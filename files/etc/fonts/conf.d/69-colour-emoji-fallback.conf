<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ANSIBLE MANAGED: playbooks/imports/play-fonts.yml (Plan 00185). Do not edit by hand. -->
<fontconfig>
  <description>Noto Color Emoji as the emoji fallback, after the text fonts</description>

  <!--
    A program finds a font for a character its own font lacks in one of two ways, and both
    otherwise land on a monochrome font (Symbola, Noto Emoji) for every emoji:
      - the ordered list (FcFontSort: Pango, so VTE and every GTK terminal) follows the
        family list once a font for the language is found, so the weak entries below are
        enough for it;
      - the single best match (FcFontMatch with the character, as fc-match does) ranks a font
        that supports the language above any weak family entry, and Symbola has Latin
        letters while Noto Color Emoji has none. Recording "en" for it when fontconfig scans
        the font levels that, and the family entries decide again. Only "en": in another
        locale Symbola's languages win the single best match back.
    The scan edit lands in the font caches, so they are rebuilt (fc-cache -f) after a change.
    The cost: a text symbol (a check mark, the sun) that no font in the family list has, but
    an unlisted text font has, now comes from the colour font, and fc-list :lang=en lists
    it. A font in the list (DejaVu Sans is in the sans-serif one) still comes first.
    Flatpak apps read their own fontconfig, so this file does not reach them.
  -->
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="lang" mode="append"><langset><string>en</string></langset></edit>
  </match>

  <!--
    Weak, and after the generic name, so it comes after every text font the distribution
    prefers for that family. Never strong and never a prefer: Noto Color Emoji has the digits,
    '#', '*' and the space for its keycaps, and a strong entry would draw them from it.
  -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
