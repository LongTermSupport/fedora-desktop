# System-wide tmux configuration (deployed by playbooks/imports/play-tmux-sessions.yml).
#
# Detachable sessions for long-running work, with the multiplexer kept out of the way:
# no status bar (Claude Code draws its own status line and the two would stack), and a
# single key, F12, that opens a menu for everything a session needs. The tmux prefix
# (Ctrl-b) still works for anyone who wants it; nothing below requires it.
#
# Day to day:  tmux new -s NAME   start a named session
#              tmux attach        return to the most recent one (or F12 -> Switch)
#              F12                the menu

set -g mouse on
set -g history-limit 50000
set -g status off
set -g default-terminal "tmux-256color"

# How long tmux holds an Esc to see whether an escape sequence follows. The default before tmux
# 3.5 is 500 ms: an Esc and a key typed within half a second reach the pane in one write, and
# fzf and Bubble Tea then read the pair as that key with Alt, so the Esc is lost
# (project_esc_joined, CLAUDE/GoProjectRules.md). 10 ms is tmux 3.5's default.
set -sg escape-time 10

# With the status bar off, the terminal's window title is the one place that says you are
# inside tmux and how to leave the session running. #S is the session name (ccy-<project>,
# cc-<project>, or whatever `tmux new -s` was given).
set -g set-titles on
set -g set-titles-string "tmux: #S  (F12 then Detach leaves it running)"

# F12 -> centred popup menu. Each item: label, shortcut key, tmux command.
bind -n F12 display-menu -T " sessions " -x C -y C \
  "New session"       n "command-prompt -p 'new session name:' \"new-session -s '%%'\"" \
  "Rename session"    r "command-prompt -p 'rename session to:' \"rename-session '%%'\"" \
  "Switch session"    s "choose-tree -s" \
  "" \
  "Detach"            d detach \
  "Kill this session" k "confirm-before -p 'kill this session and everything in it? (y/n)' kill-session"
