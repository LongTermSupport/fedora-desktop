# Managed by fedora-desktop (play-basic-configs.yml).
# OpenSSH marks its packets with a DSCP priority by default (IPQoS ef cs0). Some Wi-Fi
# access points drop frames in the priority queues those markings select, so ssh times
# out at the TCP connect while unmarked traffic to the same host gets through. Sending
# unmarked packets costs a desktop nothing.
IPQoS none
