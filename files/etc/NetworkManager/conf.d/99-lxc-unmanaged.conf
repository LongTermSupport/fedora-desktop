# ANSIBLE MANAGED — Plan 00057 (lxc-net vs NetworkManager bridge race)
#
# Keep NetworkManager's hands off the LXC bridge. `lxc-net` creates lxcbr0 and
# assigns its address (the stock LXC_ADDR, 10.0.x.1/24) itself. If NetworkManager
# also manages the bridge it wins the boot race (its saved connection is
# autoconnect) and assigns the address first; lxc-net's `ip addr add` then fails
# with "RTNETLINK answers: File exists" under `set -e`, aborting BEFORE dnsmasq
# starts — so containers boot with no DHCP lease and are unreachable.
#
# Marking the interface unmanaged makes lxc-net the sole owner of lxcbr0.
[keyfile]
unmanaged-devices=interface-name:lxcbr0
