# Deployed by playbooks/imports/play-systemd-user-tweaks.yml. Fedora's systemd-oomd-defaults
# sets ManagedOOMMemoryPressure=kill (50% for 20 s) on user@.service, and systemd-oomd then
# kills the leaf cgroup with the highest reclaim rate anywhere in the session, desktop apps
# included, often with RAM to spare. This file sorts after that one, so it wins. The play's
# comment block gives the reasons and the bug reports.
[Service]
ManagedOOMMemoryPressure=auto
