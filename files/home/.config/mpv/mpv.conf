# Deployed by play-cli-tools.yml (tag mpv). Edit here, not in ~/.config/mpv.
#
# Tuned for large local or NAS-hosted remuxes (4K HEVC Main10, HDR).

# Fedora's mpv ships with hardware decoding off, so 4K HEVC would decode on the CPU.
# auto-safe picks VAAPI on Intel/AMD and NVDEC on NVIDIA, and only decoders known to be correct.
hwdec=auto-safe

# The libplacebo renderer: the better scaling and HDR-to-SDR tone mapping.
vo=gpu-next

# A remux peaks near 100 Mbps. A deep read-ahead over SMB/NFS rides out network stalls
# instead of dropping frames; it is held in RAM, so it is bounded.
cache=yes
demuxer-max-bytes=1GiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=120

# A film is watched in more than one sitting: resume where it was left.
save-position-on-quit=yes
