# Deployed by play-claude-yolo.yml on a headless server with session restore on and a GitHub
# identity configured, and removed everywhere else. It names the file that play writes from
# the vault's github_ssh_passphrase; `ccy-sessions restore` checks it, then hands its PATH to
# each restored ccy session, which unlocks its SSH key through a restore-only SSH_ASKPASS.
# Without this drop-in a restore leaves the passphrase prompt for a person, as on a desktop.
[Service]
Environment=CCY_RESTORE_SSH_PASSPHRASE_FILE=%h/.claude-tokens/ccy/restore-ssh-passphrase
