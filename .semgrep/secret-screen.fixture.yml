# Fixture for .semgrep/secret-screen.yml, Ansible (the gate's self-test). Each "ruleid" line
# marks the line below it as the start of a finding; each "ok" line marks the line below it as
# clean.

# The issue #261 instances, as they were.
- name: Display MOK enrollment password
  ansible.builtin.debug:
    msg: |2
      Write this password down now.
      # ruleid: secret-on-normal-screen-ansible
      Your MOK enrollment password is: {{ mok_password }}

- name: Show Windows Key
  ansible.builtin.debug:
    # ruleid: secret-on-normal-screen-ansible
    msg: "{{ windows_key.stdout_lines }}"

# Other shapes of the class.
- debug:
    # ruleid: secret-on-normal-screen-ansible
    var: github_token

# The fixes, and what is not the class.
- name: Tell the person how to see the MOK password
  ansible.builtin.debug:
    # ok: secret-on-normal-screen-ansible
    msg: "Run ./vault.bash get mok_password to see it on the secret screen."

- ansible.builtin.debug:
    # ok: secret-on-normal-screen-ansible
    msg: "That {{ secret_label }} cannot be used: {{ ask_secret_problem }}."

- ansible.builtin.debug:
    # ok: secret-on-normal-screen-ansible
    msg: "The key is at {{ ssh_key_path }}; {{ item.key }} is set."

- name: A secret used, not shown
  ansible.builtin.copy:
    # ok: secret-on-normal-screen-ansible
    content: "{{ mok_password }}"
    dest: /root/mok
    mode: "0600"
  no_log: true
