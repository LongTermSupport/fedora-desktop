# Semgrep rules for code the hooks daemon loads: the project's handlers in
# .claude/hooks/handlers/. Run by scripts/qa-hook-handler-rules.bash over every Python file git
# would publish, after each rule is proven against .semgrep/hook-handlers.py. Each rule's
# reasoning, and how to fix a finding, is in CLAUDE/QA.md under its identifier.
rules:
  # Rule: code the hooks daemon loads never resolves a path against its own working
  # directory (Defence Before Fix; CLAUDE/QA.md "hook-path-resolved-against-cwd").
  #
  # A hook handler runs in the daemon's process, whose working directory is not the agent's
  # project. A relative tool path resolved with os.path.realpath() was judged against
  # wherever the daemon (or its test) ran: allowed in the container, whose working
  # directory is /workspace, and blocked as a system file on the host, whose is under /home.
  #
  # WRONG: os.path.realpath(file_path)
  # RIGHT: if not os.path.isabs(file_path):
  #            file_path = os.path.join(project_root, file_path)
  #        os.path.realpath(file_path)
  #
  # The rule reports, in a module that imports claude_code_hooks_daemon (any import form):
  # os.getcwd() and Path.cwd() always; .resolve() or .absolute() at the end of a chain that
  # starts with Path(...) not built from __file__, other than Path(value) itself; and os.path.realpath, abspath or relpath of a
  # value, or Path(value).resolve() or .absolute(), unless the value is __file__ or the same
  # block first has `if not os.path.isabs(value):` whose body makes the value absolute with
  # os.path.join or raises.
  - id: hook-path-resolved-against-cwd
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              from claude_code_hooks_daemon.$M import $N
              ...
          - pattern-inside: |
              from claude_code_hooks_daemon import $N
              ...
          - pattern-inside: |
              import claude_code_hooks_daemon
              ...
          - pattern-inside: |
              import claude_code_hooks_daemon.$M
              ...
      - pattern-either:
          - pattern: os.getcwd()
          - pattern: Path.cwd()
          - pattern: pathlib.Path.cwd()
          - patterns:
              - pattern-either:
                  - pattern: $P.resolve(...)
                  - pattern: $P.absolute()
              - pattern-not: Path($X).resolve(...)
              - pattern-not: Path($X).absolute()
              - pattern-not: pathlib.Path($X).resolve(...)
              - pattern-not: pathlib.Path($X).absolute()
              - metavariable-regex:
                  metavariable: $P
                  regex: '^(?!.*__file__)(pathlib\.)?Path\('
          - patterns:
              - pattern-either:
                  - pattern: os.path.realpath($X)
                  - pattern: os.path.abspath($X)
                  - pattern: os.path.relpath($X)
                  - pattern: Path($X).resolve(...)
                  - pattern: Path($X).absolute()
                  - pattern: pathlib.Path($X).resolve(...)
                  - pattern: pathlib.Path($X).absolute()
              - pattern-not: Path(__file__).resolve(...)
              - pattern-not: os.path.realpath(__file__)
              - pattern-not-inside: |
                  if not os.path.isabs($X):
                    $X = os.path.join(...)
                  ...
              - pattern-not-inside: |
                  if not os.path.isabs($X):
                    raise $E
                  ...
    message: >
      hook-path-resolved-against-cwd: this resolves a path against the hooks daemon's
      working directory, which is not the agent's project. Make a relative path absolute
      against the project root first. See CLAUDE/QA.md "hook-path-resolved-against-cwd".
    severity: ERROR
    metadata:
      dbf-class: a path resolved against the hooks daemon's working directory

  # Rule: a project handler never matches text against the raw command line, except through
  # the one sanctioned judge (Defence Before Fix; CLAUDE/QA.md "hook-regex-over-raw-command").
  #
  # A Bash command line holds text that is not run: a commit message, an echo, a grep pattern,
  # a heredoc body. A regex or a substring test over the whole line answers "does the text
  # contain these words?", not "does a command run them?". ansible_enforcement and
  # hidden_git_mutation each searched get_bash_command()'s text, so a commit message that
  # quoted `dnf install` or `bash -c "$(cat f)"` was denied (issue #294).
  #
  # WRONG: command = get_bash_command(hook_input)
  #        return any(p.search(command) for p in patterns)
  # RIGHT: segments = command_position_code_segments(command)
  #        return any(p.search(segment) for segment in segments for p in patterns)
  #
  # Taint, inside one function. The sources are get_bash_command(...) and a read of
  # tool_input["command"]. The sinks are a regex method (search, match, fullmatch, findall,
  # finditer, sub, subn, re.split) or an `in` test applied to the tainted value, AND any call of a
  # helper of the module's own (a plain name or `self.name`) that is handed the tainted value: a
  # helper that takes the line under another parameter name (`text`) and searches it there is the
  # same judgement one function away, so the call that hands the line over is the finding. A
  # value that went through one of the daemon's command_position_* functions is a command-position
  # segment, and is clean.
  #
  # The one sanctioned way to judge the line as written is a call of judge_raw_command_line, which
  # lives in its own module, .claude/hooks/handlers/pre_tool_use/_raw_command_judge.py. What
  # protects it is NOT a path: the judge takes its line as a parameter named `line`, which is not a
  # taint source, so this rule reports nothing inside it whether or not the module is excluded (the
  # rule has no exclusion for that reason). The trust is the NAME at the call site, a bare call of
  # judge_raw_command_line, and hook-sanctioned-name-impostor keeps that name from being defined or
  # imported from anywhere but its home. A copy of the judge under another name is a finding at the
  # call that hands it the line, positionally or by keyword: a plain name, `self.name`,
  # `module.func(...)` where the module is imported by the file (a lower-case `import mod` or
  # `from pkg import mod`; stdlib modules that do not search text are left out), or
  # `pkg.mod.func(...)` after `import pkg.mod`. Not seen: a function object passed in and called as `fn(line)` from
  # a name the file did not import, and a module reached by `importlib`. The sources include a
  # two-step read of tool_input (`ti = h["tool_input"]; command = ti["command"]`), and the sinks
  # include find, count, index, partition and fnmatch. Builtins (len, str, bool, isinstance, repr,
  # print), the daemon's own whole-line predicate is_plain_data_command and calls on other objects
  # (GatingResult.deny(f"...")) are not helpers.
  - id: hook-regex-over-raw-command
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: get_bash_command(...)
      - pattern: $H["tool_input"]["command"]
      - pattern: $H.get("tool_input", ...).get("command", ...)
      - patterns:
          - pattern-either:
              - pattern: $T["command"]
              - pattern: $T.get("command", ...)
          - pattern-either:
              - pattern-inside: |
                  $T = $H["tool_input"]
                  ...
              - pattern-inside: |
                  $T = $H.get("tool_input", ...)
                  ...
    pattern-sanitizers:
      - pattern-either:
          - pattern: command_position_segments(...)
          - pattern: command_position_code_segments(...)
          - pattern: command_position_code_segments_with_separators(...)
          - pattern: command_position_argument_segments(...)
          - pattern: command_position_view(...)
          - pattern: judge_raw_command_line(...)
          - pattern: is_plain_data_command(...)
    pattern-sinks:
      - patterns:
          - pattern: $RE.$METHOD(..., $X, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(search|match|fullmatch|findall|finditer|sub|subn)$'
          - focus-metavariable: $X
      - patterns:
          - pattern: re.split($PATTERN, $X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $X.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(find|rfind|count|index|rindex|partition|rpartition)$'
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: fnmatch.$F($X, ...)
              - pattern: fnmatch.$F($P, $X)
              - pattern: fnmatch($X, ...)
              - pattern: fnmatch($P, $X)
          - focus-metavariable: $X
      - patterns:
          - pattern: $NEEDLE in $X
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $HELPER(..., $X, ...)
              - pattern: $HELPER(..., $K=$X, ...)
          - metavariable-regex:
              metavariable: $HELPER
              regex: '^(?!(?:len|str|bool|isinstance|repr|print|get_bash_command|judge_raw_command_line|is_plain_data_command|command_position_\w+)$)(?:self\.)?[A-Za-z_]\w*$'
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $MOD.$F(..., $X, ...)
              - pattern: $MOD.$F(..., $K=$X, ...)
          - metavariable-regex:
              metavariable: $MOD
              regex: '^(?!(?:self|re|fnmatch|json|logging|logger|os|sys|shlex|textwrap|time)$)[a-z_]\w*$'
          - pattern-either:
              - pattern-inside: |
                  import $MOD
                  ...
              - pattern-inside: |
                  from $PKG import $MOD
                  ...
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $PKG.$MOD.$F(..., $X, ...)
              - pattern: $PKG.$MOD.$F(..., $K=$X, ...)
          - pattern-inside: |
              import $PKG.$MOD
              ...
          - focus-metavariable: $X
    message: >
      hook-regex-over-raw-command: this matches text against the raw Bash command line, or hands
      it to a helper (a function of the module, or `module.func` of an imported module) that can,
      and the line holds text that is not run (a message, an echo, a grep pattern, a heredoc body).
      Judge the command-position segments (command_position_code_segments) instead, or call
      judge_raw_command_line, the one sanctioned judge of the line as written (the module
      _raw_command_judge; the trust is its name at the call site, see hook-sanctioned-name-impostor).
      See CLAUDE/QA.md "hook-regex-over-raw-command".
    severity: ERROR
    metadata:
      dbf-class: a project handler matching text against the raw Bash command line

  # Rule: the same class, one function away (Defence Before Fix; CLAUDE/QA.md
  # "hook-regex-over-command-parameter").
  #
  # hook-regex-over-raw-command follows the value inside one function. hidden_git_mutation
  # handed get_bash_command()'s text to a helper whose parameter is named `command`, and the
  # helper ran the regex, so the taint rule did not see it. A function with a parameter named
  # `command` that applies a regex method or an `in` test to it is the same text-over-the-line
  # judgement. A helper that scans text on purpose (a heredoc scanner) names its parameter for
  # what it is, `text`, so the choice stays visible at its definition.
  - id: hook-regex-over-command-parameter
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              def $F(..., command, ...):
                  ...
          - pattern-inside: |
              def $F(..., command: $T, ...):
                  ...
      - pattern-either:
          - patterns:
              - pattern: $RE.$METHOD(..., command, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '^(search|match|fullmatch|findall|finditer|sub|subn)$'
          - pattern: re.split($PATTERN, command, ...)
          - pattern: $NEEDLE in command
    message: >
      hook-regex-over-command-parameter: this matches text against a parameter named
      `command`, the raw Bash command line, which holds text that is not run (a message, an
      echo, a grep pattern, a heredoc body). Judge the command-position segments
      (command_position_code_segments), or name the parameter `text` if the function scans
      text on purpose. See CLAUDE/QA.md "hook-regex-over-command-parameter".
    severity: ERROR
    metadata:
      dbf-class: a project handler matching text against a parameter holding the raw Bash command line

  # Rule: no look-alike of a sanctioned name (Defence Before Fix; CLAUDE/QA.md
  # "hook-sanctioned-name-impostor").
  #
  # hook-regex-over-raw-command trusts four kinds of call by NAME: judge_raw_command_line,
  # is_plain_data_command and every command_position_* function return something the rule treats
  # as judged or clean. A handler that defines a function, a lambda or an alias with one of those
  # names, or imports one from anywhere but its real home, would be trusted without doing the work:
  # the exemption works by name and a name can be faked. The real homes are
  # claude_code_hooks_daemon.utils.command_position (the daemon's functions) and
  # _raw_command_judge (the one judge, excluded by path); a definition in any other file is a finding.
  - id: hook-sanctioned-name-impostor
    languages: [python]
    paths:
      exclude:
        - /.claude/hooks/handlers/pre_tool_use/_raw_command_judge.py
    pattern-either:
      - patterns:
          - pattern: |
              def $N(...):
                  ...
          - metavariable-regex:
              metavariable: $N
              regex: '^(judge_raw_command_line|is_plain_data_command|command_position_\w+)$'
      - patterns:
          - pattern: $N = $E
          - metavariable-regex:
              metavariable: $N
              regex: '^(judge_raw_command_line|is_plain_data_command|command_position_\w+)$'
      - patterns:
          - pattern: from $M import $X as $N
          - metavariable-regex:
              metavariable: $N
              regex: '^(judge_raw_command_line|is_plain_data_command|command_position_\w+)$'
      - patterns:
          - pattern: from $M import $N
          - metavariable-regex:
              metavariable: $N
              regex: '^(judge_raw_command_line|is_plain_data_command|command_position_\w+)$'
          - metavariable-regex:
              metavariable: $M
              regex: '^(?!(?:_raw_command_judge|claude_code_hooks_daemon\.utils\.command_position)$)'
    message: >
      hook-sanctioned-name-impostor: this defines or imports a name that hook-regex-over-raw-command
      trusts (judge_raw_command_line, is_plain_data_command, command_position_*) from somewhere other
      than its real home, so the name would be trusted without the work behind it. Import the real
      function (from _raw_command_judge, or from claude_code_hooks_daemon.utils.command_position), or
      give your own function another name. See CLAUDE/QA.md "hook-sanctioned-name-impostor".
    severity: ERROR
    metadata:
      dbf-class: a function that borrows the name of a function a Semgrep rule trusts
