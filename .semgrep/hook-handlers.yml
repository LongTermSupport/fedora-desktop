# Semgrep rules for code the hooks daemon loads: the project's handlers in
# .claude/hooks/handlers/. Run by scripts/qa-hook-handler-rules.bash over every Python file git
# would publish, after each rule is proven against .semgrep/hook-handlers.py. Each rule's
# reasoning, and how to fix a finding, is in CLAUDE/QA.md under its identifier.
rules:
  # Rule: code the hooks daemon loads never resolves a path against its own working
  # directory (Defence Before Fix; CLAUDE/QA.md "hook-path-resolved-against-cwd").
  #
  # A hook handler runs in the daemon's process, whose working directory is not the agent's
  # project. A relative tool path resolved with os.path.realpath() was judged against
  # wherever the daemon (or its test) ran: allowed in the container, whose working
  # directory is /workspace, and blocked as a system file on the host, whose is under /home.
  #
  # WRONG: os.path.realpath(file_path)
  # RIGHT: if not os.path.isabs(file_path):
  #            file_path = os.path.join(project_root, file_path)
  #        os.path.realpath(file_path)
  #
  # The rule reports, in a module that imports claude_code_hooks_daemon (any import form):
  # os.getcwd() and Path.cwd() always; .resolve() or .absolute() at the end of a chain that
  # starts with Path(...) not built from __file__, other than Path(value) itself; and os.path.realpath, abspath or relpath of a
  # value, or Path(value).resolve() or .absolute(), unless the value is __file__ or the same
  # block first has `if not os.path.isabs(value):` whose body makes the value absolute with
  # os.path.join or raises.
  - id: hook-path-resolved-against-cwd
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              from claude_code_hooks_daemon.$M import $N
              ...
          - pattern-inside: |
              from claude_code_hooks_daemon import $N
              ...
          - pattern-inside: |
              import claude_code_hooks_daemon
              ...
          - pattern-inside: |
              import claude_code_hooks_daemon.$M
              ...
      - pattern-either:
          - pattern: os.getcwd()
          - pattern: Path.cwd()
          - pattern: pathlib.Path.cwd()
          - patterns:
              - pattern-either:
                  - pattern: $P.resolve(...)
                  - pattern: $P.absolute()
              - pattern-not: Path($X).resolve(...)
              - pattern-not: Path($X).absolute()
              - pattern-not: pathlib.Path($X).resolve(...)
              - pattern-not: pathlib.Path($X).absolute()
              - metavariable-regex:
                  metavariable: $P
                  regex: '^(?!.*__file__)(pathlib\.)?Path\('
          - patterns:
              - pattern-either:
                  - pattern: os.path.realpath($X)
                  - pattern: os.path.abspath($X)
                  - pattern: os.path.relpath($X)
                  - pattern: Path($X).resolve(...)
                  - pattern: Path($X).absolute()
                  - pattern: pathlib.Path($X).resolve(...)
                  - pattern: pathlib.Path($X).absolute()
              - pattern-not: Path(__file__).resolve(...)
              - pattern-not: os.path.realpath(__file__)
              - pattern-not-inside: |
                  if not os.path.isabs($X):
                    $X = os.path.join(...)
                  ...
              - pattern-not-inside: |
                  if not os.path.isabs($X):
                    raise $E
                  ...
    message: >
      hook-path-resolved-against-cwd: this resolves a path against the hooks daemon's
      working directory, which is not the agent's project. Make a relative path absolute
      against the project root first. See CLAUDE/QA.md "hook-path-resolved-against-cwd".
    severity: ERROR
    metadata:
      dbf-class: a path resolved against the hooks daemon's working directory
