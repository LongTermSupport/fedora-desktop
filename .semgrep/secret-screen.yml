rules:
  # Rule: a secret is never left on a terminal's normal screen (Defence Before Fix;
  # CLAUDE/QA.md "secret-on-normal-screen"; issues #255 and #261).
  #
  # A terminal keeps what its normal screen showed in the scrollback, and tmux keeps it in the
  # pane's history, long after the program that printed it has moved on. A password or token
  # shown there "once" stays readable to anyone who scrolls up, shares the screen or reads the
  # terminal's or tmux's log. The alternate screen keeps no scrollback.
  #
  # WRONG: printf '%s\n' "$token"            (on a terminal, in the scrollback for good)
  #        read -r -p "Token: " token        (the pasted token is echoed)
  #        print(admin.human_password(...))  ansible.builtin.debug: msg="{{ mok_password }}"
  # RIGHT: printf '%s\n' "$token" | scripts/secret-screen.bash   (plain when piped or
  #        redirected; on a terminal the alternate screen, cleared on Enter); read -r -s;
  #        helpers.secret_screen.show in Python; term.SecretScreen in Go (rule
  #        project_secret_scrollback); in a play, no secret in the output at all: name the
  #        command that shows it on the secret screen.
  #
  # A secret is a value whose name ends in what it is (password, passphrase, token, secret,
  # credential, API or product key, optionally _content or _value): not the name, file, path,
  # count or owner of one. Or it is the output of a command that prints one (`gh auth token`,
  # vault.bash's decryption, `claude setup-token`). The screen is the terminal a line's output
  # reaches: not a file it is redirected to, not a process it is piped into unless that only
  # passes it on (cat, tee, tr, sed, awk, grep, cut, head, tail, sort, column), not a capture,
  # and not a function's return value (its last line, before the closing brace: the hazard is
  # then at the call site).
  #
  # Blocking, with no allowlist (scripts/qa-secret-screen.bash). Never add an exclude to clear a
  # finding.

  # Shell (and any text that holds shell: a template, a play's shell block, a bashrc a play
  # writes).
  - id: secret-on-normal-screen
    pattern-either:
      # echo of a secret-named variable alone, or printf of one as a %s argument.
      - pattern-regex: '(?m)^(?![ \t]*#)(?![^\n]*\n[ \t]*\}[ \t]*$)(?:(?!\$\(|`)[^\n])*?(?<![\w$-])(?:echo(?:[ \t]+-[neE]+)*[ \t]+"?|printf[ \t]+(?:--[ \t]+)?(?:''[^''\n]*%s[^''\n]*''|"[^"\n]*%s[^"\n]*")(?:[ \t]+(?:"[^"\n]*"|''[^''\n]*''|[^\s;|&>]+))*?[ \t]+"?)(?<!\\)\$\{?\w*(?i:token|password|passwd|passphrase|secret|credential|api_?key)(?i:_content|_value)?\}?(?!\w)(?:[^|>\n]|>&2|\|[ \t]*(?:cat|tee|tr|sed|awk|grep|cut|head|tail|sort|column)\b)*(?<!\\)$'
      # An unquoted heredoc (its body is expanded) holding a secret-named variable, read by
      # cat to the terminal.
      - pattern-regex: '(?m)^(?![ \t]*#)(?:(?!\$\(|`)[^\n])*?\bcat[ \t]*<<-?[ \t]*([A-Za-z_]\w*)\b(?:(?![|>])[^\n])*\n(?:(?![ \t]*\1$)[^\n]*\n)*?[^\n]*(?<!\\)\$\{?\w*(?i:token|password|passwd|passphrase|secret|credential|api_?key)(?i:_content|_value)?\}?(?!\w)'
      # A command whose output is a secret, run so that its output reaches the terminal: as a
      # statement of its own, not captured, not redirected, not piped into a consumer.
      # vault.bash's _decrypt_var is the vault's decryption.
      - pattern-regex: '(?m)^(?![ \t]*#)(?:[ \t]*|[^\n]*?(?:&&|\|\||;|\bthen|\bdo|\{)[ \t]*)(?:gh[ \t]+auth[ \t]+token\b|_decrypt_var\b(?![ \t]*\(\))|ansible-vault[ \t]+view\b|secret-tool[ \t]+lookup\b|lpass[ \t]+show\b[^\n]*--password)(?:[^|>\n]|>&2|\|[ \t]*(?:cat|tee|tr|sed|awk|grep|cut|head|tail|sort|column)\b)*(?<!\\)$'
      # A variable assigned from such a command, later printed with echo or printf as above
      # (vault.bash dump: value=$(_decrypt_var "$name") ... printf ... "$value"). The finding
      # is the print.
      - pattern-regex: '(?m)\b(\w+)="?\$\([ \t]*(?:gh[ \t]+auth[ \t]+token\b|_decrypt_var\b|ansible-vault[ \t]+view\b|secret-tool[ \t]+lookup\b)(?![^\n]*[^&2]>[ \t]*/dev/null)[^\n]*\n(?:[^\n]*\n)*?(?![ \t]*#)(?![^\n]*\n[ \t]*\}[ \t]*$)(?:(?!\$\(|`)[^\n])*?\K(?<![\w$-])(?:echo|printf)\b[^\n|>]*?(?<!\\)\$\{?\1\}?(?!\w)(?:[^|>\n]|>&2|\|[ \t]*(?:cat|tee|tr|sed|awk|grep|cut|head|tail|sort|column)\b)*(?<!\\)$'
      # A command that prints a secret, its output tee'd to the terminal (and a file):
      # `claude setup-token | tee "$out"`, across a line continuation.
      - pattern-regex: '(?m)^(?![ \t]*#)(?:[^\n]*\\\n)*?[^\n]*\bsetup-token\b(?:[^\n|]|\\\n)*?\|[ \t]*tee\b(?![^\n]*\|)[^\n]*$'
    paths:
      exclude: &secret-screen-excludes
        # This rule file and its fixtures.
        - '.semgrep/secret-screen.*'
        # Prose, not code: a document, a plan, a journal, a review or a changelog prints
        # nothing. Plan SCRIPTS are code and stay in.
        - '*.md'
        # Go is read by its own rule, project_secret_scrollback (src-go/qa/rules), which follows
        # a value from its source to the terminal through the type system.
        - '*.go'
        # Test suites and their recorded data: every value in them is a fixture, not a secret.
        - 'scripts/test-*.bash'
        - 'tests/**'
        - '**/testdata/**'
        # Vendored, daemon-deployed and other trees that are not ours are never handed to
        # semgrep: the gate reads them from scripts/qa-trees.tsv, the one list
        # (CLAUDE/QA.md "qa-trees-drift"). Name here only what is particular to this rule.
    message: >
      secret-on-normal-screen: a secret written to the terminal's normal screen stays in its
      scrollback and tmux history. Pipe it through scripts/secret-screen.bash (the alternate
      screen on a terminal, plain when piped). See CLAUDE/QA.md "secret-on-normal-screen".
    languages: [generic]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      dbf-class: a secret written to a terminal's normal screen, kept by its scrollback

  # Shell: `read` of a secret-named variable without -s, which echoes what is typed or pasted.
  # Not a read from a file, a here-string or a while-read loop over data: nothing is typed.
  - id: secret-read-echoed
    pattern-regex: '(?m)^(?![ \t]*#)(?![^\n]*\b(?:while|until)\b)(?![^\n]*<(?:<<)?[ \t]*(?!/dev/tty\b)[^\s(<&])[^\n]*?(?<![\w.$-])read\b(?![^\n;|&]*?[ \t]-[A-Za-z]*s)(?:[ \t]+(?:-[A-Za-z]*[pdtunNei][ \t]+(?:"[^"\n]*"|''[^''\n]*''|\$''[^''\n]*''|[^\s;|&]+)|-[A-Za-z]+))*(?:[ \t]+\w+)*?[ \t]+\w*(?i:token|password|passwd|passphrase|secret|credential|api_?key)(?!\w)(?=[ \t]*(?:$|[;&|)<]))'
    paths:
      exclude: *secret-screen-excludes
    message: >
      secret-read-echoed: read without -s echoes the secret as it is typed or pasted, and the
      screen keeps it. Use read -s (then a newline on stderr). See CLAUDE/QA.md
      "secret-on-normal-screen".
    languages: [generic]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      dbf-class: a secret written to a terminal's normal screen, kept by its scrollback

  # Python: a secret-named value printed to a stream (print, a write, a lines helper), or a
  # secret asked for with input(), which echoes it, instead of getpass.
  - id: secret-on-normal-screen-python
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: print(..., $S, ...)
              - pattern: $IO.lines([..., $S, ...])
              - pattern: $OUT.write($S)
              - pattern: $OUT.write($S.encode())
          - metavariable-regex:
              metavariable: $S
              regex: '(?i)^(?:[\w.]*\.)?\w*(?:token|password|passwd|passphrase|secret|credential|api_?key)(?:_content|_value)?(?:\(.*\))?$'
      - pattern: input("=~/(?i).*(?:password|passphrase|token|secret).*/")
    paths:
      exclude: *secret-screen-excludes
    message: >
      secret-on-normal-screen-python: a secret written to a stream that may be a terminal stays
      in its scrollback. Use helpers.secret_screen.show (plain when the stream is not a
      terminal, else the alternate screen, cleared on Enter); ask for one with getpass. See
      CLAUDE/QA.md "secret-on-normal-screen".
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      dbf-class: a secret written to a terminal's normal screen, kept by its scrollback

  # Ansible: a debug task that shows a secret in the play's output, which is the terminal of the
  # person running it (and its log).
  - id: secret-on-normal-screen-ansible
    patterns:
      - pattern-either:
          - pattern-inside: 'ansible.builtin.debug: ...'
          - pattern-inside: 'debug: ...'
      - pattern-either:
          - pattern-regex: '\{\{(?:(?!\}\})[^\n])*?(?<![\w.])\w*(?i:password|passphrase|passwd|secret|token|credential|api_?key|_key|psk)(?!\w)'
          - pattern-regex: '(?m)^[ \t]*var:[ \t]*[''"]?\w*(?i:password|passphrase|passwd|secret|token|credential|api_?key|_key|psk)(?!\w)'
    paths:
      exclude: *secret-screen-excludes
    message: >
      secret-on-normal-screen-ansible: a debug task shows a secret in the play's output and
      log. Show nothing secret; name the command that shows it on the secret screen. See
      CLAUDE/QA.md "secret-on-normal-screen".
    languages: [yaml]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      dbf-class: a secret written to a terminal's normal screen, kept by its scrollback
