rules:
  # Rule: no secret in a process's command line (Defence Before Fix; CLAUDE/QA.md
  # "secret-in-argv"; issue #220).
  #
  # A process's argv is readable by every local user while it runs (/proc/<pid>/cmdline, ps).
  # play-github-cli-multi.yml ran `ssh-keygen -P "$(cat /tmp/.github_ssh_pp)"`: the file kept the
  # passphrase off the task's text, and the substitution put it straight back on ssh-keygen's.
  #
  # In Ansible the command line is wider than the command. The shell module runs
  # `/bin/sh -c '<the whole rendered script>'`, and `environment:` is rendered into the line that
  # starts the module, `/bin/sh -c 'NAME=value python3 .../AnsiballZ_command.py'`. no_log hides
  # the task's output; it does not change either command line. A task's `stdin:` and a module
  # parameter (copy's `content:`) travel in the module's payload, never on a command line.
  #
  # WRONG: ssh-keygen -y -P "$pass" -f "$key"
  #        ansible.builtin.shell: ssh-keygen ... -N "{{ github_ssh_passphrase }}"
  #        environment: { UNIFI_ADMIN_PASSWORD: "{{ unifi_admin_password }}" }
  # RIGHT: hand the secret over on stdin (`stdin:` in a task), or in the environment of the
  #        process that needs it from a program (not from Ansible's environment:), and let
  #        ssh-keygen ask for it: SSH_ASKPASS=<helper> SSH_ASKPASS_REQUIRE=force, the helper
  #        printing it from its environment. helpers/ssh_passphrase does this for the plays.
  #
  # Blocking with no allowlist: every published file outside the excludes below may have no
  # finding (scripts/qa-argv-leak.bash). Never add an exclude to clear a finding.

  # Shell, scripts, and any code: a command option that takes a passphrase or password, given an
  # expanded value. A literal (`-N ""`, `-P ''`) is not a secret. The command is followed across
  # a shell line continuation and across YAML or code list items.
  - id: secret-in-argv
    patterns:
      - pattern-either:
          # ssh-keygen -P / -N: the old and the new passphrase.
          - pattern-regex: '\bssh-keygen\b(?:\\\n|\n(?=[ \t]*(?:- |[''"]))|[^\n;|&#])*?(?<![\w-])[''"]?-[PN](?:[ \t]+|[ \t]*=|[''"][ \t]*,[ \t]*|[''"]?[ \t]*\n[ \t]*-[ \t]+)(?:[''"]?(?:\$|`|\{\{)|(?![''"]{2})[A-Za-z_(])'
          # --password / --passphrase / --passwd, and openssl's -pass/-passin/-passout pass:.
          - pattern-regex: '(?<![\w-])(?:--?(?:password|passphrase|passwd)(?:[ \t]*=[ \t]*|[ \t]+)|-pass(?:in|out)?[ \t]+[''"]?pass:)[''"]?(?:\$(?!\{?\w*(?:FILE|PATH|file|path)\b)|`|\{\{)'
      # A comment line is prose.
      - pattern-not-regex: '(?m)^[ \t]*(?:#|//)[^\n]*'
    message: >
      secret-in-argv: a passphrase or password on a command line, readable by any local user
      while it runs. Hand it over on stdin, or through SSH_ASKPASS for ssh-keygen. See
      CLAUDE/QA.md "secret-in-argv".
    paths:
      exclude: &secret-in-argv-excludes
        # This rule and its fixture.
        - '.semgrep/argv-leak.*'
        # Records, not code: nothing runs a plan's prose, a journal, a review or a changelog.
        # Plan SCRIPTS are code and stay in.
        - 'CLAUDE/Plan/**/*.md'
        - 'docs/*changelog*.md'
        # Vendored, daemon-deployed and other trees that are not ours are never handed to
        # semgrep: the gate reads them from scripts/qa-trees.tsv, the one list
        # (CLAUDE/QA.md "qa-trees-drift"). Name here only what is particular to this rule.
    languages: [generic]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      dbf-class: a secret expanded into the argv of a process

  # Ansible: a Jinja expression naming a secret inside the text of a task that runs a command
  # (shell, command, raw, script, expect) or inside environment:. Both reach a command line, as
  # the header says. stdin: and expect's responses: do not.
  #
  # In environment: the variable name is evidence too: a secret-named key (UNIFI_ADMIN_HASH)
  # given any Jinja value is flagged whatever the value is called, so a register named for
  # the step (unifi_admin_hash) cannot carry a hash past the value's name.
  - id: secret-in-argv-ansible
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: 'environment: ...'
                  - pattern-inside: 'ansible.builtin.shell: ...'
                  - pattern-inside: 'ansible.builtin.command: ...'
                  - pattern-inside: 'ansible.builtin.raw: ...'
                  - pattern-inside: 'ansible.builtin.script: ...'
                  - pattern-inside: 'ansible.builtin.expect: ...'
                  - pattern-inside: 'shell: ...'
                  - pattern-inside: 'command: ...'
                  - pattern-inside: 'raw: ...'
                  - pattern-inside: 'script: ...'
                  - pattern-inside: 'expect: ...'
              # A name that holds a secret: a password, passphrase, secret, token, key, PSK,
              # shadow entry or hash of one. Not the passwd database (getent_passwd), the openssl
              # passwd command word, or the name, label, file or path of a secret. A checksum
              # of a file (dockerfile_hash, sha256_hash) is public and is not a secret.
              - pattern-regex: '\{\{(?:(?!\}\})[^\n])*?(?<!\w)(?!getent_passwd\b|passwd[''"])(?!\w*?(?:file|sha\d*|md5|checksum|commit|image|content)_hash\b)\w*?(?:password|passphrase|passwd|secret|token|psk|credential|api_?key|private_?key|shadow|_pp\b|hash|salt)(?!_name\b|_label\b|_file\b|_path\b)\w*(?:(?!\}\})[^\n])*\}\}'
          - patterns:
              - pattern-inside: 'environment: ...'
              - pattern-regex: '(?im)^[ \t]*-?[ \t]*\w*?(?:password|passphrase|passwd|secret|token|psk|credential|api_?key|private_?key|shadow|hash|salt)\w*[ \t]*:[^\n]*\{\{[^\n]*\}\}'
      - pattern-not-inside: 'stdin: ...'
      - pattern-not-inside: 'responses: ...'
    message: >
      secret-in-argv: a secret rendered into a command line or environment: of a task, readable
      by any local user while it runs (no_log does not change that). Pass it with stdin:. See
      CLAUDE/QA.md "secret-in-argv".
    paths:
      exclude: *secret-in-argv-excludes
    languages: [yaml]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      dbf-class: a secret expanded into the argv of a process
