rules:
  # Rule: a unit that a boot target wants does not hold that target while it waits (Defence
  # Before Fix; CLAUDE/QA.md "unit-holds-boot-target"; issue #263).
  #
  # A target wants a unit, and by default the target is ordered after it, so the target is
  # reached only once the unit's start job ends. For Type=oneshot that is when the program
  # exits; for notify, notify-reload, dbus and forking it is when the program says it is ready.
  # A unit that declares a start longer than systemd's default 90 s (TimeoutStartSec above it,
  # infinity or 0) says it waits on something slow, and multi-user.target (or the user
  # manager's default.target, and with it user@UID.service and a login) is not reached until
  # it finishes. fedora-desktop-self-update-verify.service waited up to 25 minutes on the
  # restored sessions and held multi-user.target for 11, so an external post-boot health
  # check timed out on a healthy guest.
  #
  # WRONG: [Service] Type=oneshot / TimeoutStartSec=30min ... [Install] WantedBy=multi-user.target
  # RIGHT: [Unit] After=multi-user.target / [Service] Type=exec / RuntimeMaxSec=30min
  #        ... [Install] WantedBy=multi-user.target
  #
  # The finding is the unit's [Unit] line. A unit is the text from one [Unit] to the next, so a
  # play or a Go file with several units judges each alone. A key is read at a line start, after
  # an opening quote (a Go or YAML string per line) or after a \n escape (a Go string holding
  # several lines). A unit ordered After= the target it is wanted by does not hold it.
  - id: unit-holds-boot-target
    pattern-regex: '(?ms)\[Unit\](?=(?:(?!\[Unit\]).)*?(?:^[ \t]*[\x22\x27`]?|\\n)(?:WantedBy|RequiredBy)=[^\n]*?\b(multi-user|graphical|default|basic|sysinit)\.target)(?!(?:(?!\[Unit\]).)*?(?:^[ \t]*[\x22\x27`]?|\\n)After=[^\n]*?\b\1\.target)(?=(?:(?!\[Unit\]).)*?(?:^[ \t]*[\x22\x27`]?|\\n)Type=(?:oneshot|notify|notify-reload|dbus|forking)\b)(?=(?:(?!\[Unit\]).)*?(?:^[ \t]*[\x22\x27`]?|\\n)TimeoutStartSec=[ \t]*(?:infinity\b|0+[ \t]*(?:s|sec)?(?=[ \t]*(?:$|\\n|[\x22\x27`]))|[^\n\x22\x27`\\]*?\b\d+[ \t]*(?:h|hr|hours?|d|days?|w|weeks?|M|months?|y|years?)\b|(?:[2-9]|[1-9]\d+)[ \t]*(?:m|min|minutes?)\b|(?:9[1-9]|[1-9]\d{2,})[ \t]*(?:s|sec|seconds?)?(?![\w.])))'
    message: >
      unit-holds-boot-target: this unit declares a start longer than 90 s and the boot target
      that wants it waits for that start, so boot is not complete until it ends. Order it
      After= the target and make the wait run after the start (Type=exec, RuntimeMaxSec=).
      See CLAUDE/QA.md "unit-holds-boot-target".
    paths:
      exclude:
        # This rule and its fixture.
        - '.semgrep/boot-hold.*'
        # Records, not code: nothing installs a unit from a plan's prose, a journal, a review
        # or a changelog. Plan SCRIPTS are code and stay in.
        - 'CLAUDE/Plan/**/*.md'
        - 'docs/*changelog*.md'
        # Vendored, daemon-deployed and other trees that are not ours are never handed to
        # semgrep: the gate reads them from scripts/qa-trees.tsv, the one list
        # (CLAUDE/QA.md "qa-trees-drift"). Name here only what is particular to this rule.
    languages: [generic]
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      dbf-class: a unit a boot target wants whose start waits on something slow, holding the target
