rules:
  # Rule: no download, package or image fixed to one CPU architecture (Defence Before Fix;
  # CLAUDE/QA.md "arch-pinned-artefact"; Plan 00243).
  #
  # fedora-desktop runs on x86_64 and on aarch64. A URL, asset name, RPM arch or platform key
  # that spells one architecture installs nothing, or the wrong binary, on the other: the ccy
  # image did not build on arm64 because its Dockerfiles named x86_64 assets outright.
  #
  # WRONG: curl -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4/yq_linux_amd64
  # RIGHT: select the asset AND its checksum by the architecture the build runs on:
  #          case "$(dpkg --print-architecture)" in
  #            amd64) asset=yq_linux_amd64; sha=... ;;
  #            arm64) asset=yq_linux_arm64; sha=... ;;
  #            *) echo "yq: no build for this architecture" >&2; exit 1 ;;
  #          esac
  #        or, in a play, a map keyed by ansible_architecture, or a `when:` on it.
  #
  # The literal is allowed only where it IS the selection: a case arm label, a map key, or a
  # line that tests the architecture (ansible_architecture, uname -m, dpkg
  # --print-architecture, TARGETARCH, GOARCH, platform.machine()). Comments are prose.
  #
  # Known instances are listed in scripts/arch-pin.allowlist, a ratchet: a file may only lose
  # findings, and a file not on it may have none (scripts/qa-arch-pin.bash).
  - id: arch-pinned-artefact
    patterns:
      - pattern-regex: '(?<![A-Za-z0-9])(?:x86_64|x86-64|amd64|x64|linux64)(?![A-Za-z0-9])'
      # A comment line.
      - pattern-not-regex: '(?m)^[ \t]*(?:#|//)[^\n]*'
      # A case arm: `amd64)`, `x86_64|amd64)`, `"x86_64")`, `sha256_x86_64 | sha256_aarch64)`.
      - pattern-not-regex: '(?m)^[ \t]*\(?["'']?[A-Za-z0-9_-]*(?:x86_64|x86-64|amd64|x64|aarch64|arm64)["'']?(?:[ \t]*\|[ \t]*["'']?[A-Za-z0-9_-]+["'']?)*\)[^\n]*'
      # A map keyed by architecture: `x86_64: ...`, `"amd64": ...`, `tool_sha256_x86_64: ...`.
      - pattern-not-regex: '(?m)^[ \t]*-?[ \t]*["'']?[A-Za-z0-9_-]*(?:x86_64|x86-64|amd64|x64|aarch64|arm64)["'']?[ \t]*:[^\n]*'
      # A line that tests the architecture, or names an ARM build beside the x86 one.
      - pattern-not-regex: '(?m)^[^\n]*(?:ansible_architecture|ansible_machine|uname -m|print-architecture|TARGETARCH|GOARCH|platform\.machine|aarch64|arm64)[^\n]*'
    paths:
      exclude:
        # This rule, its fixture and its ratchet.
        - '.semgrep/arch-pin.*'
        - 'scripts/arch-pin.allowlist'
        # Prose: documents, plans and changelogs install nothing.
        - '*.md'
        - 'CLAUDE/Plan/**'
        # Test data describes machines; it installs nothing.
        - 'tests/**'
        - '*_test.go'
        - '**/testdata/**'
        - 'scripts/test-*.bash'
        # Vendored and upstream-owned trees.
        - 'src-go/vendor/**'
        - '.claude/hooks-daemon/**'
        - '.claude/skills/**'
        - 'untracked/**'
    languages: [generic]
    severity: ERROR
    message: >
      arch-pinned-artefact: a download, package or image fixed to one CPU architecture.
      Select it (and its checksum) by the architecture the build or host runs on, or fail
      loudly naming the missing component. See CLAUDE/QA.md "arch-pinned-artefact".
    metadata:
      category: correctness
      confidence: MEDIUM
      dbf-class: a download, package or image reference fixed to one CPU architecture
