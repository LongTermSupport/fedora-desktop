rules:
  # Rule: a downloaded model is present only when its weights are (Defence Before Fix;
  # CLAUDE/QA.md "model-present-without-weights").
  #
  # A Hugging Face cache snapshot appears as soon as a download starts: the small config
  # files land first, and the weights arrive last. An interrupted download leaves a
  # snapshot with no model.bin, which faster-whisper cannot load. Code that judges a model
  # present from the cache or snapshot directory therefore offers a model that fails later
  # and somewhere else. That is how the panel's server came to time out on an `auto`
  # model whose download had never finished.
  #
  # WRONG: snapshots.exists() and any(snapshots.iterdir())
  # RIGHT: any((rev / "model.bin").is_file() for rev in snapshots.iterdir())
  #
  # The rule reports a function that names a `snapshots` path component (the word right
  # after a quote or a slash) and never names model.bin. The word alone is not enough:
  # helpers/containerwatch takes CPU "snapshots", which are no cache.
  - id: model-present-without-weights
    languages: [javascript]
    patterns:
      - pattern-regex: '[/''"`]snapshots\b'
      - pattern-inside: |
          $M(...) { ... }
      - pattern-not-inside: |
          $M(...) {
            ...
            <... 'model.bin' ...>;
            ...
          }
    message: >
      model-present-without-weights: a model judged present from its cache snapshot.
      Check that model.bin is in the snapshot. See CLAUDE/QA.md
      "model-present-without-weights".
    severity: ERROR
    metadata:
      dbf-class: a downloaded model judged present without its weight file
  - id: model-present-without-weights
    languages: [python]
    patterns:
      - pattern-regex: '[/''"`]snapshots\b'
      - pattern-inside: |
          def $F(...):
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            <... 'model.bin' ...>
            ...
    message: >
      model-present-without-weights: a model judged present from its cache snapshot.
      Check that model.bin is in the snapshot. See CLAUDE/QA.md
      "model-present-without-weights".
    severity: ERROR
    metadata:
      dbf-class: a downloaded model judged present without its weight file

  # Rule: a dropdown option is a short name (Defence Before Fix; CLAUDE/QA.md
  # "dropdown-label-carries-explanation").
  #
  # An Adw.ComboRow shows the selected option beside the row's title, in whatever width is
  # left, and ellipsizes the rest. An option that carries its own explanation (a clause
  # after an em dash, a parenthesis, timings, a caveat) is cut off. Then neither the
  # selected value nor the options can be read. The owner reported exactly that for every
  # Startup mode option. The explanation belongs in the row's subtitle.
  #
  # WRONG: ['Standard — load then start (~3-6s)', ...]
  # RIGHT: ['Standard', ...], with 'Standard: load the model at each Insert …' in the subtitle
  #
  # A label is reported when it holds an em dash, a parenthesis, a comma, a semicolon or a
  # tilde, or runs to 25 characters or more. The 34-character original was truncated, and
  # the longest short name in the panel is 19. The labels are found in every place the
  # panel builds them: an `_addComboRow` call, the WHISPER_MODELS catalogue, and a
  # `labels` array built or pushed to at runtime.
  - id: dropdown-label-carries-explanation
    languages: [javascript]
    patterns:
      - pattern-either:
          - pattern: this._addComboRow($G, $S, $K, $T, $SUB, $VALS, [..., $L, ...])
          - pattern: const WHISPER_MODELS = [..., [$ID, $REPO, $L, ...], ...];
          - patterns:
              - pattern-either:
                  - pattern: $LABELS.push($L)
                  - pattern: const $LABELS = [..., $L, ...];
              - metavariable-regex:
                  metavariable: $LABELS
                  regex: '^(labels|.*Labels)$'
      - focus-metavariable: $L
      - metavariable-regex:
          metavariable: $L
          regex: '(?s)^.(?:.*(?:—|\(|\)|,|;|~).*|.{25,}).$'
    message: >
      dropdown-label-carries-explanation: a dropdown option that explains itself is
      truncated in the row. Use a short name and move the explanation to the row's
      subtitle. See CLAUDE/QA.md "dropdown-label-carries-explanation".
    severity: ERROR
    metadata:
      dbf-class: a dropdown option label that carries explanation instead of a short name

  # Rules: a test's pass must not hang on a wall-clock margin a loaded host can eat
  # (Defence Before Fix; CLAUDE/QA.md "test-wall-clock-ceiling-under-a-second" and
  # "test-deadline-under-ten-steps").
  #
  # The full QA gate runs beside other agents' builds and tests. A test that passes alone
  # fails there when what it waits on (a stub process, a thread, a timer) must happen
  # inside a margin the scheduler can use up: the keepalive test sent a keepalive every
  # 0.1 s against a 0.3 s heartbeat, and lost the session mid-test.
  #
  # WRONG: self.assertLess(time.monotonic() - started, 0.5)    a sub-second ceiling
  # WRONG: heartbeat_seconds=0.3 ... for _: time.sleep(0.1)    a deadline of 3 steps
  # RIGHT: a ceiling of a second or more, about ten times what it bounds; a deadline at
  #        least ten of the steps that race it; better, wait on the event itself.
  #
  # The first rule reports an upper bound under 1 s on a difference (an elapsed time),
  # directly or through a variable holding one. The second reports, in a test function, a
  # sleep inside a loop whose step is more than a tenth of a deadline-like keyword argument
  # given earlier in the same function. Margins split across places (a stub script's
  # sleep against a constant patched in setUp, a production constant) are not seen.
  - id: test-wall-clock-ceiling-under-a-second
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $T.assertLess($A - $B, $N, ...)
          - pattern: $T.assertLessEqual($A - $B, $N, ...)
          - pattern: assert $A - $B < $N
          - pattern: assert $A - $B <= $N
          - patterns:
              - pattern-inside: |
                  $G = $A - $B
                  ...
              - pattern-either:
                  - pattern: $T.assertLess($G, $N, ...)
                  - pattern: $T.assertLessEqual($G, $N, ...)
                  - pattern: assert $G < $N
                  - pattern: assert $G <= $N
      - metavariable-regex:
          metavariable: $N
          regex: '^[0-9]*\.?[0-9]+$'
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 1
    message: >
      test-wall-clock-ceiling-under-a-second: an elapsed time bounded under 1 s fails on
      a loaded host. Bound it at a second or more, about ten times what it measures. See
      CLAUDE/QA.md "test-wall-clock-ceiling-under-a-second".
    severity: ERROR
    metadata:
      dbf-class: a test whose pass depends on a wall-clock margin too tight for a loaded host
  - id: test-deadline-under-ten-steps
    languages: [python]
    patterns:
      - pattern-inside: |
          def $TEST(...):
            ...
      - metavariable-regex:
          metavariable: $TEST
          regex: '^test'
      - pattern-inside: |
          $F(..., $K=$H, ...)
          ...
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)(heartbeat|timeout|deadline|grace|limit|attempt|confirm|budget|wait|silence|max)'
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                ...
          - pattern-inside: |
              while $C:
                ...
      - pattern: time.sleep($S)
      - metavariable-regex:
          metavariable: $H
          regex: '^[0-9]*\.?[0-9]+$'
      - metavariable-regex:
          metavariable: $S
          regex: '^[0-9]*\.?[0-9]+$'
      - metavariable-comparison:
          comparison: $H < 10 * $S
    message: >
      test-deadline-under-ten-steps: a loop step more than a tenth of the deadline it
      races; a loaded host's delay crosses it. Give the deadline ten steps or more. See
      CLAUDE/QA.md "test-deadline-under-ten-steps".
    severity: ERROR
    metadata:
      dbf-class: a test whose pass depends on a wall-clock margin too tight for a loaded host
  # Rule: a text stream handed over is a real one (Defence Before Fix; CLAUDE/QA.md
  # "stream-stand-in-not-a-text-stream").
  #
  # A class written with only write() is accepted wherever a TextIO is: Python checks
  # nothing, and no type checker runs here. The consumer is free to call the rest of the
  # stream interface, and the first writelines(), flush() or print(file=) raises
  # AttributeError. That is how the login report's freshness check came to crash with
  # "'_Sink' object has no attribute 'writelines'" on every stale play.
  #
  # WRONG: class _Sink:  def write(self, text): ...      run(stdout=_Sink())
  # RIGHT: run(stdout=io.StringIO())   or   class _Locked(io.TextIOBase): ...
  #
  # The rule reports a class defined in the same file with a write(self, text) method and
  # no io or Protocol base, when an instance is passed as a stream-named keyword argument
  # (directly or through a variable, tuple assignments included), assigned to sys.stdout
  # or sys.stderr, given to redirect_stdout/redirect_stderr, or assigned over a parameter
  # whose annotation names TextIO or IO[str] anywhere in it. semgrep anchors a
  # metavariable-regex at the start of the value, so each regex spans the whole of it.
  # A stand-in defined in one module and handed over in another, or passed
  # positionally, is not seen.
  - id: stream-stand-in-not-a-text-stream
    languages: [python]
    patterns:
      - pattern-inside: |
          class $C(...):
              ...
              def write(self, $T, ...):
                  ...
              ...
          ...
      - pattern-not-inside: |
          class $C(..., io.$B, ...):
              ...
          ...
      - pattern-not-inside: |
          class $C(..., TextIOBase, ...):
              ...
          ...
      - pattern-not-inside: |
          class $C(..., StringIO, ...):
              ...
          ...
      - pattern-not-inside: |
          class $C(..., IOBase, ...):
              ...
          ...
      - pattern-not-inside: |
          class $C(..., TextIOWrapper, ...):
              ...
          ...
      - pattern-not-inside: |
          class $C(..., Protocol, ...):
              ...
          ...
      - pattern-not-inside: |
          class $C(..., typing.Protocol, ...):
              ...
          ...
      - pattern-either:
          - patterns:
              - pattern: $F(..., $K=$C(...), ...)
              - metavariable-regex:
                  metavariable: $K
                  regex: '(?i)^(std(out|err)|out|err|output|stream|file|sink|unchecked|log|diagnostics|errors|out_\w*|err_\w*|\w*_stream|\w*_sink)$'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $V = $C(...)
                      ...
                  - pattern-inside: |
                      $V, ... = $C(...), ...
                      ...
                  - pattern-inside: |
                      $V0, $V, ... = $X0, $C(...), ...
                      ...
                  - pattern-inside: |
                      $V0, $V1, $V, ... = $X0, $X1, $C(...), ...
                      ...
              - pattern: $F(..., $K=$V, ...)
              - metavariable-regex:
                  metavariable: $K
                  regex: '(?i)^(std(out|err)|out|err|output|stream|file|sink|unchecked|log|diagnostics|errors|out_\w*|err_\w*|\w*_stream|\w*_sink)$'
          - pattern: sys.stdout = $C(...)
          - pattern: sys.stderr = $C(...)
          - pattern: contextlib.redirect_stdout($C(...))
          - pattern: contextlib.redirect_stderr($C(...))
          - pattern: redirect_stdout($C(...))
          - pattern: redirect_stderr($C(...))
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      def $FN(..., $P: $ANN, ...):
                          ...
                  - pattern-inside: |
                      def $FN(..., $P: $ANN = $D, ...):
                          ...
              - metavariable-regex:
                  metavariable: $ANN
                  regex: '[^\n]*\b(TextIO|TextIOBase|IO\[str\])'
              - pattern: $P = $C(...)
    message: >
      stream-stand-in-not-a-text-stream: an object with only write() is handed over as a
      text stream; the first writelines(), flush() or print(file=) on it raises. Use
      io.StringIO, or derive from io.TextIOBase. See CLAUDE/QA.md
      "stream-stand-in-not-a-text-stream".
    severity: ERROR
    metadata:
      dbf-class: a hand-rolled text-stream stand-in passed where a real text stream is expected

  # Rule: a finished state is published only once the cleanup it implies is done (Defence
  # Before Fix; CLAUDE/QA.md "completion-published-before-cleanup").
  #
  # Another thread reads a job's state (FILE_PROGRESS, STATUS, busy(), an Event wait) to learn
  # it has ended. Cleanup run after that state is set is still pending when the reader acts:
  # the reader sees "done" and the marker that says the job runs, or starts the next job and
  # has its marker deleted by the old job's late cleanup. wsi-stream-server's file job set
  # "done" before deleting its marker, and a test that checked the marker after "done" failed
  # one run in seven.
  #
  # WRONG: with self._lock: self._state = state
  #        MARKER.unlink(missing_ok=True)
  # RIGHT: MARKER.unlink(missing_ok=True)
  #        with self._lock: self._state = state
  #
  # Published: an assignment to an attribute named state or status (alone or in a tuple),
  # inside a `with` block or not, or `.set()` on an Event named for an ending (finished,
  # done, complete, ended, exited). Cleanup after it in the same function: a path removed
  # (unlink, rmdir, os.remove, os.unlink, os.rmdir, shutil.rmtree), a process signalled
  # (terminate, kill), or an update_*() call. A stop REQUEST (an Event named stop) is not a
  # completion.
  - id: completion-published-before-cleanup
    languages: [python]
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern-inside: |
                          with $L:
                            ...
                            $X.$S = $V
                            ...
                          ...
                      - pattern-not-inside: |
                          with $L:
                            ...
                            $X.$S = $V
                            ...
                      - pattern: $CLEAN
                  - patterns:
                      - pattern-inside: |
                          with $L:
                            ...
                            $X.$S, $Y = $V
                            ...
                          ...
                      - pattern-not-inside: |
                          with $L:
                            ...
                            $X.$S, $Y = $V
                            ...
                      - pattern: $CLEAN
                  - patterns:
                      - pattern-inside: |
                          with $L:
                            ...
                            $Y, $X.$S = $V
                            ...
                          ...
                      - pattern-not-inside: |
                          with $L:
                            ...
                            $Y, $X.$S = $V
                            ...
                      - pattern: $CLEAN
                  - pattern-inside: |
                      $X.$S = $V
                      ...
                  - pattern-inside: |
                      $X.$S, $Y = $V
                      ...
                  - pattern-inside: |
                      $Y, $X.$S = $V
                      ...
              - metavariable-regex:
                  metavariable: $S
                  regex: '^_?(state|status)$'
          - patterns:
              - pattern-inside: |
                  $E.set()
                  ...
              - metavariable-regex:
                  metavariable: $E
                  regex: '(?i).*(finish|done|complete|ended|exited)\w*$'
      - pattern-either:
          - pattern: $P.unlink(...)
          - pattern: $P.rmdir(...)
          - pattern: os.unlink(...)
          - pattern: os.remove(...)
          - pattern: os.rmdir(...)
          - pattern: shutil.rmtree(...)
          - pattern: $P.terminate()
          - pattern: $P.kill()
          - patterns:
              - pattern: $FN(...)
              - metavariable-regex:
                  metavariable: $FN
                  regex: '^update_\w+$'
    message: >
      completion-published-before-cleanup: this cleanup runs after the state that tells
      another thread the job has ended, so that thread can act on what is not yet cleaned
      up. Clean up first, then publish the state. See CLAUDE/QA.md
      "completion-published-before-cleanup".
    severity: ERROR
    metadata:
      dbf-class: a job's end published before the cleanup a reader of that end relies on

  # Rule: a recorder Escape kills does not leave its recording behind (Defence Before Fix;
  # CLAUDE/QA.md "recorder-killed-leaving-its-files").
  #
  # Escape kills a batch recorder's whole process group with SIGKILL, so nothing is
  # transcribed. A killed process runs no cleanup: wsi never removed /dev/shm/wfile-<user>.wav,
  # and the room audio Escape was meant to throw away stayed until the next recording or a
  # reboot. The panel, which sent the KILL, must remove what the recorder would have.
  #
  # WRONG: const {signal, group} = discardSignal(launch);
  #        this._signalProcess(pid, signal, group);
  # RIGHT: discardRecorder(pid, launch, {user, home, send, remove})   (recorderLaunch.js),
  #        whose returned removal of discardLeftovers(launch, ...) runs once the recorder has
  #        exited (panelSession.js)
  #
  # The rule reports, outside a node:test test(...), a kill in a function (a method, a
  # function declaration or expression, or an arrow function) that never calls
  # discardLeftovers(). A kill is a discardSignal() call, a call given the signal name 'KILL'
  # or 'SIGKILL', an argv array naming -KILL, -9, -SIGKILL, KILL or SIGKILL, a
  # send_signal(9) or a force_exit().
  - id: recorder-killed-leaving-its-files
    languages: [javascript]
    patterns:
      - pattern-either:
          - pattern: discardSignal(...)
          - pattern: $F(..., 'KILL', ...)
          - pattern: $F(..., 'SIGKILL', ...)
          - pattern: '[..., "-KILL", ...]'
          - pattern: '[..., "-9", ...]'
          - pattern: '[..., "-SIGKILL", ...]'
          - pattern: '[..., "KILL", ...]'
          - pattern: '[..., "SIGKILL", ...]'
          - pattern: $P.send_signal(9)
          - pattern: $P.force_exit()
      - pattern-either:
          - pattern-inside: |
              $M(...) { ... }
          - pattern-inside: |
              function $M(...) { ... }
          - pattern-inside: |
              function (...) { ... }
          - pattern-inside: |
              (...) => { ... }
          - pattern-inside: |
              (...) => $BODY
      - pattern-not-inside: |
          $M(...) {
            ...
            <... discardLeftovers(...) ...>;
            ...
          }
      - pattern-not-inside: |
          function $M(...) {
            ...
            <... discardLeftovers(...) ...>;
            ...
          }
      - pattern-not-inside: test(...)
    message: >
      recorder-killed-leaving-its-files: a recorder killed here cannot remove its own
      recording. Remove what it leaves (discardLeftovers in recorderLaunch.js) once the kill
      is sent. See CLAUDE/QA.md "recorder-killed-leaving-its-files".
    severity: ERROR
    metadata:
      dbf-class: a process killed uncatchably whose files the killer leaves on disk

  # Rule: code the hooks daemon loads never resolves a path against its own working
  # directory (Defence Before Fix; CLAUDE/QA.md "hook-path-resolved-against-cwd").
  #
  # A hook handler runs in the daemon's process, whose working directory is not the agent's
  # project. A relative tool path resolved with os.path.realpath() was judged against
  # wherever the daemon (or its test) ran: allowed in the container, whose working
  # directory is /workspace, and blocked as a system file on the host, whose is under /home.
  #
  # WRONG: os.path.realpath(file_path)
  # RIGHT: if not os.path.isabs(file_path):
  #            file_path = os.path.join(project_root, file_path)
  #        os.path.realpath(file_path)
  #
  # The rule reports, in a module that imports claude_code_hooks_daemon (any import form):
  # os.getcwd() and Path.cwd() always; any .resolve() or .absolute() on a path not built from
  # __file__, other than Path(value) itself; and os.path.realpath, abspath or relpath of a
  # value, or Path(value).resolve() or .absolute(), unless the value is __file__ or the same
  # block first has `if not os.path.isabs(value):` whose body makes the value absolute with
  # os.path.join or raises.
  - id: hook-path-resolved-against-cwd
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              from claude_code_hooks_daemon.$M import $N
              ...
          - pattern-inside: |
              from claude_code_hooks_daemon import $N
              ...
          - pattern-inside: |
              import claude_code_hooks_daemon
              ...
          - pattern-inside: |
              import claude_code_hooks_daemon.$M
              ...
      - pattern-either:
          - pattern: os.getcwd()
          - pattern: Path.cwd()
          - pattern: pathlib.Path.cwd()
          - patterns:
              - pattern-either:
                  - pattern: $P.resolve(...)
                  - pattern: $P.absolute()
              - pattern-not: Path($X).resolve(...)
              - pattern-not: Path($X).absolute()
              - pattern-not: pathlib.Path($X).resolve(...)
              - pattern-not: pathlib.Path($X).absolute()
              - metavariable-regex:
                  metavariable: $P
                  regex: '^(?!.*__file__)'
          - patterns:
              - pattern-either:
                  - pattern: os.path.realpath($X)
                  - pattern: os.path.abspath($X)
                  - pattern: os.path.relpath($X)
                  - pattern: Path($X).resolve(...)
                  - pattern: Path($X).absolute()
                  - pattern: pathlib.Path($X).resolve(...)
                  - pattern: pathlib.Path($X).absolute()
              - pattern-not: Path(__file__).resolve(...)
              - pattern-not: os.path.realpath(__file__)
              - pattern-not-inside: |
                  if not os.path.isabs($X):
                    $X = os.path.join(...)
                  ...
              - pattern-not-inside: |
                  if not os.path.isabs($X):
                    raise $E
                  ...
    message: >
      hook-path-resolved-against-cwd: this resolves a path against the hooks daemon's
      working directory, which is not the agent's project. Make a relative path absolute
      against the project root first. See CLAUDE/QA.md "hook-path-resolved-against-cwd".
    severity: ERROR
    metadata:
      dbf-class: a path resolved against the hooks daemon's working directory
