rules:
  # Rule: a downloaded model is present only when its weights are (Defence Before Fix;
  # CLAUDE/QA.md "model-present-without-weights").
  #
  # A Hugging Face cache snapshot appears as soon as a download starts: the small config
  # files land first, and the weights arrive last. An interrupted download leaves a
  # snapshot with no model.bin, which faster-whisper cannot load. Code that judges a model
  # present from the cache or snapshot directory therefore offers a model that fails later
  # and somewhere else. That is how the panel's server came to time out on an `auto`
  # model whose download had never finished.
  #
  # WRONG: snapshots.exists() and any(snapshots.iterdir())
  # RIGHT: any((rev / "model.bin").is_file() for rev in snapshots.iterdir())
  #
  # The rule reports a function that names a `snapshots` path component (the word right
  # after a quote or a slash) and never names model.bin. The word alone is not enough:
  # helpers/containerwatch takes CPU "snapshots", which are no cache.
  - id: model-present-without-weights
    languages: [javascript]
    patterns:
      - pattern-regex: '[/''"`]snapshots\b'
      - pattern-inside: |
          $M(...) { ... }
      - pattern-not-inside: |
          $M(...) {
            ...
            <... 'model.bin' ...>;
            ...
          }
    message: >
      model-present-without-weights: a model judged present from its cache snapshot.
      Check that model.bin is in the snapshot. See CLAUDE/QA.md
      "model-present-without-weights".
    severity: ERROR
    metadata:
      dbf-class: a downloaded model judged present without its weight file
  - id: model-present-without-weights
    languages: [python]
    patterns:
      - pattern-regex: '[/''"`]snapshots\b'
      - pattern-inside: |
          def $F(...):
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            <... 'model.bin' ...>
            ...
    message: >
      model-present-without-weights: a model judged present from its cache snapshot.
      Check that model.bin is in the snapshot. See CLAUDE/QA.md
      "model-present-without-weights".
    severity: ERROR
    metadata:
      dbf-class: a downloaded model judged present without its weight file

  # Rule: a dropdown option is a short name (Defence Before Fix; CLAUDE/QA.md
  # "dropdown-label-carries-explanation").
  #
  # An Adw.ComboRow shows the selected option beside the row's title, in whatever width is
  # left, and ellipsizes the rest. An option that carries its own explanation (a clause
  # after an em dash, a parenthesis, timings, a caveat) is cut off. Then neither the
  # selected value nor the options can be read. The owner reported exactly that for every
  # Startup mode option. The explanation belongs in the row's subtitle.
  #
  # WRONG: ['Standard — load then start (~3-6s)', ...]
  # RIGHT: ['Standard', ...], with 'Standard: load the model at each Insert …' in the subtitle
  #
  # A label is reported when it holds an em dash, a parenthesis, a comma, a semicolon or a
  # tilde, or runs to 25 characters or more. The 34-character original was truncated, and
  # the longest short name in the panel is 19. The labels are found in every place the
  # panel builds them: an `_addComboRow` call, the WHISPER_MODELS catalogue, and a
  # `labels` array built or pushed to at runtime.
  - id: dropdown-label-carries-explanation
    languages: [javascript]
    patterns:
      - pattern-either:
          - pattern: this._addComboRow($G, $S, $K, $T, $SUB, $VALS, [..., $L, ...])
          - pattern: const WHISPER_MODELS = [..., [$ID, $REPO, $L, ...], ...];
          - patterns:
              - pattern-either:
                  - pattern: $LABELS.push($L)
                  - pattern: const $LABELS = [..., $L, ...];
              - metavariable-regex:
                  metavariable: $LABELS
                  regex: '^(labels|.*Labels)$'
      - focus-metavariable: $L
      - metavariable-regex:
          metavariable: $L
          regex: '(?s)^.(?:.*(?:—|\(|\)|,|;|~).*|.{25,}).$'
    message: >
      dropdown-label-carries-explanation: a dropdown option that explains itself is
      truncated in the row. Use a short name and move the explanation to the row's
      subtitle. See CLAUDE/QA.md "dropdown-label-carries-explanation".
    severity: ERROR
    metadata:
      dbf-class: a dropdown option label that carries explanation instead of a short name

  # Rules: a test's pass must not hang on a wall-clock margin a loaded host can eat
  # (Defence Before Fix; CLAUDE/QA.md "test-wall-clock-ceiling-under-a-second" and
  # "test-deadline-under-ten-steps").
  #
  # The full QA gate runs beside other agents' builds and tests. A test that passes alone
  # fails there when what it waits on (a stub process, a thread, a timer) must happen
  # inside a margin the scheduler can use up: the keepalive test sent a keepalive every
  # 0.1 s against a 0.3 s heartbeat, and lost the session mid-test.
  #
  # WRONG: self.assertLess(time.monotonic() - started, 0.5)    a sub-second ceiling
  # WRONG: heartbeat_seconds=0.3 ... for _: time.sleep(0.1)    a deadline of 3 steps
  # RIGHT: a ceiling of a second or more, about ten times what it bounds; a deadline at
  #        least ten of the steps that race it; better, wait on the event itself.
  #
  # The first rule reports an upper bound under 1 s on a difference (an elapsed time),
  # directly or through a variable holding one. The second reports, in a test function, a
  # sleep inside a loop whose step is more than a tenth of a deadline-like keyword argument
  # given earlier in the same function. Margins split across places (a stub script's
  # sleep against a constant patched in setUp, a production constant) are not seen.
  - id: test-wall-clock-ceiling-under-a-second
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $T.assertLess($A - $B, $N, ...)
          - pattern: $T.assertLessEqual($A - $B, $N, ...)
          - pattern: assert $A - $B < $N
          - pattern: assert $A - $B <= $N
          - patterns:
              - pattern-inside: |
                  $G = $A - $B
                  ...
              - pattern-either:
                  - pattern: $T.assertLess($G, $N, ...)
                  - pattern: $T.assertLessEqual($G, $N, ...)
                  - pattern: assert $G < $N
                  - pattern: assert $G <= $N
      - metavariable-regex:
          metavariable: $N
          regex: '^[0-9]*\.?[0-9]+$'
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 1
    message: >
      test-wall-clock-ceiling-under-a-second: an elapsed time bounded under 1 s fails on
      a loaded host. Bound it at a second or more, about ten times what it measures. See
      CLAUDE/QA.md "test-wall-clock-ceiling-under-a-second".
    severity: ERROR
    metadata:
      dbf-class: a test whose pass depends on a wall-clock margin too tight for a loaded host
  - id: test-deadline-under-ten-steps
    languages: [python]
    patterns:
      - pattern-inside: |
          def $TEST(...):
            ...
      - metavariable-regex:
          metavariable: $TEST
          regex: '^test'
      - pattern-inside: |
          $F(..., $K=$H, ...)
          ...
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)(heartbeat|timeout|deadline|grace|limit|attempt|confirm|budget|wait|silence|max)'
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                ...
          - pattern-inside: |
              while $C:
                ...
      - pattern: time.sleep($S)
      - metavariable-regex:
          metavariable: $H
          regex: '^[0-9]*\.?[0-9]+$'
      - metavariable-regex:
          metavariable: $S
          regex: '^[0-9]*\.?[0-9]+$'
      - metavariable-comparison:
          comparison: $H < 10 * $S
    message: >
      test-deadline-under-ten-steps: a loop step more than a tenth of the deadline it
      races; a loaded host's delay crosses it. Give the deadline ten steps or more. See
      CLAUDE/QA.md "test-deadline-under-ten-steps".
    severity: ERROR
    metadata:
      dbf-class: a test whose pass depends on a wall-clock margin too tight for a loaded host
