#!/usr/bin/env ansible-playbook
---
# Podman Rootless Store Repair
#
# Repairs a rootless podman store wedged by leftover files owned by UIDs OUTSIDE
# the user's current /etc/subuid map. The unprivileged user — and even `podman
# unshare` (namespaced root, confined to that map) — cannot remove such files
# (permission denied), so podman fails to load its store, rc=125.
#
# TWO DISTINCT failure surfaces, established from triage on host joseph-p14:
#
#   1. Incomplete OVERLAY LAYER (the store-load blocker): podman names it on
#      every load and tries to stage-delete it, but the layer dir is owned by an
#      out-of-map sub-UID so the rename fails EACCES. Until it is gone, EVERY
#      podman command (info/images/ps/run → CCY startup) fails. THIS is what
#      blocks CCY. Fix: remove the named layer dir as REAL root. Safe — an
#      incomplete layer is never the mounted layer of a running container.
#
#   2. Out-of-map VOLUME _data (a `podman system df` blocker ONLY): `podman
#      system df` walks each volume's _data to compute its size and aborts on a
#      volume owned by an out-of-map sub-UID (open _data: permission denied).
#      This does NOT block the store from loading and does NOT block CCY — only
#      `df`'s size accounting. Such a volume still holds real data (e.g. a
#      Postgres data dir), so this play REPORTS it and does NOT delete it. Making
#      it usable again is a deliberate subuid migration (Plan 00062 Task 4.8),
#      not part of unblocking the store.
#
# HEALTH GATE: `podman info` + `podman images` (they load the store fully but do
# NOT walk volume contents) — the correct "does the store load?" signal. `podman
# system df` is captured for information only; its failure on an out-of-map
# volume is expected and is NOT treated as store failure.
#
# Root cause of the out-of-map ownership on this host (grounded, not assumed):
# the user's /etc/subuid range changed (this repo's play-docker.yml removed a
# hand-managed 100000:65536 block, reverting to Fedora's auto-allocated
# 524288:65536). Artifacts built under the old 100000 map are thereby orphaned.
# Establish/confirm with triage.bash before drawing conclusions.
#
# Plan-local incident-recovery playbook (Plan 00062) — NOT durable IaC, so it
# lives in the plan folder, not under playbooks/. Prefer the wrapper (captures
# full output to untracked/reports/):
#   CLAUDE/Plan/00062-disk-reclaim-tui/deploy.bash
# or run it directly on the HOST:
#   ansible-playbook CLAUDE/Plan/00062-disk-reclaim-tui/podman-store-repair.yml
#
# Optional: also remove a specific image podman flagged corrupted (it will be
# re-pulled/rebuilt on next use) — e.g. the CCY image:
#   ...deploy.bash -e podman_repair_remove_image=claude-yolo:latest
- hosts: desktop
  name: Podman Rootless Store Repair - clear incomplete overlay layers so the store loads
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    plan_dir: "{{ root_dir }}/CLAUDE/Plan/00062-disk-reclaim-tui"
    podman_storage: "/home/{{ user_login }}/.local/share/containers/storage"
    podman_tempdirs: "/home/{{ user_login }}/.local/share/containers/storage/overlay/tempdirs"
    podman_user_runtime: "/run/user/{{ user_login_uid | default(1000) }}"
    podman_repair_max_passes: 6   # bounded self-iteration over incomplete layers
    podman_repair_remove_image: ""   # set via -e to also drop a corrupted image
  tasks:
    - name: Probe rootless store health BEFORE repair via podman info (as the user)
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman info
      register: podman_info_before
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: a wedged store returns non-zero; we branch/report on rc below
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Report store health before repair
      ansible.builtin.debug:
        msg: >-
          podman store BEFORE repair: podman info rc={{ podman_info_before.rc }}
          ({{ 'healthy — nothing to repair' if podman_info_before.rc == 0 else 'WEDGED — will clear incomplete layers' }})

    # Bounded self-iteration: each pass probes `podman info`; if it fails because
    # of an incomplete overlay layer, that layer is removed as REAL root and the
    # next pass gets further. podman surfaces incomplete layers one-at-a-time
    # (it aborts the load at the first it cannot delete), so we loop until the
    # store loads or we exhaust the pass budget. Removing an incomplete layer is
    # exactly what podman itself is trying to do — never a running mount.
    - name: Clear incomplete overlay layers until the store loads (bounded loop, as root)
      ansible.builtin.include_tasks: repair-pass.yml
      loop: "{{ range(1, podman_repair_max_passes + 1) | list }}"
      loop_control:
        loop_var: repair_pass
      when: not (store_loaded | default(false))

    - name: Stat the stale tempdirs directory
      ansible.builtin.stat:
        path: "{{ podman_tempdirs }}"
      register: podman_tempdirs_stat

    - name: Remove stale podman temp dirs as root (orphaned scratch; bypasses sub-UID ownership)
      ansible.builtin.file:
        path: "{{ podman_tempdirs }}"
        state: absent
      when: podman_tempdirs_stat.stat.exists
      register: podman_tempdirs_removed

    - name: Final store-load probe - podman info (as the user)
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman info
      register: podman_info_after
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: asserted explicitly two tasks below
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Final store-load probe - podman images (forces a full layer-store load)
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman images
      register: podman_images_after
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: asserted explicitly below
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Informational probe - podman system df (also sizes volumes; may fail on an out-of-map volume even when the store is healthy)
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_after
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: df failure on an out-of-map volume is expected, not a store failure
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    # Diagnostic only (as real root): owner UID of every volume _data dir. Any
    # UID that is neither the host user nor inside the current subuid map is an
    # out-of-map volume — the kind that trips `podman system df`. Printed for the
    # report; NOT acted on (these hold real data — see Task 4.8).
    - name: Diagnostic - volume _data owner uids (as real root)
      ansible.builtin.command:
        argv:
          - find
          - "{{ podman_storage }}/volumes"
          - -mindepth
          - "2"
          - -maxdepth
          - "2"
          - -name
          - _data
          - -printf
          - '%U %p\n'
      register: podman_volume_owners
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: purely diagnostic; a missing volumes dir is fine

    - name: Show post-repair diagnostics
      ansible.builtin.debug:
        msg:
          - "podman info   rc={{ podman_info_after.rc }}   (0 = store loads)"
          - "podman images rc={{ podman_images_after.rc }} (0 = layer store loads)"
          - "podman df     rc={{ podman_df_after.rc }}     (non-zero here can be an out-of-map VOLUME, not a store failure)"
          - "Incomplete overlay layers removed this run: {{ podman_incomplete_layers | default([]) }}"
          - "df stderr (if any):"
          - "{{ podman_df_after.stderr | default('') }}"
          - "volume _data owner uids (uid path):"
          - "{{ podman_volume_owners.stdout | default('(none)') }}"

    - name: Assert the store now loads (podman info AND podman images both succeed)
      ansible.builtin.assert:
        that:
          - podman_info_after.rc == 0
          - podman_images_after.rc == 0
        success_msg: "Rootless podman store loads cleanly ✅ (podman info + images OK — CCY can start now)."
        fail_msg: |
          The rootless podman store still does not load.
            podman info   rc={{ podman_info_after.rc }}
            podman images rc={{ podman_images_after.rc }}

          Incomplete overlay layers removed this run: {{ podman_incomplete_layers | default([]) }}

          podman info's remaining error was:
          {{ podman_info_after.stderr | default('(no stderr captured)') }}

          If a NEW 64-hex layer id appears above, the pass budget
          (podman_repair_max_passes={{ podman_repair_max_passes }}) was exhausted —
          re-run the play (or raise the budget with -e podman_repair_max_passes=N).
          If the error names something OTHER than an incomplete layer, capture it
          with triage.bash and share the report — do NOT run `podman system reset`
          (it wipes all rootless images/containers and disrupts the live CCY sessions).

    - name: Note out-of-map volumes (store loads, but `podman system df` cannot size them)
      ansible.builtin.debug:
        msg:
          - "The store loads, but `podman system df` failed (rc={{ podman_df_after.rc }})."
          - "That is an OUT-OF-MAP VOLUME, not a store failure — it does NOT block CCY."
          - "Such a volume still holds real data; it is NOT deleted here."
          - "Run triage.bash to list out-of-map volumes; reconciling them is a"
          - "deliberate subuid migration (Plan 00062 Task 4.8)."
      when:
        - podman_info_after.rc == 0
        - podman_df_after.rc != 0

    - name: Remove a specific corrupted image if requested
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman rmi -f {{ podman_repair_remove_image }}
      when: podman_repair_remove_image | length > 0
      register: podman_rmi
      changed_when: podman_rmi.rc == 0
      failed_when: false  # FAIL-FAST-OK: image may already be gone; informational only
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Repair summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Podman rootless store repair complete"
          - "============================================"
          - "Before: podman info rc={{ podman_info_before.rc }}"
          - "After:  podman info rc={{ podman_info_after.rc }} / images rc={{ podman_images_after.rc }} / df rc={{ podman_df_after.rc }}"
          - "Incomplete overlay layers removed: {{ podman_incomplete_layers | default([]) }}"
          - "{{ 'Corrupted image removed: ' ~ podman_repair_remove_image if podman_repair_remove_image | length > 0 else 'No image removed' }}"
          - ""
          - "If df still fails, that is an out-of-map volume (Task 4.8), not a store failure."
          - "If CCY was flagged corrupted and still misbehaves, re-run with:"
          - "  -e podman_repair_remove_image=claude-yolo:latest"
          - "then relaunch ccy (it rebuilds from .claude/ccy/Dockerfile)."
