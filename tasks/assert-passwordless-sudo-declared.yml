---
# A developer desktop declares whether it keeps passwordless sudo: there is no default, so no
# host gains or loses root without a line its owner wrote. A server or consumer install never has
# it (play-ZZZ-passwordless-sudo.yml removes it there), so it is not asked. Imported early by
# play-basic-configs.yml, so an undeclared host fails before the run changes much, and by
# play-ZZZ-passwordless-sudo.yml, which applies the choice at the end of a main run.
- name: Assert a Developer Desktop Declares passwordless_sudo_for_unattended_deploys
  ansible.builtin.assert:
    that:
      - passwordless_sudo_for_unattended_deploys is defined
      - passwordless_sudo_for_unattended_deploys is boolean
    fail_msg: >-
      This developer desktop does not declare passwordless_sudo_for_unattended_deploys (true or
      false). Add one line to environment/localhost/host_vars/localhost.yml:
      `passwordless_sudo_for_unattended_deploys: true` keeps passwordless sudo, which a host whose
      deploys an agent runs unattended needs (meta-deploy.bash);
      `passwordless_sudo_for_unattended_deploys: false` removes it, and sudo asks for your password.
      See localhost.yml.dist.
  when: provisioning_profile != 'server' and install_audience != 'consumer'
