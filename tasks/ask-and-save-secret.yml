---
# Ask for a secret a play needs and does not have, save it vault-encrypted to localhost.yml,
# and use it for this run. Later runs read it from localhost.yml and never ask again.
#
# Use it instead of failing with "add X to the vault": a person at the keyboard is asked, in
# plain words, and a typing mistake is asked again (up to three times) rather than ending the
# run. A run with no keyboard (a headless run.bash) cannot answer, so a required secret then
# fails with the way to supply it as IaC.
#
# Usage, before the play changes anything that needs the secret:
#
#   - name: Ask for the MOK password when it is missing
#     ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret.yml"
#     vars:
#       secret_name: mok_password            # the variable to set and save
#       secret_label: MOK password            # what the prompts call it
#       secret_explain: |                     # what it is for and where to get it
#         ...
#       secret_confirm: true                  # ask twice (default true; false for a pasted key)
#       secret_optional: false                # true: an empty answer skips it for this run,
#                                             #   nothing saved, the variable left undefined
#       secret_min_length: 8                  # optional bounds, checked before saving
#       secret_max_length: 63
#     when: mok_password is not defined
#
# The value goes to ansible-vault on stdin, never in a command line, and is run from the
# checkout (chdir root_dir), where ansible.cfg's relative vault password file resolves.

- name: Check the request to ask for a secret
  ansible.builtin.assert:
    that:
      - secret_name is defined
      - secret_name is match('^[a-z][a-z0-9_]*$')
      - secret_label is defined
      - secret_label | length > 0
      - secret_explain is defined
      - secret_explain | length > 0
    fail_msg: >-
      tasks/ask-and-save-secret.yml was included without secret_name (a lower-case variable
      name), secret_label and secret_explain. This is a fault in the play that included it.
    quiet: true

- name: "Explain what the {{ secret_label }} is for"
  ansible.builtin.debug:
    msg: "{{ secret_explain }}"

- name: Start with no answer
  ansible.builtin.set_fact:
    ask_secret_value: ""
    ask_secret_done: false
    ask_secret_problem: ""
    ask_secret_unattended: "{{ lookup('ansible.builtin.env', 'ASSUME_YES') == 'true' }}"
  no_log: true

# run.bash --changed --yes exports ASSUME_YES: it runs from a terminal, so a prompt would wait
# for an answer nobody gives. A headless run has no terminal, and pause answers it at once.
- name: "Stop because the {{ secret_label }} cannot be asked for on an unattended run"
  ansible.builtin.fail:
    msg: >-
      This play needs the {{ secret_label }}, it is not saved yet, and this run is unattended
      (run.bash --yes), so nobody can type it. Nothing that needs it was done.
      Save it first with ./vault.bash set {{ secret_name }}, or run the play from a terminal
      and type it when asked.
  when:
    - ask_secret_unattended | bool
    - not (secret_optional | default(false) | bool)

- name: "Skip asking for the {{ secret_label }} on an unattended run"
  ansible.builtin.set_fact:
    ask_secret_done: true
  when: ask_secret_unattended | bool

# A loop of includes: each attempt's tasks skip themselves once an answer has been taken.
- name: "Ask for the {{ secret_label }}"
  ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret-attempt.yml"
  loop: [1, 2, 3]
  loop_control:
    loop_var: ask_secret_attempt

- name: "Stop because no {{ secret_label }} was given"
  ansible.builtin.fail:
    msg: >-
      No {{ secret_label }} was given ({{ ask_secret_problem | default('no answer', true) }},
      three times), and this play cannot go on without it. Nothing that needs it was done. Run
      the play again and type it when asked. On a run with no keyboard, save it first as IaC
      with ./vault.bash set {{ secret_name }} and run the play again.
  when: not (ask_secret_done | bool)

- name: "Save the {{ secret_label }}"
  when: ask_secret_value | length > 0
  block:
    - name: "Vault-encrypt the {{ secret_label }}"
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --stdin-name
          - "{{ secret_name }}"
        # ansible.cfg names the vault password file relative to the checkout.
        chdir: "{{ root_dir }}"
        stdin: "{{ ask_secret_value }}"
        # ansible adds a newline otherwise, and encrypt_string would vault it with the secret.
        stdin_add_newline: false
      become: false
      register: ask_secret_encrypted
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe under no_log; the fail below gives the reason
      no_log: true

    # The secret went in on stdin; ansible-vault's stderr and exit code never carry it.
    - name: "Stop if the {{ secret_label }} could not be vault-encrypted"
      ansible.builtin.fail:
        msg: >-
          ansible-vault could not encrypt the {{ secret_label }} (exit
          {{ ask_secret_encrypted.rc | default('none') }}):
          {{ ask_secret_encrypted.stderr | default('') }} {{ ask_secret_encrypted.msg | default('') }}.
          Nothing was saved. Check that {{ root_dir }}/ansible.cfg names a vault password file
          that exists, then run the play again.
      when: ask_secret_encrypted.rc | default(1) != 0

    # Not no_log: the block is the vault-encrypted text, and a failure here (localhost.yml
    # missing or not writable) must say which file.
    - name: "Save the vault-encrypted {{ secret_label }} to localhost.yml"
      ansible.builtin.blockinfile:
        path: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
        marker: "# {mark} ANSIBLE MANAGED: {{ secret_name }}"
        block: "{{ ask_secret_encrypted.stdout }}"
        create: false
      become: false

    - name: "Use the {{ secret_label }} for this run"
      ansible.builtin.set_fact:
        "{{ secret_name }}": "{{ ask_secret_value }}"
      no_log: true

    - name: "Say that the {{ secret_label }} is saved"
      ansible.builtin.debug:
        msg: >-
          The {{ secret_label }} is saved in localhost.yml, vault-encrypted, as
          {{ secret_name }}. Later runs use it without asking.

- name: "Say that the {{ secret_label }} is skipped for this run"
  ansible.builtin.debug:
    msg: >-
      No {{ secret_label }} given{{ ' (an unattended run asks nobody)'
      if (ask_secret_unattended | bool) else '' }}: skipped for this run, nothing saved. The
      next run from a terminal asks again.
  when: ask_secret_value | length == 0

- name: Forget the answer
  ansible.builtin.set_fact:
    ask_secret_value: ""
  no_log: true
