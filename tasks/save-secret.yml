---
# Save a secret vault-encrypted to localhost.yml and use it for this run. Later runs read it from
# localhost.yml. The one save path for a secret a play has and the install does not:
# tasks/ask-and-save-secret.yml saves what a person typed through it, and a play that makes a
# secret (play-ftp-camera.yml's generated hotspot password) saves it here too.
#
# Usage:
#
#   - name: Save the camera hotspot Wi-Fi password
#     ansible.builtin.include_tasks: "{{ root_dir }}/tasks/save-secret.yml"
#     vars:
#       secret_name: ftp_camera_hotspot_password   # the variable to set and save
#       secret_label: camera hotspot Wi-Fi password # what the messages call it
#       secret_value: "{{ registered.stdout }}"    # a template, so the value is never in the args
#
# The value goes to ansible-vault on stdin, never in a command line, and is run from the
# checkout (chdir root_dir), where ansible.cfg's relative vault password file resolves.

- name: Check the request to save a secret
  ansible.builtin.assert:
    that:
      - secret_name is defined
      - secret_name is match('^[a-z][a-z0-9_]*$')
      - secret_label is defined
      - secret_label | length > 0
      - secret_value is defined
      - secret_value | length > 0
    fail_msg: >-
      tasks/save-secret.yml was included without secret_name (a lower-case variable name),
      secret_label and a non-empty secret_value. This is a fault in the play that included it.
    quiet: true

- name: "Vault-encrypt the {{ secret_label }}"
  ansible.builtin.command:
    argv:
      - ansible-vault
      - encrypt_string
      - --stdin-name
      - "{{ secret_name }}"
    # ansible.cfg names the vault password file relative to the checkout.
    chdir: "{{ root_dir }}"
    stdin: "{{ secret_value }}"
    # ansible adds a newline otherwise, and encrypt_string would vault it with the secret.
    stdin_add_newline: false
  become: false
  register: save_secret_encrypted
  changed_when: false
  failed_when: false  # FAIL-FAST-OK: probe under no_log; the fail below gives the reason
  no_log: true

# The secret went in on stdin; ansible-vault's stderr and exit code never carry it.
- name: "Stop if the {{ secret_label }} could not be vault-encrypted"
  ansible.builtin.fail:
    msg: >-
      ansible-vault could not encrypt the {{ secret_label }} (exit
      {{ save_secret_encrypted.rc | default('none') }}):
      {{ save_secret_encrypted.stderr | default('') }} {{ save_secret_encrypted.msg | default('') }}.
      Nothing was saved. Check that {{ root_dir }}/ansible.cfg names a vault password file
      that exists, then run the play again.
  when: save_secret_encrypted.rc | default(1) != 0

# Not no_log: the block is the vault-encrypted text, and a failure here (localhost.yml
# missing or not writable) must say which file.
- name: "Save the vault-encrypted {{ secret_label }} to localhost.yml"
  ansible.builtin.blockinfile:
    path: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
    marker: "# {mark} ANSIBLE MANAGED: {{ secret_name }}"
    block: "{{ save_secret_encrypted.stdout }}"
    create: false
  become: false

- name: "Use the {{ secret_label }} for this run"
  ansible.builtin.set_fact:
    "{{ secret_name }}": "{{ secret_value }}"
  no_log: true

- name: "Say that the {{ secret_label }} is saved"
  ansible.builtin.debug:
    msg: >-
      The {{ secret_label }} is saved in localhost.yml, vault-encrypted, as
      {{ secret_name }}. Later runs use it as it is.
