---
# Secure Boot's MOK password, for a play that installs a kernel module it signs (NVIDIA,
# DisplayLink). Include it first, before anything is installed: it registers
# secure_boot_state (mokutil --sb-state) and, when Secure Boot is on and no mok_password is
# set, asks for one and saves it vault-encrypted (tasks/ask-and-save-secret.yml), so a missing
# password never stops the play half way.
#
# Usage:
#   - name: Secure Boot MOK password, asked for now if it is needed and missing
#     ansible.builtin.include_tasks: "{{ root_dir }}/tasks/secure-boot-mok-password.yml"
#     vars:
#       mok_module: the NVIDIA driver       # what is signed, in the explanation

- name: Install mokutil for the Secure Boot check
  ansible.builtin.dnf:
    name: mokutil
    state: present
  become: true

- name: Check if Secure Boot is enabled
  ansible.builtin.command:
    argv: [mokutil, --sb-state]
  register: secure_boot_state
  changed_when: false
  failed_when: false  # FAIL-FAST-OK: probe — firmware without EFI variables has no Secure Boot to report

- name: Ask for a MOK password and save it (one-time setup)
  ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret.yml"
  vars:
    secret_name: mok_password
    secret_label: MOK password
    secret_explain: |2

      ============================================
      SECURE BOOT: CHOOSE A MOK PASSWORD
      ============================================

      Secure Boot is on, so {{ mok_module }} is signed with a key that has to be
      enrolled once, at the next boot, on a blue "MOK management" screen. That
      screen asks for the password you choose now (8 to 16 characters is
      typical). You type it once, on that screen, and it is not needed again.
  when:
    - "'SecureBoot enabled' in secure_boot_state.stdout"
    - mok_password is not defined
