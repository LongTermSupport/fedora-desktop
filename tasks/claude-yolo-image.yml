---
# The ccy image, claude-yolo:latest: its build context staged under /opt/claude-yolo (the
# Dockerfile, the entrypoint and every file the Dockerfile COPYs), the shared bash libraries
# (the build lock among them), and the build itself under the lock every ccy launch takes.
# Imported by play-claude-yolo.yml and by play-claude-code-consumer.yml, which runs the same
# image as ccc (Plan 00233). Needs root_dir, user_login and container_engine, git, and the Go
# toolchain (play-golang.yml) for the container-images build.
#
# The build context holds repository files only, copied as they are (issue 235), so a pipeline
# that stages it from the repository's files can build the image too. What the image needs built
# from this repository's source (ccy-start-claude, pingbus-status-line, teamchat and the pingbus
# zipapp) is built by the Dockerfile's builder stage from the commit given as CCY_SOURCE_COMMIT.
# scripts/test-ccy-container-version-hook.bash fails on any task here that writes anything else
# into the context where the Dockerfile copies it.
- name: Create Claude YOLO Base Directory
  become: true
  ansible.builtin.file:
    path: /opt/claude-yolo
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Custom Dockerfiles Directory
  become: true
  ansible.builtin.file:
    path: /opt/claude-yolo/custom-dockerfiles
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Dockerfile
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile"
    dest: /opt/claude-yolo/Dockerfile
    owner: root
    group: root
    mode: "0644"
  tags:
    - scripts
    - dockerfile

- name: Copy Entrypoint Script
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/var/local/claude-yolo/entrypoint.sh"
    dest: /opt/claude-yolo/entrypoint.sh
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts
    - entrypoint

- name: Copy the fzf Release Pin into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/vars/fzf-pin.yml"
    dest: /opt/claude-yolo/fzf-pin.yml
    owner: root
    group: root
    mode: "0644"
  tags:
    - scripts
    - dockerfile

- name: Copy Browser Mode Stub into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/var/local/claude-yolo/agent-browser-mode-required"
    dest: /opt/claude-yolo/agent-browser-mode-required
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts

- name: Copy Browser Session Guard into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/var/local/claude-yolo/agent-browser-session-guard"
    dest: /opt/claude-yolo/agent-browser-session-guard
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts

# The ctrl+z patch script that used to be copied here is gone (CCY 3.42.0).
# Suppressing ctrl+z is now the PTY supervisor's job, so remove the stale
# copy from build contexts provisioned by an earlier run — otherwise the
# Dockerfile hash changes while a dead file lingers beside it.
- name: Remove Retired ctrl+z Patch Script from Docker Build Context
  become: true
  ansible.builtin.file:
    path: /opt/claude-yolo/ccy-ctrl-z-patch.js
    state: absent
  tags:
    - scripts
    - dockerfile

# The Dockerfile COPYs this directory into the image at /opt/claude-yolo/supervisor-plugins/.
# Without it the build context has no supervisor-plugins/ and the image build fails.
- name: Copy Supervisor Plugins into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/var/local/claude-yolo/supervisor-plugins/"
    dest: /opt/claude-yolo/supervisor-plugins/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  tags:
    - scripts
    - dockerfile

- name: Copy PHPantom LSP Plugin into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/var/local/claude-yolo/plugins/"
    dest: /opt/claude-yolo/plugins/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  tags:
    - scripts
    - dockerfile

- name: Create Documentation Directory
  become: true
  ansible.builtin.file:
    path: /opt/claude-yolo/docs
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts
    - docs

- name: Copy CCY Startup Info File
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/opt/claude-yolo/ccy-startup-info.txt"
    dest: /opt/claude-yolo/ccy-startup-info.txt
    owner: root
    group: root
    mode: "0644"
  tags:
    - scripts

- name: Copy Documentation into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: "{{ root_dir }}/files/opt/claude-yolo/docs/CUSTOM-DOCKERFILES.txt"
      dest: /opt/claude-yolo/docs/CUSTOM-DOCKERFILES.txt
    - src: "{{ root_dir }}/files/opt/claude-yolo/docs/CCY-GUIDE.txt"
      dest: /opt/claude-yolo/docs/CCY-GUIDE.txt
  tags:
    - scripts
    - docs

- name: Create Skills Directory in Docker Build Context
  become: true
  ansible.builtin.file:
    path: /opt/claude-yolo/skills/browsing
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts
    - skills

- name: Copy Browsing Skills into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /opt/claude-yolo/skills/browsing/
    owner: root
    group: root
    mode: "0644"
  loop:
    # SKILL.md is deliberately the only file here. The command reference used to be
    # duplicated into COMMANDLINE-USAGE.md and EXAMPLES.md, which drifted so far that
    # all 97 of their examples used an `agent-browser run "..."` syntax the CLI no
    # longer has. agent-browser ships its own version-matched skills
    # (`agent-browser-headless skills get core --full`), so the skill now points at those.
    - "{{ root_dir }}/files/opt/claude-yolo/skills/browsing/SKILL.md"
  tags:
    - scripts
    - skills

- name: Create Optional Child-Claude Directories in Docker Build Context
  become: true
  ansible.builtin.file:
    path: "/opt/claude-yolo/optional/child-claude/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - bin
    - skills/child-claude
  tags:
    - scripts
    - skills

# Staged OUTSIDE /opt/claude-yolo/skills/ deliberately. The entrypoint copies
# that directory into every session unconditionally, so opt-in content cannot
# live there. Reasoning: Plan 00092, by number under CLAUDE/Plan/.
#
# The next two tasks only ever ADD, exactly like the browsing copy above, and the
# Dockerfile COPYs this whole directory. So deleting a file from
# files/opt/claude-yolo/optional/ does NOT remove it from a host's build context, and
# the stale copy keeps shipping into the image. If anything under optional/ is ever
# removed or renamed, add it to a `state: absent` task — the pattern is at
# "Remove Obsolete Browsing Skill Files" below, which exists because this was missed once.
- name: Copy Optional Child-Claude Wrapper into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/opt/claude-yolo/optional/child-claude/bin/ccy-claude"
    dest: /opt/claude-yolo/optional/child-claude/bin/ccy-claude
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts
    - skills

- name: Copy Optional Child-Claude Skill into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ root_dir }}/files/opt/claude-yolo/optional/child-claude/skills/child-claude/SKILL.md"
    dest: /opt/claude-yolo/optional/child-claude/skills/child-claude/SKILL.md
    owner: root
    group: root
    mode: "0644"
  tags:
    - scripts
    - skills

# The agent team bus member kit (Plan 00161 DESIGN.md section 5.3): the plugin, its
# settings and the pingbus zipapp. Loaded, idle, in every session started in ccy's tmux
# (PINGBUS_MEMBERSHIP, Plan 00203); a seat is held only when the session's desired
# membership names one. The non-ccy launcher agent-bus-claude is not staged: the entrypoint does
# its job here. Add-only like the child-claude copies above.
- name: Create Optional Agent-Bus Directories in Docker Build Context
  become: true
  ansible.builtin.file:
    path: "/opt/claude-yolo/optional/agent-bus/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - plugin/pingbus/.claude-plugin
    - plugin/pingbus/hooks
    - plugin/pingbus/skills/pingbus
  tags:
    - scripts
    - skills

- name: Copy Optional Agent-Bus Plugin and Settings into Docker Build Context
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: "{{ root_dir }}/files/opt/claude-yolo/optional/agent-bus/settings.json"
      dest: /opt/claude-yolo/optional/agent-bus/settings.json
    - src: "{{ root_dir }}/files/opt/claude-yolo/optional/agent-bus/plugin/pingbus/.claude-plugin/plugin.json"
      dest: /opt/claude-yolo/optional/agent-bus/plugin/pingbus/.claude-plugin/plugin.json
    - src: "{{ root_dir }}/files/opt/claude-yolo/optional/agent-bus/plugin/pingbus/hooks/hooks.json"
      dest: /opt/claude-yolo/optional/agent-bus/plugin/pingbus/hooks/hooks.json
    - src: "{{ root_dir }}/files/opt/claude-yolo/optional/agent-bus/plugin/pingbus/skills/pingbus/SKILL.md"
      dest: /opt/claude-yolo/optional/agent-bus/plugin/pingbus/skills/pingbus/SKILL.md
  tags:
    - scripts
    - skills

# The play used to build these into the context; the Dockerfile's builder stage builds them now
# (issue 235). Removed so no stale copy lies under the context's optional/, which the image COPYs
# before the builder's copies land over it.
- name: Remove the Files the Image Now Builds Itself from Docker Build Context
  become: true
  ansible.builtin.file:
    path: "/opt/claude-yolo/{{ item }}"
    state: absent
  loop:
    - ccy-start-claude
    - optional/agent-bus/pingbus
    - optional/agent-bus/pingbus-status-line
    - optional/teamchat/bin
  tags:
    - scripts
    - skills

# The agent team bus v2 member kit (Plan 00209 Task 4.1), beside v1's above and touching none of it.
- name: Stage the teamchat Kit into Docker Build Context
  ansible.builtin.import_tasks: "{{ root_dir }}/tasks/teamchat-ccy-kit.yml"

- name: Remove Obsolete Browsing Skill Files from Docker Build Context
  become: true
  ansible.builtin.file:
    path: "/opt/claude-yolo/skills/browsing/{{ item }}"
    state: absent
  loop:
    - COMMANDLINE-USAGE.md
    - EXAMPLES.md
  # The copy task above only ever ADDS files, so deleting these from the repo would
  # otherwise leave stale copies in the build context on every host that has already
  # deployed them — and the Dockerfile COPYs the whole directory, so the removed,
  # wrong documentation would keep shipping into the image indefinitely.
  tags:
    - scripts
    - skills

- name: Copy Custom Dockerfile Templates (Never Overwrite User Changes)
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/claude-yolo/custom-dockerfiles/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
    force: false # NEVER overwrite - users can customize these
  loop:
    - "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile.project-template"
    - "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile.example-ansible"
    - "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile.example-golang"
  tags:
    - scripts
    - templates

# Shared library for DRY helpers (used by ccy)
- name: Create Shared Library Directory
  become: true
  ansible.builtin.file:
    path: /var/local/claude-yolo/lib
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - scripts
    - launchers

# ccy's self-prune (lib/image-build-prune.bash, Plan 00235): every build under the lock, the
# launcher's and the one below, records the repository's images before it and removes what it
# replaced after it, through this command. The launcher finds it on PATH, as it finds
# ccy-token-usable; the build below names it by path. play-podman.yml installs the same binary
# for its daily prune; the build is checksum-compared, so the second install changes nothing.
# It is installed before the libs that call it, so a play run that stops between the two never
# leaves libs calling a command that is missing or older than they are.
- name: Build and Install the container-images Command
  ansible.builtin.import_tasks: "{{ root_dir }}/tasks/build-go-command.yml"
  vars:
    go_command_name: container-images
    go_command_dest: "/home/{{ user_login }}/.local/bin/container-images"
    go_command_mode: "0755"
  tags:
    - scripts
    - launchers

- name: Install Shared Helper Libraries
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/local/claude-yolo/lib/{{ item | basename }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/common-pure.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/common.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/host-paths.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/token-handoff.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/launcher-path.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/ssh-handling.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/token-management.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/token-usable.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/network-management.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/dockerfile-custom.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/docker-health.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/docker-network-cleanup.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/tmux-session.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/session-registry.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/restart-request.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/session-lifecycle.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/agent-bus-membership.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/agent-bus-seats.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/image-build-lock.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/image-build-prune.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/image-build.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/network-policy.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/agent-choice.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/launch-summary.bash"
    - "{{ root_dir }}/files/var/local/claude-yolo/lib/container-limits.bash"
    # ccy's one-key agent, run by path from ssh-handling.bash (stdlib Python, TDD'd in helpers/).
    - "{{ root_dir }}/helpers/ssh_agent_filter/ssh_agent_filter.py"
  # `launchers` is on the lib and on every script that sources it (ccy, cc,
  # ccy-sessions), with the directories they land in: a tag that deployed one
  # without the others would recreate the new-lib-under-old-cc break.
  tags:
    - scripts
    - launchers

# ccy_version: the build below labels :latest with it and the self-prune after it removes the
# project images an older ccy built.
- name: Read the Launcher's CCY_VERSION for the Image Label
  ansible.builtin.import_tasks: "{{ root_dir }}/tasks/ccy-version.yml"

# The commit the image's builder stage clones (Dockerfile, ccy-builder): this checkout's HEAD, so
# the image's Go commands and pingbus are built from the source this play deploys. The clone is
# from GitHub, so HEAD must be pushed or the build fails at the fetch. Written beside the
# Dockerfile, where no COPY takes it, for the launcher's own rebuilds (lib/common.bash).
- name: Read the Checkout's Commit for the Image Build
  ansible.builtin.command:
    argv: [git, -C, "{{ root_dir }}", rev-parse, --verify, "HEAD^{commit}"]
  become: false
  changed_when: false
  register: ccy_source_commit

- name: Refuse a Checkout Commit That Is Not a Full Commit Id
  ansible.builtin.assert:
    that:
      - ccy_source_commit.stdout is match('^[0-9a-f]{40}$')
    fail_msg: git rev-parse HEAD answered '{{ ccy_source_commit.stdout }}', not a 40-hex commit id.
    quiet: true

- name: Record the Commit the Image Is Built From
  become: true
  ansible.builtin.copy:
    content: "{{ ccy_source_commit.stdout }}\n"
    dest: /opt/claude-yolo/source-commit
    owner: root
    group: root
    mode: "0644"

- name: Calculate Dockerfile Hash for Build
  ansible.builtin.shell: md5sum /opt/claude-yolo/Dockerfile | cut -d' ' -f1 | cut -c1-16
  register: dockerfile_hash
  changed_when: false

# `images -q` prints nothing (rc 0) for a missing tag, so a first build or a rebuild is told
# apart from a full cache hit by comparing the image ID before and after the build.
- name: Read Claude YOLO Image ID Before Build
  ansible.builtin.command: "{{ container_engine }} images -q claude-yolo:latest"
  register: image_id_before
  changed_when: false

# Under the image's build lock, the one every ccy launch takes (lib/image-build-lock.bash,
# Plan 00216): a launch started while the play builds waits for this build and uses it, and
# the play waits for a launch's build. The check is false: the play always builds. The images
# the build replaces are removed after it (lib/image-build-prune.bash), by the command above.
- name: Build Claude YOLO Container Image with Hash
  environment:
    CCY_CONTAINER_IMAGES: "/home/{{ user_login }}/.local/bin/container-images"
    CONTAINER_ENGINE: "{{ container_engine }}"
    CCY_VERSION: "{{ ccy_version }}"
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - source "$0" && ccy_image_build_locked "$@"
      - /var/local/claude-yolo/lib/image-build-lock.bash
      - claude-yolo:latest
      - "false"
      - --
      - "{{ container_engine }}"
      - build
      - --build-arg
      - CCY_SOURCE_COMMIT={{ ccy_source_commit.stdout }}
      - --build-arg
      - DOCKERFILE_HASH={{ dockerfile_hash.stdout }}
      - --label
      - ccy-version={{ ccy_version }}
      - -t
      - claude-yolo:latest
      - /opt/claude-yolo
  register: container_build
  changed_when: false

- name: Detect Whether Claude YOLO Image Was Rebuilt
  ansible.builtin.command: "{{ container_engine }} images -q claude-yolo:latest"
  register: image_id_after
  changed_when: image_id_after.stdout != image_id_before.stdout

- name: Verify Container Image
  ansible.builtin.command: "{{ container_engine }} image inspect claude-yolo:latest"
  register: image_verify
  changed_when: false

