# Build one Go command from this checkout's src-go/ and install it.
#
# Import this from any play that deploys a command from src-go/cmd/<name>:
#
#   - name: Build and install the foo command
#     ansible.builtin.import_tasks: "{{ root_dir }}/tasks/build-go-command.yml"
#     vars:
#       go_command_name: foo
#       go_command_dest: "/home/{{ user_login }}/.local/bin/foo"
#       go_command_mode: "0755"
#       go_command_ldflags: "-X main.RootDir={{ root_dir }}"   # optional, besides the digest
#       go_command_owner: root                                   # optional, with go_command_become
#       go_command_become: true                                  # optional
#     tags:
#       - foo
#
# import_tasks, not include_tasks: the tags on the import reach every task below, so
# `--tags foo` runs the whole build and the install, not just the include.
#
# Needs the Go toolchain, which playbooks/imports/play-golang.yml installs: the importing play
# imports that play first. This file only builds and installs, as the login user.
#
# Built to a scratch path and installed with `copy`, which compares checksums, so an unchanged
# source reports ok rather than changed (-trimpath and -buildvcs=false keep the build
# byte-for-byte reproducible: the first drops the checkout path, the second the git revision a
# build otherwise stamps in). A failed build stops the play before anything is installed, and
# nothing is ever installed by hand ([InfrastructureAsCode.md](CLAUDE/InfrastructureAsCode.md)).
#
# The scratch directory and the build run as the login user (become: false) whatever the
# importing play does: the Go build cache and the scratch directory are the user's, and a build
# run as root would leave root-owned files in them, and root must not run a toolchain over a
# checkout the user can write. Only the install may be elevated, for a command that belongs
# under /usr/local/sbin: go_command_become runs the `copy` as root and go_command_owner names
# the owner it leaves.
#
# Every command is built with its source digest baked in (-X main.SourceDigest=<hex>), computed
# by helpers/agent_bus/installer_digest.py from the checkout, and answers `--version` with it.
# helpers/go_drift/check.py (run by scripts/qa-deployed-drift.bash) compares the installed
# command's answer with the checkout's digest, so a command the plays have not rebuilt since a
# source change is a QA finding. A new deployed command needs `var SourceDigest string` in its
# main package and a row in scripts/go-binary-installs.tsv.
#
# Inputs
#   go_command_name     required; the directory under src-go/cmd and the scratch binary's name
#   go_command_dest     required; where the binary is installed
#   go_command_mode     required; the installed file's mode
#   go_command_ldflags  optional; extra linker flags, joined with the digest flag into one -ldflags value
#   go_command_owner    optional; the installed file's owner and group, the login user by default
#   go_command_become   optional; true installs as root (for an owner other than the login user)
#
# The scratch directory predates its second user and keeps its first user's name; every command
# built through this file lands there.

- name: Ensure the Go Command Build Directory Exists
  ansible.builtin.file:
    path: "/home/{{ user_login }}/.cache/ccy-go-build"
    state: directory
    owner: "{{ user_login }}"
    group: "{{ user_login }}"
    mode: "0755"
  become: false

# The digest only reads files, so it is computed under --check as well.
- name: Compute the {{ go_command_name }} Source Digest
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - helpers.agent_bus.installer_digest
      - --source
      - "{{ root_dir }}"
      - --command
      - "{{ go_command_name }}"
    chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
  register: go_command_digest
  changed_when: false
  check_mode: false
  become: false

- name: Build the {{ go_command_name }} Command
  ansible.builtin.command:
    # argv is a LIST. The folded scalar below renders to one Jinja expression, and Ansible's native
    # templating returns the list that expression builds (not a string to be word-split), so the
    # -ldflags pair and each path stay single arguments whatever they contain.
    argv: >-
      {{ ['go', 'build', '-trimpath', '-buildvcs=false']
      + ['-ldflags', ((go_command_ldflags | default('')) ~ ' -X main.SourceDigest=' ~ (go_command_digest.stdout | trim)) | trim]
      + ['-o', '/home/' ~ user_login ~ '/.cache/ccy-go-build/' ~ go_command_name,
      './cmd/' ~ go_command_name] }}
    chdir: "{{ root_dir }}/src-go"
  environment:
    HOME: "/home/{{ user_login }}"
    GOTOOLCHAIN: local
    GOFLAGS: -mod=readonly
    GOCACHE: "/home/{{ user_login }}/.cache/go-build"
  become: false
  changed_when: false # a build into the scratch path changes nothing installed; the copy below reports the change

- name: Install the {{ go_command_name }} Command
  ansible.builtin.copy:
    src: "/home/{{ user_login }}/.cache/ccy-go-build/{{ go_command_name }}"
    remote_src: true
    dest: "{{ go_command_dest }}"
    owner: "{{ go_command_owner | default(user_login) }}"
    group: "{{ go_command_owner | default(user_login) }}"
    mode: "{{ go_command_mode }}"
  become: "{{ go_command_become | default(false) }}"
