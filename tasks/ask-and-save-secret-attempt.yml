---
# One attempt of tasks/ask-and-save-secret.yml, which includes it in a loop: ask, check the
# answer, and either take it or say what was wrong so the next attempt can put it right. Every
# task skips itself once an answer has been taken. Not for use on its own.

- name: "Ask for the {{ secret_label }}, attempt {{ ask_secret_attempt }} of 3"
  when: not (ask_secret_done | bool)
  block:
    - name: "Prompt for the {{ secret_label }}"
      ansible.builtin.pause:
        prompt: >-
          {{ secret_label }}{{ ' (press ENTER with nothing typed to skip it this run)'
          if (secret_optional | default(false) | bool) else '' }}. It is not shown as you type
        echo: false
      register: ask_secret_first
      no_log: true

    - name: "Prompt for the {{ secret_label }} again"
      ansible.builtin.pause:
        prompt: "{{ secret_label }} again, to check it"
        echo: false
      register: ask_secret_again
      no_log: true
      when:
        - secret_confirm | default(true) | bool
        - ask_secret_first.user_input | default('') | length > 0

    # What, if anything, is wrong with the answer, in words that do not repeat it.
    - name: Check the answer
      ansible.builtin.set_fact:
        ask_secret_problem: >-
          {%- set answer = ask_secret_first.user_input | default('') -%}
          {%- if answer | length == 0 -%}
          {{ '' if (secret_optional | default(false) | bool) else 'nothing was typed' }}
          {%- elif (secret_confirm | default(true) | bool)
                   and answer != (ask_secret_again.user_input | default('')) -%}
          the two entries differed
          {%- elif '\n' in answer -%}
          it spans more than one line
          {%- elif answer | length < (secret_min_length | default(1) | int) -%}
          it is shorter than {{ secret_min_length }} characters
          {%- elif answer | length > (secret_max_length | default(4096) | int) -%}
          it is longer than {{ secret_max_length }} characters
          {%- endif -%}
      no_log: true

    - name: Take the answer
      ansible.builtin.set_fact:
        ask_secret_value: "{{ ask_secret_first.user_input | default('') }}"
        ask_secret_done: true
      no_log: true
      when: ask_secret_problem | length == 0

    - name: Say what was wrong
      ansible.builtin.debug:
        msg: "That {{ secret_label }} cannot be used: {{ ask_secret_problem }}. Please try again."
      when:
        - ask_secret_problem | length > 0
        - ask_secret_attempt < 3
