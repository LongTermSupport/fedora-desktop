#version=F@FEDORA_VERSION@
# Fedora Workstation kickstart for the VM acceptance lab's `desktop` base (Plan 00110).
#
# VM ONLY — NOT the shipped installer. fedora-install/ks.cfg is what a human boots: it
# prompts on tty6 for authorisation, WiFi, user and passphrases. This file keeps that
# installer's SHAPE — Anaconda from the netinst tree deploying the Workstation Live
# filesystem via `liveimg`, btrfs subvolumes under a LUKS2 wrapper, a wheel user — with
# every prompt replaced by a rendered value, so the lab can install it unattended and
# then prove the repo provisions the result.
#
# Divergences from what ships, each recorded in evidence.divergences by the harness:
#   - the LUKS passphrase is a throwaway generated by the builder and driven in over
#     the serial console at every boot (`luks-unlock-automated`);
#   - `plymouth.enable=0` and `console=ttyS0` on the kernel line, without `rhgb quiet`,
#     so that prompt reaches the serial console at all (`plymouth-disabled`);
#   - GDM autologin for the lab user (`gdm-autologin-enabled-by-harness`);
#   - sshd enabled and the lab's key authorised, so the harness can reach the guest.
#
# The Live ISO is attached as the second CD-ROM and mounted in %pre: its squashfs is
# the liveimg payload, exactly as ks.cfg mounts the FDINST partition. The at-sign
# placeholders are rendered by helpers/vmtest/render_kickstart.py at build time.

cmdline

%pre --interpreter=/bin/bash --log=/tmp/ks-pre.log --erroronfail
set -euo pipefail
# The Live ISO is one of the CD-ROMs (the netinst that booted us is another); find it
# by content, not by device order.
mkdir -p /mnt/live
found=0
for dev in /dev/sr0 /dev/sr1 /dev/sr2 /dev/sr3; do
    [[ -b "${dev}" ]] || continue
    if mount -o ro "${dev}" /mnt/live 2>/dev/null; then
        if [[ -r /mnt/live/LiveOS/squashfs.img ]]; then
            found=1
            break
        fi
        umount /mnt/live
    fi
done
if [[ "${found}" -ne 1 ]]; then
    echo "ERROR: no attached CD-ROM carries LiveOS/squashfs.img; the Workstation Live ISO must be attached" >&2
    exit 1
fi
%end

liveimg --url=file:///mnt/live/LiveOS/squashfs.img

lang en_GB.UTF-8
keyboard --xlayouts='gb'
timezone Europe/London --utc
network --bootproto=dhcp --device=link --activate --hostname=vmtest-desktop

rootpw --lock
user --name=fedora --groups=wheel --gecos="VM Test User" --password=@USER_PASSWORD_CRYPT@ --iscrypted
sshkey --username=fedora "@SSH_PUBKEY@"

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd

# The shipped layout (ks.cfg first-install branch): EFI, /boot, then btrfs under LUKS2.
zerombr
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=600
part /boot --fstype=ext4 --size=1024
part btrfs.01 --fstype=btrfs --size=1 --grow --encrypted --luks-version=luks2 --passphrase="@LUKS_PASSPHRASE@"
btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root LABEL=fedora
btrfs /home --subvol --name=home LABEL=fedora

# No `rhgb quiet`: Plymouth would own the passphrase prompt and nothing would reach the
# serial line (DESIGN.md §5.3a).
bootloader --append="console=ttyS0,115200n8 plymouth.enable=0"

%post --interpreter=/bin/bash --log=/root/ks-post.log --erroronfail
set -euo pipefail

# Passwordless sudo for the lab user, as cloud-init gives the Cloud image's user.
printf 'fedora ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-vmtest-lab
chmod 0440 /etc/sudoers.d/90-vmtest-lab

# GDM autologin: the harness's divergence, so the provisioning run can be launched
# INTO a real session (DESIGN.md §5.3 item 2).
mkdir -p /etc/gdm
cat > /etc/gdm/custom.conf <<'GDM'
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=fedora
GDM

systemctl set-default graphical.target
systemctl enable gdm.service sshd.service

# The session runner's autostart entry: launched by gnome-session, it waits for the
# harness to hand it a run and executes run.bash inside the session.
lab_home="$(getent passwd fedora | cut -d: -f6)"
mkdir -p "${lab_home}/.config/autostart"
cat > "${lab_home}/.config/autostart/vmtest-session-provision.desktop" <<'DESKTOP'
[Desktop Entry]
Type=Application
Name=VM test session runner
Exec=/usr/local/bin/vmtest-session-provision.bash
X-GNOME-Autostart-enabled=true
NoDisplay=true
DESKTOP
chown -R fedora:fedora "${lab_home}/.config"
mkdir -p /var/lib/vmtest
chown fedora:fedora /var/lib/vmtest
%end

poweroff
