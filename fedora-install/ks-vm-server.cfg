#version=F@FEDORA_VERSION@
# Fedora Server kickstart for the VM acceptance lab's `server-full` base (Plan 00110).
#
# VM ONLY. Fully non-interactive: Anaconda runs in cmdline mode on the serial
# console, so anything it would have asked for is a hard failure instead of a
# prompt nobody can answer. It installs a stock Fedora Server from ONE named
# install tree, creates the lab's `fedora` user with the lab's throwaway SSH key
# and passwordless sudo (the same shape the Cloud Base image gives the fast
# base), and powers off so the builder can boot the result and snapshot it.
#
# Nothing here is the repo's own installer: fedora-install/ks.cfg installs
# Workstation via liveimg and is the desktop base's concern. This base proves
# that the product provisions an Anaconda-installed Fedora Server, which differs
# from a Cloud image in exactly the defaults provisioning touches.
#
# The at-sign placeholders are rendered by helpers/vmtest/render_kickstart.py
# at build time; a leftover placeholder is a refusal, never a boot.

cmdline
url --url=@TREE_URL@

lang en_GB.UTF-8
keyboard --xlayouts='gb'
timezone Etc/UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=vmtest-server

# Root locked; the lab reaches the guest as `fedora` by key only.
rootpw --lock
user --name=fedora --groups=wheel --lock
sshkey --username=fedora "@SSH_PUBKEY@"

selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd

# Stock Fedora Server layout: LVM with xfs. The console goes to the serial line
# so every boot of this base is readable in the run's console.log.
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=lvm --fstype=xfs
bootloader --append="console=ttyS0,115200n8"

%packages
@^server-product-environment
%end

%post --erroronfail --log=/root/ks-post.log
set -euo pipefail
# Passwordless sudo for the lab user, as cloud-init gives the Cloud image's user.
printf 'fedora ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/90-vmtest-lab
chmod 0440 /etc/sudoers.d/90-vmtest-lab
%end

poweroff
