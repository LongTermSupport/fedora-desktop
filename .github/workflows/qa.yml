name: QA

# Server-side quality gate. The local git hooks (scripts/git-hooks) are
# bypassable with --no-verify and run only on the contributor's clone; this
# workflow is the non-bypassable layer, and its pass on a push is what lets a
# protected branch move (rule push-without-qa-verdict, src-go/qa/pushgate).
#
# Diff gate, full after (issue #245): work reaches a protected branch through
# ci/<topic>. A push of a work branch runs ./scripts/qa-changed.bash in diff
# mode against the tip of the protected line it is built on, and that pass lets
# the same commit be pushed to the line. A push to a protected branch, a
# release-<version> branch or a release tag runs the full ./scripts/qa-all.bash,
# after the move; a red run there is fixed forward. A pull request runs diff
# mode against its base. The base job decides which (scripts/qa-ci-scope.bash).
# A gitleaks scan of the tree runs on every event.
#
# See CLAUDE/QA.md for what each stage checks.

on:
  push:
    branches: ["**"]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run of a branch, but never a run on the default branch: the
# bash-limits ratchet compares a default-branch push with the commit before it, and a cancelled
# run would leave a raised record (or a new allowlist entry) in history that no run ever judged,
# for the next push to inherit as its base.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # Decides the QA this run does (src-go/qa/ciscope, C1-C12): mode full or diff, the protected
  # line, and that line's tip on origin as the diff base. A work branch must contain the tip of
  # one protected line (the default branch first, else the one other line it is built on, such as
  # F43 or F44-arm): one that contains none is failed here in seconds, because a diff against a
  # stale base would judge changes the line already has. A release-<version> branch of the release
  # workflow runs the full suite and is not judged for its base: it is cut from the commit that
  # started the run, and the release's tag job needs this run to pass
  # (TestQAExemptsTheBranchesTheReleaseWorkflowPushes).
  base:
    name: picks the protected line
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      line: ${{ steps.scope.outputs.line }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src-go/go.mod

      - name: Decide the scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --ref "$REF" --default "$DEFAULT")
          if [ "$EVENT" = pull_request ]; then
            args+=(--pr-base "$PR_BASE")
          fi
          ./scripts/qa-ci-scope.bash "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  qa:
    # No gate count in this name. It said "(8 gates)" while qa-all.bash ran
    # thirteen, because a number here is a second place to state a fact that
    # lives in one place already — and nothing checks it. qa-all.bash and
    # qa-changed.bash print their own gates and checks, one pass line each.
    name: QA (${{ needs.base.outputs.mode }})
    needs: base
    runs-on: ubuntu-latest
    steps:
      # A scope that is neither would run neither QA step below and pass with nothing run.
      - name: Require a known scope
        env:
          MODE: ${{ needs.base.outputs.mode }}
          BASE: ${{ needs.base.outputs.base }}
        run: |
          set -euo pipefail
          case "$MODE" in
            full) ;;
            diff)
              if [ -z "$BASE" ]; then
                echo "::error::diff mode with no base commit"
                exit 1
              fi ;;
            *) echo "::error::the base job decided no QA scope (mode '$MODE')"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The python of the ccy image, 3.13, which src-go/internal/bus/pycompat reproduces and is
      # proven against: its tests run python3.13 by name (this action puts it on PATH) and
      # refuse one that reports any other version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # setup-go@v6 installs the toolchain line of this file (v5 read the go directive; v6 does
      # too under GOTOOLCHAIN=local, which no workflow sets): the release the CCY image's builder
      # stage and GO_VERSION carry, which may run ahead of the Go Fedora ships for a security
      # release. CI's Go is never raised through a go directive, which every host build enforces
      # (go-minimum-above-provisioned-go, CLAUDE/QA.md). TestEveryWorkflowSetsUpTheGoFloor
      # (src-go/qa/toolchain) fails when a workflow does otherwise.
      # src-go builds from its committed vendor/; the qa module and govulncheck (its tool
      # directive) come from the module proxy. golangci-lint is installed at the pin below.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src-go/go.mod

      # Every QA tool is pinned from the single source of truth (.qa-versions),
      # the same file the host playbook and the CCY image read. A gate's verdict
      # is a property of the binary that produced it, so an unpinned tool means
      # CI and a developer's machine can disagree with nothing reporting it —
      # and reddens main with no commit behind it.
      #
      # shellcheck is preinstalled on ubuntu-latest, at whatever version the
      # runner image happens to carry, so it is replaced rather than trusted.
      - name: Install QA tooling
        run: |
          set -euo pipefail
          . ./.qa-versions
          # fontconfig: scripts/test-colour-emoji-fallback.bash runs fc-cache, fc-match, fc-list.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig
          python -m pip install --upgrade pip
          pip install \
            "ruff==${RUFF}" \
            "semgrep==${SEMGREP}" \
            ansible
          # The runner's architecture picks each asset, in each upstream's own spelling. The
          # shellcheck digests belong to the SHELLCHECK pin in .qa-versions: bump them with it.
          case "$(uname -m)" in
            x86_64) sc_arch=x86_64; sc_sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198; go_arch=amd64 ;;
            aarch64) sc_arch=aarch64; sc_sha=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588; go_arch=arm64 ;;
            *) echo "Install QA tooling: no shellcheck, golangci-lint or fzf build pinned for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.${sc_arch}.tar.xz"
          echo "${sc_sha}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK}/shellcheck" /usr/local/bin/shellcheck
          # golangci-lint: the archive is verified against the release's own checksums
          # file before it is unpacked.
          GL_NAME="golangci-lint-${GOLANGCI_LINT}-linux-${go_arch}"
          GL="${GL_NAME}.tar.gz"
          GL_URL="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT}"
          mkdir -p /tmp/golangci-lint
          curl -fsSL -o "/tmp/golangci-lint/${GL}" "${GL_URL}/${GL}"
          curl -fsSL -o /tmp/golangci-lint/checksums.txt "${GL_URL}/golangci-lint-${GOLANGCI_LINT}-checksums.txt"
          (cd /tmp/golangci-lint && grep " ${GL}\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/golangci-lint/${GL}" -C /tmp/golangci-lint
          sudo install -m 0755 "/tmp/golangci-lint/${GL_NAME}/golangci-lint" /usr/local/bin/golangci-lint
          # fzf: scripts/test-bash-history-search.bash drives the real picker. The release and
          # its sha256 are the ones every host and the ccy image install (vars/fzf-pin.yml),
          # which names its builds as Go does (amd64, arm64).
          FZF_VERSION="$(awk -F'"' '/^fzf_version:/ {print $2}' vars/fzf-pin.yml)"
          FZF_SHA="$(awk -F'"' -v key="fzf_sha256_${go_arch}:" '$1 == key " " {print $2}' vars/fzf-pin.yml)"
          test -n "${FZF_VERSION}" && test -n "${FZF_SHA}"
          curl -fsSL -o /tmp/fzf.tar.gz \
            "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_${go_arch}.tar.gz"
          echo "${FZF_SHA}  /tmp/fzf.tar.gz" | sha256sum -c -
          tar -xzf /tmp/fzf.tar.gz -C /tmp fzf
          sudo install -m 0755 /tmp/fzf /usr/local/bin/fzf
          # Asserts the whole toolchain at once, so CI fails on a drifted pin
          # here rather than reporting a verdict nobody else can reproduce.
          ./scripts/qa-toolchain.bash

      # Install the project's pinned role + collections (requirements.yml) so
      # `ansible-playbook --syntax-check` can resolve every module/role the
      # playbooks reference.
      - name: Install Ansible requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Install extension JS deps (for ESLint stage)
        working-directory: extensions
        run: npm ci

      # ansible.cfg sets `vault_password_file = ./vault-pass.secret`, which is
      # gitignored (a real secret) and absent on a clean checkout. `--syntax-check`
      # is parse-only and never decrypts, but Ansible still needs the password
      # file to EXIST at startup — provide a throwaway placeholder. It is gitignored
      # so it can never be committed, and is never used to decrypt anything.
      - name: Provide placeholder vault password (parse-only, never decrypts)
        run: echo "ci-syntax-check-placeholder" > vault-pass.secret

      # The bash-limits gate and the shellcheck-suppression ratchet (qa-bash) fail on an allowlist
      # entry added or a record raised relative to a base commit (QA_BASH_LIMITS_BASE, read by
      # scripts/qa-bash-limits.bash and the qa-bash tool). The base is a point the
      # change has not reached, whatever the push granularity: in diff mode the base job's line
      # tip, the same commit qa-changed diffs against; otherwise the merge-base of HEAD and the
      # default branch, for a push to any other branch alike. A push to
      # the default branch has nothing to branch from, so its base is the head before the push
      # (the whole push, however many commits it carries); that is sound because a run on the
      # default branch is never cancelled (see concurrency above), so the head before it was
      # judged. A default-branch push whose previous head cannot be had (a force-push, a new
      # branch) fails the step: nothing can be compared, and a gate that cannot compare must
      # not pass.
      - name: Fetch the allowlist base for the bash-limits gate
        env:
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODE: ${{ needs.base.outputs.mode }}
          SCOPE_BASE: ${{ needs.base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if [ "$MODE" = diff ]; then
            git cat-file -e "${SCOPE_BASE}^{commit}"
            base="$SCOPE_BASE"
          elif [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            git cat-file -e "${PUSH_BEFORE}^{commit}"
            base="$PUSH_BEFORE"
          else
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
          fi
          echo "QA_BASH_LIMITS_BASE=${base}" >> "$GITHUB_ENV"

      # The ONE exemption, and it is made here, in the open, not by the gate. The hook-handlers
      # gate (scripts/qa-hook-handlers.bash) runs the project's hooks-daemon handler tests under
      # the daemon's own venv, and this checkout has no daemon: .claude/hooks-daemon/ is
      # gitignored, and building it (.claude/provision.sh) clones the daemon release, builds its
      # venv with uv and starts the daemon, and the tests then need a pytest of the venv's Python
      # version, which nothing here pins. The gate honours this variable on GitHub Actions only
      # (anywhere else it is exit 2), prints HOOK-HANDLERS-EXEMPT with the reason, and runs for
      # real in every local qa-all and qa-changed, where the daemon is provisioned. qa-changed
      # runs the same gate, only when a handler or the gate itself changed, and takes the same
      # exemption.
      # The other local-only check, qa-deployed-drift, needs no exemption: it compares only where
      # a deployed copy exists (~/.local/bin), and a runner has none, so it reports itself skipped
      # and passes its source-tree half.
      # The Go gate runs the whole of src-go under -race, and internal/teamchat a second time
      # under the busfailpoints tag with -count=2. With teamchat it needs more than qa-all's default
      # limit of 30 minutes per gate (its first run on this tree was killed at exactly that limit,
      # the other gates having passed), so the limit is 120 minutes here, and the same per check
      # for qa-changed, whose Go gate on a teamchat change runs those stages whole. A hung test is
      # still stopped at 30 minutes by `go test -timeout`, which names it (scripts/qa-go-qa.bash).
      - name: Run full QA suite
        if: needs.base.outputs.mode == 'full'
        env:
          QA_HOOK_HANDLERS_EXEMPT: "CI has no hooks daemon (gitignored); the handler tests run in every local qa-all and qa-changed"
          QA_ALL_TIMEOUT: "120m"
        run: ./scripts/qa-all.bash

      - name: Run diff-mode QA against the protected line's tip
        if: needs.base.outputs.mode == 'diff'
        env:
          QA_HOOK_HANDLERS_EXEMPT: "CI has no hooks daemon (gitignored); the handler tests run in every local qa-all and qa-changed"
          QA_CHANGED_TIMEOUT: "120m"
          BASE: ${{ needs.base.outputs.base }}
        run: ./scripts/qa-changed.bash --base "$BASE"

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: /tmp/qa-results.json
          if-no-files-found: ignore

  # NO second job for the unit suites.
  #
  # There used to be a `helpers` job running qa-helper-tests.bash, the ccy
  # rootless-guard suite and the extension-compat check as separate steps. Every
  # one of those is now a hard gate inside qa-all.bash, which the job above runs.
  #
  # Removing it is not tidying. While the rootless-guard suite ran HERE and not in
  # qa-all.bash, a local `./scripts/qa-all.bash` could pass on a change that CI
  # then failed — and CLAUDE/QA.md tells everyone that command is sufficient.
  # A gate listed in two places drifts; a gate listed once cannot. If you add a
  # suite, add a row to scripts/qa-gates.tsv (what qa-all.bash runs) and it reaches CI for free.

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The gitleaks GitHub Action requires a paid GITLEAKS_LICENSE for
      # organisation-owned repos. The gitleaks BINARY is free/OSS, so we run it
      # directly. We scan the working tree (`gitleaks dir`), not full history:
      # the historical PII is a known, accepted state (see Decision Gate 1), so a
      # history scan would red-fail every run; a tree scan still blocks any NEW
      # secret from being merged.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          case "$(uname -m)" in
            x86_64) gl_arch=x64; gl_sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64) gl_arch=arm64; gl_sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "Install gitleaks: no build pinned for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_${gl_arch}.tar.gz" -o /tmp/gitleaks.tgz
          echo "${gl_sha}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner --verbose
