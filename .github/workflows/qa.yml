name: QA

# Server-side quality gate. The local git hooks (scripts/git-hooks) are
# bypassable with --no-verify and run only on the contributor's clone; this
# workflow is the non-bypassable layer. It runs the same suite as
# ./scripts/qa-all.bash plus a gitleaks secret scan over the full history.
#
# See CLAUDE/QA.md for what each stage checks.

on:
  push:
    branches: ["**"]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-all:
    # No gate count in this name. It said "(8 gates)" while qa-all.bash ran
    # thirteen, because a number here is a second place to state a fact that
    # lives in one place already — and nothing checks it. qa-all.bash prints its
    # own gates, one pass line each.
    name: qa-all.bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Go version is src-go/go.mod's own; golangci-lint is installed at the pin below.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src-go/go.mod

      # Every QA tool is pinned from the single source of truth (.qa-versions),
      # the same file the host playbook and the CCY image read. A gate's verdict
      # is a property of the binary that produced it, so an unpinned tool means
      # CI and a developer's machine can disagree with nothing reporting it —
      # and reddens main with no commit behind it.
      #
      # shellcheck is preinstalled on ubuntu-latest, at whatever version the
      # runner image happens to carry, so it is replaced rather than trusted.
      - name: Install QA tooling
        run: |
          set -euo pipefail
          . ./.qa-versions
          python -m pip install --upgrade pip
          pip install \
            "ruff==${RUFF}" \
            "semgrep==${SEMGREP}" \
            ansible
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK}/shellcheck" /usr/local/bin/shellcheck
          # golangci-lint: the archive is verified against the release's own checksums
          # file before it is unpacked.
          GL="golangci-lint-${GOLANGCI_LINT}-linux-amd64.tar.gz"
          GL_URL="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT}"
          mkdir -p /tmp/golangci-lint
          curl -fsSL -o "/tmp/golangci-lint/${GL}" "${GL_URL}/${GL}"
          curl -fsSL -o /tmp/golangci-lint/checksums.txt "${GL_URL}/golangci-lint-${GOLANGCI_LINT}-checksums.txt"
          (cd /tmp/golangci-lint && grep " ${GL}\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/golangci-lint/${GL}" -C /tmp/golangci-lint
          sudo install -m 0755 "/tmp/golangci-lint/golangci-lint-${GOLANGCI_LINT}-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          # Asserts the whole toolchain at once, so CI fails on a drifted pin
          # here rather than reporting a verdict nobody else can reproduce.
          ./scripts/qa-toolchain.bash

      # Install the project's pinned role + collections (requirements.yml) so
      # `ansible-playbook --syntax-check` can resolve every module/role the
      # playbooks reference.
      - name: Install Ansible requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Install extension JS deps (for ESLint stage)
        working-directory: extensions
        run: npm ci

      # ansible.cfg sets `vault_password_file = ./vault-pass.secret`, which is
      # gitignored (a real secret) and absent on a clean checkout. `--syntax-check`
      # is parse-only and never decrypts, but Ansible still needs the password
      # file to EXIST at startup — provide a throwaway placeholder. It is gitignored
      # so it can never be committed, and is never used to decrypt anything.
      - name: Provide placeholder vault password (parse-only, never decrypts)
        run: echo "ci-syntax-check-placeholder" > vault-pass.secret

      # The bash-limits gate fails on an allowlist entry added or a record raised relative to a
      # base commit (scripts/qa-bash-limits.bash, QA_BASH_LIMITS_BASE). Locally that base is
      # HEAD; here HEAD is the commit under test, so the base is what the change started from:
      # a pull request's base commit, or a push's previous head (the whole push, however many
      # commits it carries). A push with no previous head (a new branch) is compared with the
      # default branch, and so is one whose previous head can no longer be fetched (a
      # force-push): the default branch's allowlist is a base no honest change raises.
      - name: Fetch the allowlist base for the bash-limits gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || ! git fetch --no-tags --depth=1 origin "$base"; then
            echo "::notice::no fetchable previous head; comparing the allowlist with origin/${DEFAULT_BRANCH}"
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          fi
          echo "QA_BASH_LIMITS_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Run full QA suite
        run: ./scripts/qa-all.bash

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: /tmp/qa-results.json
          if-no-files-found: ignore

  # NO second job for the unit suites.
  #
  # There used to be a `helpers` job running qa-helper-tests.bash, the ccy
  # rootless-guard suite and the extension-compat check as separate steps. Every
  # one of those is now a hard gate inside qa-all.bash, which the job above runs.
  #
  # Removing it is not tidying. While the rootless-guard suite ran HERE and not in
  # qa-all.bash, a local `./scripts/qa-all.bash` could pass on a change that CI
  # then failed — and CLAUDE/QA.md tells everyone that command is sufficient.
  # A gate listed in two places drifts; a gate listed once cannot. If you add a
  # suite, add it to qa-all.bash and it reaches CI for free.

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The gitleaks GitHub Action requires a paid GITLEAKS_LICENSE for
      # organisation-owned repos. The gitleaks BINARY is free/OSS, so we run it
      # directly. We scan the working tree (`gitleaks dir`), not full history:
      # the historical PII is a known, accepted state (see Decision Gate 1), so a
      # history scan would red-fail every run; a tree scan still blocks any NEW
      # secret from being merged.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner --verbose
