---
# This machine's commit-signing key. play-git-configure-and-tools.yml generates it and
# signs with it by default; play-github-cli-multi.yml registers it on GitHub and gives
# each account in github_accounts a key of its own, which git uses in that account's
# repositories. git_signing_key in host_vars points it at a different key.
git_signing_key_path: "{{ git_signing_key | default('/home/' + user_login + '/.ssh/id_ed25519_git_signing') }}"
