---
# VM lifecycle acceptance testing — the scenario manifest (Plan 00110)
#
# This file is the SOURCE of the bridge's scenario allowlist. Ansible renders it
# to JSON on the host; helpers/vmtest/scenarios.py validates it and derives the
# allowlist; scripts/qa-vmtest-manifest.bash checks it on every QA run.
#
# The Fedora version is NOT declared here: it comes from vars/fedora-version.yml
# and base names are composed as "<key>-<version>" (e.g. server-fast-44).
#
# Freshness backstops, in days. Neither is a trigger: the base refreshes when the
# updates-repo revision advances and reinstalls when the media identity changes.
# TTL-U applies only when the revision could not be read; TTL-R bounds the age of
# a base whose reinstall signal is correctly inert for a whole release.
vm_test_ttl_upgrade_days: 7
vm_test_ttl_rebuild_days: 90

# The bases. `fast` is imported from the published Cloud qcow2 and never runs
# Anaconda; `full` is an Anaconda install from exactly ONE install tree (`tree`
# is the variant directory under releases/<version>/). `artefacts` selects the
# published artefact(s) in releases.json by its structured fields plus a
# filename prefix/suffix — never by a full filename, which embeds a compose
# label that is not known until the document is read. Their hashes (and the
# tree's .treeinfo checksums for a full base) are the base's media identity.
# Sizing is provisional until the Phase 0 host triage reports the headroom; the
# lab refuses a run that would take committed guest RAM past the host's ceiling
# either way.
vm_test_bases:
  server-fast:
    kind: fast
    profile: server
    tree: null
    artefacts:
      - variant: Cloud
        subvariant: Cloud_Base
        prefix: Fedora-Cloud-Base-Generic-
        suffix: .qcow2
    vcpus: 2
    ram_mib: 4096
  server-full:
    kind: full
    profile: server
    tree: Server
    artefacts:
      - variant: Server
        subvariant: Server
        prefix: Fedora-Server-netinst-
        suffix: .iso
    vcpus: 2
    ram_mib: 4096
  desktop:
    kind: full
    profile: desktop
    tree: Everything
    artefacts:
      - variant: Everything
        subvariant: Everything
        prefix: Fedora-Everything-netinst-
        suffix: .iso
      - variant: Workstation
        subvariant: Workstation
        prefix: Fedora-Workstation-Live-
        suffix: .iso
    vcpus: 4
    ram_mib: 8192

# The scenarios. Each names the base it requires; a request whose base is absent
# is an error, never a substitution. `planned` is the check count the guest
# acceptance script declares up front; a run whose total differs is an error.
# `planned: null` means the guest script has not declared its count yet: the
# scenario is listed but NOT runnable, and stays off the allowlist.
# `max_skipped` caps skipped checks per scenario and must leave at least one
# check that has to pass. `run_env` (optional) sets run.bash's non-secret
# knobs from a closed allowlist; it is how the negative scenarios differ from
# the positive one.
#
# The three `*-fails`/`*-missing` scenarios are the falsifiability proof: each
# MUST produce verdict fail at stage provision (never error, never pass), and
# each proves a different thing — a failed main play propagating out of
# run.bash, a failed optional play propagating, and argument validation.
vm_test_scenarios:
  server-fast-provision:
    base: server-fast
    description: provision a Fedora Cloud Base guest with run.bash (proves the product, not the installer)
    planned: 13   # = PLANNED in files/home/.local/share/vmtest/guest-acceptance-server.bash
    max_skipped: 0
  server-main-playbook-fails:
    base: server-fast
    description: an unrecognised RUN_BASH_PROVISIONING_PROFILE fails play 1 of playbook-main.yml; the failure must propagate out of run.bash
    planned: 13
    max_skipped: 0
    run_env:
      RUN_BASH_PROVISIONING_PROFILE: not-a-profile
  server-optional-playbook-fails:
    base: server-fast
    description: play-nvidia.yml is general-scoped so it runs on the server profile, and its MOK vault assertion cannot hold on a throwaway vault; the failure must propagate
    planned: 13
    max_skipped: 0
    run_env:
      RUN_BASH_OPTIONAL_PLAYBOOKS: play-nvidia.yml
  server-optional-play-missing:
    base: server-fast
    description: a play name that does not resolve is refused before anything runs (argument validation, not failure propagation)
    planned: 13
    max_skipped: 0
    run_env:
      RUN_BASH_OPTIONAL_PLAYBOOKS: play-does-not-exist.yml
  server-full-provision:
    base: server-full
    description: provision an Anaconda-installed Fedora Server guest with run.bash (the same guest checks as the fast path, on a materially different starting OS)
    planned: 13   # the shared guest-acceptance-server.bash
    max_skipped: 0
  desktop-fresh-install:
    base: desktop
    description: the repo's own installer shape (netinst + Workstation liveimg) plus desktop provisioning
    planned: null
    max_skipped: 0
