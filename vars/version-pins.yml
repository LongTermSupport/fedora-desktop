---
# Upstream version pins declared across the playbooks — the manifest, not the pins.
#
# Several playbooks hardcode an upstream release in a play var (e.g.
# `marklessVersion: "0.9.6"`). This file says WHERE each of those lives and what
# upstream project it tracks; the pinned value itself is never copied here, because
# the playbook is its single source of truth and a second copy is a second thing to
# forget.
#
# Two consumers read this, which is why it is a declared file rather than a heredoc
# inside one of them:
#   * scripts/check-pinned-versions.bash — repo pin vs UPSTREAM latest
#   * Plan 00109's installed-vs-pinned check — repo pin vs what is INSTALLED here
# They ask different questions of the same population, and the population must not
# be able to differ between them.
#
# scripts/qa-version-pins.bash validates this file on every qa-all run, including
# that each playbook still exists and still declares its var.
#
# Fields:
#   playbook    (required) path, from the repo root, to the playbook holding the pin
#   var         (required) the play var whose value is the pinned version
#   github      owner/repo to compare against. Omit for a pin with no automated
#               source — it is then reported as MANUAL and needs a note
#   tag_prefix  any tag prefix beyond a leading 'v' to strip before comparing
#               (e.g. a project tagging releases as `release-5.6.0`)
#   note        free text shown for a MANUAL row; required when github is omitted
#   installed   how to resolve what is INSTALLED on this host, for the third drift
#               axis (repo pin vs host). `kind: dkms|rpm|command` plus a `name:`, or
#               `kind: untracked` plus a `why:` recording the decision not to.
#               Required by the host-side check and rejected if absent, because
#               "nobody decided" must not be a reachable state.
#
# Guessing a resolver is worse than declaring `untracked`. The displaylink pin below
# is the worked example: it is a release TAG, while the installed rpm's own version
# tracks evdi, so a plausible-looking rpm resolver reports a permanent false finding.
# Most rows are `untracked` with "not yet established" — a to-do that is visible in
# this file and counted by ./scripts/qa-version-pins.bash, rather than an absence.

version_pins:
  - playbook: playbooks/imports/play-nvm-install.yml
    var: nvm_version
    github: nvm-sh/nvm
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  - playbook: playbooks/imports/play-markless.yml
    var: marklessVersion
    github: jvanderberg/markless
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  - playbook: playbooks/imports/optional/common/play-qobuz.yml
    var: rescrobbledVersion
    github: InputUsername/rescrobbled
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  - playbook: playbooks/imports/optional/common/play-cli-tools.yml
    var: ouchVersion
    github: ouch-org/ouch
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  - playbook: playbooks/imports/optional/common/play-opencode.yml
    var: opencodeVersion
    github: anomalyco/opencode
    installed:
      kind: untracked
      why: >-
        An optional play, and `kind: command` reports a missing binary as a finding on every
        host that never ran it. The play asserts `opencode --version` equals the pin on every
        run and puts the pinned binary back, so drift on a host that ran it is caught and
        undone the next time it runs.

  - playbook: playbooks/imports/optional/common/play-md-viewer.yml
    var: md_viewer_version
    note: >-
      A full commit hash on LongTermSupport/md-viewer main, built with `go install` (Plan
      00199). The project publishes no tags yet, so there is no release to compare with: bump it
      to a newer main commit by hand, and to a tag once one exists.
    installed:
      kind: untracked
      why: >-
        `md-viewer --version` prints the Go pseudo-version, which carries only the first 12
        characters of the hash; the play asserts that prefix at install time, so a separate
        host-side resolver would repeat that check.

  - playbook: playbooks/imports/play-git-configure-and-tools.yml
    var: bash_git_prompt_version
    note: >-
      A full commit hash on magicmonty/bash-git-prompt master (Plan 00183); its tags are years
      behind master, so there is no release to compare with. Bump it to a newer master commit
      by hand, after checking gitprompt.sh still calls async_run only for its git fetch: the
      play's async_run override depends on that, and its assert fails the play otherwise.
    installed:
      kind: untracked
      why: >-
        The play checks ~/.bash-git-prompt out at the pin on every run and fails on local
        changes, so the installed commit is the pin; a host-side resolver would repeat that.

  - playbook: playbooks/imports/optional/common/play-network-tools.yml
    var: ooklaSpeedtestVersion
    note: >-
      Ookla publishes the CLI as a tarball at install.speedtest.net, not on GitHub; check
      https://www.speedtest.net/apps/cli for a newer version and update the sha256 with it.
    installed:
      kind: untracked
      why: >-
        `speedtest --version` prints a build number beyond the pin (`Speedtest by Ookla
        1.2.0.84` for the 1.2.0 tarball, measured), so a command resolver classifies the
        exact pinned release as AHEAD on every host that ran the play: a permanent false
        finding. The play itself asserts the pin appears in that output at install time.

  - playbook: playbooks/imports/optional/common/play-photography.yml
    var: rapidraw_version
    github: CyberTimon/RapidRAW
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  - playbook: playbooks/imports/optional/common/play-photography.yml
    var: art_version
    github: artraweditor/ART
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  - playbook: playbooks/imports/optional/hardware-specific/play-displaylink.yml
    var: displaylink_version
    github: displaylink-rpm/displaylink-rpm
    installed:
      kind: untracked
      why: >-
        The pin is the displaylink-rpm RELEASE TAG (e.g. v6.3.0-2). The installed rpm's own
        version tracks evdi instead (displaylink-1.14.16-2 during the 2026-09-11
        incident), so there is no host-side value that this pin can be compared with.
        Comparing the rpm version would report a permanent false finding.

  - playbook: playbooks/imports/optional/hardware-specific/play-displaylink.yml
    var: evdi_version
    github: DisplayLink/evdi
    installed:
      kind: dkms
      name: evdi

  - playbook: playbooks/imports/optional/hardware-specific/play-nvidia.yml
    var: cudnn_version
    note: >-
      NVIDIA cuDNN — check developer.nvidia.com / the CUDA repo manually
    installed:
      kind: untracked
      why: >-
        Not yet established. Needs a host to determine how the installed version is
        resolved; declared rather than omitted so the gap is counted, not invisible.

  # Not a playbook: agent-bus-install reads its Tuwunel pin from this file (Plan 00161,
  # DESIGN.md section 3.2), written in the same `var: value` line form. Its two
  # per-architecture sha256 lines change with every bump.
  - playbook: files/usr/local/share/agent-bus/tuwunel.pin
    var: tuwunel_version
    github: matrix-construct/tuwunel
    installed:
      kind: untracked
      why: >-
        `/usr/local/lib/agent-bus/tuwunel --version` would resolve it, but a tracked
        non-DKMS pin is compared on every host, servers included, and only hosts that ran
        agent-bus-install have the binary; whether to hold every host to it is a
        decision for the play (U22), not taken here.
