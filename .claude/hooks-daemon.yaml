# Claude Code Hooks Daemon - Handler Configuration
#
# AFTER EDITING THIS FILE: restart the daemon for changes to take effect.
#   User: type /hooks-daemon restart
#   Claude: use Skill tool with skill="hooks-daemon" args="restart"
#
# Verify it is running:
#   User: type /hooks-daemon health
#   Claude: use Skill tool with skill="hooks-daemon" args="health"
#
# Full handler reference: .claude/hooks-daemon/CLAUDE/HANDLER_DEVELOPMENT.md

version: "1.0"

# Daemon configuration
daemon:
  idle_timeout_seconds: 600  # Auto-shutdown after 10 minutes of inactivity
  log_level: INFO
  enable_hello_world_handlers: false
  enforce_single_daemon_process: true  # Auto-enabled (container detected)

# CCY container workflow (Plan 00147 / fedora-desktop#31).
# deploy_supervisor: true keeps the standalone PTY supervisor (claude-supervise.py,
# Plan 00135) auto-deployed/refreshed into .claude/ccy/ on install and upgrade.
# Deploying it does NOT arm it — arming is the launcher's job: .claude/ccy/ccy.env
# points CCY_CLAUDE_WRAPPER at it (currently in --dry-run).
ccy:
  deploy_supervisor: true

# Plan workflow + QA policy.
# Made explicit in Plan 00059 (the daemon otherwise synthesises this block from
# the legacy markdown_organization.track_plans_in_project option). An explicit
# top-level plan_workflow block DISABLES that auto-migration, so enabled +
# directory MUST be restated here or plan tracking silently turns off.
# qa: subsystem (Plan 00144 upstream) lints the plan tree for cross-file drift.
plan_workflow:
  enabled: true
  directory: CLAUDE/Plan
  workflow_docs: CLAUDE/PlanWorkflow.md
  qa:
    enabled: true
    completed_dir: Completed
    cancelled_dir: Cancelled
    edit_mode: block          # block | warn | off
    commit_gate_mode: warn    # warn-first; flip to block once the tree stays clean
    sweep_mode: advise        # advise | off
    staleness_days: 30
    legacy_plan_allowlist: []  # legacy plans fixed properly in 00059, not suppressed
    collision_allowlist: []
    journal:                   # Plan journalling (daemon v3.40.0). All checks advise-only unless mode: block.
      enabled: true
      grandfather_before: 60   # plans 00001-00059 predate journalling — never nag them to add a JOURNAL/

# Handler Configuration
# Handlers run in priority order (lower number = earlier execution)
# Priority ranges: 5=test, 10-20=safety, 25-45=workflow, 50-60=tool usage

handlers:
  # PreToolUse handlers (run before every tool call)
  pre_tool_use:
    # SAFETY HANDLERS (Priority 10-20)
    destructive_git: {enabled: true, priority: 10}          # Block git reset --hard, clean -f, etc
    daemon_restart_verifier: {enabled: true, priority: 10}  # Advisory: suggest daemon restart verification
    sed_blocker:                                             # Block sed (use Edit tool instead)
      enabled: true
      priority: 10
      options:
        blocking_mode: direct_invocation_only  # Allow scripts that contain sed; block direct calls
    pip_break_system: {enabled: true, priority: 10}         # Block pip --break-system-packages
    sudo_pip: {enabled: true, priority: 10}                 # Block sudo pip
    curl_pipe_shell: {enabled: true, priority: 10}          # Block curl | bash patterns
    lock_file_edit_blocker: {enabled: true, priority: 10}   # Block direct editing of lock files
    daemon_location_guard: {enabled: true, priority: 11}    # Prevent cd into .claude/hooks-daemon
    absolute_path: {enabled: true, priority: 12}            # Require absolute paths in file operations
    error_hiding_blocker: {enabled: true, priority: 13}     # Block || true, except: pass, empty catch
    security_antipattern: {enabled: true, priority: 15}     # Block hardcoded secrets and injection
    pipe_blocker: {enabled: true, priority: 15}             # Block dangerous pipe patterns
    worktree_file_copy: {enabled: true, priority: 15}       # Prevent worktree file copies
    dangerous_permissions: {enabled: true, priority: 15}    # Block chmod 777, chown root
    tdd_enforcement: {enabled: true, priority: 15}          # Enforce test-first development
    git_stash: {enabled: true, priority: 20}                # Warn about git stash

    # CODE QUALITY HANDLERS (Priority 25-35)
    qa_suppression: {enabled: true, priority: 30}           # Block QA suppression comments (11 languages)
    plan_number_helper: {enabled: true, priority: 30}       # Provide correct next plan number
    markdown_organization:                                   # Plan tracking and markdown organisation
      enabled: true
      priority: 35
      options:
        track_plans_in_project: "CLAUDE/Plan"
        plan_workflow_docs: "CLAUDE/PlanWorkflow.md"
        # Additive list layered on top of the daemon's built-in defaults
        # (CLAUDE/, docs/, untracked/, RELEASES/), so only the project-specific
        # extra needs declaring here — upstream default additions are inherited
        # automatically. Migrated from the discouraged full-override
        # allowed_markdown_paths in hooks-daemon v3.19.0.
        extra_allowed_markdown_paths:
          - "^files/opt/claude-yolo/skills/.*\\.md$"  # Container-deployed skill docs
          # Opt-in skills, staged in the image but installed only when a project
          # asks for them in its ccy.env. They live OUTSIDE skills/ on purpose:
          # entrypoint.sh copies that directory unconditionally, so anything in it
          # ships to every session. See Plan 00092.
          - "^files/opt/claude-yolo/optional/.*\\.md$"

    lsp_enforcement: {enabled: true, priority: 38}          # Steer toward LSP tools instead of Grep

    # WORKFLOW HANDLERS (Priority 40-55)
    gh_issue_comments: {enabled: true, priority: 40}        # Require --comments on gh issue view
    plan_time_estimates: {enabled: true, priority: 40}      # Block time estimates in plans
    global_npm_advisor: {enabled: true, priority: 40}       # Advise on npm install -g (non-blocking)
    plan_workflow: {enabled: true, priority: 45}            # Guidance when creating plans
    npm_command: {enabled: true, priority: 50}              # Restrict npm commands to approved list
    validate_instruction_content: {enabled: true, priority: 50}  # Block ephemeral content in CLAUDE.md
    web_search_year: {enabled: true, priority: 55}          # Fix outdated years in searches

    # CONTENT HANDLERS (Plan 00082) — each enabled only after its existing
    # backlog was MEASURED, never assumed. A handler made blocking over a
    # backlog traps whoever next touches those files, and the usual response to
    # that is to disable it — losing the protection outright. Re-measure with
    # CLAUDE/Plan/00082-plan-index-hygiene-and-comment-handlers/triage.bash.
    #
    # comment_changelog: 0 blocking signals across repo-owned source (F2), so
    # this costs nothing today and guards every future write. A comment states
    # CURRENT state; history keyed by a RELEASE NUMBER is a changelog and
    # belongs in git or docs/ccy-changelog.md. History keyed by a FAILURE MODE
    # (a plan number, a bug) is rationale and is deliberately NOT flagged —
    # which is most of this repo's comments.
    comment_changelog: {enabled: true, priority: 42}
    # comment_size: 0 over-long comment LINES, 6 files with a >40-line comment
    # BLOCK (F3) — one of them daemon-owned and unfixable here (F8). Harmless:
    # shrinking an over-limit comment is always allowed and a same-size edit
    # only advises, so only GROWING one is denied.
    comment_size: {enabled: true, priority: 43}
    # sensitive_content: this is a PUBLIC repository. The pre-commit scanner
    # already gates `git commit`; this gates the Write/Edit that precedes it, so
    # a real identifier is refused at the moment it is typed rather than at the
    # moment it is staged.
    sensitive_content:
      enabled: true
      priority: 44
      options:
        public_patterns:
          # Named regexes are SAFE TO NAME — the deny reason quotes the pattern
          # name and the matched text, so nothing secret may live here. Real
          # private identifiers belong in the gitignored secret word list
          # (.claude/block-words.secret, covered by *.secret in .gitignore),
          # where a match is reported only as an index.
          #
          # Measured at 0 matches across 691 tracked files (F5). RFC 5737
          # documentation ranges are deliberately not matched — those are the
          # placeholders CLAUDE/ExampleValues.md tells you to use instead.
          - name: private-ipv4
            pattern: '(^|[^0-9.])(10(\.[0-9]{1,3}){3}|192\.168(\.[0-9]{1,3}){2}|172\.(1[6-9]|2[0-9]|3[01])(\.[0-9]{1,3}){2})([^0-9.]|$)'
          # REJECTED candidates, recorded so they are not re-proposed blind:
          #   real-home-path  — 11 legitimate matches (F6): systemd user@.service
          #                     unit paths, the daemon's own handler source, test
          #                     fixtures.
          #   any-email       — 81 matches (F7), dominated by git@github.com,
          #                     user@1000.service and *.example.com subdomains.

    # ADVISORY HANDLERS (Priority 56-60)
    daemon_docs_guard: {enabled: true, priority: 57}        # Warn when reading daemon internal docs
    british_english: {enabled: true, priority: 60}          # Warn about American English spellings

  # PostToolUse handlers (run after tool execution)
  post_tool_use:
    validate_eslint_on_write: {enabled: true, priority: 10}  # Run ESLint after JS/TS file writes
    # Language-aware lint after Write/Edit.
    # .semgrep/bash-conventions.bash is flagged wholesale, because every line of
    # that fixture is a deliberate anti-pattern — it is the corpus the semgrep
    # rules must catch. The exemption was reported upstream when no route existed
    # and daemon 3.54.0 shipped one, so the noise is now exempted rather than
    # tolerated. The fixture is still gated by `semgrep --test` in
    # qa-patterns.bash, which is the check that actually belongs to it.
    lint_on_edit:
      enabled: true
      priority: 25
      options:
        exclude_paths:
          - ".semgrep/bash-conventions.bash"

  # PermissionRequest - Auto-approve decisions
  permission_request:
    auto_approve_reads: {enabled: true, priority: 10}  # Auto-approve read-only operations

  # Notification - Custom notification handling
  notification:
    notification_logger: {enabled: true, priority: 10}  # Log notifications

  # UserPromptSubmit - Context injection before processing
  user_prompt_submit:
    git_context_injector: {enabled: true, priority: 20}  # Inject git context into prompts
    # Standing authorisations (daemon 3.53.0). The HANDLER ships enabled but every
    # authorisation ships OFF, so it is inert until the repository owner opts in —
    # deliberately, since this is the one handler that RELAXES a restriction rather
    # than adding one, and shipping it active would have the daemon fabricate the
    # consent its own injected text claims.
    #
    # Why this repo needs it: several system-prompt instructions are conditional on
    # the user having asked ("do not call the Agent tool unless the user requested
    # it"), and those instructions are re-sent on EVERY request — while the request
    # itself was made once, in a conversation that ended. This repo MANDATES the
    # qa-reviewer agent as the final step of every plan (CLAUDE.md, CLAUDE/QA.md,
    # CLAUDE/PlanWorkflow.md step 5), so without a durable record the one review gate
    # that catches what qa-all.bash structurally cannot stalls every session until
    # the owner re-grants something they already mandated. Recorded, auditable,
    # revocable by deleting the entry.
    #
    # subagent-delegation ONLY. workflow-orchestration is a SEPARATE built-in id and
    # is deliberately not enabled: authorising delegation says nothing about
    # authorising multi-agent workflow orchestration, which can spawn dozens of
    # agents and is a different cost decision.
    standing_authorisations:
      enabled: true
      priority: 25
      options:
        authorisations:
          - id: subagent-delegation
            enabled: true

  # SessionStart - Initialise environment
  session_start:
    hook_registration_checker: {enabled: true, priority: 51}      # Validate hook registrations
    optimal_config_checker: {enabled: true, priority: 52}         # Check for optimal Claude Code settings
    git_filemode_checker: {enabled: true, priority: 53}           # Warn when git core.fileMode=false
    gitignore_safety_checker: {enabled: true, priority: 54}       # Warn when .claude/ paths not gitignored
    suggest_status_line: {enabled: true, priority: 55}            # Suggest status line setup
    version_check: {enabled: true, priority: 55}                  # Check for daemon updates
    git_upstream_checker:                                         # Keep the branch in sync with upstream
      enabled: true
      priority: 56
      options:
        mode: agent-pull   # Pull as the session's first action when behind upstream

  # Stop - Control agent continuation. auto_continue_stop is terminal and matches
  # nearly every stop, so any Stop handler above priority 10 never runs. Message
  # auditing therefore lives on the nitpick pseudo-event below, not here.
  stop:
    auto_continue_stop: {enabled: true, priority: 15}        # Require "STOPPING BECAUSE:" prefix

  # SubagentStop - a subagent's final message must fit the wire channel; the
  # harness silently elides the middle of an oversized one. Long reports go to a
  # file (plan folder subagent-reports/, or untracked/agent-reports/).
  subagent_stop:
    subagent_report_size_blocker: {enabled: true, priority: 15}  # Deny an oversized subagent final message

  # PreCompact - Before conversation compaction
  pre_compact:
    disclosure_reset_pre_compact: {enabled: true, priority: 15}  # Reset per-agent rule-disclosure state

  # StatusLine handlers
  status_line:
    git_repo_name: {enabled: true, priority: 5}     # Git repository name
    account_display: {enabled: true, priority: 6}   # Account information
    model_context: {enabled: true, priority: 10}    # Model name and context %
    git_branch: {enabled: true, priority: 20}       # Current git branch
    startup_cleanup: {enabled: true, priority: 28}  # Stale file cleanup indicator
    daemon_stats: {enabled: true, priority: 30}     # Daemon health metrics

  # WorktreeCreate - seed a fresh worktree with the gitignored local config an
  # agent needs to behave like the session that spawned it. symlink, because the
  # file is only ever read. vault-pass.secret is deliberately NOT seeded: it is a
  # protected path and playbooks never run inside a worktree or the container.
  worktree_create:
    worktree_create:
      enabled: true
      priority: 50
      options:
        seed:
          default_mode: symlink
          entries:
            - .claude/settings.local.json

# Pseudo-events: synthetic events fired from real ones with frequency control.
# A pseudo-event ABSENT from this file is never registered, so the nitpick
# message-quality detectors only run when this block exists.
pseudo_events:
  nitpick:
    enabled: true
    triggers:
      - "pre_tool_use:1/5"    # Audit assistant messages once every 5 tool calls
      - "stop:1/1"            # and on every Stop
    handlers:
      dismissive_language: {enabled: true}  # Avoiding-work, out-of-scope deflection, premature-halt phrasing
      hedging_language: {enabled: true}     # Guessing instead of researching

# Documentation QA. Defaults are kept (advise on sweep, warn on edit/commit);
# only the corpus is narrowed. .ansible/ is the gitignored galaxy install of
# third-party collections and roles, not this repo's documentation;
# CLAUDE/Plan/Archive/ holds pre-plan-workflow notes kept as a frozen record;
# and a PLAN_archive.md is the verbatim superseded PLAN.md of a plan that was
# slimmed in place, so its dead links and duplicated blocks are history, not debt.
documentation:
  enabled: true
  trees:
    agent: CLAUDE
    human: docs
  qa:
    scope_exclude_globs:
      - ".ansible/**"
      - "CLAUDE/Plan/Archive/**"
      - "**/PLAN_archive.md"

# Project-level custom handlers
plugins:
  paths: []
  plugins:
    # Custom Infrastructure-as-Code enforcement handlers
    - path: ".claude/hooks/handlers/pre_tool_use/system_paths.py"
      event_type: "pre_tool_use"
      handlers: ["SystemPathsHandler"]
      enabled: true

    - path: ".claude/hooks/handlers/pre_tool_use/ansible_enforcement.py"
      event_type: "pre_tool_use"
      handlers: ["AnsibleEnforcementHandler"]
      enabled: true
