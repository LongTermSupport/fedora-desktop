# go-qa-ci (pinned as GO_QA_CI in /.qa-versions) over this Go tree. The root is src-go, the
# directory of the module; the nested module qa holds the project rules (src-go/qa/rules,
# CLAUDE/GoProjectRules.md), which run through the driver below beside go-qa-ci's bundled
# analyzers. The go gate (scripts/qa-gates.tsv) runs it with --no-fix: outside CI go-qa's fmt
# rewrites files by default, and a gate that rewrites what it judges passes the defect it ran to
# find. In CI (the CI variable) go-qa fails on any rewrite by itself.
modules = ["qa"]

[analyzers]
module = "qa"
driver = "./driver"

# The floor sits a few points under the measured total, so it catches untested code landing,
# not ordinary drift. Raise it as coverage rises; never lower it to let a change in.
[coverage]
fail_under_statements = 90

[record]
path = "qa/record.toml"
max_total = 19
max_policy = 1
deciders = ["repository-owner"]
history_base = "origin/F44"

[record.trust.models]
# The tier of the agent that wrote the entries, go-qa-ci's own choice for this model family
# (30-day review, at most three entries): the owner decides the tier on the merge day.
claude-sonnet = "medium"
