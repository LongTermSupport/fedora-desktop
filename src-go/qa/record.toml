# The project record (go-qa-ci docs/record.md): every configuration exception in src-go/.golangci.yml,
# one entry per rule the suppression detector prints for it, and the generated-code header of
# widthtable.go. An entry covers every exclusion in .golangci.yml the detector names with its rule,
# so its justification names each one by its path pattern.
# The [ratchet] table is the repository owner's signature (Plan 00191 Task 3.8).

[ratchet]
high_water = 12
decided_by = "repository-owner"
decided_on = 2026-11-03
reason = "raising the ceiling by one, to 30, for the gosec G401/G505 exclusion of Synapse's HMAC-SHA1 registration MAC in internal/teamchat/matrix (the repository owner's decision 3 on pull request 124, Plan 00246 Task 8.2); the test-file G301/G302/G306 exclusions of teamchat join entries already recorded and raise nothing. The ceiling was raised by two on 2026-10-29 for the tagliatelle exclusions of internal/netpolicy/podman.go (podman inspect's own field names, Plan 00232) and internal/containerimages/oldrange_records.go (c/storage's own mapped-layers key, Plan 00235)."

[[exception]]
rule = "golangci.yml::exclusions.rules::goconst+dupword"
path = ".golangci.yml"
justification = "goconst and dupword flag repeated literals and repeated words; a test spells out the argv it expects, and naming each repeated literal (gum, fzf) as a constant, or flagging a list like A A B, hides what is asserted. Scope: the exclusion for path _test.go only; production code is held to both."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G204"
path = ".golangci.yml"
justification = "gosec G204 guards against command injection through a program launched from a variable. Each module has exactly one process seam that exists to do that: internal/execx/ (src-go) and qa/internal/proc/proc.go (the qa module, which cannot import execx); every other package reaches a program through its seam, so a G204 anywhere else is still reported. Permanent by the owner's decision of 2026-11-17: starting a program from an argument vector is what each seam is defined to do, so G204 will always flag it; go-qa-ci records its own launcher file, internal/launch/launch.go, as permanent for the same reason (go-qa-ci docs/record.md, Configuration exceptions)."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-11-17
permanent = true

[[exception]]
rule = "go::generated-header"
path = "internal/pingbus/statusline/widthtable.go"
justification = "A generated-code header makes golangci-lint and staticcheck skip a file, so a hand-written one would hide code from them. This file is generated, from Python 3.11.2's unicodedata (Unicode 14.0.0), as the status line's East Asian Width tables, and its Code generated ... DO NOT EDIT. line is the standard Go generated-file header that says so, not a lint suppression. Scope: this one file."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "golangci.yml::govet.disable::fieldalignment"
path = ".golangci.yml"
justification = "Off repo-wide: fieldalignment's own Doc says its diagnostics very rarely indicate a significant problem, and vet and gopls leave it off by default. The repository owner's ruling of 2026-11-18 on Go QA (a check runs on all code or is off repo-wide; noisy checks are turned off; Q40 answered: drop fieldalignment). The 103 struct reorders of Plan 00245 stay. qa/lintconfig holds this."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-11-18
permanent = true

[[exception]]
rule = "golangci.yml::gosec.excludes::G301"
path = ".golangci.yml"
justification = "Off repo-wide: G301 flags a directory mode wider than 0750, and these tools and their tests make the directories their specifications name. The repository owner's ruling of 2026-11-18 on Go QA turns gosec's file-mode, file-path and weak-hash rules off instead of keeping a list of per-path exclusions."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-11-18
permanent = true

