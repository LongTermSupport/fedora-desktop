path = ".golangci.yml"
justification = "govet fieldalignment guards against padding bytes wasted in memory-heavy structs; reordering struct fields for padding costs readability for bytes nobody needs, and the module holds no memory-heavy struct. Scope: the fieldalignment analyzer, module-wide."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "go::generated-header"
path = "internal/pingbus/statusline/widthtable.go"
justification = "A generated-code header makes golangci-lint and staticcheck skip a file, so a hand-written one would hide code from them. This file is generated, from Python 3.11.2's unicodedata (Unicode 14.0.0), as the status line's East Asian Width tables, and its Code generated ... DO NOT EDIT. line is the standard Go generated-file header that says so, not a lint suppression. Scope: this one file."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26
