# The project record (go-qa-ci docs/record.md): one entry per suppression the detector prints. A
# check is on for all code or off for all code with its reason in src-go/.golangci.yml, which needs
# no entry, so the one entry is the generated-code header of widthtable.go.
# The [ratchet] table is the repository owner's signature (Plan 00191 Task 3.8).

[ratchet]
high_water = 1
decided_by = "repository-owner"
decided_on = 2026-11-03
reason = "raising the ceiling by one, to 30, for the gosec G401/G505 exclusion of Synapse's HMAC-SHA1 registration MAC in internal/teamchat/matrix (the repository owner's decision 3 on pull request 124, Plan 00246 Task 8.2); the test-file G301/G302/G306 exclusions of teamchat join entries already recorded and raise nothing. The ceiling was raised by two on 2026-10-29 for the tagliatelle exclusions of internal/netpolicy/podman.go (podman inspect's own field names, Plan 00232) and internal/containerimages/oldrange_records.go (c/storage's own mapped-layers key, Plan 00235)."

[[exception]]
rule = "go::generated-header"
path = "internal/pingbus/statusline/widthtable.go"
justification = "A generated-code header makes golangci-lint and staticcheck skip a file, so a hand-written one would hide code from them. This file is generated, from Python 3.11.2's unicodedata (Unicode 14.0.0), as the status line's East Asian Width tables, and its Code generated ... DO NOT EDIT. line is the standard Go generated-file header that says so, not a lint suppression. Scope: this one file."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26
