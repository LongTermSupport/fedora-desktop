# The exceptions to the defences go-qa-ci runs. Every entry is a configuration exception in
# src-go/.golangci.yml, recorded here one for one because go-qa-ci requires each to be a signed
# record entry; `go-qa record list` enumerates them. The entries were written by a model: the
# owner re-decides them by their review date.

[ratchet]
high_water = 19
decided_by = "repository-owner"
decided_on = 2026-10-15
reason = "adopting go-qa-ci: the record is the existing exclusions of the golangci configuration, recorded one for one with no new exception"

[[exception]]
rule = "golangci.yml::exclusions.rules::goconst+dupword"
path = ".golangci.yml"
justification = "every _test.go in the module and the qa module: a test spells out the argv it expects, so naming each repeated literal as a constant, or flagging a list like 'A A B', would hide what is asserted; production code is still held to both linters"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G204"
path = ".golangci.yml"
justification = "internal/execx and qa/internal/proc, the two process seams (one per module): the runner exists to launch a command from a variable, so a command-injection finding there is the design; every other package reaches a program through a seam and is still held to G204"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13

[[exception]]
rule = "golangci.yml::exclusions.rules::tagliatelle"
path = ".golangci.yml"
justification = "internal/transcript/transcript.go, qa/changed/checks.go, qa/ansible/report.go and qa/patterns/semgrep.go: the JSON keys are the snake_case wire format of the transcript, semgrep and the QA machine report, not ours to rename; no other file is exempt"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G304|G703"
path = ".golangci.yml"
justification = "qa/changed, qa/patterns, qa/discovery, qa/ansiblesyntax, qa/bash and the qa-patterns command read repository files by a path the file listing or the person running the tool gave; the hazard is path traversal, accepted because the tool only reads the tree it is run in, and only the named files are exempt"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G304|G703|G306|G302"
path = ".golangci.yml"
justification = "qa/all and qa/gates read the gate scripts and the counts file by computed path and write the machine report where the caller says; the hazard is a path or permission the caller chooses, accepted because the caller is the person running QA on their own checkout"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13

