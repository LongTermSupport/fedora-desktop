# The project record (go-qa-ci docs/record.md): every configuration exception in src-go/.golangci.yml,
# one entry per rule the suppression detector prints for it, and the generated-code header of
# widthtable.go. An entry covers every exclusion in .golangci.yml the detector names with its rule,
# so its justification names each one by its path pattern.
# The [ratchet] table is the repository owner's signature (Plan 00191 Task 3.8).

[[exception]]
rule = "golangci.yml::exclusions.rules::goconst+dupword"
path = ".golangci.yml"
justification = "goconst and dupword flag repeated literals and repeated words; a test spells out the argv it expects, and naming each repeated literal (gum, fzf) as a constant, or flagging a list like A A B, hides what is asserted. Scope: the exclusion for path _test.go only; production code is held to both."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G204"
path = ".golangci.yml"
justification = "gosec G204 guards against command injection through a program launched from a variable. Each module has exactly one process seam that exists to do that: internal/execx/ (src-go) and qa/internal/proc/proc.go (the qa module, which cannot import execx); every other package reaches a program through its seam, so a G204 anywhere else is still reported."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "golangci.yml::exclusions.rules::tagliatelle"
path = ".golangci.yml"
justification = "tagliatelle enforces one JSON key case so a struct tag cannot drift from the house style; these structs decode or write another program's wire format, whose key case is not ours to choose. Scope: internal/transcript/transcript.go (Claude's transcript), internal/wsitoken/usage.go (ccy --token-usage --json), internal/teams/membership/(membership|desired|report).go and internal/conversation/conversation.go (pingbus files), internal/pingbus/statusline/golden/golden_test.go (the pingbus oracle's scenarios.json), and qa/changed/checks.go, qa/ansible/report.go, qa/patterns/semgrep.go (semgrep's report and qa-ansible's machine report)."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G302|G304|G306|G703"
path = ".golangci.yml"
justification = "gosec G302/G306 guard against files made readable by other users and G304/G703 against reading a path an attacker chose; the status line refuses files others can read, so its tests must build such files, and they read and edit the cache file of their own temporary world. Scope: internal/pingbus/statusline/ test files only."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

[[exception]]
rule = "golangci.yml::exclusions.rules::gosec/G302|G304|G306|G401|G501|G703"
path = ".golangci.yml"
justification = "gosec G302/G306 guard against permissive file modes, G304/G703 against reading a path an attacker chose, G401/G501 against MD5 used for security; the launcher's differential harness builds a scratch sandbox per scenario, installs the launcher into it executable as the play does, reads back what the run left by paths computed from its own temporary directory or the checkout, and uses MD5 only because the fake engine must report the launcher's Dockerfile hash. Scope: internal/ccylaunch/difftest/ test files only."
decided_by = "repository-owner"
added_by_model = "claude-opus-5-5"
decided_on = 2026-10-27
review_by = 2026-11-26

