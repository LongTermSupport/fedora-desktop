[[exception]]
rule = "golangci.yml::govet.disable::fieldalignment"
path = ".golangci.yml"
justification = "the whole module: struct field order is chosen for readability, and the padding bytes fieldalignment would reclaim are unmeasurable in a command-line tool that holds no memory-heavy struct; every other govet analyzer is enabled"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13

[[exception]]
rule = "gqaci_exit_outside_main"
path = "qa/cmd/*/*_test.go"
justification = "a test that proves the closed-stdout refusal re-runs its own test binary as the command with stdout closed, and the child must end with the command's exit code for the parent to read it; the hazard is skipped deferred calls, accepted because the child does nothing after the call; the test files of the qa-* commands are exempt"
decided_by = "repository-owner"
added_by_model = "claude-sonnet-5-5"
decided_on = 2026-10-15
review_by = 2027-01-13
covers = "findings"
policy = true

