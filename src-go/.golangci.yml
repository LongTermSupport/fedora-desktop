# golangci-lint v2, strict. The version is pinned in /.qa-versions (GOLANGCI_LINT).
# Every finding fails the gate; nothing is suppressed in code (nolint is banned by
# R-QA-SUPPRESSION), so a rule that is wrong for this module is turned off HERE, with why.
version: "2"

run:
  go: "1.26"
  tests: true

linters:
  default: all
  disable:
    # Deprecated in golangci-lint 2.x; default: all still selects them beside their
    # successors (wsl_v5, gomodguard_v2), which stay enabled.
    - wsl
    - gomodguard
    # Whitespace style (blank lines around returns and statements): layout is gofumpt's,
    # and these flag idiomatic code, not defects.
    - wsl_v5
    - nlreturn
    # `if err := f(); err != nil` is idiomatic Go that keeps err scoped to its check.
    - noinlineerr
    - exhaustruct_v5
    # Forbids any global, including the sentinel errors and compiled regexps idiomatic Go
    # keeps at package level.
    - gochecknoglobals
    # Demands every struct field be set in a literal: fights the zero-value idiom.
    - exhaustruct
    # Forbids non-stdlib imports unless listed; the module's dependencies are reviewed
    # in go.mod instead.
    - depguard
    # Line length is gofumpt's and the reviewer's call, not a count.
    - lll
    # Bans the short names (r, w, t, ok) idiomatic Go uses in small scopes.
    - varnamelen
    # Requires t.Parallel() everywhere; tests that drive a fake terminal or change the
    # working directory must not run in parallel.
    - paralleltest
    - tparallel
    # Demands black-box test packages only; white-box tests of unexported logic are wanted.
    - testpackage
    # Flags every TODO; the plan tracks work, and none may be committed anyway.
    - godox
    # Wants every comment to end in a period, including list items and code references.
    - godot
    # Rejects every magic number including exit codes, column widths and retry counts
    # that read best as literals beside their one use.
    - mnd
    # Forbids returning interfaces; the seams (Runner, Prompter) are constructed behind
    # them on purpose.
    - ireturn
    # Bans package-level init and globals the tests never touch; too broad here.
    - gochecknoinits
    # Wants wrapped errors from every external package call even when the caller adds the
    # context itself.
    - wrapcheck
    # Prints to stdout/stderr are this module's output, not debugging leftovers.
    - forbidigo
    # Prefers err113 sentinel-only errors; fmt.Errorf with %w is the house style.
    - err113
    # Not applicable: no HTTP handlers, no SQL, no protobuf.
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - protogetter
  exclusions:
    rules:
      # A test spells out the argv it expects; naming each repeated literal ("gum", "fzf")
      # as a constant, or flagging a list like "A A B", hides what is asserted.
      - path: _test\.go
        linters: [goconst, dupword]
      # G204: the runner exists to launch a command from a variable; it is the one place that
      # may. Every other package reaches a program through it, so a G204 elsewhere is real.
      - path: internal/execx/
        linters: [gosec]
        text: "G204"
      # The transcript's field names are Claude's wire format (usage counts are snake_case
      # beside camelCase siblings), not ours to choose.
      - path: internal/transcript/transcript\.go
        linters: [tagliatelle]
      # `ccy --token-usage --json` is ccy's documented report (schema 1, snake_case keys).
      - path: internal/wsitoken/usage\.go
        linters: [tagliatelle]
      # A session's membership file is pingbus's wire format (Plan 00203 SPEC-hot-control.md
      # section 3.1, snake_case like the rest of pingbus's files), read by the session's pingbus.
      - path: internal/teams/membership/(membership|desired|report)\.go
        linters: [tagliatelle]
      # The QA module cannot import execx (it is a separate module), so its process runner is
      # its own one process seam, for the same reason.
      - path: qa/internal/proc/proc\.go
        linters: [gosec]
        text: "G204"
      # qa-changed's whole job is to read the repository's files by computed path (their first
      # line, a playbook's text, a suite's text) and to mirror files for semgrep; the paths come
      # from git and the command line of the person running it.
      - path: qa/changed/
        linters: [gosec]
        text: "G304|G703"
      # qa-all and the gate table read the gate scripts and the counts file by computed path,
      # and write the machine report where the caller says.
      - path: qa/(all|gates)/
        linters: [gosec]
        text: "G304|G703|G306|G302"
      # qa-ansible reads the tree through an fs.FS, but its tests build trees, set the execute
      # bit the hygiene check looks for, and read the report back by computed path.
      - path: qa/ansible/.*_test\.go
        linters: [gosec]
        text: "G304|G302|G306"
      # semgrep's JSON report is snake_case, its wire format; so is qa-ansible's machine report,
      # which qa-all and qa-changed read.
      - path: qa/changed/checks\.go|qa/ansible/report\.go|qa/patterns/semgrep\.go
        linters: [tagliatelle]
      # qa-patterns copies the scripts into a scan mirror (discover.go), reads the trees table
      # and each script's first line, reads the rules and semgrep's report (semgrep.go), and
      # reads a script back for its line count (report.go), all by computed path; the paths come
      # from the repository's own file list and the command line of the person running it. Only
      # these files, so a new file or a test is still held to the rule.
      - path: qa/patterns/(discover|semgrep|report)\.go
        linters: [gosec]
        text: "G304|G703"
      # qa-discovery reads the trees table and each candidate's first line by computed path; the
      # paths come from git's file list and the command line of the person running it.
      - path: qa/discovery/(list|trees)\.go
        linters: [gosec]
        text: "G304|G703"
      # qa-ansible-syntax reads each candidate playbook by the path git listed, and its tests read
      # back a file they wrote under a temporary directory.
      - path: qa/ansiblesyntax/(discover|helpers_test)\.go|qa/cmd/qa-ansible-syntax/main_test\.go
        linters: [gosec]
        text: "G304|G703"
      # The command's report writer and the real-tree test read and write by computed path.
      - path: qa/cmd/qa-patterns/(main|real_test)\.go
        linters: [gosec]
        text: "G304|G703"
      # Two tests read back a file they wrote under a temporary directory.
      - path: qa/(patterns/helpers_test|cmd/qa-patterns/main_test)\.go
        linters: [gosec]
        text: "G304"
      # A test writes an executable stub to prove the executable check.
      - path: qa/changed/.*_test\.go
        linters: [gosec]
        text: "G302|G306"
      # qa-python reads the pin and the first line of each file git lists by computed path
      # (ruff.go), and ruff's report is snake_case, its wire format; the report
      # is what qa-all reads. Its tests read back what they wrote under a temporary directory.
      - path: qa/python/(ruff|report)\.go
        linters: [gosec, tagliatelle]
        text: "G304|ruff_diagnostics"
      - path: qa/(python/.*|cmd/qa-python/main)_test\.go
        linters: [gosec, tagliatelle]
        text: "G304|G302|G306|ruff_diagnostics"
      # qa-bash's report carries shellcheck's findings under the snake_case key qa-all reads; its
      # tests read back what they wrote under a temporary directory.
      - path: qa/bash/report\.go
        linters: [tagliatelle]
        text: "shellcheck_diagnostics"
      # The one shared type for a semgrep result, whose keys are snake_case.
      - path: qa/internal/semgrepreport/report\.go
        linters: [tagliatelle]
        text: "check_id"
      # qa-bash reads each gated file for its directives and the allowlist by computed path (the
      # paths come from git's file list), and the report it writes is readable by other
      # accounts (mode 0644, SPEC-qa-bash.md S2).
      - path: qa/bash/directives\.go
        linters: [gosec]
        text: "G304|G703"
      - path: qa/cmd/qa-bash/main\.go
        linters: [gosec]
        text: "G306|G302"
      - path: qa/(bash/.*|cmd/qa-bash/main)_test\.go
        linters: [gosec, tagliatelle]
        text: "G304|G302|G306|shellcheck_diagnostics"
      # vmtest works in the lab tree under the user's own home: every path it opens is the lab
      # directory joined with a fixed name or a validated base, member or run id. It keeps the
      # modes the lab has always had (SPEC-vmtest.md section 5): run directories and records
      # 0755/0644 because the run spool and the desktop bridge read them, base images 0444 so
      # nothing writes a base by mistake. Its tests build that tree.
      - path: internal/vmtest/
        linters: [gosec]
        text: "G304|G703|G301|G302|G306"
      # rclonerc reads the RC credential at the path play-rclone.yml writes (or the one
      # RCLONE_RC_AUTH_FILE names, as the bash library it mirrors does).
      - path: internal/rclonerc/rclonerc\.go
        linters: [gosec]
        text: "G304"
      # ftp-camera's job is files by computed path: it reads its config and the uploads under
      # the camera account's home, and copies each sorted upload into the rclone mount, creating
      # its directories with the user's umask as cp and mkdir -p did (SPEC-ftp-camera.md E63).
      # Its tests build that tree.
      - path: internal/ftpcamera/
        linters: [gosec]
        text: "G304|G703|G301|G302|G306"
      # watermark's job is the one image the person names: it reads its signature from the
      # path given on the command line (SPEC-wsi-watermark.md M8).
      - path: internal/watermark/image\.go
        linters: [gosec]
        text: "G304"
      # wsi reads its PID file and its recording in /dev/shm and its log under the user's home,
      # each a fixed name (SPEC-wsi-watermark.md W5-W7); its tests read back what it wrote there,
      # copy the recording as the fake sox does, and write an executable stand-in recorder.
      - path: internal/wsi/(app|log)\.go
        linters: [gosec]
        text: "G304"
      - path: internal/wsi/.*_test\.go
        linters: [gosec]
        text: "G304|G306|G703"
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    revive:
      enable-all-rules: false
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        # Reordering struct fields for padding costs readability for bytes nobody needs.
        - fieldalignment
    exhaustive:
      # A switch over an enum lists every member: a default would let a new member fall
      # through unhandled.
      default-signifies-exhaustive: false

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
