# golangci-lint v2. The version is pinned in /.qa-versions (GOLANGCI_LINT).
# Every finding fails the gate; nothing is suppressed in code (nolint is banned by
# R-QA-SUPPRESSION). The repository owner's ruling of 2026-11-18: Go's own defaults plus the
# checks major Go projects run, each on for all code or off for all code with its reason here;
# no list of per-path exceptions.
version: "2"

run:
  go: "1.26"
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Each is enabled by at least one major Go project.
    - errorlint
    - bodyclose
    - exhaustive
    - misspell
    - unconvert
    - usestdlibvars
    - predeclared
    - testifylint
    - nolintlint
    - unparam
    - gocritic
    - revive
    - gosec
    # Narrow, precise bug patterns. One that starts to need exceptions is turned off.
    - nilerr
    - nilnil
    - errchkjson
    - durationcheck
    - thelper
    # The one complexity measure.
    - gocognit
  exclusions:
    rules:
      # G204: the runner exists to launch a command from a variable; it is the one place that
      # may. Every other package reaches a program through it, so a G204 elsewhere is real.
      - path: internal/execx/
        linters: [gosec]
        text: "G204"
      # The QA module cannot import execx (it is a separate module), so its process runner is
      # its own one process seam, for the same reason.
      - path: qa/internal/proc/proc\.go
        linters: [gosec]
        text: "G204"
  settings:
    gosec:
      excludes:
        # Reading a path from a variable (G304, G703) and a file or directory mode (G301, G302,
        # G306) are what these tools and their tests do all day, and an MD5 or SHA-1 here is a
        # checksum or a protocol's MAC (G401, G501, G505), not a choice made for security.
        - G301
        - G302
        - G304
        - G306
        - G401
        - G501
        - G505
        - G703
    gocognit:
      min-complexity: 20
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      # vet's own analyzers plus the ones gopls runs by default. shadow and fieldalignment stay
      # off: more noise than signal (qa/lintconfig holds fieldalignment).
      enable:
        - nilness
        - unusedwrite
        - atomicalign
        - deepequalerrors
        - sortslice
        - timeformat
    exhaustive:
      # A switch over an enum lists every member: a default would let a new member fall
      # through unhandled.
      default-signifies-exhaustive: false

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
