#!/usr/bin/env ansible-playbook
---
#!/usr/bin/env ansible-playbook
# Install modern terminal emulators optimized for Claude Code
# Provides Alacritty, Kitty, Ghostty, and Foot - all with excellent performance,
# true color support, and great experience for AI-assisted development

- hosts: desktop
  name: Install Modern Terminal Emulators
  become: true
  vars:
    root_dir: "{{ inventory_dir }}/../../"
  tasks:
    # Alacritty - Fastest terminal with lowest input latency
    - name: Install Alacritty Terminal Emulator
      ansible.builtin.package:
        name: alacritty
        state: present
      tags: alacritty

    # Kitty - Feature-rich with native tabs and image support
    - name: Install Kitty Terminal Emulator
      ansible.builtin.package:
        name: kitty
        state: present
      tags: kitty

    # Ghostty - Brand new terminal by Mitchell Hashimoto (v1.0 released Christmas 2025)
    - name: Install Ghostty COPR Repository
      ansible.builtin.command:
        cmd: dnf copr enable -y pgdev/ghostty
        creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:pgdev:ghostty.repo
      tags: ghostty

    - name: Install Ghostty Terminal Emulator
      ansible.builtin.package:
        name: ghostty
        state: present
      tags: ghostty

    # Foot - Lightning-fast Wayland-native terminal with minimal resource usage
    - name: Install Foot Terminal Emulator
      ansible.builtin.package:
        name: foot
        state: present
      tags: foot

    # =========================================================================
    # Kitty UX defaults (Plan 00047)
    # =========================================================================
    # Shell integration + new-tab/new-window inherit cwd. Originally this
    # block also contained a wheel→PageUp remap (mouse_map b4/b5 send_text
    # \x1b[5~) intended to fix the CC-in-fullscreen wheel-clobbers-history
    # bug — that approach was empirically proven unreachable on Wayland (see
    # CLAUDE/Plan/00047/DECISION.md "FINAL ANSWER"). The proper fix was
    # dropping CLAUDE_CODE_NO_FLICKER from CCY's entrypoint.sh so CC uses
    # its classic in-band renderer; kitty's native scrollback then IS the
    # conversation and the wheel works without any emulator-side config.

    - name: Ensure Kitty Config Directory Exists
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: /home/{{ user_login }}/.config/kitty
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      tags: kitty

    - name: Configure Kitty UX Defaults
      become_user: "{{ user_login }}"
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.config/kitty/kitty.conf
        create: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED: kitty UX defaults (Plan 00047)"
        block: |
          # Shell integration emits OSC 7 (cwd reporting) on each prompt, so
          # new tabs/windows can inherit the cwd of the spawning one. It is the
          # default in recent kitty, but make it explicit so behaviour is
          # deterministic across upgrades.
          shell_integration enabled
          map ctrl+shift+t      new_tab_with_cwd
          map ctrl+shift+enter  new_window_with_cwd

          # Tab bar appearance — top edge, slanted edges so it reads as proper
          # GUI tabs rather than a status-strip. `tab_bar_min_tabs 1` makes the
          # bar visible even with a single tab, so the UI feels stable as you
          # open/close tabs (default 2 hides the bar until a second tab opens).
          tab_bar_edge     top
          tab_bar_style    slant
          tab_bar_min_tabs 1
      tags: kitty

    # Remove the previous wheel-to-PageUp blocks if present — they were
    # deployed by a prior version of this playbook and do nothing useful
    # now that CC no longer uses fullscreen rendering. This task is
    # idempotent: blockinfile state=absent is a no-op if the marker
    # block isn't present.
    - name: Drop Obsolete CC Wheel-to-PageUp Block from kitty.conf
      become_user: "{{ user_login }}"
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.config/kitty/kitty.conf
        marker: "# {mark} ANSIBLE MANAGED: CC wheel to PageUp (Plan 00047)"
        state: absent
      tags: kitty

    - name: Drop Obsolete CC Wheel-to-PageUp Block from alacritty.toml
      become_user: "{{ user_login }}"
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.config/alacritty/alacritty.toml
        marker: "# {mark} ANSIBLE MANAGED: CC wheel to PageUp (Plan 00047)"
        state: absent
      tags: alacritty

    - name: Display Installation Complete Message
      ansible.builtin.debug:
        msg: |
          Modern terminal emulators installed successfully:

          🚀 Alacritty - Fastest with lowest input latency
            • GPU-accelerated with OpenGL
            • Simple, minimal configuration (YAML)
            • Best for: Speed and simplicity
            • Launch: alacritty

          🐱 Kitty - Feature-rich with excellent graphics
            • Native tabs and window splits
            • Image protocol support
            • Font ligature support
            • Best for: Feature-rich experience with built-in multiplexing
            • Launch: kitty

          👻 Ghostty - Brand new from HashiCorp co-founder (v1.0 Dec 2025)
            • Platform-native UI (GTK4)
            • GPU-accelerated (OpenGL)
            • Zero configuration needed
            • Built-in tabs, splits, hundreds of themes
            • Best for: Modern features with native integration
            • Launch: ghostty

          🦶 Foot - Lightning-fast Wayland-native minimalist
            • Built specifically for Wayland
            • Extremely lightweight (21 MB memory!)
            • CPU-based rendering (faster than GPU for terminals)
            • Server/client architecture for instant startup
            • Best for: Wayland users wanting maximum efficiency
            • Launch: foot (or foot --server + footclient)

          All terminals feature:
          ✓ True color (24-bit) support
          ✓ Excellent performance with Claude Code
          ✓ Low input latency

          Configuration files:
          • Alacritty: ~/.config/alacritty/alacritty.toml
          • Kitty: ~/.config/kitty/kitty.conf
          • Ghostty: ~/.config/ghostty/config
          • Foot: ~/.config/foot/foot.ini

          Plan 00047: kitty shell-integration + new-tab/window cwd bindings.
