#!/usr/bin/env ansible-playbook
---
#!/usr/bin/env ansible-playbook
# Install modern terminal emulators optimized for Claude Code
# Provides Alacritty, Kitty, Ghostty, and Foot - all with excellent performance,
# true color support, and great experience for AI-assisted development

- hosts: desktop
  name: Install Modern Terminal Emulators
  become: true
  vars:
    root_dir: "{{ inventory_dir }}/../../"
  tasks:
    # Alacritty - Fastest terminal with lowest input latency
    - name: Install Alacritty Terminal Emulator
      ansible.builtin.package:
        name: alacritty
        state: present
      tags: alacritty

    # Kitty - Feature-rich with native tabs and image support
    - name: Install Kitty Terminal Emulator
      ansible.builtin.package:
        name: kitty
        state: present
      tags: kitty

    # Ghostty - Brand new terminal by Mitchell Hashimoto (v1.0 released Christmas 2025)
    - name: Install Ghostty COPR Repository
      ansible.builtin.command:
        cmd: dnf copr enable -y pgdev/ghostty
        creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:pgdev:ghostty.repo
      tags: ghostty

    - name: Install Ghostty Terminal Emulator
      ansible.builtin.package:
        name: ghostty
        state: present
      tags: ghostty

    # Foot - Lightning-fast Wayland-native terminal with minimal resource usage
    - name: Install Foot Terminal Emulator
      ansible.builtin.package:
        name: foot
        state: present
      tags: foot

    # =========================================================================
    # Claude Code wheel→PageUp remap for supported emulators (Plan 00047)
    # =========================================================================
    # The fullscreen alt-screen rendering Claude Code uses, combined with CCY's
    # CLAUDE_CODE_DISABLE_MOUSE=1 (to keep native text selection working),
    # leaves the terminal's DECSET-1007 fallback in charge of the wheel — it
    # emits arrow-up/down on the alt screen, which the CC prompt reads as
    # history recall and clobbers in-progress input. Per-emulator config below
    # remaps the wheel to PageUp/PageDown SCOPED to alt-screen with no mouse
    # grab, so primary-screen scrolling (bash, less without -X, etc.) and
    # mouse-grabbing TUIs (htop, btop, lazygit) are unaffected.
    #
    # Ghostty has no mouse-binding config in v1.x (open feature request
    # #4169) — skipped here. Foot has no send-key action — also skipped.
    # See CLAUDE/Plan/00047/DECISION.md and lib/terminal-detection.bash.

    - name: Ensure Kitty Config Directory Exists
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: /home/{{ user_login }}/.config/kitty
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      tags: kitty

    - name: Configure Kitty Wheel To PageUp on Alt-Screen
      become_user: "{{ user_login }}"
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.config/kitty/kitty.conf
        create: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED: CC wheel to PageUp (Plan 00047)"
        block: |
          # Remap wheel to PageUp/PageDown for ungrabbed apps (e.g. Claude Code
          # in fullscreen rendering with mouse capture off). Mouse-grabbing
          # TUIs (htop, btop, lazygit) keep raw wheel events via `grabbed`.
          mouse_map wheel_up   press ungrabbed send_key Page_Up
          mouse_map wheel_down press ungrabbed send_key Page_Down
      tags: kitty

    - name: Ensure Alacritty Config Directory Exists
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: /home/{{ user_login }}/.config/alacritty
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      tags: alacritty

    - name: Configure Alacritty Wheel To PageUp on Alt-Screen
      become_user: "{{ user_login }}"
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.config/alacritty/alacritty.toml
        create: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED: CC wheel to PageUp (Plan 00047)"
        block: |
          # Remap wheel to PageUp/PageDown only in alt-screen mode (mode = "Alt"),
          # so primary-screen scrolling in bash/less/cat is unaffected.
          # \u001B is the TOML escape for the ESC byte; the full ANSI sequences
          # are ESC[5~ (PageUp) and ESC[6~ (PageDown).
          [[mouse.bindings]]
          mouse = "WheelUp"
          chars = "\u001B[5~"
          mode = "Alt"

          [[mouse.bindings]]
          mouse = "WheelDown"
          chars = "\u001B[6~"
          mode = "Alt"
      tags: alacritty

    - name: Display Installation Complete Message
      ansible.builtin.debug:
        msg: |
          Modern terminal emulators installed successfully:

          🚀 Alacritty - Fastest with lowest input latency
            • GPU-accelerated with OpenGL
            • Simple, minimal configuration (YAML)
            • Best for: Speed and simplicity
            • Launch: alacritty

          🐱 Kitty - Feature-rich with excellent graphics
            • Native tabs and window splits
            • Image protocol support
            • Font ligature support
            • Best for: Feature-rich experience with built-in multiplexing
            • Launch: kitty

          👻 Ghostty - Brand new from HashiCorp co-founder (v1.0 Dec 2025)
            • Platform-native UI (GTK4)
            • GPU-accelerated (OpenGL)
            • Zero configuration needed
            • Built-in tabs, splits, hundreds of themes
            • Best for: Modern features with native integration
            • Launch: ghostty

          🦶 Foot - Lightning-fast Wayland-native minimalist
            • Built specifically for Wayland
            • Extremely lightweight (21 MB memory!)
            • CPU-based rendering (faster than GPU for terminals)
            • Server/client architecture for instant startup
            • Best for: Wayland users wanting maximum efficiency
            • Launch: foot (or foot --server + footclient)

          All terminals feature:
          ✓ True color (24-bit) support
          ✓ Excellent performance with Claude Code
          ✓ Low input latency

          Configuration files:
          • Alacritty: ~/.config/alacritty/alacritty.toml
          • Kitty: ~/.config/kitty/kitty.conf
          • Ghostty: ~/.config/ghostty/config
          • Foot: ~/.config/foot/foot.ini

          Plan 00047: wheel→PageUp remap deployed for kitty + alacritty.
          Ghostty + foot are skipped (no emulator-level wheel remap available).
