#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# The private-name guard's pinned list is written by scripts/qa-private-names.bash, which builds
# the Go tool from the checkout.
- import_playbook: play-golang.yml

- hosts: desktop
  name: Configure Git Security Hooks
  become: false

  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: developer   # all | developer — see CLAUDE/AnsibleStyle.md
    repo_path: "{{ root_dir }}"
    # A bus host's teamchat-ctl state root: one directory per team it serves
    # (internal/teamchat/paths.CtlStateRoot; installplay's test holds the two equal).
    pn_ctl_state_root: /var/lib/teamchat-ctl
    # private_name_terms is a list, and only a list's items can each be vaulted.
    pn_terms_is_list: >-
      {{ private_name_terms is not defined or (private_name_terms is sequence
      and private_name_terms is not string and private_name_terms is not mapping) }}

  tasks:
    - name: Audience guard — end play on a consumer install
      ansible.builtin.meta: end_play
      when: install_audience != 'developer'

    - name: Verify we are in a git repository
      ansible.builtin.stat:
        path: "{{ repo_path }}/.git"
      register: git_dir
      failed_when: not git_dir.stat.exists

    - name: Verify git hooks directory exists
      ansible.builtin.stat:
        path: "{{ repo_path }}/scripts/git-hooks"
      register: hooks_dir
      failed_when: not hooks_dir.stat.exists

    - name: Verify pre-commit hook exists and is executable
      ansible.builtin.stat:
        path: "{{ repo_path }}/scripts/git-hooks/pre-commit"
      register: pre_commit_hook
      failed_when: not pre_commit_hook.stat.exists or not pre_commit_hook.stat.executable

    - name: Verify commit-msg hook exists and is executable
      ansible.builtin.stat:
        path: "{{ repo_path }}/scripts/git-hooks/commit-msg"
      register: commit_msg_hook
      failed_when: not commit_msg_hook.stat.exists or not commit_msg_hook.stat.executable

    - name: Verify pre-push hook exists and is executable
      ansible.builtin.stat:
        path: "{{ repo_path }}/scripts/git-hooks/pre-push"
      register: pre_push_hook
      failed_when: not pre_push_hook.stat.exists or not pre_push_hook.stat.executable

    # Both hooks source this. Without it neither can run, so its absence must
    # fail the play rather than surface later as a hook that exits 1 on every
    # commit.
    - name: Verify the shared secret-scanning library exists
      ansible.builtin.stat:
        path: "{{ repo_path }}/scripts/git-hooks/lib/secret-scan.bash"
      register: hooks_lib
      # Size, not just existence. A zero-byte file passes `stat.exists` and then
      # defines none of the functions the hooks call — Plan 00067's shape, where a
      # present-but-empty artefact satisfied a presence check.
      failed_when: not hooks_lib.stat.exists or hooks_lib.stat.size == 0

    - name: Configure git to use tracked hooks directory
      community.general.git_config:
        name: core.hooksPath
        value: scripts/git-hooks
        scope: local
        repo: "{{ repo_path }}"

    - name: Verify git hooks configuration
      ansible.builtin.command:
        cmd: git config core.hooksPath
      args:
        chdir: "{{ repo_path }}"
      register: hooks_path_check
      changed_when: false
      failed_when: hooks_path_check.stdout != 'scripts/git-hooks'

    - name: Display git hooks status
      ansible.builtin.debug:
        msg: "✓ Git security hooks configured: {{ repo_path }}/scripts/git-hooks"

    # The private-name guard's pinned list (Plan 00265 R79, src-go/qa/privatenames): a ccy
    # container learns only its own session's teams from the bus, so this machine's inventory
    # names the rest. `qa-private-names pin` writes <git common dir>/private-terms-pinned (0600,
    # this user's, replaced whole), which every worktree and the ccy container mounting this
    # checkout read. Every task that holds a name is no_log; pin prints only a count, and its
    # stderr never holds a name, so the check after it shows that.
    - name: Count the private_name_terms Items That Are Not Vault-Encrypted
      ansible.builtin.set_fact:
        pn_plaintext_items: "{{ (private_name_terms | default([]) | reject('vault_encrypted') | list | length) if pn_terms_is_list | bool else 0 }}"
      no_log: true

    - name: Refuse a private_name_terms Item That Is Not Vault-Encrypted
      ansible.builtin.assert:
        that:
          - pn_terms_is_list | bool
          - pn_plaintext_items | int == 0
        fail_msg: >-
          private_name_terms in host_vars must be a list whose every item is vault-encrypted;
          {{ 'it is not a list' if not pn_terms_is_list | bool else (pn_plaintext_items ~ ' item(s) are plaintext') }}.
          No value is shown. Remove each plaintext item, add the names again with
          `scripts/vault-list.bash add private_name_terms` (it vault-encrypts each one), and run
          this play again.
        quiet: true

    - name: Read Whether This Machine Serves Teams
      ansible.builtin.stat:
        path: "{{ pn_ctl_state_root }}"
      register: pn_ctl_root

    # A command, not find: a no_log task still prints its warnings, and find warns with the path of
    # an entry it cannot read, which is a team's name. find(1)'s stderr is never shown, only rc.
    - name: Read the Teams This Bus Host Serves
      ansible.builtin.command:
        argv: [find, "{{ pn_ctl_state_root }}", -mindepth, "1", -maxdepth, "1", -type, d, -printf, "%f\n"]
      become: true
      register: pn_served
      changed_when: false
      check_mode: false # read-only, so --check runs it and the assert below still judges it
      failed_when: false # FAIL-FAST-OK: no_log hides a failure's reason; the next task fails on rc, never printing a name
      no_log: true
      when: pn_ctl_root.stat.exists

    - name: Check the Served Teams Were Read
      ansible.builtin.assert:
        that:
          - not pn_ctl_root.stat.exists or pn_served.rc == 0
        fail_msg: >-
          The teams this bus host serves could not all be listed from {{ pn_ctl_state_root }}
          (find exited {{ pn_served.rc | default('none') }}; its output is not shown, as it names
          teams), so the pinned list would miss some.
        quiet: true

    - name: Write the Private-Name Guard's Pinned List
      ansible.builtin.command:
        argv: ["{{ root_dir }}/scripts/qa-private-names.bash", pin]
        chdir: "{{ root_dir }}"
        stdin: >-
          {{ {'teamchat_teams': teamchat_teams | default([]),
              'teamchat_lxc_members': teamchat_lxc_members | default([]),
              'agent_bus_teams': agent_bus_teams | default([]),
              'agent_bus_lxc_members': agent_bus_lxc_members | default([]),
              'agent_bus_element_teams': agent_bus_element_teams | default([]),
              'teamchat_site': teamchat_site | default(''),
              'served_teams': pn_served.stdout_lines | default([]),
              'private_name_terms': private_name_terms | default([])} | to_json }}
      register: pn_pin
      changed_when: pn_pin.stdout is search('pinned list written')
      failed_when: false # FAIL-FAST-OK: no_log hides a failure's reason; the next task fails on rc, showing the name-free stderr
      no_log: true

    - name: Check the Pinned List Was Written
      ansible.builtin.assert:
        that:
          - pn_pin.rc == 0
        fail_msg: >-
          qa-private-names pin refused (exit {{ pn_pin.rc }}): {{ pn_pin.stderr | trim }}
        success_msg: "{{ pn_pin.stdout | trim }}"
      # --check skips the write above, so it records no rc; a dry run writes nothing and judges nothing here
      when: not ansible_check_mode
