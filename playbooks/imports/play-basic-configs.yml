#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
- hosts: desktop
  name: Basic Configs
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    # Priority 0: PS1_Colour given as an extra-var. run.bash passes RUN_BASH_PS1_COLOUR this way
    # on a headless run, where nobody can answer the prompt below; an extra-var outranks every
    # set_fact here, so the tasks below are skipped by their own `is not defined` guards.
    # Priority 1: per-hostname override in localhost.yml
    # Example in localhost.yml:
    #   hostname_overrides:
    #     <hostname-a>:
    #       ps1_colour: green
    #     <hostname-b>:
    #       ps1_colour: lightblueBold
    - name: Set PS1_Colour from hostname override
      ansible.builtin.set_fact:
        PS1_Colour: "{{ hostname_overrides[ansible_facts['hostname']].ps1_colour }}"
      when:
        - hostname_overrides is defined
        - ansible_facts['hostname'] in hostname_overrides
        - hostname_overrides[ansible_facts['hostname']].ps1_colour is defined

    # Priority 2: existing /var/local/ps1-prompt-colour file
    - name: Check if PS1 prompt colour already configured
      ansible.builtin.stat:
        path: /var/local/ps1-prompt-colour
      register: ps1_colour_file
      when: PS1_Colour is not defined

    - name: Read existing PS1 colour if present
      ansible.builtin.slurp:
        src: /var/local/ps1-prompt-colour
      register: existing_ps1_colour
      when: PS1_Colour is not defined and ps1_colour_file is defined and ps1_colour_file.stat.exists

    - name: Set PS1_Colour from existing config
      ansible.builtin.set_fact:
        PS1_Colour: "{{ (existing_ps1_colour.content | b64decode).split('=')[1] | trim }}"
      when: PS1_Colour is not defined and ps1_colour_file is defined and ps1_colour_file.stat.exists

    # Priority 3: interactive prompt (first run only). An EMPTY answer — enter on the default,
    # or a run with no tty — takes the default: `default(..., true)` covers the empty string,
    # where the plain filter would write `PS1_COLOUR=` and every prompt would silently fall
    # back to the prompt script's own colour.
    - name: Prompt for PS1 colour if not already configured
      ansible.builtin.pause:
        prompt: |
          Enter Prompt Colour. Must be one of:
            white / whiteBold
            red / redBold
            green / greenBold
            yellow / yellowBold
            blue / blueBold
            purple / purpleBold
            lightblue / lightblueBold

          (default: lightblueBold)
          Tip: set hostname_overrides.<hostname>.ps1_colour in localhost.yml to skip this prompt
      register: ps1_colour_prompt
      when: PS1_Colour is not defined and ps1_colour_file is defined and not ps1_colour_file.stat.exists

    - name: Set PS1_Colour from prompt
      ansible.builtin.set_fact:
        PS1_Colour: "{{ ps1_colour_prompt.user_input | default('lightblueBold', true) }}"
      when: PS1_Colour is not defined and ps1_colour_file is defined and not ps1_colour_file.stat.exists

    - name: Ensure jq is available
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ensure-jq.yml"

    - name: Basic packages
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - vim
          - wget
          - bash-completion
          - htop
          - python3-libdnf5
          - multitail
          - figlet
          - p7zip
      tags: packages

    # Passwordless sudo is a workstation convenience: one human at the keyboard, and a
    # password prompt on every dnf is friction with no security payoff. A server has no such
    # human and is reached by automation, where a permanent NOPASSWD:ALL is the whole ladder
    # from any process running as this user to root. So the server profile REMOVES this
    # play's block rather than merely not writing it: a box provisioned as a desktop and later
    # rebuilt as a server ends up in the state its current profile declares, and nothing
    # downstream has to undo what this play did. Only this play's own marker-wrapped block is
    # touched — a rule the operator wrote themselves (docs/headless-server-install.md Step 0a)
    # is theirs and stays. Headless runs supply their credential through the preflight
    # contract (NOPASSWD the operator owns, or RUN_BASH_SUDO_PASSWORD_FILE), never through
    # this block.
    - name: Passwordless Sudo (desktop profile grants it, server profile removes it)
      ansible.builtin.blockinfile:
        dest: /etc/sudoers
        marker: "## {mark} passwordless sudo for {{ user_login}}"
        block: "{{ user_login }}    ALL=(ALL)    NOPASSWD: ALL"
        state: "{{ 'absent' if provisioning_profile == 'server' else 'present' }}"
        validate: visudo -cf %s

    - name: Vim Colours
      block:
        - name: Install Colourscheme
          ansible.builtin.copy:
            src: "{{ root_dir }}/files/usr/share/vim/vimfiles/colors/deus.vim"
            dest: /usr/share/vim/vimfiles/colors/deus.vim
            mode: "0644"

        - name: Vim Configs
          ansible.builtin.blockinfile:
            marker: "\" {mark} Vim Colourscheme"
            block: colors deus
            path: /etc/vimrc.local
            create: true

    - name: Basic Bash Tweaks Files
      ansible.builtin.copy:
        src: "{{ root_dir }}/files{{ item }}"
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/profile.d/zz_lts-fedora-desktop.bash
        - /var/local/colours
        - /var/local/ps1-prompt

    - name: Prompt Colour File
      ansible.builtin.copy:
        content: "export PS1_COLOUR={{ PS1_Colour }}"
        dest: /var/local/ps1-prompt-colour
        owner: root
        group: root
        mode: "0644"

    - name: Create .bashrc-includes directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ item.split('/')[2] if '/home/' in item else 'root' }}"
        group: "{{ item.split('/')[2] if '/home/' in item else 'root' }}"
        mode: "0755"
      loop:
        - /root/.bashrc-includes
        - /home/{{ user_login }}/.bashrc-includes

    - name: Ensure Bash Tweaks are Loaded
      ansible.builtin.blockinfile:
        marker: "# {mark} ANSIBLE MANAGED: Bash Tweaks"
        block: source /etc/profile.d/zz_lts-fedora-desktop.bash
        path: "{{ item }}"
        create: false
      loop:
        - /root/.bashrc
        - /root/.bash_profile
        - /home/{{ user_login }}/.bashrc
        - /home/{{ user_login }}/.bash_profile

    - name: Add bashrc includes sourcing
      ansible.builtin.blockinfile:
        marker: "# {mark} ANSIBLE MANAGED: Source bashrc includes"
        block: |
          if [ -d ~/.bashrc-includes ]; then
            for file in ~/.bashrc-includes/*; do
              [ -r "$file" ] && source "$file"
            done
          fi
        path: "{{ item }}"
        create: false
      loop:
        - /root/.bashrc
        - /home/{{ user_login }}/.bashrc

    - name: Deploy shutdown-with-update script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/usr/local/bin/shutdown-with-update"
        dest: /usr/local/bin/shutdown-with-update
        owner: root
        group: root
        mode: "0755"

    # The same script under a second name: it reads its own basename and, as
    # reboot-with-update, warns the running ccy/cc sessions and reboots instead of
    # shutting down (Plan 00135). A symlink, so the two can never drift apart.
    - name: Link reboot-with-update to the same script
      ansible.builtin.file:
        src: /usr/local/bin/shutdown-with-update
        dest: /usr/local/bin/reboot-with-update
        state: link
        owner: root
        group: root

    - name: Deploy shutdown-with-update alias
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/bashrc-includes/shutdown-with-update.bash"
        dest: "{{ item }}/.bashrc-includes/shutdown-with-update.bash"
        owner: "{{ item.split('/')[2] if item != '/root' else 'root' }}"
        group: "{{ item.split('/')[2] if item != '/root' else 'root' }}"
        mode: "0644"
      loop:
        - /root
        - /home/{{ user_login }}

    - name: Deploy USB audio fix script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/bashrc-includes/usb-audio-fix.bash"
        dest: "{{ item }}/.bashrc-includes/usb-audio-fix.bash"
        owner: "{{ item.split('/')[2] if item != '/root' else 'root' }}"
        group: "{{ item.split('/')[2] if item != '/root' else 'root' }}"
        mode: "0644"
      loop:
        - /root
        - /home/{{ user_login }}
      # Desktop-audio-hardware concern with no headless-server consumer (Plan 00061 §6.1).
      when: provisioning_profile != 'server'

    - name: Check if SSH key exists
      ansible.builtin.stat:
        path: /home/{{ user_login }}/.ssh/id
      register: user_ssh_key

    - name: Copy SSH ID to root
      ansible.builtin.copy:
        remote_src: true
        src: /home/{{user_login}}/.ssh/{{item}}
        dest: /root/.ssh/{{item}}
        owner: root
        mode: "0600"
      loop:
        - id
        - id.pub
      when: user_ssh_key.stat.exists

    - name: Ensure ~/.local/bin directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install ssh-agent-start helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-agent-start"
        dest: "/home/{{ user_login }}/.local/bin/ssh-agent-start"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install ssh-with-agent shared library (sourced, not executed)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-with-agent.bash"
        dest: "/home/{{ user_login }}/.local/bin/ssh-with-agent.bash"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    - name: Install ssh-with-password helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-with-password"
        dest: "/home/{{ user_login }}/.local/bin/ssh-with-password"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install scp-with-password helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/scp-with-password"
        dest: "/home/{{ user_login }}/.local/bin/scp-with-password"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install ssh-with-key helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-with-key"
        dest: "/home/{{ user_login }}/.local/bin/ssh-with-key"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install scp-with-key helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/scp-with-key"
        dest: "/home/{{ user_login }}/.local/bin/scp-with-key"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install ssh-copy-id-with-password helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-copy-id-with-password"
        dest: "/home/{{ user_login }}/.local/bin/ssh-copy-id-with-password"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install ssh-copy-id-with-key helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-copy-id-with-key"
        dest: "/home/{{ user_login }}/.local/bin/ssh-copy-id-with-key"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install ssh-keys-rekey helper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ssh-keys-rekey"
        dest: "/home/{{ user_login }}/.local/bin/ssh-keys-rekey"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Install YQ
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/bin/yq
      args:
        executable: /bin/bash
        creates: /usr/bin/yq
      tags: yq

    # Gates the probe below, and exists only for `--check`. On a real run the install
    # above has just guaranteed this path — a failed install aborts the play — so this
    # is always true and the probe always runs. Under `--check` on a host that has no
    # yq yet, the install is skipped, and without this gate the probe would run
    # `yq --version` against an absent binary and fail the preview on exactly the host
    # the install was about to fix.
    - name: Probe Whether A YQ Binary Is Present
      ansible.builtin.stat:
        path: /usr/bin/yq
      register: yq_binary
      tags: yq

    # The pinned `lts.vault-scripts` role needs yq **v4** — `dumpSecretsInFiles` and
    # `rekeyVaultFile` use v4 syntax, and its `assertYqInstalled` refuses anything
    # else. The task above cannot guarantee that on its own, in two ways that both
    # end with the host looking provisioned:
    #
    # `creates:` skips the download whenever /usr/bin/yq exists, so a host carrying
    # v3 from an older run keeps v3 for ever. And a `wget` that dies partway leaves
    # a truncated file at that path, which `creates:` then skips on every future
    # run — a failed install that never retries.
    #
    # Asserted here so both surface at provision time, naming the fix, instead of
    # inside a vault script at the moment someone needs a secret. `yq --version` is
    # also the probe for the truncated case: a broken binary cannot answer it.
    #
    # `check_mode: false` because this reads and changes nothing. Without it the
    # command module is skipped under `--check` and still registers `stdout=''`, which
    # renders as major 0 and fails the assert below on EVERY host — including one
    # running a perfectly good v4.53.3 — breaking `playbook-main.yml --check` and every
    # plan `deploy.bash --check`. `play-suspend-and-lid-policy.yml` and
    # `play-gnome-shell-extensions.yml` carry this same guard for this same reason.
    - name: Probe The Installed YQ Version
      become: true
      ansible.builtin.command: yq --version
      register: yq_version
      changed_when: false
      check_mode: false
      when: yq_binary.stat.exists
      tags: yq

    # v4 OR NEWER, matching the role's own `assertYqInstalled`, which extracts the
    # major and rejects `< 4`. Pinning to exactly v4 would be stricter than the thing
    # this assert exists to protect, and the install above fetches `latest` — so the
    # day yq v5 ships, a stricter check here would fail provisioning on a host whose
    # vault scripts would have run perfectly.
    #
    # The regex is the role's: mikefarah v3 prints `yq version 3.4.1`, v4 prints
    # `... version v4.53.3`, and the unrelated python (kislyuk) yq prints `yq 3.2.3`,
    # which matches no `version` form at all and is rejected as unrecognised.
    # `regex_replace`, not `regex_search`: search returns None when nothing matches,
    # and `| first` on None raises a templating error instead of failing the assert —
    # so the check would blow up rather than report. replace returns the input
    # unchanged on no match, which `| int` renders 0, and 0 fails the comparison
    # cleanly. `[.]` rather than an escaped dot keeps YAML backslash rules out of it.
    - name: Assert YQ Is A Major Version The Vault Scripts Support
      ansible.builtin.assert:
        that:
          - yq_major | int >= 4
        fail_msg: |
          yq reports: {{ yq_version.stdout | default('nothing', true) }}

          The vault scripts require mikefarah yq v4 or newer — every yq call in them
          is v4 syntax. This host has something else: most likely v3 left by an
          earlier run, or a truncated download sitting at /usr/bin/yq.

          The install task above will not replace it: `creates:` treats "the file
          exists" as "nothing to do", so every future run skips it too. The fix
          belongs in that task — gating the install on this probe rather than on the
          file's existence — so every host self-heals rather than just this one.
        success_msg: "yq is v{{ yq_major }}, which the vault scripts support (v4+)"
      vars:
        yq_major: "{{ yq_version.stdout | default('nothing', true) | regex_replace('^.*version v?([0-9]+)[.].*$', '\\1') }}"
      when: yq_binary.stat.exists
      tags: yq

    - name: DNF Parallel
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        line: max_parallel_downloads=10

    # Always show GRUB menu — useful for kernel selection and recovery
    - name: Disable GRUB Menu Auto-Hide
      ansible.builtin.command: grub2-editenv - unset menu_auto_hide
      changed_when: true
      tags: grub

    - name: Check and Apply Firmware Updates via fwupd
      ansible.builtin.shell: |
        set -e
        fwupdmgr get-devices
        # Plain refresh respects the fwupd metadata-age cache and exits quickly when fresh
        # (no forced LVFS re-download every run, PERF-04). rc 2 means metadata already current.
        rc=0
        fwupdmgr refresh || rc=$?
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
          exit "$rc"
        fi
        rc=0
        fwupdmgr get-updates || rc=$?
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
          exit "$rc"
        fi
        rc=0
        fwupdmgr update || rc=$?
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
          exit "$rc"
        fi
      args:
        executable: /bin/bash
      register: fwupd_result
      # Report changed only when an update was actually staged/applied, not on no-op runs.
      changed_when: >-
        'Successfully installed firmware' in fwupd_result.stdout
        or 'has been updated' in fwupd_result.stdout
        or 'reboot is required' in fwupd_result.stdout | lower
      # Firmware updating is a physical-hardware concern with no consumer on a VM /
      # headless target: fwupd is not installed there and `fwupdmgr get-devices` (or a
      # no-device `refresh`) exits non-zero under bare `set -e`, aborting the whole run
      # via any_errors_fatal at play 3. Gate it off on the server profile (same pattern
      # as the USB-audio task above). Bare-metal servers wanting firmware updates can
      # revisit this behind an explicit opt-in probe.
      when: provisioning_profile != 'server'

    # ABRT crash handling policy (Plan 00134). Two decisions, both stated here rather
    # than left to Fedora's defaults:
    #   abrt_auto_reporting  — send anonymous µReports for packaged crashes (default on;
    #                          a host that never wants anything sent sets it false in
    #                          host_vars). abrt-auto-reporting edits abrt.conf itself
    #                          and takes effect without a restart.
    #   abrt_retention_days  — records older than this are removed daily. Unreported
    #                          records (unpackaged or third-party-repo binaries can
    #                          never be reported) otherwise accumulate for ever, and
    #                          abrt-applet re-announces every one at each login.
    # Resolved once under distinct names: the persisted block below would otherwise
    # read as `abrt_retention_days: {{ abrt_retention_days | default(30) }}`, which is
    # the ansible-core 2.19 self-referential shape the QA gate rejects.
    # The whole policy is a DESKTOP concern (the applet and µReports are desktop-shaped), so
    # it is gated off the server profile the same way fwupd is above. Nothing else in this
    # repo installs ABRT: the Workstation image ships it, a leaner desktop image may not, and
    # the probe below needs `abrt-auto-reporting` on PATH — so the block declares the two
    # packages it depends on rather than trusting the image. A host that later resolves to
    # the server profile keeps the units and the persisted block; only the sudo grant above
    # is actively removed on a profile flip, because it has a security reason to be.
    - name: ABRT crash handling policy (desktop profile only)
      when: provisioning_profile != 'server'
      tags: abrt
      block:
        - name: Install the ABRT tools this policy drives
          ansible.builtin.dnf:
            name:
              - abrt      # abrt-auto-reporting
              - abrt-tui  # abrt-cli, used by abrt-prune-stale.bash
            state: present

        - name: Resolve the effective ABRT policy
          ansible.builtin.set_fact:
            abrt_policy_reporting: "{{ 'enabled' if (abrt_auto_reporting | default(true) | bool) else 'disabled' }}"
            abrt_policy_days: "{{ abrt_retention_days | default(30) | int }}"

        - name: Probe ABRT auto-reporting state
          ansible.builtin.command: abrt-auto-reporting
          register: abrt_auto_reporting_probe
          changed_when: false

        - name: Set ABRT auto-reporting per abrt_auto_reporting
          ansible.builtin.command:
            argv:
              - abrt-auto-reporting
              - "{{ abrt_policy_reporting }}"
          when: abrt_auto_reporting_probe.stdout | trim != abrt_policy_reporting
          changed_when: true

        # Persist the effective values into host_vars so a `-e` override on one run is the
        # policy on every later run, and a host that never set them gets the block with the
        # project defaults. The markered block converges on re-runs (same pattern as the
        # LastPass / NordVPN / Qobuz plays). host_vars is the user's file, hence become: false.
        - name: Persist ABRT policy to localhost.yml
          become: false
          ansible.builtin.blockinfile:
            path: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
            marker: "# {mark} ANSIBLE MANAGED: ABRT crash policy"
            block: |
              # ABRT crash policy — see docs/configuration.md#crash-reporting-abrt
              abrt_auto_reporting: {{ 'true' if abrt_policy_reporting == 'enabled' else 'false' }}
              abrt_retention_days: {{ abrt_policy_days }}
            create: false

        - name: Deploy ABRT stale-record prune script
          ansible.builtin.copy:
            src: "{{ root_dir }}/files/usr/local/bin/abrt-prune-stale.bash"
            dest: /usr/local/bin/abrt-prune-stale.bash
            owner: root
            group: root
            mode: "0755"

        - name: Deploy ABRT prune service unit
          ansible.builtin.template:
            src: "{{ root_dir }}/files/etc/systemd/system/abrt-prune-stale.service.j2"
            dest: /etc/systemd/system/abrt-prune-stale.service
            owner: root
            group: root
            mode: "0644"
          vars:
            abrt_prune_days: "{{ abrt_policy_days }}"

        - name: Deploy ABRT prune timer unit
          ansible.builtin.copy:
            src: "{{ root_dir }}/files/etc/systemd/system/abrt-prune-stale.timer"
            dest: /etc/systemd/system/abrt-prune-stale.timer
            owner: root
            group: root
            mode: "0644"

        - name: Enable and start the ABRT prune timer
          ansible.builtin.systemd:
            name: abrt-prune-stale.timer
            enabled: true
            state: started
            daemon_reload: true

        # Run the prune now so a backlog is cleared on this pass, not at the next tick.
        - name: Prune stale ABRT records now
          ansible.builtin.command:
            argv:
              - /usr/local/bin/abrt-prune-stale.bash
              - "{{ abrt_policy_days }}"
          register: abrt_prune_result
          changed_when: "'ABRT-PRUNE-CHANGED' in abrt_prune_result.stdout"
