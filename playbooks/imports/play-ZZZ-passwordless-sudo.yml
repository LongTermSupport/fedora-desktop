#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Passwordless sudo, set last.
#
# A developer desktop keeps `NOPASSWD: ALL` only when its host_vars says
# passwordless_sudo_for_unattended_deploys: true, the choice for a host whose deploys an agent
# runs unattended (meta-deploy.bash cannot answer a password prompt). There is no default: a
# developer desktop that does not declare it fails (tasks/assert-passwordless-sudo-declared.yml).
# A server never has it: it has no human at the keyboard and is reached by automation, where a
# permanent NOPASSWD:ALL is the whole ladder from any process running as this user to root. A
# consumer install never has it either (Plan 00228 Decision 8): a non-technical user's account
# should not be a silent path to root. Only this play's own marker-wrapped block is touched; a
# rule the operator wrote (docs/headless-server-install.md Step 0a) is theirs and stays.
#
# Why last: run.bash decides once, before a run, whether Ansible needs the sudo password
# (`sudo -k -n true`). Revoking the grant early in a run that relied on it would fail every later
# become task, so this play is the last one playbook-main.yml imports, and no other play touches
# the grant: a play run on its own leaves it as it was.
#
# The kickstart's first-boot rule (/etc/sudoers.d/99-fedora-desktop-setup) is removed here on
# every host, and by its first-boot wrapper after run.bash. Both are needed: a run that fails
# before this play leaves it to the wrapper, and a reboot at the end of first boot can kill the
# wrapper before its removal runs. Removing it last strands nothing: every later play run.bash
# starts probes sudo again and asks for the password.
- hosts: desktop
  name: Passwordless sudo, set last
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
    passwordless_sudo_granted: >-
      {{ provisioning_profile != 'server' and install_audience != 'consumer'
         and (passwordless_sudo_for_unattended_deploys | default(false) | bool) }}
  tasks:
    - name: Passwordless sudo is declared
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/assert-passwordless-sudo-declared.yml"

    - name: Passwordless Sudo (a developer desktop that declares it keeps it; every other host has it removed)
      ansible.builtin.blockinfile:
        dest: /etc/sudoers
        marker: "## {mark} passwordless sudo for {{ user_login}}"
        block: "{{ user_login }}    ALL=(ALL)    NOPASSWD: ALL"
        state: "{{ 'present' if passwordless_sudo_granted | bool else 'absent' }}"
        validate: visudo -cf %s

    - name: Remove the kickstart's first-boot sudo rule
      ansible.builtin.file:
        path: /etc/sudoers.d/99-fedora-desktop-setup
        state: absent
