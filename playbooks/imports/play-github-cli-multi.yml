#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# GitHub CLI Multi-Account Setup - Leverages native gh multi-account support (v2.40.0+)
- hosts: desktop
  name: GitHub CLI Multi-Account Configuration
  vars_files:
    - "{{ root_dir }}/vars/git-signing.yml"   # git_signing_key_path
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    vault_file: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
    # GitHub SSH-over-443 ALWAYS-ON toggle. Default off. Set github_ssh_over_443:
    # true in host_vars/localhost.yml (or pass -e github_ssh_over_443=true) when
    # port 22 is firewall-blocked. ssh.github.com:443 serves the SAME host keys as
    # github.com:22, so this is a transparent endpoint swap, not a separate identity.
    #
    # Routing is applied by the unit-tested helpers/github443 module (a single
    # first-wins override block at the top of ~/.ssh/config + a [ssh.github.com]:443
    # known_hosts pin), NOT by per-stanza HostName rewriting — so it also covers
    # deploy-key aliases. github_443_extra_aliases adds extra Host globs (e.g.
    # ['myorg_deploy_*']) for deploy keys that redirect to github.com.
    #
    # For a TEMPORARY enable without re-running Ansible, use the `github-ssh-443`
    # CLI this play deploys (`github-ssh-443 on|off|auto|status|env`). It drives the
    # same helper, so the two reconcile.
    #
    # github_443_extra_aliases is read straight from host_vars (or -e) where it is
    # used, with `| default([])` applied there. It is deliberately NOT redeclared as
    # a play var: a self-referential `x: "{{ x | default([]) }}"` triggers Ansible
    # 2.19's "Recursive loop detected in template" error.
    #
    # Endpoint derived from the toggle, for the final SSH probe ONLY. That probe
    # uses `ssh -F /dev/null` (to isolate to a single key + ignore the agent), so
    # it bypasses the ~/.ssh/config override block and must be told the endpoint
    # explicitly. These derive from github_ssh_over_443 (NOT from themselves), so
    # they are safe under 2.19.
    github_ssh_hostname: "{{ 'ssh.github.com' if (github_ssh_over_443 | default(false) | bool) else 'github.com' }}"
    github_ssh_port: "{{ '443' if (github_ssh_over_443 | default(false) | bool) else '22' }}"
  tasks:
    - name: Check gh version for multi-account support
      ansible.builtin.shell: gh --version | grep -oP '\d+\.\d+\.\d+' | head -1
      register: gh_version_output
      changed_when: false
      failed_when: gh_version_output.rc != 0
      check_mode: false

    - name: Verify gh supports multi-account (v2.40.0+)
      ansible.builtin.assert:
        that:
          - gh_version_output.stdout != ""
          - gh_version_output.stdout is version('2.40.0', '>=')
        fail_msg: "GitHub CLI v2.40.0+ required for multi-account support. Current: {{ gh_version_output.stdout | default('not installed') }}"
        success_msg: "GitHub CLI {{ gh_version_output.stdout }} supports multi-account"

    - name: Ensure jq is available
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ensure-jq.yml"

    # =========================================================================
    # URL-printing helpers — deployed BEFORE the scope audit so that any
    # remediation the user runs afterwards (script-based or per-account) has
    # the deployed helper available. Both files are deployed unconditionally
    # because they are inert until invoked.
    #
    # /usr/local/bin/gh-print-auth-url
    #   GH_BROWSER target: prints the device-code URL instead of opening a
    #   browser. Used by scripts/gh-account-setup.bash and the shell wrapper
    #   below.
    #
    # /etc/profile.d/gh-multi-profile.sh
    #   Defines a gh() shell function that auto-sets GH_BROWSER for
    #   `gh auth login` / `gh auth refresh`. Sourced by interactive bash
    #   shells via /etc/bashrc → /etc/profile.d/*.sh.
    # =========================================================================
    - name: Deploy gh-print-auth-url Helper (GH_BROWSER URL Printer)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/usr/local/bin/gh-print-auth-url"
        dest: /usr/local/bin/gh-print-auth-url
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Deploy gh() Shell Wrapper for Multi-Profile Browser Handling
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/profile.d/gh-multi-profile.sh"
        dest: /etc/profile.d/gh-multi-profile.sh
        owner: root
        group: root
        mode: "0644"
      become: true

    # =========================================================================
    # GitHub SSH-over-443 host tooling (deployed unconditionally — useful for
    # single- and multi-account hosts alike). The unit-tested helper is the
    # single source of truth for host 443 routing; the CLI wrapper and the
    # persistent apply task above both drive it.
    # =========================================================================
    - name: Ensure ccy-helpers library directory exists
      ansible.builtin.file:
        path: /usr/local/lib/ccy-helpers/helpers/github443
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Deploy github443 helper modules
      ansible.builtin.copy:
        src: "{{ root_dir }}/helpers/github443/{{ item }}"
        dest: "/usr/local/lib/ccy-helpers/helpers/github443/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - core.py
        - cli.py
      become: true

    - name: Deploy github-ssh-443 toggle CLI
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/usr/local/bin/github-ssh-443"
        dest: /usr/local/bin/github-ssh-443
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Enable always-on GitHub SSH-over-443 profile export
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/profile.d/zz-github-ssh-443.sh"
        dest: /etc/profile.d/zz-github-ssh-443.sh
        owner: root
        group: root
        mode: "0644"
      become: true
      when: github_ssh_over_443 | default(false) | bool

    - name: Remove always-on GitHub SSH-over-443 profile export when disabled
      ansible.builtin.file:
        path: /etc/profile.d/zz-github-ssh-443.sh
        state: absent
      become: true
      when: not (github_ssh_over_443 | default(false) | bool)

    - name: Check current gh authentication status
      ansible.builtin.shell: gh auth status 2>&1
      register: gh_auth_check
      changed_when: false
      check_mode: false
      failed_when: false  # FAIL-FAST-OK: probe — gh returns non-zero when not authenticated

    - name: Display current authentication status
      ansible.builtin.debug:
        msg: "{{ gh_auth_check.stdout }}"

    - name: Skip if gh is not authenticated (e.g. firstboot)
      when: gh_auth_check.rc != 0
      block:
        - ansible.builtin.debug:
            msg: "Skipping GitHub CLI multi-account setup — gh is not authenticated. Run 'gh auth login' first."
        - ansible.builtin.meta: end_play

    - name: Check if GitHub accounts are configured
      ansible.builtin.set_fact:
        github_accounts_configured: "{{ github_accounts is defined and github_accounts | length > 0 }}"

    # CONFIGURATION CHECK - github_accounts must be set in localhost.yml (populated by run.bash)
    - name: Skip if github_accounts not configured
      when: not github_accounts_configured
      block:
        - ansible.builtin.debug:
            msg: >
              Skipping GitHub multi-account setup — github_accounts not configured in localhost.yml.
              Re-run run.bash which will prompt for account details, or add github_accounts manually:
                github_accounts:
                  personal: "your-github-username"
        - ansible.builtin.meta: end_play

    # AUTHENTICATION SETUP
    - name: Check which accounts need authentication
      ansible.builtin.shell: |
        gh auth status 2>&1 | grep -q "{{ item.value }}" && echo "authenticated" || echo "needs_auth"
      register: account_auth_status
      changed_when: false
      check_mode: false
      loop: "{{ github_accounts | default({}) | dict2items }}"
      when: github_accounts_configured and github_accounts is defined

    - name: Display accounts needing authentication
      ansible.builtin.debug:
        msg: |
          Account '{{ item.item.key }}' ({{ item.item.value }}): {{ 'Already authenticated ✓' if item.stdout == 'authenticated' else 'Needs authentication' }}
      loop: "{{ account_auth_status.results | default([]) }}"
      when: github_accounts_configured

    # PER-ACCOUNT OAUTH SCOPE AUDIT
    # Every gh token must carry the scopes in vars/github-required-scopes.yml.
    # helpers/github_scopes reads each account with its own token (no account switch)
    # and is the only judge of what a token's scopes satisfy: run.bash and
    # scripts/gh-account-setup.bash ask the same helper, so none keeps its own copy.
    - name: Capture currently active GitHub account (to restore after the SSH key audit)
      ansible.builtin.shell: |
        set -euo pipefail
        gh auth status --json hosts 2>/dev/null | \
          jq -r '.hosts["github.com"][] | select(.active == true) | .login // empty'
      args:
        executable: /bin/bash
      register: original_active_account
      changed_when: false
      when: github_accounts_configured

    - name: Audit OAuth scopes for every configured GitHub account
      ansible.builtin.command:
        argv: "{{ ['python3', '-m', 'helpers.github_scopes.cli', 'audit'] + (github_accounts | dict2items | map(attribute='value') | map('regex_replace', '^', '--user=') | list) }}"
        chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
      register: scope_audit
      changed_when: false
      when: github_accounts_configured

    - name: Display scope audit results per account
      ansible.builtin.debug:
        msg: "{{ scope_audit.stdout_lines }}"
      when: github_accounts_configured

    # One remedy for every account at once: gh-account-setup.bash asks each account for
    # everything it lacks in a single browser authorisation. run.bash runs the same thing
    # before any play, so a normal run.bash never reaches this.
    - name: Fail-fast if any account is missing required OAuth scopes
      ansible.builtin.fail:
        msg: |
          These GitHub accounts cannot be used as they are:
          {% for line in scope_audit.stdout_lines if not line.startswith('SCOPES-OK ') %}
            {{ line | regex_replace('^SCOPES-', '') }}
          {% endfor %}

          One command fixes every account, one browser authorisation each, asking for
          everything that account lacks (vars/github-required-scopes.yml):

            bash {{ root_dir }}/scripts/gh-account-setup.bash --setup-all

          Then re-run this playbook.
      when:
        - github_accounts_configured
        - scope_audit.stdout_lines | reject('match', '^SCOPES-OK ') | list | length > 0

    # SSH KEY GENERATION AND SETUP
    - name: Assert github_ssh_passphrase is set in vault
      ansible.builtin.assert:
        that:
          - github_ssh_passphrase is defined
          - github_ssh_passphrase | length > 0
        fail_msg: |
          ERROR: github_ssh_passphrase not found in vault!

          Add it using the vault helper:
            ./vault.bash set github_ssh_passphrase

          This passphrase protects your GitHub SSH private keys.
          All github_* keys use the same passphrase.
      when: github_accounts_configured

    - name: Generate SSH keys for accounts
      block:
        - name: Ensure .ssh directory exists
          ansible.builtin.file:
            path: "/home/{{ user_login }}/.ssh"
            state: directory
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0700"

        - name: Check for existing SSH keys
          ansible.builtin.stat:
            path: "/home/{{ user_login }}/.ssh/github_{{ item.key }}"
          register: ssh_key_status
          loop: "{{ github_accounts | default({}) | dict2items }}"

        # Must run BEFORE the passphrase probe: an empty key fails that probe
        # too, and would otherwise be misreported as a wrong passphrase. The
        # generation guard below tests only that the file EXISTS, so a zero-byte
        # key suppresses regeneration permanently (the Plan 00094 failure shape).
        - name: Fail fast if an existing SSH key file is empty
          ansible.builtin.fail:
            msg: |
              SSH key ~/.ssh/github_{{ item.item.key }} exists but is EMPTY (0 bytes).
              That is not a usable key, and it is not a passphrase problem — it is
              most likely a truncated or interrupted write.

              Key generation is guarded on the file EXISTING, so an empty file
              silently suppresses regeneration on every future run.

              To fix, delete it and re-run this playbook:
                rm -f ~/.ssh/github_{{ item.item.key }} ~/.ssh/github_{{ item.item.key }}.pub
          when:
            - item.stat.exists
            - item.stat.size == 0
          loop: "{{ ssh_key_status.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Create passphrase file for SSH key operations
          ansible.builtin.copy:
            content: "{{ github_ssh_passphrase }}"
            dest: "/tmp/.github_ssh_pp"
            mode: "0600"
            owner: "{{ user_login }}"
          no_log: true

        - name: Verify existing keys work with vault passphrase
          ansible.builtin.shell: |
            ssh-keygen -y -P "$(cat /tmp/.github_ssh_pp)" \
              -f "/home/{{ user_login }}/.ssh/github_{{ item.item.key }}" >/dev/null 2>&1
          args:
            executable: /bin/bash
          when: item.stat.exists
          loop: "{{ ssh_key_status.results }}"
          loop_control:
            label: "{{ item.item.key }}"
          register: passphrase_verify
          changed_when: false
          failed_when: false  # FAIL-FAST-OK: test-then-fail — next task gives actionable error message

        - name: Fail fast if existing keys have wrong passphrase
          ansible.builtin.fail:
            msg: |
              SSH key ~/.ssh/github_{{ item.item.item.key }} exists and is non-empty
              (emptiness was ruled out earlier) but the vault passphrase does not
              unlock it — so it either has a different passphrase or is corrupt.

              To fix, delete the key and re-run this playbook:
                rm ~/.ssh/github_{{ item.item.item.key }} ~/.ssh/github_{{ item.item.item.key }}.pub

              Or update the vault passphrase to match:
                ./vault.bash set github_ssh_passphrase
          when: item.rc is defined and item.rc != 0
          loop: "{{ passphrase_verify.results | default([]) }}"
          loop_control:
            label: "{{ item.item.item.key | default('unknown') }}"

        - name: Generate SSH keys for missing accounts
          ansible.builtin.shell: |
            set -euo pipefail
            ssh-keygen -t ed25519 -C "{{ item.item.value }}@github" \
              -f "/home/{{ user_login }}/.ssh/github_{{ item.item.key }}" \
              -N "{{ github_ssh_passphrase }}" 2>&1
          args:
            executable: /bin/bash
          no_log: true
          when: not item.stat.exists
          loop: "{{ ssh_key_status.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Re-stat SSH keys after generation
          ansible.builtin.stat:
            path: "/home/{{ user_login }}/.ssh/github_{{ item.key }}"
          register: ssh_key_final
          loop: "{{ github_accounts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        # Fail rather than chmod 0600 an empty file and carry on as if the key
        # were real — a zero-byte key would then block regeneration forever.
        - name: Assert every SSH key was generated non-empty
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.size > 0
            fail_msg: |
              SSH key ~/.ssh/github_{{ item.item.key }} is missing or empty after
              the generation step. Do not re-run before deleting it: generation is
              guarded on the file existing, so a zero-byte key is never replaced.

                rm -f ~/.ssh/github_{{ item.item.key }} ~/.ssh/github_{{ item.item.key }}.pub
          loop: "{{ ssh_key_final.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Set proper permissions on SSH keys
          ansible.builtin.file:
            path: "/home/{{ user_login }}/.ssh/github_{{ item.key }}"
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0600"
          loop: "{{ github_accounts | default({}) | dict2items }}"

        - name: Create SSH config entries
          ansible.builtin.blockinfile:
            path: "/home/{{ user_login }}/.ssh/config"
            create: true
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0600"
            marker: "# {mark} ANSIBLE MANAGED: GitHub {{ item.key }}"
            # HostName/Port stay github.com:22 here. 443 routing (when enabled) is
            # applied by the github443 helper's first-wins override block at the top
            # of this file, which matches `github.com-*` and overrides these.
            block: |
              Host github.com-{{ item.key }}
                  HostName github.com
                  Port 22
                  User git
                  IdentityFile ~/.ssh/github_{{ item.key }}
                  IdentitiesOnly yes
                  AddKeysToAgent yes
          loop: "{{ github_accounts | default({}) | dict2items }}"

        - name: Add default Host github.com SSH config entry
          ansible.builtin.blockinfile:
            path: "/home/{{ user_login }}/.ssh/config"
            create: true
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0600"
            marker: "# {mark} ANSIBLE MANAGED: GitHub default"
            # HostName/Port stay github.com:22; the github443 override block at the
            # top of the file reroutes to ssh.github.com:443 when 443 is enabled.
            block: |
              Host github.com
                  HostName github.com
                  Port 22
                  User git
                  IdentityFile ~/.ssh/id
                  IdentitiesOnly yes
                  AddKeysToAgent yes

        - name: Apply GitHub SSH-over-443 host config (BOF override + known_hosts pin)
          # Single source of truth for host 443 routing — the same helpers/github443
          # module the `github-ssh-443` CLI drives. `on` when github_ssh_over_443 is
          # set (writes the first-wins override block at the top of ~/.ssh/config and
          # pins [ssh.github.com]:443 in known_hosts), `off` otherwise (cleanly
          # removes both managed blocks). --no-teardown skips the control-socket close
          # during provisioning. chdir puts the repo root on sys.path for the import.
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - helpers.github443.cli
              - "{{ 'on' if (github_ssh_over_443 | default(false) | bool) else 'off' }}"
              - --ssh-dir
              - "/home/{{ user_login }}/.ssh"
              - --aliases
              - "{{ github_443_extra_aliases | default([]) | join(',') }}"
              - --no-teardown
            chdir: "{{ root_dir }}"
          register: gh443_apply
          changed_when: "'GH443-CHANGED' in gh443_apply.stdout"

        # Audit GitHub-installed keys directly via the API, not via an SSH
        # roundtrip. For each account: switch, fetch installed pubkey list,
        # compute fingerprint of each, and compare with the local pubkey
        # fingerprint. Replaces the older SSH-test-based detection that gave
        # false negatives whenever the local SSH test failed for unrelated
        # reasons (passphrase strip, ssh-agent shadowing, etc).
        - name: Audit local SSH pubkey vs keys installed on GitHub
          ansible.builtin.shell: |
            set -e
            gh auth switch --hostname github.com --user "{{ item.value }}" 2>/dev/null
            local_fp=$(ssh-keygen -lf "/home/{{ user_login }}/.ssh/github_{{ item.key }}.pub" | awk '{print $2}')
            installed_fps=$(gh api user/keys --jq '.[].key' | while IFS= read -r pubkey; do
              printf '%s\n' "$pubkey" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}'
            done)
            if printf '%s\n' "$installed_fps" | grep -qFx "$local_fp"; then
              echo "PRESENT:$local_fp"
            else
              echo "MISSING:$local_fp"
            fi
          args:
            executable: /bin/bash
          register: github_key_audit
          changed_when: false
          loop: "{{ github_accounts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Display SSH key audit results
          ansible.builtin.debug:
            msg: >
              github_{{ item.item.key }} ({{ item.item.value }}): {{ item.stdout }}
          loop: "{{ github_key_audit.results | default([]) }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Upload missing SSH pubkeys via gh ssh-key add
          ansible.builtin.shell: |
            set -e
            gh auth switch --hostname github.com --user "{{ item.item.value }}" 2>/dev/null
            gh ssh-key add "/home/{{ user_login }}/.ssh/github_{{ item.item.key }}.pub" \
              --title "{{ ansible_facts['hostname'] }}-{{ item.item.key }}"
          args:
            executable: /bin/bash
          when: item.stdout is defined and item.stdout.startswith('MISSING:')
          loop: "{{ github_key_audit.results | default([]) }}"
          loop_control:
            label: "{{ item.item.key }}"

        # Final SSH verification. By this point each account has its pubkey
        # confirmed installed on GitHub, so authentication should succeed. If
        # the test fails despite the audit passing, the cause is almost
        # always passphrase-related. The strip step tries the vault
        # passphrase first then an empty passphrase as a fallback so old
        # unencrypted keys keep working.
        - name: Verify SSH access and identity for all accounts
          ansible.builtin.shell: |
            tmp_key=$(mktemp)
            trap 'rm -f "$tmp_key"' EXIT
            cp "/home/{{ user_login }}/.ssh/github_{{ item.key }}" "$tmp_key"
            chmod 600 "$tmp_key"
            if ! ssh-keygen -p -P "$(cat /tmp/.github_ssh_pp)" -N "" -f "$tmp_key" >/dev/null 2>&1; then
              ssh-keygen -p -P "" -N "" -f "$tmp_key" >/dev/null 2>&1
            fi
            # IdentityAgent=none + IdentitiesOnly=yes force ssh to use ONLY the
            # specified key. Without these, ssh also offers every key in the
            # running ssh-agent — GitHub rate-limits after ~5 failed attempts
            # and ssh hangs until the outer timeout fires (rc=124, no output).
            out=$(timeout 15 ssh -F /dev/null -o IdentityAgent=none -o IdentitiesOnly=yes \
              -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
              -i "$tmp_key" -p {{ github_ssh_port }} -T git@{{ github_ssh_hostname }} 2>&1)
            # Port-agnostic fallback: if the primary endpoint did not authenticate
            # (e.g. a network that firewalls port 22), retry over ssh.github.com:443,
            # which serves the SAME host keys and identity. This keeps verification
            # working on restricted networks and removes the chicken-and-egg where
            # the play cannot pass on a port-22-blocked network before 443 is on.
            if ! printf '%s' "$out" | grep -q "successfully authenticated"; then
              alt=$(timeout 15 ssh -F /dev/null -o IdentityAgent=none -o IdentitiesOnly=yes \
                -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
                -i "$tmp_key" -p 443 -T git@ssh.github.com 2>&1)
              if printf '%s' "$alt" | grep -q "successfully authenticated"; then
                out="$alt"
              fi
            fi
            printf '%s\n' "$out"
          args:
            executable: /bin/bash
          timeout: 45
          register: ssh_test
          changed_when: false
          failed_when: ssh_test.rc not in [0, 1, 124, 255]
          loop: "{{ github_accounts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Display SSH access test results
          ansible.builtin.debug:
            msg: >
              github_{{ item.item.key }} (expects {{ item.item.value }}):
              {{ item.stdout | regex_search('Hi [^!]+!') | default('NOT AUTHENTICATED', true) }}
          loop: "{{ ssh_test.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Assert SSH access and identity match for all accounts
          ansible.builtin.assert:
            that:
              - "'successfully authenticated' in item.stdout"
              - ('Hi ' + item.item.value + '!') in item.stdout
            fail_msg: |
              SSH verification FAILED for alias {{ item.item.key }} (expected user {{ item.item.value }}).
              GitHub responded: {{ item.stdout | regex_search('Hi [^!]+!') | default('(no Hi response)', true) }}

              The audit confirmed the local pubkey is installed on GitHub for
              this account, so failure here is most likely passphrase-related.

              Diagnose:
                ssh-keygen -y -P "$(cat /tmp/.github_ssh_pp)" -f ~/.ssh/github_{{ item.item.key }}

              If that fails, the key has a passphrase that differs from the
              one in the vault. Either update the vault passphrase or delete
              and regenerate the key:
                rm ~/.ssh/github_{{ item.item.key }} ~/.ssh/github_{{ item.item.key }}.pub
                # then re-run this playbook
            success_msg: "{{ item.item.key }} -> {{ item.item.value }} OK"
          loop: "{{ ssh_test.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: Restore originally-active GitHub account after SSH key audit
          ansible.builtin.shell: |
            gh auth switch --hostname github.com --user "{{ original_active_account.stdout }}" 2>/dev/null
          changed_when: false
          when: original_active_account.stdout | default('') | length > 0

      always:
        - name: Clean up SSH askpass helper (always runs, even on failure)
          ansible.builtin.file:
            path: "/tmp/.github_ssh_pp"
            state: absent
      when: github_accounts_configured

    # COMMIT SIGNING KEYS, ONE PER ACCOUNT (Plan 00139)
    # play-git-configure-and-tools.yml signs every commit with the machine key. Here each
    # account gets a signing key of its own, ~/.ssh/github_<alias>_signing, which git uses
    # in any repository whose remote is github.com-<alias> (clone-<alias>, remote-<alias>).
    # The machine key stays for every other repository, and goes on the account that has
    # user_email as a verified email: GitHub marks a signed commit Verified only there.
    # helpers/github_signing registers what GitHub lacks, with each account's own token,
    # then proves git picks each key. No passphrase, as for the machine key: agents
    # commit unattended.
    - name: Sign Each GitHub Account's Repositories With That Account's Own Key
      when: github_accounts_configured
      block:
        - name: Generate a Signing Key for Each GitHub Account
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - ed25519
              - -N
              - ""
              - -C
              - "{{ item.value }} git signing"
              - -f
              - "/home/{{ user_login }}/.ssh/github_{{ item.key }}_signing"
            creates: "/home/{{ user_login }}/.ssh/github_{{ item.key }}_signing"
          loop: "{{ github_accounts | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Check for This Machine's Signing Key
          ansible.builtin.stat:
            path: "{{ git_signing_key_path }}"
          register: machine_signing_key

        - name: Assert This Machine's Signing Key Exists
          ansible.builtin.assert:
            that:
              - machine_signing_key.stat.exists
            fail_msg: |
              {{ git_signing_key_path }} does not exist. play-git-configure-and-tools.yml
              generates it; run that play, then this one.

        # Checks every key (0600, no passphrase, .pub matches) and reads every account
        # before it adds anything, so a refusal leaves GitHub as it was.
        - name: Register Every Signing Key With GitHub
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - helpers.github_signing.cli
              - register
              - --title
              - "{{ ansible_facts['hostname'] }}"
              - --ssh-dir
              - "/home/{{ user_login }}/.ssh"
              - --accounts
              - "{{ github_accounts | to_json }}"
              - --machine-key
              - "{{ git_signing_key_path }}"
              - --email
              - "{{ user_email }}"
            chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
          register: signing_registration
          changed_when: "'SIGNING-ADDED' in signing_registration.stdout"

        - name: Display Signing Key Registration
          ansible.builtin.debug:
            msg: "{{ signing_registration.stdout_lines }}"

        - name: Ensure ~/.config/git Exists
          ansible.builtin.file:
            path: "/home/{{ user_login }}/.config/git"
            state: directory
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0755"

        - name: Name Each Account's Signing Key in a File of Its Own
          ansible.builtin.copy:
            dest: "/home/{{ user_login }}/.config/git/github-signing-{{ item.key }}.gitconfig"
            content: |
              # ANSIBLE MANAGED by play-github-cli-multi.yml
              [user]
              	signingkey = /home/{{ user_login }}/.ssh/github_{{ item.key }}_signing
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0644"
          loop: "{{ github_accounts | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        # scp-style remotes need `:*/**`: a `**` not beside a slash matches no `/`.
        - name: Select Each Account's Key by the Repository's Remote
          ansible.builtin.copy:
            dest: "/home/{{ user_login }}/.config/git/github-signing.gitconfig"
            content: |
              # ANSIBLE MANAGED by play-github-cli-multi.yml
              {% for alias in github_accounts %}
              [includeIf "hasconfig:remote.*.url:git@github.com-{{ alias }}:*/**"]
              	path = /home/{{ user_login }}/.config/git/github-signing-{{ alias }}.gitconfig
              [includeIf "hasconfig:remote.*.url:ssh://git@github.com-{{ alias }}/**"]
              	path = /home/{{ user_login }}/.config/git/github-signing-{{ alias }}.gitconfig
              {% endfor %}
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0644"

        # At the end of ~/.gitconfig, after the machine key in [user], so an account's key
        # wins in that account's repositories. The check below fails if anything overrides it.
        - name: Include the Account Key Selection From ~/.gitconfig
          ansible.builtin.blockinfile:
            path: "/home/{{ user_login }}/.gitconfig"
            marker: "# {mark} ANSIBLE MANAGED: GitHub Account Signing Keys"
            insertafter: EOF
            block: |
              [include]
              	path = /home/{{ user_login }}/.config/git/github-signing.gitconfig
            create: false

        - name: Prove Git Picks Each Account's Key and the Machine Key Elsewhere
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - helpers.github_signing.cli
              - check-selection
              - --ssh-dir
              - "/home/{{ user_login }}/.ssh"
              - --accounts
              - "{{ github_accounts | to_json }}"
              - --fallback
              - "{{ git_signing_key_path }}"
            chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
          changed_when: false

    # GIT ACCOUNT HELPER SETUP
    - block:
        - name: Create ~/.local/bin directory
          ansible.builtin.file:
            path: "/home/{{ user_login }}/.local/bin"
            state: directory
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0755"

        - name: Deploy git-account-helper from template
          ansible.builtin.template:
            src: "{{ root_dir }}/files/home/.local/bin/git-account-helper.j2"
            dest: "/home/{{ user_login }}/.local/bin/git-account-helper"
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0755"

        - name: Create ~/.config/git-account-helper directory
          ansible.builtin.file:
            path: "/home/{{ user_login }}/.config/git-account-helper"
            state: directory
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0755"

        - name: Generate accounts.json configuration
          ansible.builtin.copy:
            content: "{{ github_accounts | to_json }}"
            dest: "/home/{{ user_login }}/.config/git-account-helper/accounts.json"
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0644"

        - name: Create cache directory ~/.cache/git-account-helper
          ansible.builtin.file:
            path: "/home/{{ user_login }}/.cache/git-account-helper"
            state: directory
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0755"
      when: github_accounts_configured and github_accounts is defined

    # GITHUB ACCOUNT ALIASES AND HELPERS - always use multi-account paradigm
    - block:
        - name: Create GitHub CLI aliases include file
          ansible.builtin.blockinfile:
            path: "/home/{{ user_login }}/.bashrc-includes/gh-aliases.inc.bash"
            create: true
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0644"
            marker: "# {mark} ANSIBLE MANAGED: GitHub CLI Multi-Account Aliases"
            block: |
              # GitHub CLI Multi-Account Aliases and Functions

              # GitHub SSH-over-443 awareness for the per-account git wrappers.
              # Those wrappers force `ssh -F /dev/null -o HostName=github.com` to
              # isolate to a single key (ignoring ~/.ssh/config), which also
              # bypasses the 443 override block. So they build their sshCommand
              # through this helper, which consults the GITHUB_SSH_443 runtime
              # signal and swaps the endpoint to ssh.github.com:443 when set
              # (host export, /etc/profile.d, or `eval "$(github-ssh-443 env)"`),
              # else github.com:22. Unset → identical to the previous behaviour.
              _gh443_sshcmd() {
                  local key="$1"
                  local host="github.com" port="22"
                  if [ "${GITHUB_SSH_443:-0}" = "1" ]; then
                      host="ssh.github.com"
                      port="443"
                  fi
                  printf 'ssh -F /dev/null -o HostName=%s -p %s -i %s -o IdentitiesOnly=yes -o AddKeysToAgent=yes' "$host" "$port" "$key"
              }

              # Quick status check for all GitHub accounts
              function gh-status() {
                  echo "GitHub CLI Account Status:"
                  echo "=========================="
                  gh auth status
              }

              # Switch to a specific GitHub account
              function gh-switch() {
                  local account="$1"
                  if [[ -z "$account" ]]; then
                      echo "Usage: gh-switch <account>"
                      echo "Available accounts:"
                      {% for alias, username in github_accounts.items() %}
                      echo "  - {{ alias }} ({{ username }})"
                      {% endfor %}
                      return 1
                  fi

                  case "$account" in
                      {% for alias, username in github_accounts.items() %}
                      {{ alias }})
                          echo "Switching to {{ alias }} ({{ username }})..."
                          gh auth switch --hostname github.com --user "{{ username }}"

                          # Optional: Update git config for this account
                          if [[ "$2" == "--update-git" ]]; then
                              gh-update-git-config "{{ alias }}"
                          fi
                          ;;
                      {% endfor %}
                      *)
                          echo "Unknown account: $account"
                          echo "Available: {% for alias in github_accounts.keys() %}{{ alias }}{% if not loop.last %}, {% endif %}{% endfor %}"
                          return 1
                          ;;
                  esac
              }

              # Update git config based on GitHub account
              function gh-update-git-config() {
                  local account="$1"
                  case "$account" in
                      {% for alias, username in github_accounts.items() %}
                      {{ alias }})
                          # The account's public email, else its noreply address. Either
                          # is verified on the account, so a commit it signs is Verified,
                          # and a private address would trip GitHub's email push protection.
                          local email id
                          email=$(gh api user --jq '.email // empty') || return 1
                          if [[ -z "$email" ]]; then
                              id=$(gh api user --jq .id) || return 1
                              email="${id}+{{ username }}@users.noreply.github.com"
                          fi
                          git config user.email "$email"
                          echo "Updated git user.email to: $email"
                          git config user.name "{{ username }}"
                          echo "Updated git user.name to: {{ username }}"
                          ;;
                      {% endfor %}
                  esac
              }

              # Get or set the default GitHub account
              function gh-get-default() {
                  local default_file="$HOME/.config/gh/default-account"
                  if [[ -f "$default_file" ]]; then
                      cat "$default_file"
                  else
                      # If no default set, return the currently active account
                      gh auth status 2>&1 | grep "Active account: true" -B1 | grep "account" | grep -oE "account [^ ]+" | awk '{print $2}'
                  fi
              }

              function gh-set-default() {
                  local account="$1"
                  if [[ -z "$account" ]]; then
                      echo "Usage: gh-set-default <username>"
                      return 1
                  fi
                  mkdir -p "$HOME/.config/gh"
                  echo "$account" > "$HOME/.config/gh/default-account"
                  echo "Default GitHub account set to: $account"
                  # Switch to the new default immediately
                  gh auth switch --hostname github.com --user "$account" 2>/dev/null
              }

              # owner/repo from a github.com URL (https, ssh://, scp-style, with or
              # without a github.com-<alias> host). With a second argument of
              # "bare", a plain owner/repo is accepted too; a remote's own URL is
              # never read that way, since a bare path there is a local directory.
              function _gh_repo_path() {
                  local url="$1" allow_bare="${2:-}" path
                  if [[ "$url" =~ ^(https://([^@/]+@)?github\.com/|ssh://git@github\.com(-[A-Za-z0-9_.-]+)?/|git@github\.com(-[A-Za-z0-9_.-]+)?:)(.+)$ ]]; then
                      path="${BASH_REMATCH[5]}"
                  elif [[ "$allow_bare" == bare ]]; then
                      path="$url"
                  else
                      return 1
                  fi
                  path="${path%/}"
                  path="${path%.git}"
                  [[ "$path" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ ]] || return 1
                  [[ "${path#*/}" != . && "${path#*/}" != .. ]] || return 1
                  printf '%s\n' "$path"
              }

              # A URL fit to print: credentials in an https remote are masked.
              function _gh_redact_url() {
                  if [[ "$1" =~ ^(https?://)[^@/]+@(.*)$ ]]; then
                      printf '%s***@%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
                  else
                      printf '%s\n' "$1"
                  fi
              }

              # Point a remote at the github.com-<alias> SSH host, so ssh and the
              # auto-detecting git() wrapper both use that account from then on.
              # With no repo given it reads the remote's current URL and asks first.
              function _gh_remote_to_alias() {
                  local alias="$1"
                  shift
                  local assume_yes=0 remote="" source="" count=0
                  while (( $# )); do
                      case "$1" in
                          -h|--help)
                              echo "Usage: remote-$alias [-y] [remote] [owner/repo]"
                              echo
                              echo "Point a git remote at the github.com-$alias SSH host."
                              echo "  remote       remote to change (default: origin)"
                              echo "  owner/repo   repository; default: read from the remote's current URL"
                              echo "  -y, --yes    change it without asking"
                              echo
                              echo "Examples:"
                              echo "  remote-$alias                       # convert origin, after confirming"
                              echo "  remote-$alias upstream              # convert the upstream remote"
                              echo "  remote-$alias owner/repo            # set origin to owner/repo"
                              echo "  remote-$alias upstream owner/repo   # set upstream to owner/repo"
                              return 0
                              ;;
                          -y|--yes) assume_yes=1 ;;
                          -*)
                              echo "remote-$alias: unknown option '$1' (see remote-$alias --help)" >&2
                              return 1
                              ;;
                          *)
                              count=$((count + 1))
                              case "$count" in
                                  1) remote="$1" ;;
                                  2) source="$1" ;;
                                  *)
                                      echo "remote-$alias: too many arguments (see remote-$alias --help)" >&2
                                      return 1
                                      ;;
                              esac
                              ;;
                      esac
                      shift
                  done
                  # A lone owner/repo means origin, unless a remote has that name.
                  if (( count == 1 )) && [[ "$remote" == */* ]] \
                      && ! command git remote | grep -qxF -- "$remote"; then
                      source="$remote"
                      remote=""
                  fi
                  remote="${remote:-origin}"

                  local current
                  if ! current="$(command git remote get-url "$remote" 2>&1)"; then
                      echo "remote-$alias: cannot read remote '$remote': $current" >&2
                      return 1
                  fi
                  local repo_path
                  if [[ -n "$source" ]]; then
                      if ! repo_path="$(_gh_repo_path "$source" bare)"; then
                          echo "remote-$alias: '$(_gh_redact_url "$source")' is not an owner/repo or a github.com URL." >&2
                          return 1
                      fi
                  elif ! repo_path="$(_gh_repo_path "$current")"; then
                      echo "remote-$alias: $remote ($(_gh_redact_url "$current")) is not a github.com repository." >&2
                      echo "  Name the repository: remote-$alias $remote owner/repo" >&2
                      return 1
                  fi
                  local target="git@github.com-${alias}:${repo_path}.git"
                  if [[ "$current" == "$target" ]]; then
                      echo "$remote already uses the $alias account: $target" >&2
                      return 0
                  fi

                  echo "  $remote: $(_gh_redact_url "$current")" >&2
                  echo "  ->  $target" >&2
                  if (( ! assume_yes )); then
                      local reply=""
                      if ! read -rp "Change it? [y/N] " reply </dev/tty; then
                          reply=""
                      fi
                      case "$reply" in
                          y|Y|yes|YES) ;;
                          *)
                              echo "Aborted. No changes made (-y skips this prompt)." >&2
                              return 1
                              ;;
                      esac
                  fi
                  command git remote set-url "$remote" "$target"
                  echo "$remote now uses the $alias account." >&2
              }

              # Account-specific aliases
              {% for alias, username in github_accounts.items() %}
              function gh-{{ alias }}() {
                  # Get the default account to restore later
                  local default_account=$(gh-get-default)

                  # First ensure we're switched to the right account for github.com
                  local current_active=$(gh auth status 2>&1 | grep -A1 "account {{ username }}" | grep "Active account" | grep -c "true")
                  if [ "$current_active" -eq 0 ]; then
                      # >&2: keep the gh-{{ alias }} wrapper's stdout pure so
                      # $(gh-{{ alias }} ... --json) captures unpolluted JSON for jq.
                      echo "Switching to {{ username }}..." >&2
                      gh auth switch --hostname github.com --user "{{ username }}" 2>/dev/null || {
                          echo "Error: Account {{ username }} not authenticated. Run:"
                          echo "  gh auth login --hostname github.com --git-protocol ssh"
                          return 1
                      }
                  fi

                  # Run the gh command with all arguments
                  gh "$@"
                  local exit_code=$?

                  # Switch back to default account if different
                  if [[ -n "$default_account" && "$default_account" != "{{ username }}" ]]; then
                      gh auth switch --hostname github.com --user "$default_account" 2>/dev/null
                  fi

                  return $exit_code
              }

              function gh-{{ alias }}-make-default() {
                  gh-set-default "{{ username }}"
                  echo "{{ username }} ({{ alias }}) is now the default GitHub account"
              }

              function clone-{{ alias }}() {
                  # Get the default account to restore later
                  local default_account=$(gh-get-default)

                  # Clone using specific account's SSH key
                  local repo="$1"
                  local repo_path=""

                  # Extract repo path from various formats
                  if [[ "$repo" == https://github.com/* ]]; then
                      repo_path=$(echo "$repo" | sed 's|https://github.com/||' | sed 's|\.git$||')
                  elif [[ "$repo" == git@github.com:* ]]; then
                      repo_path=$(echo "$repo" | sed 's|git@github.com:||' | sed 's|\.git$||')
                  elif [[ ! "$repo" == *:* ]]; then
                      repo_path="$repo"
                      repo_path="${repo_path%.git}"
                  fi

                  # Switch to the right account and clone
                  gh auth switch --hostname github.com --user "{{ username }}" 2>/dev/null
                  gh repo clone "$repo_path" -- --config core.sshCommand="$(_gh443_sshcmd ~/.ssh/github_{{ alias }})"
                  local exit_code=$?

                  # Set the remote to use the specific SSH key
                  if [[ -n "$repo_path" ]]; then
                      local dir_name=$(basename "$repo_path")
                      if [[ -d "$dir_name" ]]; then
                          cd "$dir_name"
                          git remote set-url origin "git@github.com-{{ alias }}:${repo_path}.git"
                          cd - > /dev/null
                      fi
                  fi

                  # Switch back to default account if different
                  if [[ -n "$default_account" && "$default_account" != "{{ username }}" ]]; then
                      gh auth switch --hostname github.com --user "$default_account" 2>/dev/null
                  fi

                  return $exit_code
              }

              function remote-{{ alias }}() {
                  _gh_remote_to_alias {{ alias }} "$@"
              }
              {% endfor %}

              # Test SSH connections for all accounts
              function github-test-ssh() {
                  echo "Testing SSH connections:"
                  {% for alias in github_accounts.keys() %}
                  echo -n "  {{ alias }}: "
                  ssh -T git@github.com-{{ alias }} 2>&1 | grep -o "Hi .*!" || echo "Not connected"
                  {% endfor %}
              }

              # Show current active GitHub account
              function gh-whoami() {
                  gh auth status 2>&1 | grep "Active account: true" -B1 | head -1 | sed 's/.*account //' | sed 's/ (.*//'
              }

              # List all configured GitHub accounts
              function gh-list() {
                  echo "Configured GitHub accounts:"
                  {% for alias, username in github_accounts.items() %}
                  printf "  %-15s : %s\n" "{{ alias }}" "{{ username }}"
                  {% endfor %}
              }

              # Helper to get token for specific account
              {% for alias, username in github_accounts.items() %}
              function gh-token-{{ alias }}() {
                  gh auth switch --hostname github.com --user "{{ username }}" 2>/dev/null
                  gh auth token
              }
              {% endfor %}

              # PhpStorm-specific token generation with required scopes
              {% for alias, username in github_accounts.items() %}
              function gh-{{ alias }}-token-phpstorm() {
                  echo "=================================================="
                  echo "PhpStorm Token for {{ alias }} ({{ username }})"
                  echo "=================================================="
                  echo ""

                  # Preflight check for jq
                  if ! command -v jq &> /dev/null; then
                      echo "ERROR: jq is not installed"
                      echo "This should have been installed by the playbook."
                      echo "Run: sudo dnf install jq"
                      return 1
                  fi

                  # Switch to the account
                  gh auth switch --hostname github.com --user "{{ username }}" 2>/dev/null || {
                      echo "ERROR: Failed to switch to account {{ username }}"
                      echo "Run: gh auth login --hostname github.com --git-protocol ssh"
                      return 1
                  }

                  # Get current token scopes using JSON output for reliable parsing
                  # First check if we can get auth status at all
                  local auth_json
                  auth_json=$(gh auth status 2>&1)

                  if ! echo "$auth_json" | grep -q "Logged in to github.com"; then
                      echo "ERROR: Not authenticated to github.com as {{ username }}"
                      echo ""
                      echo "Current status:"
                      echo "$auth_json"
                      echo ""
                      echo "To authenticate, run:"
                      echo "  gh auth login --hostname github.com --git-protocol ssh"
                      return 1
                  fi

                  # Which required scopes this token lacks: helpers/github_scopes, the one
                  # judge run.bash, gh-account-setup.bash and the play all use, reading
                  # vars/github-required-scopes.yml from the checkout that deployed this.
                  local response missing_scopes
                  if ! response=$(gh api -i user 2>&1); then
                      echo "ERROR: Could not read this account's token scopes: $response"
                      return 1
                  fi
                  if ! missing_scopes=$(printf '%s' "$response" | (cd "{{ root_dir }}" && python3 -m helpers.github_scopes.cli missing)); then
                      echo "ERROR: Could not judge this account's token scopes"
                      return 1
                  fi

                  if [ -n "$missing_scopes" ]; then
                      echo "Missing required scopes: $missing_scopes"
                      echo "Adding them in one authorisation (existing scopes are kept)..."
                      echo ""
                      if ! gh auth refresh --hostname github.com --scopes "$missing_scopes"; then
                          echo ""
                          echo "ERROR: Failed to refresh token"
                          return 1
                      fi
                      echo ""
                      echo "✓ Token refreshed successfully!"
                  else
                      echo "✓ Token already has all required scopes"
                  fi

                  echo ""
                  echo "=================================================="
                  echo "Your PhpStorm Token:"
                  echo "=================================================="
                  gh auth token
                  echo ""
                  echo "To use in PhpStorm:"
                  echo "  1. Settings > Version Control > GitHub"
                  echo "  2. Click '+' to add account"
                  echo "  3. Select 'Log In with Token'"
                  echo "  4. Paste the token above"
                  echo "=================================================="
              }
              {% endfor %}

              # Clone helper that properly configures remotes
              function github-clone() {
                  local account="$1"
                  local repo="$2"

                  if [[ -z "$repo" ]]; then
                      echo "Usage: github-clone <account> <repo>"
                      echo "Available accounts: {% for alias in github_accounts.keys() %}{{ alias }}{% if not loop.last %}, {% endif %}{% endfor %}"
                      return 1
                  fi

                  case "$account" in
                      {% for alias, username in github_accounts.items() %}
                      {{ alias }})
                          clone-{{ alias }} "$repo"
                          ;;
                      {% endfor %}
                      *)
                          echo "Unknown account: $account"
                          return 1
                          ;;
                  esac
              }

              # ==================== GIT ACCOUNT AUTO-DETECTION ====================
              # Smart git wrapper that auto-detects account from repository remote

              declare -gA _GH_ACCOUNT_USERS=(
              {% for alias, username in github_accounts.items() %}
                  [{{ alias }}]="{{ username }}"
              {% endfor %}
              )

              # Run git as one account over BOTH transports. core.sshCommand only
              # covers SSH remotes; an HTTPS remote authenticates through the
              # credential helper, which by default is `gh auth git-credential`
              # and answers with whichever gh account is ACTIVE. The empty helper
              # value resets that list, and the replacement asks gh for this
              # account's token by name, so the active account is never switched.
              # Only `get` is answered: gh owns the token, git must not store it.
              #
              # The sshCommand from _gh443_sshcmd uses -F /dev/null so ssh cannot
              # read ~/.ssh/config: its default "Host github.com" block would
              # offer ~/.ssh/id alongside this key, and GitHub attributes to
              # whichever matches first. -o HostName=github.com is required with
              # it, because the github.com-<alias> host alias used by
              # clone-<alias>/remote-<alias> remotes lives only in that config.
              function _gh_account_git() {
                  local alias="$1"
                  shift
                  local user="${_GH_ACCOUNT_USERS[$alias]-}"
                  if [[ -z "$user" ]]; then
                      echo "ERROR: unknown GitHub account alias: $alias" >&2
                      return 1
                  fi
                  command git \
                      -c "core.sshCommand=$(_gh443_sshcmd ~/.ssh/github_${alias})" \
                      -c credential.https://github.com.helper= \
                      -c "credential.https://github.com.helper=!f() { test \"\$1\" = get || exit 0; tok=\$(gh auth token --hostname github.com --user ${user}) || exit 1; echo username=${user}; echo \"password=\$tok\"; }; f" \
                      "$@"
              }

              function git() {
                  # Detect account from repository.
                  # git-account-helper exits non-zero when no alias matches the current
                  # repo — that's the normal "no routing needed" case, not an error.
                  # Handle it explicitly so this wrapper is safe to call from scripts
                  # running under `set -e`.
                  local detected_alias=""
                  if ! detected_alias=$(git-account-helper detect 2>/dev/null); then
                      detected_alias=""
                  fi

                  # Detection reads a github.com-<alias> remote host, so a plain
                  # https://github.com remote is not detected: use git-<alias>.
                  if [[ -n "$detected_alias" ]]; then
                      _gh_account_git "$detected_alias" "$@"
                  else
                      # No account detected, use standard git
                      command git "$@"
                  fi
              }

              # Account-specific git commands (force specific account, SSH or HTTPS).
              {% for alias in github_accounts.keys() %}
              function git-{{ alias }}() {
                  _gh_account_git {{ alias }} "$@"
              }
              {% endfor %}

              # ==================== GIT BRANCH/CHECKOUT HELPERS ====================
              # git-branch-default     — print the repo's default branch name
              # git-checkout-default   — check out that branch
              # Per-account variants (git-<alias>-branch-default / -checkout-default)
              # route through the per-account git wrapper so the alias's account
              # is used for any remote operation (e.g. the ls-remote probe).
              # The shared implementation lives in _git_branch_default_impl so the
              # detection logic isn't duplicated across N aliases × 2 commands.

              # Resolves the default branch using a cheapest-first cascade:
              #   1. refs/remotes/origin/HEAD if previously cached locally  — no network
              #   2. ls-remote --symref origin HEAD                          — one round-trip
              #   3. init.defaultBranch (or "main")                          — offline fallback
              function _git_branch_default_impl() {
                  local -a gcmd=("$@")
                  local ref

                  if "${gcmd[@]}" symbolic-ref --quiet refs/remotes/origin/HEAD >/dev/null; then
                      ref=$("${gcmd[@]}" symbolic-ref --short refs/remotes/origin/HEAD)
                      echo "${ref#origin/}"
                      return 0
                  fi

                  # stderr suppression here is the probe-then-check pattern: "no
                  # remote" is a valid path handled by the fallback below, not an
                  # error we want to print to the user.
                  ref=$("${gcmd[@]}" ls-remote --symref origin HEAD 2>/dev/null \
                        | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
                  if [[ -n "$ref" ]]; then
                      echo "$ref"
                      return 0
                  fi

                  "${gcmd[@]}" config --get --default main init.defaultBranch
              }

              function git-branch-default() {
                  _git_branch_default_impl git
              }

              function git-checkout-default() {
                  local branch
                  branch=$(git-branch-default) || return $?
                  git checkout "$branch"
              }

              {% for alias in github_accounts.keys() %}
              function git-{{ alias }}-branch-default() {
                  _git_branch_default_impl git-{{ alias }}
              }

              function git-{{ alias }}-checkout-default() {
                  local branch
                  branch=$(git-{{ alias }}-branch-default) || return $?
                  git-{{ alias }} checkout "$branch"
              }
              {% endfor %}

              # Show which account would be used for current repository
              function git-which-account() {
                  local repo_path="${1:-.}"
                  echo "Repository: $repo_path"
                  echo ""

                  local detected_alias
                  detected_alias=$(git-account-helper detect "$repo_path" 2>&1)
                  local exit_code=$?

                  if [[ $exit_code -eq 0 ]]; then
                      local username=$(git-account-helper info "$repo_path" 2>/dev/null | jq -r '.username')
                      local email=$(git-account-helper info "$repo_path" 2>/dev/null | jq -r '.email')
                      local ssh_key=$(git-account-helper info "$repo_path" 2>/dev/null | jq -r '.ssh_key')

                      echo "Detected Account: $detected_alias"
                      echo "GitHub Username:  $username"
                      echo "Email:            $email"
                      echo "SSH Key:          $ssh_key"
                      echo ""
                      echo "Git commands in this repository will use the $detected_alias account automatically."
                  else
                      echo "$detected_alias"
                      echo ""
                      echo "Available accounts:"
                      {% for alias, username in github_accounts.items() %}
                      echo "  git-{{ alias }} - Use {{ alias }} account ({{ username }})"
                      {% endfor %}
                  fi
              }

              # List all configured git accounts
              function git-accounts() {
                  echo "Configured Git Accounts:"
                  echo "========================"
                  {% for alias, username in github_accounts.items() %}
                  echo "  {{ alias }}:"
                  echo "    Username:  {{ username }}"
                  echo "    SSH Key:   ~/.ssh/github_{{ alias }}"
                  echo "    Remote:    git@github.com-{{ alias }}:owner/repo.git"
                  echo ""
                  {% endfor %}
                  echo "Commands:"
                  echo "  git                    - Auto-detect account from repository"
                  {% for alias in github_accounts.keys() %}
                  echo "  git-{{ alias }} <cmd>       - Force {{ alias }} account"
                  {% endfor %}
                  echo "  git-which-account      - Show detected account for current repo"
                  echo "  git-accounts           - Show this help"
              }

              # Helper for setting up a new repository with specific account
              function git-init-with-account() {
                  local account="$1"
                  local repo="$2"

                  if [[ -z "$account" ]] || [[ -z "$repo" ]]; then
                      echo "Usage: git-init-with-account <account> <owner/repo>"
                      echo "Available accounts: {% for alias in github_accounts.keys() %}{{ alias }}{% if not loop.last %}, {% endif %}{% endfor %}"
                      return 1
                  fi

                  case "$account" in
                      {% for alias, username in github_accounts.items() %}
                      {{ alias }})
                          git init
                          git remote add origin "git@github.com-{{ alias }}:${repo}.git"
                          echo "Repository initialized with {{ alias }} account"
                          echo "Remote: git@github.com-{{ alias }}:${repo}.git"
                          ;;
                      {% endfor %}
                      *)
                          echo "Unknown account: $account"
                          echo "Available: {% for alias in github_accounts.keys() %}{{ alias }}{% if not loop.last %}, {% endif %}{% endfor %}"
                          return 1
                          ;;
                  esac
              }

        - name: Display multi-account completion
          ansible.builtin.pause:
            seconds: 0
            prompt: |2

              ========================================================================
              GitHub CLI Multi-Account Setup Complete!
              ========================================================================

              Configured accounts:
              {% for alias, username in github_accounts.items() %}
                - {{ alias }}: {{ username }}
              {% endfor %}

              Commands available after reloading shell:

              GitHub CLI Commands:
                gh-status               - Check all GitHub accounts
                gh-list                 - List configured accounts
                gh-whoami               - Show current active account
                gh-switch <alias>       - Switch to specific account
                github-test-ssh         - Test SSH connections
              {% for alias in github_accounts.keys() %}
                gh-{{ alias }} <command>           - Run gh command as {{ alias }}
                clone-{{ alias }} <repo>           - Clone repo using {{ alias }} account
                remote-{{ alias }} [remote] [repo] - Convert a remote to {{ alias }} (confirms)
                gh-token-{{ alias }}               - Get token for {{ alias }} account
                gh-{{ alias }}-token-phpstorm      - Generate PhpStorm token for {{ alias }}
              {% endfor %}
                gh-update-git-config          - Update git config for current account

              Git Commands (Auto-Detection):
                git <command>           - Auto-detects account from repository remote
                git-which-account       - Show which account will be used
                git-accounts            - List all configured accounts
                git-branch-default      - Print the repo's default branch (origin HEAD)
                git-checkout-default    - Checkout the repo's default branch
              {% for alias in github_accounts.keys() %}
                git-{{ alias }} <command>             - Force {{ alias }} account for git command
                git-{{ alias }}-branch-default        - Print default branch via {{ alias }} account
                git-{{ alias }}-checkout-default      - Checkout default branch via {{ alias }} account
              {% endfor %}
                git-init-with-account   - Initialize repo with specific account

              Examples:
              {% set first_alias = github_accounts.keys() | first %}
              {% set first_username = github_accounts[first_alias] %}

              GitHub CLI:
                clone-{{ first_alias }} {{ first_username }}/repo - Clone with {{ first_alias }} account
                gh-{{ first_alias }} pr list         - List PRs using {{ first_alias }} account
                remote-{{ first_alias }} user/repo   - Set remote for {{ first_alias }} account
                gh-{{ first_alias }}-token-phpstorm  - Generate PhpStorm token for {{ first_alias }}

              Git Auto-Detection:
                git push                - Automatically uses correct account
                git pull                - Automatically uses correct account
                git-which-account       - Shows detected account
                git-{{ first_alias }} push       - Force {{ first_alias }} account

              Restart shell or run: source ~/.bashrc
              ========================================================================
      when: github_accounts_configured and github_accounts is defined

    - name: Ensure bashrc-includes directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.bashrc-includes"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Ensure bashrc sources includes directory
      ansible.builtin.blockinfile:
        path: "/home/{{ user_login }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED: Source bashrc includes"
        block: |-
          # Source all bash includes
          if [ -d ~/.bashrc-includes ]; then
              for f in ~/.bashrc-includes/*.bash; do
                  [ -r "$f" ] && source "$f"
              done
          fi
