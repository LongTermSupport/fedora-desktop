#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Agent team bus v2 host (Plan 00209 DESIGN-v2-C-host.md 3.5.1, as amended by Plan 00246
# INSTALL-PATH.md): installs the v2 programs and units on a bus server host and applies the teams
# the host declares. It uses no v1 name and no v1 file.
#
# It runs against ANY inventory host, not only the desktop it is edited on: hosts is
# teamchat_hosts (default: desktop), the programs are built on the CONTROLLER for the target's
# architecture and copied over, and nothing here reads the login user, the checkout or a home
# directory on the target. A deploy route that manages a remote bus server host runs this file
# with its own inventory group in teamchat_hosts.
#
#   1. Controller: the commands are built from the committed src-go, static, for each distinct
#      architecture among the hosts (tasks/teamchat-build-go-commands.yml). The source digest baked
#      into each names what it is built from: teamchat-admin's is the git tree id of src-go;
#      teamchat's is the ccy image's source digest (files/var/local/claude-yolo/image-source-digest
#      over image-source-paths at HEAD), the one the image's builder stage gives its teamchat, so
#      one teamchat source prints one digest on the host and in the image. The play refuses a
#      src-go that differs from the commit, so a digest always names the bytes built.
#   2. Target: the owner group, the teamchat-ctl account and the state roots; the programs copied
#      to their digest-named homes and checked against the controller's sha256; then
#      /usr/local/sbin/teamchat-admin, the kit's current link and /usr/local/bin/teamchat swapped.
#   3. The pinned Tuwunel for the target's architecture (files/usr/local/share/teamchat/tuwunel.pin,
#      tracked by the update-versions skill), and the server pin file teamchat-admin reads.
#   4. Every unit, the two resolver files and the tmpfiles entry, as the teamchat-admin just installed
#      prints them (`units list`, `units print`): the text is Go's, the play holds none. The
#      tmpfiles entry's directories are made, then one daemon-reload.
#   5. Per team, from teamchat_teams: `team approve` for the teams teamchat_approve_teams names,
#      then `lxc apply --phase absent` (the LXC members that leave are parked while every team
#      still runs), `team remove` for each absent entry, `team apply` for each present one, and
#      `lxc apply --phase present` (the declared LXC members placed and joined). approve and
#      apply get each team's own teamchat_lxc_members entries; both LXC phases get the whole
#      declaration (DESIGN-v2-C-host.md 3.5.1 steps 10 to 13, 3.9.2).
#   6. The health and backup timers are enabled exactly while a team is declared present, and the
#      two units that start the LXC seats again after a boot exactly while an LXC member is, so a
#      host with no team starts nothing.
#
# Tags: each part runs alone with --tags. The input and host checks, the owner group, the
# control account and the directories are tagged always, so a tagged run is still checked.
#   admin    build and install teamchat-admin and its link (steps 1 and 2)
#   member   build and install the member program, its kit and its link (steps 1 and 2)
#   tuwunel  the pinned Tuwunel and the server pin (step 3)
#   units    the units, the resolver files and the tmpfiles entry (step 4)
#   teams    approve, remove and apply the teams, both LXC phases, and the timers (steps 5 and
#            6); with teamchat_only_teams it applies one team. A run without units (or member) does
#            not re-apply every team for a base unit change (or a new member program, which the TLS
#            terminators run); run units and member with it after such a change.
#
# Inputs (inventory variables of the target; the names are paths.HostVar*):
#   teamchat_owner_group     required: the group that may read the status records. Made if absent.
#   teamchat_teams           optional list, DESIGN-v2-C-host.md 3.8; teamchat_only_teams scopes
#                            step 5 to the teams it names, each of which must be declared.
#   teamchat_approve_teams   optional list of team ids whose declared security fields the OPERATOR
#                            approves in this run. This is the owner's gate (DC18) done by IaC: a
#                            listed team is approved exactly as declared, so the review of the
#                            inventory change is the approval, its LXC members included. Unlisted
#                            new or changed teams are refused by `team apply` and `lxc apply`.
#                            Each listed team must be present and, in a scoped run, in
#                            teamchat_only_teams; the play refuses any other.
#   teamchat_lxc_members     optional list, DESIGN-v2-C-host.md 3.8 and 3.9: one seat each, of a
#                            team declared present; the play checks the shape, teamchat-admin the
#                            rest. A team with a present member is served on the LXC bridge, and
#                            its LXC seats are given its bridge address (https), so its url is
#                            free: a name or any address, for its seats on other machines.
#   teamchat_site            optional: the machine's handle site, handed to `lxc apply` with the
#                            members; an entry's own site wins.
#   teamchat_carry_max_archive_bytes
#                            optional: the carry archive's cap in bytes, which team export and
#                            team import read (SPEC-carry CN5). Default 1073741824 (1 GiB).
#   teamchat_lxc_seat_restore_starts_containers
#                            optional boolean, default true (Plan 00266 C.2). The boot unit
#                            (teamchat-lxc-boot.service) starts the LXC containers that ran at the
#                            last shutdown, then `lxc reconcile` starts their recorded seats again.
#                            false leaves the container start out of the unit, which then runs
#                            only reconcile: for a host whose own IaC starts its containers, and
#                            calls reconcile itself once they run.
#   teamchat_memory_high, teamchat_cache_capacity_modifier
#                            the server pin's values (defaults 512M and 0.5, NOT yet measured on
#                            a real host: DESIGN-v2-C-host.md H-C1).
#   teamchat_restore_drill   optional boolean, default false: this host may run
#                            `teamchat-admin restore-drill` (issue #324). Only where it is true is
#                            teamchat_restore_drill_port, then required, labelled for the team
#                            units under SELinux. The port is never opened in the firewall: the
#                            drill's scratch team listens on loopback only. Leave it false on a
#                            host that serves a real team, since the drill refuses beside one.
# Not built, refused by name when set: teamchat_address (the teamchat0 bus address; the LXC
# path does not need it). The Element team list is its own play's.
#
# Firewalld must already be running on the target: this play does not start a firewall on a
# remote host, because the first start of one can cut off the ssh that runs the play.
- hosts: "{{ teamchat_hosts | default('desktop') }}"
  name: Agent team bus v2 host (teamchat)
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
    # Where things live on the target; internal/teamchat/paths owns them and a Go test holds these equal.
    tc_lib_dir: /usr/local/lib/teamchat
    tc_server_dir: /usr/local/lib/teamchat/server
    tc_kit_root: /usr/local/lib/teamchat/kit
    tc_share_dir: /usr/local/share/teamchat
    tc_resolver_dir: /usr/local/share/teamchat/resolve
    tc_etc_dir: /etc/teamchat
    tc_admin_state_root: /var/lib/teamchat-admin
    tc_ctl_state_root: /var/lib/teamchat-ctl
    tc_status_root: /var/lib/teamchat-status
    tc_admin_link: /usr/local/sbin/teamchat-admin
    tc_member_link: /usr/local/bin/teamchat
    tc_tmpfiles_file: /etc/tmpfiles.d/teamchat.conf
    tc_ctl_user: teamchat-ctl
    tc_carry_max_archive_bytes: "{{ teamchat_carry_max_archive_bytes | default(1073741824) }}"
    # The pinned Tuwunel: a pin file in `var: value` lines, which is YAML (a mapping with comments).
    tc_pin: "{{ lookup('ansible.builtin.file', root_dir ~ '/files/usr/local/share/teamchat/tuwunel.pin') | from_yaml }}"
    # The SELinux module for an enforcing host, read on the controller like the pin.
    tc_selinux_cil: "{{ lookup('ansible.builtin.file', root_dir ~ '/files/usr/local/share/teamchat/teamchat.cil') }}"
    tc_arch: "{{ ansible_facts['architecture'] }}"
    tc_version: "{{ tc_pin.tuwunel_version | regex_replace('^v', '') }}"
    tc_teams: "{{ teamchat_teams | default([]) }}"
    tc_present: "{{ tc_teams | rejectattr('state', 'defined') | list + tc_teams | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
    tc_absent: "{{ tc_teams | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
    tc_scoped_present: "{{ tc_present if teamchat_only_teams is not defined else tc_present | selectattr('team', 'in', teamchat_only_teams) | list }}"
    tc_scoped_absent: "{{ tc_absent if teamchat_only_teams is not defined else tc_absent | selectattr('team', 'in', teamchat_only_teams) | list }}"
    tc_lxc: "{{ teamchat_lxc_members | default([]) }}"
    tc_lxc_present_members: "{{ tc_lxc | rejectattr('state', 'defined') | list + tc_lxc | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
    # Whether the boot unit starts the containers that ran at the last shutdown (Plan 00266 C.2).
    tc_lxc_starts_containers: "{{ teamchat_lxc_seat_restore_starts_containers | default(true) }}"
    # The teams each LXC phase acts on, passed as --only-teams. The absent phase takes the present
    # teams and the absent ones in the run's scope: every seat an absent team's LXC record holds
    # is parked and removed before `team remove` stops its homeserver.
    # It is spelled from tc_present, never from tc_scoped_present: the units step's
    # set_fact replaces that name with every present team after a base unit change, a fact
    # outranks this play variable when it is templated, and the absent phase would then park and
    # remove the leaving seats of teams this run was not scoped to. A base unit change re-applies
    # a team for its unit text; it changes no declaration, so it widens no removal.
    # The present phase follows tc_scoped_present, widened like `team apply`.
    tc_lxc_absent_teams: "{{ ((tc_present if teamchat_only_teams is not defined else tc_present | selectattr('team', 'in', teamchat_only_teams) | list) + tc_scoped_absent) | map(attribute='team') | list }}"
    tc_lxc_present_teams: "{{ tc_scoped_present | map(attribute='team') | list }}"
    # A present-phase line whose guest check could not reach its team (lxc.WhyReach). A guest is
    # given the team's LXC bridge address, so a running guest that cannot reach it is a fault, never offline.
    tc_reach_re: "\toffline: guest check reach$"
    # A held-back line (SKIPPED or DEFERRED), shown in a task of its own (C 3.9.3).
    tc_held_re: "^(SKIPPED|DEFERRED)\t"
    # `lxc apply`'s stdin: the declaration in host_vars' own keys (declare.Decode).
    tc_lxc_declaration: "{{ ({'teamchat_teams': tc_teams, 'teamchat_lxc_members': tc_lxc} | combine({'teamchat_site': teamchat_site} if teamchat_site is defined else {})) | to_json }}"
    # Matches the CHANGED<TAB><what> marker lines teamchat-admin prints.
    tc_changed_re: "^CHANGED\t"
  vars_files:
    - "{{ root_dir }}/vars/teamchat-arch.yml"
    - "{{ root_dir }}/vars/golang.yml"
  tasks:
    # Every input is judged before anything changes.
    - name: Check the Play's Inputs
      ansible.builtin.assert:
        that:
          - tc_arch in teamchat_arch
          - teamchat_owner_group is defined
          - teamchat_owner_group is match('^[a-z_][a-z0-9_-]{0,31}$')
          - tc_carry_max_archive_bytes | string is match('^[1-9][0-9]{0,18}$')
          - tc_carry_max_archive_bytes | int <= 9223372036854775807
          - tc_pin.tuwunel_version is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
          - tc_pin['tuwunel_sha256_' ~ tc_arch] is match('^[0-9a-f]{64}$')
          - tc_teams is sequence and tc_teams is not string
          - tc_teams | reject('mapping') | list | length == 0
          - tc_teams | rejectattr('team', 'defined') | list | length == 0
          - tc_teams | map(attribute='team') | unique | list | length == tc_teams | length
          - teamchat_only_teams is not defined or (teamchat_only_teams is sequence and teamchat_only_teams is not string)
          - teamchat_approve_teams is not defined or (teamchat_approve_teams is sequence and teamchat_approve_teams is not string)
          - teamchat_address | default('') == ''
          - teamchat_lxc_seat_restore_starts_containers | default(true) is boolean
          # The LXC members: their shape and their team here, every other rule by the Go reader.
          # The conditions run in order, so the later ones see only mappings with every key.
          - tc_lxc is sequence and tc_lxc is not string
          - tc_lxc | reject('mapping') | list | length == 0
          - tc_lxc | rejectattr('team', 'defined') | list | length == 0
          - tc_lxc | rejectattr('container', 'defined') | list | length == 0
          - tc_lxc | rejectattr('user', 'defined') | list | length == 0
          - tc_lxc | rejectattr('checkout', 'defined') | list | length == 0
          - tc_lxc | rejectattr('seat', 'defined') | list | length == 0
          - tc_lxc | map(attribute='seat') | reject('integer') | list | length == 0
          - tc_lxc | selectattr('state', 'defined') | map(attribute='state') | difference(['present', 'absent']) | length == 0
          - tc_lxc | map(attribute='team') | difference(tc_present | map(attribute='team') | list) | length == 0
          - tc_lxc | map(attribute='team') | zip(tc_lxc | map(attribute='container'), tc_lxc | map(attribute='checkout'), tc_lxc | map(attribute='seat')) | map('join', '|') | unique | list | length == tc_lxc | length
          - teamchat_restore_drill | default(false) is boolean
          - >-
            not (teamchat_restore_drill | default(false)) or (teamchat_restore_drill_port is defined
            and teamchat_restore_drill_port is integer and teamchat_restore_drill_port >= 1024
            and teamchat_restore_drill_port <= 65535
            and teamchat_restore_drill_port not in (tc_teams | selectattr('port', 'defined') | map(attribute='port') | list))
        fail_msg: >-
          play-teamchat.yml refused its inputs. The target's architecture ({{ tc_arch }}) needs a row
          in vars/teamchat-arch.yml and a tuwunel_sha256_{{ tc_arch }} line in the Tuwunel pin;
          teamchat_owner_group must be a group name; teamchat_carry_max_archive_bytes must be a
          positive whole number of bytes that fits a signed 64-bit integer; teamchat_teams must be a list of mappings with
          a unique team each; teamchat_only_teams and teamchat_approve_teams must be lists;
          teamchat_lxc_members must be a list of mappings, each with a team declared present, a
          container, a user, a checkout and a whole-number seat, a state of present or absent if it
          has one, and no two with the same team, container, checkout and seat;
          teamchat_address (the teamchat0 bus address) is not built in this play yet and must be
          unset or empty: the LXC path does not need it, its seats being given the bridge address;
          teamchat_lxc_seat_restore_starts_containers must be true or false, unquoted.
          teamchat_restore_drill must be true or false, and when true teamchat_restore_drill_port
          must be an integer port from 1024 to 65535 that no declared team uses.
        quiet: true
      tags: [always]

    # Both lists pick teams by name, so a name that matches nothing would be dropped without a
    # word (filter-list-unchecked, CLAUDE/QA.md): a misspelt scope applies nothing, and a team
    # approved outside the scope is never approved. Each is refused here, by name.
    - name: Refuse a Scope or an Approval Naming a Team This Run Does Not Apply
      ansible.builtin.assert:
        that:
          - tc_unknown_scoped | length == 0
          - tc_unapplied_approvals | length == 0
        fail_msg: >-
          play-teamchat.yml refused its team lists.
          {% if tc_unknown_scoped %}teamchat_only_teams names {{ tc_unknown_scoped | join(', ') }},
          which teamchat_teams does not declare. {% endif %}
          {% if tc_unapplied_approvals %}teamchat_approve_teams names
          {{ tc_unapplied_approvals | join(', ') }}, which this run does not apply: each approved
          team must be declared present{{ ' and named in teamchat_only_teams' if teamchat_only_teams is defined else '' }}. {% endif %}
          Correct the names, or widen teamchat_only_teams to the teams to approve.
        quiet: true
      vars:
        tc_unknown_scoped: "{{ teamchat_only_teams | default([]) | difference(tc_teams | map(attribute='team') | list) }}"
        tc_unapplied_approvals: "{{ teamchat_approve_teams | default([]) | difference(tc_scoped_present | map(attribute='team') | list) }}"
      tags: [always]

    # The programs are built on the controller (step 1), which this play does not manage: it may
    # be a desktop whose play-golang.yml installed Go, or a machine of another deploy route. So it
    # does not install Go there; a controller without Go, or with an older one, stops the play
    # here, before any change.
    - name: Read the Controller's Go Version
      ansible.builtin.command:
        argv: [go, env, GOVERSION]
      environment:
        GOTOOLCHAIN: local
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      check_mode: false
      register: tc_controller_go
      failed_when: false # FAIL-FAST-OK: the registered result is checked by the next task, which fails with the reason
      tags: [admin, member]

    - name: Refuse a Controller Without the Go the Build Needs
      ansible.builtin.assert:
        that:
          - tc_controller_go.rc | default(1) == 0
          - (tc_controller_go.stdout | default('') | trim | regex_replace('^go', '')) is version(golang_min_version, '>=')
        fail_msg: >-
          The controller (the machine running this play) builds teamchat and teamchat-admin from
          src-go, and needs Go {{ golang_min_version }} or newer on its PATH (vars/golang.yml). It
          has: {{ (tc_controller_go.stdout | default('') | trim) or ('no usable go: ' ~ (tc_controller_go.msg | default(tc_controller_go.stderr | default('')) | trim)) }}.
          On a Fedora desktop, run playbooks/imports/play-golang.yml; elsewhere install Go by
          that machine's own configuration, then run this play again.
        quiet: true
      run_once: true
      tags: [admin, member]

    # The play neither starts firewalld (the host's own configuration owns it) nor assumes it runs:
    # a missing firewall-cmd or a state other than "running" stops the play here, before any change.
    - name: Check That Firewalld Is Already Running
      ansible.builtin.command:
        argv: [firewall-cmd, --state]
      changed_when: false
      register: tc_firewalld
      failed_when: false # FAIL-FAST-OK: the registered result is checked by the next task, which fails with the reason
      tags: [always]

    - name: Refuse a Host Whose Firewalld Is Not Running
      ansible.builtin.assert:
        that:
          - tc_firewalld.rc | default(1) == 0
          - tc_firewalld.stdout | default('') | trim == 'running'
        fail_msg: >-
          firewalld is not running on this host (firewall-cmd --state gave
          '{{ tc_firewalld.stdout | default('') | trim }}', exit {{ tc_firewalld.rc | default('none') }}).
          This play does not install or start a firewall on a remote host, because the first start of
          one can cut off the ssh that runs the play. Start firewalld, with the access the host needs,
          from the host's own configuration, then run this play again.
        quiet: true
      tags: [always]

    - name: Install the Packages
      ansible.builtin.package:
        name:
          - zstd # unpacks the pinned Tuwunel release asset
      tags: [tuwunel]

    # The owner group, the control account and the directories are what every part needs first.
    - name: Make the Owner Group
      ansible.builtin.group:
        name: "{{ teamchat_owner_group }}"
        state: present
      tags: [always]

    - name: Make the Control Account
      ansible.builtin.user:
        name: "{{ tc_ctl_user }}"
        system: true
        create_home: false
        home: "{{ tc_ctl_state_root }}"
        shell: /usr/sbin/nologin
      tags: [always]

    - name: Make the Directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ tc_lib_dir }}", mode: "0755"}
        - {path: "{{ tc_server_dir }}", mode: "0755"}
        - {path: "{{ tc_kit_root }}", mode: "0755"}
        - {path: "{{ tc_share_dir }}", mode: "0755"}
        # The homeserver's two resolver files: its unit binds this directory over /run/systemd/resolve.
        - {path: "{{ tc_resolver_dir }}", mode: "0755"}
        - {path: "{{ tc_etc_dir }}", mode: "0755"}
        - {path: "{{ tc_admin_state_root }}", mode: "0700"}
        - {path: "{{ tc_ctl_state_root }}", mode: "0700", owner: "{{ tc_ctl_user }}", group: "{{ tc_ctl_user }}"}
        - {path: "{{ tc_status_root }}", mode: "0750", group: "{{ teamchat_owner_group }}"}
      tags: [always]

    - name: Name the Owner Group
      ansible.builtin.copy:
        content: "{{ teamchat_owner_group }}\n"
        dest: "{{ tc_etc_dir }}/owner-group"
        owner: root
        group: root
        mode: "0644"
      tags: [always]

    # team export and team import refuse to run (78) without this file; there is no built-in cap.
    - name: Write the Carry Archive Cap
      ansible.builtin.copy:
        content: "{{ tc_carry_max_archive_bytes }}\n"
        dest: "{{ tc_etc_dir }}/carry-max-archive-bytes"
        owner: root
        group: root
        mode: "0644"
      tags: [always]

    # Build on the controller and copy over; the controller's directory is removed however the
    # block ends. The block has no tag of its own, because a block's tag reaches every task in it:
    # each task says whether the admin program, the member program or both need it.
    - name: Build the Programs and Install Them
      block:
        - name: Make the Controller's Build Directory
          ansible.builtin.tempfile:
            state: directory
            prefix: teamchat-build-
          delegate_to: localhost
          become: false
          run_once: true
          register: tc_build_dir
          changed_when: false # scratch on the controller; the copies below report the host change
          tags: [admin, member]

        - name: Read the Source Tree Id of src-go
          ansible.builtin.command:
            argv: [git, -C, "{{ root_dir }}", rev-parse, "HEAD:src-go"]
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          register: tc_tree
          tags: [admin, member]

        # The member program's digest is the ccy image's: the one script the image's builder stage
        # runs too, over the same image-source-paths, so the host and the image print one digest
        # for one teamchat source, whatever else src-go holds (Plan 00265 R57).
        - name: Read the Image-Source Digest of the Member Program
          ansible.builtin.command:
            argv:
              - bash
              - "{{ root_dir }}/files/var/local/claude-yolo/image-source-digest"
              - "{{ root_dir }}"
              - HEAD
              - "{{ root_dir }}/files/var/local/claude-yolo/image-source-paths"
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          register: tc_member_digest
          tags: [admin, member]

        - name: Read What Differs From the Commit in src-go
          ansible.builtin.command:
            argv: [git, -C, "{{ root_dir }}", status, --porcelain, --, src-go]
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          register: tc_dirty
          tags: [admin, member]

        - name: Refuse a src-go That Differs From Its Commit
          ansible.builtin.assert:
            that:
              - tc_dirty.stdout == ''
              - tc_tree.stdout is match('^[0-9a-f]{40,64}$')
              - tc_member_digest.stdout is match('^[0-9a-f]{40,64}$')
            fail_msg: >-
              src-go has changes that are not committed (or a digest cannot be read), so a
              source digest would not name the bytes built. Commit them, or build from a clean checkout.
            quiet: true
          run_once: true
          tags: [admin, member]

        # Imported, not included: an import's tag reaches the tasks it reads, an include's does not.
        - name: Build the Admin Program for the Targets' Architectures
          ansible.builtin.import_tasks: "{{ root_dir }}/tasks/teamchat-build-go-commands.yml"
          vars:
            go_cross_commands: [teamchat-admin]
            go_cross_goarches: "{{ ansible_play_hosts | map('extract', hostvars, ['ansible_facts', 'architecture']) | map('extract', teamchat_arch, 'goarch') | unique | list }}"
            go_cross_dir: "{{ tc_build_dir.path }}"
            go_cross_ldflags: "-X main.SourceDigest={{ tc_tree.stdout }}"
          tags: [admin, member]

        - name: Build the Member Program for the Targets' Architectures
          ansible.builtin.import_tasks: "{{ root_dir }}/tasks/teamchat-build-go-commands.yml"
          vars:
            go_cross_commands: [teamchat]
            go_cross_goarches: "{{ ansible_play_hosts | map('extract', hostvars, ['ansible_facts', 'architecture']) | map('extract', teamchat_arch, 'goarch') | unique | list }}"
            go_cross_dir: "{{ tc_build_dir.path }}"
            go_cross_ldflags: "-X main.SourceDigest={{ tc_member_digest.stdout }}"
          tags: [admin, member]

        - name: Hash This Host's Builds on the Controller
          ansible.builtin.stat:
            path: "{{ tc_build_dir.path }}/{{ teamchat_arch[tc_arch].goarch }}/{{ item }}"
            checksum_algorithm: sha256
          loop: [teamchat-admin, teamchat]
          delegate_to: localhost
          become: false
          register: tc_built
          tags: [admin, member]

        - name: Copy the Admin Program to Its Digest-Named Home
          ansible.builtin.copy:
            src: "{{ tc_build_dir.path }}/{{ teamchat_arch[tc_arch].goarch }}/teamchat-admin"
            dest: "{{ tc_lib_dir }}/teamchat-admin-{{ tc_tree.stdout }}"
            owner: root
            group: root
            mode: "0755"
          tags: [admin]

        - name: Read the Copied Admin Program
          ansible.builtin.stat:
            path: "{{ tc_lib_dir }}/teamchat-admin-{{ tc_tree.stdout }}"
            checksum_algorithm: sha256
          register: tc_copied_admin
          tags: [admin]

        - name: Check the Admin Program Against the Controller's Hash
          ansible.builtin.assert:
            that:
              - tc_copied_admin.stat.checksum == tc_built.results[0].stat.checksum
            fail_msg: The admin program on the target is not the one the controller built; nothing is linked to it.
            quiet: true
          tags: [admin]

        - name: Copy the Member Program Beside the Kits
          ansible.builtin.copy:
            src: "{{ tc_build_dir.path }}/{{ teamchat_arch[tc_arch].goarch }}/teamchat"
            dest: "{{ tc_lib_dir }}/teamchat-member-{{ tc_member_digest.stdout }}"
            owner: root
            group: root
            mode: "0755"
          tags: [member]

        - name: Read the Copied Member Program
          ansible.builtin.stat:
            path: "{{ tc_lib_dir }}/teamchat-member-{{ tc_member_digest.stdout }}"
            checksum_algorithm: sha256
          register: tc_copied_member
          tags: [member]

        - name: Check the Member Program Against the Controller's Hash
          ansible.builtin.assert:
            that:
              - tc_copied_member.stat.checksum == tc_built.results[1].stat.checksum
            fail_msg: The member program on the target is not the one the controller built; no kit is assembled from it.
            quiet: true
          tags: [member]

        # The kit is placed whole by its own program (binary, plugin, hooks, skill and
        # settings) at the directory named for the build, so a host `run --claude` finds the
        # plugin and the settings. The program assembles it in a sibling directory and renames
        # it into place, leaves a whole kit alone and replaces anything else, and clears a
        # leftover sibling first; so it runs every time and its stdout says whether it assembled.
        - name: Assemble the Member Kit
          ansible.builtin.command:
            argv:
              - "{{ tc_lib_dir }}/teamchat-member-{{ tc_member_digest.stdout }}"
              - kit
              - assemble
              - --into
              - "{{ tc_kit_root }}/{{ tc_member_digest.stdout }}"
          register: tc_kit_assembled
          changed_when: tc_kit_assembled.stdout.startswith('assembled ')
          tags: [member]

        - name: Read Every Part of the Kit
          ansible.builtin.stat:
            path: "{{ tc_kit_root }}/{{ tc_member_digest.stdout }}/{{ item.part }}"
          loop:
            - {part: bin, kind: dir}
            - {part: bin/teamchat, kind: file}
            - {part: settings.json, kind: file}
            - {part: plugin, kind: dir}
            - {part: plugin/teamchat, kind: dir}
            - {part: plugin/teamchat/.claude-plugin, kind: dir}
            - {part: plugin/teamchat/.claude-plugin/plugin.json, kind: file}
            - {part: plugin/teamchat/hooks, kind: dir}
            - {part: plugin/teamchat/hooks/hooks.json, kind: file}
            - {part: plugin/teamchat/skills, kind: dir}
            - {part: plugin/teamchat/skills/teamchat, kind: dir}
            - {part: plugin/teamchat/skills/teamchat/SKILL.md, kind: file}
            - {part: plugin/teamchat/skills/coordinator, kind: dir}
            - {part: plugin/teamchat/skills/coordinator/SKILL.md, kind: file}
          loop_control:
            label: "{{ item.part }}"
          register: tc_kit_parts
          tags: [member]

        - name: Check the Kit Is Whole
          ansible.builtin.assert:
            that:
              - tc_kit_parts.results | rejectattr('stat.exists') | list | length == 0
              - tc_kit_parts.results | selectattr('item.kind', 'eq', 'dir') | rejectattr('stat.isdir') | list | length == 0
              - tc_kit_parts.results | selectattr('item.kind', 'eq', 'file') | rejectattr('stat.isreg') | list | length == 0
            fail_msg: >-
              The kit at {{ tc_kit_root }}/{{ tc_member_digest.stdout }} is not whole: a part is missing or of the wrong kind
              (missing: {{ tc_kit_parts.results | rejectattr('stat.exists') | map(attribute='item.part') | list }}),
              so the current link is not moved to it. Run the play again: the assembly replaces a kit that is not whole.
            quiet: true
          tags: [member]

        - name: Read the Kit's Member Program
          ansible.builtin.stat:
            path: "{{ tc_kit_root }}/{{ tc_member_digest.stdout }}/bin/teamchat"
            checksum_algorithm: sha256
          register: tc_kit_member
          tags: [member]

        - name: Check the Kit's Member Program Against the Controller's Hash
          ansible.builtin.assert:
            that:
              - tc_kit_member.stat.checksum == tc_built.results[1].stat.checksum
            fail_msg: The kit's member program is not the one the controller built; nothing is linked to it.
            quiet: true
          tags: [member]
      always:
        - name: Remove the Controller's Build Directory
          ansible.builtin.file:
            path: "{{ tc_build_dir.path }}"
            state: absent
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          when: tc_build_dir is defined and tc_build_dir.path is defined
          tags: [admin, member]

    - name: Link the Admin Program
      ansible.builtin.file:
        src: "{{ tc_lib_dir }}/teamchat-admin-{{ tc_tree.stdout }}"
        dest: "{{ tc_admin_link }}"
        state: link
        force: true
      tags: [admin]

    # A changed link is a new member program, which every team's TLS terminator runs; the teams
    # step below widens to every present team for it, as for a changed base unit.
    - name: Point the Kit's Current Link at This Build
      ansible.builtin.file:
        src: "{{ tc_member_digest.stdout }}"
        dest: "{{ tc_kit_root }}/current"
        state: link
        force: true
      register: tc_kit_current
      tags: [member]

    - name: Link the Member Program
      ansible.builtin.file:
        src: "{{ tc_kit_root }}/current/bin/teamchat"
        dest: "{{ tc_member_link }}"
        state: link
        force: true
      tags: [member]

    # The pinned Tuwunel. The asset's hash is the pin; the record says which pin the installed
    # binary came from, so an unchanged pin downloads nothing. The record alone is not enough: a
    # binary deleted while its record stays is installed again (install-guard-trusts-record).
    - name: Read the Tuwunel Install Record
      ansible.builtin.stat:
        path: "{{ tc_share_dir }}/tuwunel-{{ tc_version }}-asset.sha256"
      register: tc_record
      tags: [tuwunel]

    - name: Read the Installed Tuwunel Binary
      ansible.builtin.stat:
        path: "{{ tc_server_dir }}/tuwunel-{{ tc_version }}"
      register: tc_binary
      tags: [tuwunel]

    - name: Install the Pinned Tuwunel
      tags: [tuwunel]
      when: >-
        not tc_binary.stat.exists or not tc_binary.stat.executable
        or not tc_record.stat.exists
        or tc_record.stat.checksum != ((tc_pin['tuwunel_sha256_' ~ tc_arch] ~ '\n') | hash('sha1'))
      block:
        - name: Make a Root-Only Directory for the Download
          ansible.builtin.tempfile:
            state: directory
            prefix: teamchat-tuwunel-
          register: tc_download
          changed_when: false # scratch; the install below reports the host change

        - name: Download the Pinned Tuwunel Release Asset
          ansible.builtin.get_url:
            url: "https://github.com/matrix-construct/tuwunel/releases/download/{{ tc_pin.tuwunel_version }}/{{ tc_pin.tuwunel_version }}-release-all-{{ teamchat_arch[tc_arch].tuwunel_asset }}-linux-gnu-tuwunel.zst"
            dest: "{{ tc_download.path }}/tuwunel.zst"
            checksum: "sha256:{{ tc_pin['tuwunel_sha256_' ~ tc_arch] }}"
            mode: "0600"
            timeout: 600
          changed_when: false

        # Unpacks into the scratch directory only; the install below reports the host change.
        - name: Unpack the Tuwunel Release Asset
          ansible.builtin.command:
            argv: [zstd, -q, -d, -f, -o, "{{ tc_download.path }}/tuwunel", "{{ tc_download.path }}/tuwunel.zst"]
          changed_when: false

        - name: Install the Tuwunel Binary
          ansible.builtin.copy:
            src: "{{ tc_download.path }}/tuwunel"
            remote_src: true
            dest: "{{ tc_server_dir }}/tuwunel-{{ tc_version }}"
            owner: root
            group: root
            mode: "0755"

        - name: Record Which Pin the Binary Came From
          ansible.builtin.copy:
            content: "{{ tc_pin['tuwunel_sha256_' ~ tc_arch] }}\n"
            dest: "{{ tc_share_dir }}/tuwunel-{{ tc_version }}-asset.sha256"
            owner: root
            group: root
            mode: "0644"
      always:
        - name: Remove the Download Directory
          ansible.builtin.file:
            path: "{{ tc_download.path }}"
            state: absent
          when: tc_download is defined and tc_download.path is defined
          changed_when: false

    - name: Write the Server Pin
      ansible.builtin.copy:
        content: "{{ {'v': 1, 'version': tc_version, 'memory_high': teamchat_memory_high | default('512M'), 'cache_capacity_modifier': teamchat_cache_capacity_modifier | default('0.5')} | to_json }}\n"
        dest: "{{ tc_server_dir }}/tuwunel.pin"
        owner: root
        group: root
        mode: "0644"
      tags: [tuwunel]

    # The units are Go's text. The admin program just linked prints the list and each file; with
    # teamchat_lxc_seat_restore_starts_containers false, the boot unit is printed without its
    # container start.
    - name: List the Units the Admin Program Installs
      ansible.builtin.command:
        argv: ["{{ tc_admin_link }}", units, list]
      changed_when: false
      register: tc_unit_list
      tags: [units]

    - name: Print Each Unit's Text
      ansible.builtin.command:
        argv: "{{ [tc_admin_link, 'units', 'print'] + ([] if tc_lxc_starts_containers else ['--no-container-start']) + [item.split('\t')[0]] }}"
      loop: "{{ tc_unit_list.stdout_lines }}"
      changed_when: false
      register: tc_unit_text
      tags: [units]

    # The boot unit starts each recorded container as an instance of LXC's own lxc@.service
    # (Plan 00266 C.2). A host without that template unit would have every boot start refused, so
    # a run that enables the boot unit's container start fails here instead.
    - name: Look For LXC's Own Template Unit
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/lxc@.service
      register: tc_lxc_template_unit
      when: tc_lxc_present_members | length > 0 and tc_lxc_starts_containers
      tags: [units]

    - name: Fail When LXC's Own Template Unit Is Missing
      ansible.builtin.assert:
        that:
          - tc_lxc_template_unit.stat.exists
        fail_msg: >-
          /usr/lib/systemd/system/lxc@.service is missing: the LXC seat restore starts each container
          through it. Install LXC with play-lxc-install-config.yml, or set
          teamchat_lxc_seat_restore_starts_containers: false where the host's own IaC starts the
          containers.
      when: tc_lxc_present_members | length > 0 and tc_lxc_starts_containers
      tags: [units]

    # One of the units is a drop-in of LXC's own lxc@.service (Plan 00266 C.2), whose directory a
    # fresh host does not have; the copy below makes no directory.
    - name: Make the Directory of LXC's Unit Drop-in
      ansible.builtin.file:
        path: /etc/systemd/system/lxc@.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [units]

    # A command's stdout loses its trailing newline in Ansible, so the file's end is made explicit
    # here: the text trimmed, then exactly one newline. The lab compares each installed file with
    # `units print` byte for byte.
    - name: Write Each Unit
      ansible.builtin.copy:
        content: "{{ item.stdout | trim }}\n"
        dest: "{{ item.item.split('\t')[1] }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ tc_unit_text.results }}"
      loop_control:
        label: "{{ item.item.split('\t')[1] }}"
      register: tc_units_written
      tags: [units]

    # The resolver stub's old home, a file the unit no longer binds (it binds tc_resolver_dir).
    - name: Remove the Resolver Stub the Resolver Directory Replaced
      ansible.builtin.file:
        path: "{{ tc_share_dir }}/resolv.conf"
        state: absent
      tags: [units]

    # The directories the units write that nothing else makes (the lock directory under /run, the
    # leaves' root) are the tmpfiles entry's: made now, and again at every boot. A unit that writes
    # a directory that is not there fails its namespace setup, so none of these is optional.
    - name: Make the Tmpfiles Directories
      ansible.builtin.command:
        argv: [systemd-tmpfiles, --create, "{{ tc_tmpfiles_file }}"]
      changed_when: tc_units_written.changed
      tags: [units]

    - name: Reload Systemd When a Unit Changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: tc_units_written.changed
      tags: [units]

    # A base unit's text is shared by every team, and so is the member program every team's TLS
    # terminator runs, so one that changed reaches an unscoped team at its next restart unplanned:
    # every present team is applied, whatever the scope says (DESIGN-v2-C-host.md 3.2.3), and team
    # apply restarts each unit whose base unit or program is not the one units.json says it was
    # started on. Tagged units and member: only a run that writes the units or links a new
    # program can change one.
    - name: Apply Every Present Team Because a Base Unit or the Member Program Changed
      ansible.builtin.set_fact:
        tc_scoped_present: "{{ tc_present }}"
      when:
        - teamchat_only_teams is defined
        - >-
          (tc_units_written is defined and tc_units_written.results is defined
          and tc_units_written.results | selectattr('changed') | map(attribute='item.item') | select('match', '^teamchat-(server|tls)@') | list | length > 0)
          or (tc_kit_current is defined and tc_kit_current is changed)
      tags: [units, member]

    # Teams. teamchat-admin judges the declaration; the play only hands each team's entry over.
    # SELinux: the team units run as init_t, which may not connect to an unreserved port, so on
    # an enforcing host the terminator could not reach its homeserver. files/.../teamchat.cil
    # gives each team's port its own type that init_t may bind and connect to; nothing else.
    - name: Let the Team Units Reach Their Team's Port Under SELinux
      when: ansible_facts['selinux']['status'] == 'enabled'
      tags: [selinux, teams]
      block:
        - name: Install the SELinux Port Tools
          ansible.builtin.package:
            name:
              - policycoreutils-python-utils # semanage, which the port labels need

        - name: Write the teamchat SELinux Module
          ansible.builtin.copy:
            content: "{{ tc_selinux_cil }}\n"
            dest: "{{ tc_share_dir }}/teamchat.cil"
            owner: root
            group: root
            mode: "0644"
          register: tc_selinux_module_file

        - name: List the Installed SELinux Modules
          ansible.builtin.command:
            argv: [semodule, --list-modules=full]
          register: tc_selinux_modules
          changed_when: false
          check_mode: false

        - name: Install the teamchat SELinux Module
          ansible.builtin.command:
            argv: [semodule, --install, "{{ tc_share_dir }}/teamchat.cil"]
          # Runs only when the module is new or differs, which the same two checks decide.
          changed_when: >-
            tc_selinux_module_file is changed
            or tc_selinux_modules.stdout is not search('(?m)^\s*\d+\s+teamchat\s')
          when: >-
            tc_selinux_module_file is changed
            or tc_selinux_modules.stdout is not search('(?m)^\s*\d+\s+teamchat\s')

        - name: Label Each Present Team's Port for the Team Units
          community.general.seport:
            ports: "{{ item.port | string }}"
            proto: tcp
            setype: teamchat_port_t
            state: present
          loop: "{{ tc_scoped_present }}"
          loop_control:
            label: "{{ item.team }}:{{ item.port }}"

        # Labelled only where the drill is enabled: on any other host it would be unused surface.
        # No firewall task: the drill's scratch team serves on loopback only.
        - name: Label the Restore Drill's Port for the Team Units
          community.general.seport:
            ports: "{{ teamchat_restore_drill_port | string }}"
            proto: tcp
            setype: teamchat_port_t
            state: present
          when: teamchat_restore_drill | default(false)

    # A team's LXC members are among its security fields (DC18), so each team is handed its own
    # entries. The approval comes before both LXC phases, which hold every team they act on
    # against it.
    - name: Approve the Teams the Operator Names
      ansible.builtin.command:
        argv: ["{{ tc_admin_link }}", team, approve, --team, "{{ item.team }}"]
        stdin: "{{ {'team': item, 'lxc_members': tc_lxc | selectattr('team', 'eq', item.team) | list} | to_json }}"
      loop: "{{ tc_scoped_present | selectattr('team', 'in', teamchat_approve_teams | default([])) | list }}"
      loop_control:
        label: "{{ item.team }}"
      register: tc_approved
      changed_when: tc_approved.stdout_lines | select('match', tc_changed_re) | list | length > 0
      tags: [teams]

    # The LXC absent phase (DESIGN-v2-C-host.md 3.9.2): a member whose entry says absent, that
    # the team's LXC record holds and no entry declares, or that a team declared absent holds, is
    # parked and its guest files removed, while every team's homeserver still runs; `team remove`
    # refuses a team whose record still holds a seat that has not left. A present team not yet
    # installed is passed by, its leaving seats DEFERRED. A stopped or missing container is not a
    # failure: its member is parked from the host.
    - name: Park and Remove the LXC Members That Leave
      ansible.builtin.command:
        argv: "{{ [tc_admin_link, 'lxc', 'apply', '--phase', 'absent', '--only-teams', tc_lxc_absent_teams | join(',')] }}"
        stdin: "{{ tc_lxc_declaration }}"
      when: tc_lxc_absent_teams | length > 0
      register: tc_lxc_absent
      changed_when: tc_lxc_absent.stdout_lines | select('match', tc_changed_re) | list | length > 0
      tags: [teams]

    - name: Remove the Absent Teams
      ansible.builtin.command:
        argv: "{{ [tc_admin_link, 'team', 'remove', '--team', item.team] + (['--purge'] if item.purge | default(false) | bool else []) }}"
      loop: "{{ tc_scoped_absent }}"
      loop_control:
        label: "{{ item.team }}"
      register: tc_removed
      changed_when: tc_removed.stdout_lines | select('match', tc_changed_re) | list | length > 0
      tags: [teams]

    - name: Apply the Present Teams
      ansible.builtin.command:
        argv: ["{{ tc_admin_link }}", team, apply]
        stdin: "{{ {'team': item, 'lxc_members': tc_lxc | selectattr('team', 'eq', item.team) | list} | to_json }}"
      loop: "{{ tc_scoped_present }}"
      loop_control:
        label: "{{ item.team }}"
      register: tc_applied
      changed_when: tc_applied.stdout_lines | select('match', tc_changed_re) | list | length > 0
      tags: [teams]

    # The LXC present phase (DESIGN-v2-C-host.md 3.9.2): for each running container, the kit,
    # the guest check, the joins, the bundles, the desired memberships and each service seat's
    # session unit, written from the host side. A stopped or missing container, or a member whose
    # guest check finds gh signed out, is offline: a SKIPPED or DEFERRED line, never a failure
    # (n3b-D1). A running guest that cannot reach its team fails the play: an LXC seat is given the
    # team's listen address on the LXC bridge (team apply refuses a team with a present LXC member
    # and no bridge address), so that is a fault, not a stopped container.
    # A running container's wrong facts fail the play, naming the entry.
    - name: Place and Join the Declared LXC Members
      ansible.builtin.command:
        argv: "{{ [tc_admin_link, 'lxc', 'apply', '--phase', 'present', '--only-teams', tc_lxc_present_teams | join(',')] }}"
        stdin: "{{ tc_lxc_declaration }}"
      when: tc_lxc_present_teams | length > 0
      register: tc_lxc_present
      changed_when: tc_lxc_present.stdout_lines | select('match', tc_changed_re) | list | length > 0
      failed_when: tc_lxc_present.rc != 0 or tc_lxc_present.stdout_lines | select('search', tc_reach_re) | list | length > 0
      tags: [teams]

    # Only `lxc start` records a seat for the boot unit to start again (Plan 00266 C.2), so every
    # seat whose session runs now is added to that record: a seat started before the record
    # existed, or by hand, comes back after the next boot too. A seat already recorded is KEPT;
    # nothing is started or taken out.
    - name: Record the LXC Seats Whose Session Runs
      ansible.builtin.command:
        argv: ["{{ tc_admin_link }}", lxc, record-started]
      when: tc_lxc_present_members | length > 0
      register: tc_lxc_recorded
      changed_when: tc_lxc_recorded.stdout_lines | select('match', '^ADDED\t') | list | length > 0
      tags: [teams]

    # The held-back lines of both phases, shown without -v (C 3.9.3): each names the seat and why
    # it waits for a later run (a stopped container, a seat still held, a team not yet installed).
    - name: Show the LXC Members Held Back
      ansible.builtin.debug:
        msg: "{{ (tc_lxc_absent.stdout_lines | default([]) + tc_lxc_present.stdout_lines | default([])) | select('match', tc_held_re) | list }}"
      when: (tc_lxc_absent.stdout_lines | default([]) + tc_lxc_present.stdout_lines | default([])) | select('match', tc_held_re) | list | length > 0
      tags: [teams]

    # The timers run exactly while a team is declared present (C40).
    - name: Run the Health and Backup Timers While a Team Is Present
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: "{{ tc_present | length > 0 }}"
        state: "{{ 'started' if tc_present | length > 0 else 'stopped' }}"
      loop:
        - teamchat-health.timer
        - teamchat-backup.timer
      tags: [teams]

    # The LXC seats' restart after a boot (Plan 00266 C.2) runs exactly while an LXC member is
    # declared present. The record unit is started now, so its stop at the next shutdown records
    # the running containers (an inactive unit runs no ExecStop); the boot unit is only enabled,
    # to run at the next boot, never by this play.
    - name: Run the LXC Record Unit While an LXC Member Is Present
      ansible.builtin.systemd_service:
        name: teamchat-lxc-record.service
        enabled: "{{ tc_lxc_present_members | length > 0 }}"
        state: "{{ 'started' if tc_lxc_present_members | length > 0 else 'stopped' }}"
      tags: [teams]

    - name: Enable the LXC Boot Unit While an LXC Member Is Present
      ansible.builtin.systemd_service:
        name: teamchat-lxc-boot.service
        enabled: "{{ tc_lxc_present_members | length > 0 }}"
      tags: [teams]
