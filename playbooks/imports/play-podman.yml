#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# The daily prune of the store (container-images, below) is a Go command built here, so the Go
# toolchain is installed first. play-golang.yml stays its one source of truth.
- import_playbook: play-golang.yml

- hosts: desktop
  name: Install Podman and podman-compose
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
    # container-images' state directory (stateDir in src-go/internal/containerimages/prune.go).
    container_images_state_dir: "/home/{{ user_login }}/.local/state/fedora-desktop"
    # Present only while the ownership probe finds the store clean; without it container-images
    # removes nothing (storeCleanName in the same Go file, P9).
    container_images_store_clean: "{{ container_images_state_dir }}/container-images.store-clean"
  # Rootless podman is for everyone: ccc (play-claude-code-consumer.yml) runs Claude Code in it
  # on a consumer install. The Docker-compatibility parts, podman-compose and the Docker-API
  # socket, serve developer tooling only.
  tasks:
    - name: Install Podman
      become: true
      ansible.builtin.dnf:
        name:
          - podman
          - python3-pip  # the pip module below needs it; a Cloud Base image lacks it
        state: present

    - name: Install podman-compose (Docker Compose compatibility)
      ansible.builtin.pip:
        name: podman-compose
        state: present
        extra_args: --user
      when: install_audience == 'developer'

    # The user systemd manager is brought up (linger + explicit user@UID.service start) by
    # play-systemd-user-tweaks.yml earlier in playbook-main.yml, and linger persists it
    # across reboots — so on a full run the manager is guaranteed up here. We resolve the UID
    # locally so the scope:user socket enable also works when this play is run standalone (a
    # stated repo requirement); on a box that has NEVER run the full playbook the enable
    # fails loud rather than silently skipping — the correct fail-fast behaviour, replacing
    # the old probe-then-skip that left a container host with no Docker-API socket.
    - name: Look up UID for the user's systemd session env
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"

    - name: Enable Podman Socket for Docker Compatibility
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}/bus"
      when: install_audience == 'developer'

    # A layer c/storage could not finish deleting (files owned outside the current subuid range,
    # which the rootless user cannot unlink) makes every later podman command fail, the podman
    # ps probe below included, and a failed probe would let the migrate stop every running
    # container. So the store is repaired as root first (tasks/podman-store-repair.yml): a
    # temporary directory no process uses is removed; nothing to do changes nothing.
    - name: Repair the Rootless Store as Root
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/podman-store-repair.yml"

    # After podman / crun / runc / kernel upgrades, the user-namespace storage
    # state can fall out of sync with the new binaries; symptoms are rootless
    # builds failing with EPERM in overlay storage (chmod / unlink on lower
    # layer files inside a build container). `podman system migrate` is the
    # canonical, idempotent fix — it re-runs the namespace setup. Safe to call
    # on every play run as long as no containers are currently running — and
    # that condition is CHECKED, not assumed: `podman system migrate` stops
    # every running container first, and on a host whose workload is already
    # up it both takes that workload down and can fail with rc 125 ("cannot
    # stop container: container is stopped") on a container that stopped
    # between its own listing and its stop. When something is running the
    # migrate is skipped; it is a post-upgrade repair, never needed on a box
    # that is serving. A `podman ps` that itself fails (broken storage) does
    # not block the migrate, because the migrate is the repair for that.
    # See https://docs.podman.io/en/latest/markdown/podman-system-migrate.1.html
    - name: Check for running rootless containers (migrate would stop them)
      ansible.builtin.command: podman ps --quiet
      register: podman_running_containers
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-fail — rc/stdout consumed by the next task's when:

    - name: Migrate Podman User Namespace State (post-upgrade fix)
      ansible.builtin.command: podman system migrate
      changed_when: false
      when: >-
        podman_running_containers.rc != 0
        or (podman_running_containers.stdout_lines | length) == 0

    - name: Note when the migrate was skipped because containers are running
      ansible.builtin.debug:
        msg: >-
          podman system migrate SKIPPED: {{ podman_running_containers.stdout_lines | length }}
          rootless container(s) are running and the migrate would stop them. It is only
          needed after a podman/crun/kernel upgrade; stop the workload and re-run if so.
      when: >-
        podman_running_containers.rc == 0
        and (podman_running_containers.stdout_lines | length) > 0

    - name: Verify Podman Install
      ansible.builtin.command: podman info
      changed_when: false

    # =========================================================================
    # The daily prune of the rootless store (Plan 00235)
    # =========================================================================
    # Every ccy rebuild and daily in-place update re-points a fixed tag and leaves the image it
    # named dangling; nothing else removes them. container-images-prune.timer runs
    # `container-images prune --yes` daily: dangling images no container uses (over a day old),
    # tagged images no container uses and none is built on, over 28 days old (P2) and
    # buildah working containers left by an interrupted build; never a volume, never an image in
    # use, nothing while a ccy image build runs. It prunes
    # podman's store, the one this play installs for every audience whatever container_engine
    # names: ccc always runs in podman, and Docker's store is DDEV's (CLAUDE/ContainerEngines.md).
    - name: Ensure the User Local Bin and systemd Unit Directories Exist
      ansible.builtin.file:
        path: "/home/{{ user_login }}/{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - .local/bin
        - .config/systemd/user

    - name: Build and Install the container-images Command
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/build-go-command.yml"
      vars:
        go_command_name: container-images
        go_command_dest: "/home/{{ user_login }}/.local/bin/container-images"
        go_command_mode: "0755"
      tags:
        - container-images

    # Until a prune has succeeded the deploy runs one itself, so the backlog is cleared by the
    # deploy, not a day later, and a first run that failed is run again by the next deploy.
    # Only a `prune --yes` that succeeded writes this stamp.
    - name: Check Whether a Prune Has Ever Succeeded
      ansible.builtin.stat:
        path: "{{ container_images_state_dir }}/container-images.succeeded"
      register: container_images_succeeded

    - name: Deploy the container-images Prune Service and Timer
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ item }}"
        dest: "/home/{{ user_login }}/.config/systemd/user/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      loop:
        - container-images-prune.service
        - container-images-prune.timer

    # Only when given the host agent's decisions on the store's old-range files (Plan 00235 Q6,
    # through CLAUDE/Plan/00235-*/old-range-apply.bash): each item re-owned or removed as decided, a
    # dry run unless podman_store_old_range_apply is true. The probe below then judges the result.
    - name: Clean Up the Store's Old-Range Files as the Host Agent Decided
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/podman-store-old-range.yml"
      when: podman_store_old_range_decisions is defined

    # A store holding files owned outside the user's subuid range would be broken by the timer's
    # next prune, with no root to repair it, so the timer is held off and the play fails at its
    # end (tasks/podman-store-ownership-probe.yml, Plan 00235 Q6).
    - name: Find Whether the Store Holds Files the Rootless User Cannot Delete
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/podman-store-ownership-probe.yml"

    # ccy's self-prune and a manual `container-images prune --yes` have no root to repair the
    # store either, so they remove nothing unless the probe's verdict is this marker. The play
    # runs as the user, so the directory and its parents are the user's.
    - name: Ensure the container-images State Directory Exists
      ansible.builtin.file:
        path: "{{ container_images_state_dir }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0750"

    - name: Mark the Store Clean for container-images
      ansible.builtin.copy:
        content: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}\n"
        dest: "{{ container_images_store_clean }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      when: not (podman_store_foreign_owner | bool)

    - name: Remove the container-images Store-Clean Mark
      ansible.builtin.file:
        path: "{{ container_images_store_clean }}"
        state: absent
      when: podman_store_foreign_owner | bool

    - name: Enable and Start the container-images Prune Timer, or Hold It Off
      ansible.builtin.systemd:
        name: container-images-prune.timer
        scope: user
        enabled: "{{ not (podman_store_foreign_owner | bool) }}"
        state: "{{ 'stopped' if podman_store_foreign_owner | bool else 'started' }}"
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}/bus"

    # A oneshot's start waits for the run to end, so a prune that fails fails this task, and
    # the play, loudly. Later runs are the timer's. A prune that meets a layer it cannot delete
    # stops there and leaves that layer's temporary directory, which breaks the store, so the
    # repair runs again after the prune whatever its result; the play still fails after it.
    - name: Run the First Prune Now, Clearing the Backlog
      when:
        - not container_images_succeeded.stat.exists
        - not (podman_store_foreign_owner | bool)
      block:
        - name: Start the container-images Prune Service and Wait for It
          ansible.builtin.systemd:
            name: container-images-prune.service
            scope: user
            state: started
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
            DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}/bus"
      always:
        - name: Repair the Rootless Store as Root After the Prune
          ansible.builtin.import_tasks: "{{ root_dir }}/tasks/podman-store-repair.yml"

    - name: Fail While the Store Holds Files Owned Outside the subuid Range
      ansible.builtin.fail:
        msg: >-
          the podman store holds files owned outside your subuid range (old range); the daily
          prune is held off until they are re-owned (Plan 00235 Q6). First found:
          {{ podman_store_foreign_file.stdout }}
      when: podman_store_foreign_owner | bool

    - name: Show Podman Version
      ansible.builtin.debug:
        msg: "Podman installed successfully. Run 'podman --version' to verify."
