#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
- hosts: desktop
  name: Systemd User Service Tweaks
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
  tasks:
    # =========================================================================
    # USER SYSTEMD MANAGER BRING-UP (prerequisite for every systemctl --user below)
    # =========================================================================
    # On a headless Cloud Base firstboot the provisioning user has NEVER logged in, so no
    # user@UID.service (the per-user systemd manager) is running and /run/user/UID does not
    # exist — every systemctl --user call below (and in play-podman.yml downstream) would
    # fail. Enabling linger persists the manager across logouts and starts it at boot, but
    # loginctl enable-linger only QUEUES that start job asynchronously: it does not block
    # until the manager is up. So we follow it with an explicit systemd start of
    # user@UID.service — the ansible.builtin.systemd module blocks on the (Type=notify) job
    # until the manager signals READY=1, making its presence, and the private control socket
    # the verify/handler need, a deterministic guarantee at the next task rather than a race.
    # This is the mechanism play-rclone.yml:155-171 relies on, made cold-start-safe.
    - name: Look up UID for the user's systemd session env
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
      tags:
        - always
        - systemd
        - linger

    - name: Enable linger so user services survive logout and start at boot
      become: true
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ user_login }}
        creates: /var/lib/systemd/linger/{{ user_login }}
      tags:
        - always
        - systemd
        - linger

    - name: Ensure the user systemd manager is running (closes the enable-linger async race)
      become: true
      ansible.builtin.systemd:
        name: "user@{{ ansible_facts['getent_passwd'][user_login][1] }}.service"
        state: started
      tags:
        - always
        - systemd
        - linger

    # =========================================================================
    # SYSTEMD-OOMD MEMORY PRESSURE FIX
    # =========================================================================
    #
    # PROBLEM: systemd-oomd aggressively kills processes/containers despite
    # abundant available RAM due to false-positive "memory pressure" detection.
    #
    # ROOT CAUSE:
    # 1. systemd-oomd uses PSI (Pressure Stall Information) to detect memory
    #    pressure by measuring time spent reclaiming memory, faulting pages,
    #    and swapping. Normal cache reclaim activity registers as "pressure"
    #    even when there's tons of free RAM.
    #
    # 2. Memory accounting counts page cache as "used" (memory.current in
    #    cgroups), making file I/O intensive workloads appear memory-hungry
    #    even though cache is instantly reclaimable.
    #
    # 3. Default threshold is 80% pressure for 20 seconds, which is easily
    #    triggered by normal container operations (loading files, processing,
    #    caching) despite having 95GB+ free RAM.
    #
    # IMPACT:
    # - Containers killed at ~4GB usage when system has 100GB+ available
    # - Fedora rootless Podman containers particularly affected
    # - Processes under user.slice terminated prematurely
    # - Poor desktop experience with applications unexpectedly killed
    #
    # KNOWN BUGS & ISSUES:
    # - Debian Bug #1118191: Killing processes with plenty of memory
    #   https://bugs.debian.org/1118191
    #
    # - systemd PR #22965: Fixed memory calculation to use MemAvailable
    #   https://github.com/systemd/systemd/pull/22965
    #
    # - systemd Issue #19142: Killing Docker/Podman containers in user.slice
    #   https://github.com/systemd/systemd/issues/19142
    #
    # - systemd Issue #32304: Killing more processes than expected
    #   https://github.com/systemd/systemd/issues/32304
    #
    # - systemd Issue #35270: Bringing down entire desktop environments
    #   https://github.com/systemd/systemd/issues/35270
    #
    # - systemd Issue #33486: Not killing when it should
    #   https://github.com/systemd/systemd/issues/33486
    #
    # - Red Hat Bugzilla #1941170: Very aggressive in killing apps
    #   https://bugzilla.redhat.com/show_bug.cgi?id=1941170
    #
    # - Ubuntu systemd-oomd Headaches (Phoronix)
    #   https://www.phoronix.com/news/Ubuntu-systemd-oomd-Headaches
    #
    # - Fedora Change: EnableSystemdOomd
    #   https://fedoraproject.org/wiki/Changes/EnableSystemdOomd
    #
    # TECHNICAL DETAILS:
    # - systemd Memory Pressure Documentation
    #   https://systemd.io/MEMORY_PRESSURE/
    #   https://github.com/systemd/systemd/blob/main/docs/MEMORY_PRESSURE.md
    #
    # - systemd-oomd.service Man Page
    #   https://www.freedesktop.org/software/systemd/man/latest/systemd-oomd.service.html
    #
    # WHERE THE KILL COMES FROM:
    # Fedora's systemd-oomd-defaults sets ManagedOOMMemoryPressure=kill with
    # ManagedOOMMemoryPressureLimit=50% on the SYSTEM unit user@.service
    # (/usr/lib/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf).
    # Over the limit (PSI "full" avg10) for 20 s, oomd kills one candidate under
    # user@UID.service: a leaf cgroup (or one with memory.oom.group=1), the one
    # with the highest reclaim (pgscan) rate. Any desktop app or ccy container
    # can be that leaf. ManagedOOMPreference=avoid/omit is read from the
    # candidate's own cgroup only, never inherited, so setting it on app.slice
    # or session.slice protects none of the app scopes beneath them.
    #
    # SOLUTION:
    # A system drop-in that sorts after Fedora's sets user@.service back to
    # ManagedOOMMemoryPressure=auto: oomd no longer watches the session's
    # pressure. The kernel OOM killer still acts when memory really runs out, and
    # ccy's containers are capped together by agents.slice (play-claude-yolo.yml),
    # where the kernel kills inside that slice first. A drop-in in the USER
    # manager (~/.config/systemd/user/user.slice.d) cannot do this: the user
    # manager has no user.slice, and the kill setting is on the system unit.
    #
    # ALTERNATIVES CONSIDERED:
    # - Increase ManagedOOMMemoryPressureLimit to 95% (still has false positives)
    # - Disable systemd-oomd system-wide (too aggressive; -.slice's swap kill is kept)
    # - ManagedOOMPreference on the desktop slices (not inherited; see above)
    #
    # =========================================================================

    - name: Create The user@.service Drop-In Directory
      become: true
      ansible.builtin.file:
        path: /etc/systemd/system/user@.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - systemd
        - oomd

    - name: Stop systemd-oomd Killing In The User Session On Memory Pressure
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/systemd/system/user@.service.d/50-no-memory-pressure-kill.conf"
        dest: /etc/systemd/system/user@.service.d/50-no-memory-pressure-kill.conf
        owner: root
        group: root
        mode: "0644"
      register: oomd_config
      tags:
        - systemd
        - oomd

    # It set the property on a unit no cgroup belongs to, so it never applied.
    - name: Remove The Old User-Manager Drop-In That Never Applied
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user/user.slice.d/50-oom-override.conf"
        state: absent
      tags:
        - systemd
        - oomd

    # Its own task, not a handler, so the read-back below always sees the reloaded unit.
    # pid 1 hands the changed property to systemd-oomd on the reload; no restart of the
    # user manager (which would end the session) is needed.
    - name: Reload The System Manager So user@.service Takes The Drop-In
      become: true
      ansible.builtin.systemd:
        daemon_reload: true
      when: oomd_config.changed
      tags:
        - systemd
        - oomd

    - name: Read Back user@.service's Memory Pressure Setting
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "user@{{ ansible_facts['getent_passwd'][user_login][1] }}.service"
          - --property=ManagedOOMMemoryPressure
      register: oomd_verify
      changed_when: false
      tags:
        - systemd
        - oomd

    - name: Assert systemd-oomd No Longer Kills In The User Session On Pressure
      ansible.builtin.assert:
        that:
          - "'ManagedOOMMemoryPressure=auto' in oomd_verify.stdout_lines"
        fail_msg: |
          user@{{ ansible_facts['getent_passwd'][user_login][1] }}.service still reports
          {{ oomd_verify.stdout | default('(empty)') }} after the drop-in
          /etc/systemd/system/user@.service.d/50-no-memory-pressure-kill.conf was written and
          the system manager reloaded, so systemd-oomd can still kill desktop apps on memory
          pressure. Look for a later drop-in overriding it with
          systemctl cat user@{{ ansible_facts['getent_passwd'][user_login][1] }}.service
        quiet: true
      tags:
        - systemd
        - oomd

    # =========================================================================
    # FUTURE SYSTEMD TWEAKS
    # =========================================================================
    # Add additional systemd user service configurations below following
    # the same pattern:
    # - Create necessary directories
    # - Deploy the file from files/
    # - Reload the manager that reads it
    # - Read the value back from the live manager and assert it
    # - Tag appropriately
    # =========================================================================

