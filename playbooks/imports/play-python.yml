#!/usr/bin/env ansible-playbook
---
# This play installs things you need for Python and AI development
- hosts: desktop
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # Number of newest CPython MINOR lines (3.x) to install. Nothing is hardcoded:
    # the latest N minors and the latest patch of each are resolved at runtime from
    # pyenv (see "Install/upgrade Pyenv Versions"). Pinning exact patches made the
    # old static list go stale on every CPython point release and fail with
    # "definition not found"; deriving everything from pyenv self-heals that.
    pyenv_minor_count: 4
  tasks:
    - name: Ensure pipx Installed, Pyenv dependencies, and dependencies required by various python packages
      become: true
      ansible.builtin.dnf:
        name:
          - pipx
          - ruff
          - uv
          - make
          - cmake
          - gcc-c++
          - gcc
          - patch
          - zlib-ng-compat-devel # F44+: zlib-devel was dropped; zlib-ng-compat-devel provides the same headers/lib (pyenv wiki)
          - bzip2
          - bzip2-devel
          - readline-devel
          - sqlite
          - sqlite-devel
          - openssl-devel
          - tk-devel
          - libffi-devel
          - xz-devel
          - libuuid-devel
          - gdbm-libs
          - libnsl2
          - SDL2-devel
          - SDL2_image-devel
          - SDL2_mixer-devel
          - SDL2_ttf-devel
          - libjpeg-devel
          - portmidi-devel
          - portaudio-devel
          - python3-devel

    - name: Install PDM
      community.general.pipx:
        name: pdm
        state: latest
      # PERF-06: no separate `pdm self update` task — `state: latest` already upgrades pdm
      # on every run; the extra shell task was pure duplication and always reported changed.

    - name: Hugging Face CLI
      community.general.pipx:
        name: huggingface_hub
        state: latest

    # Required by scripts/qa-patterns.bash (runs .semgrep/bash-conventions.yml rules
    # against all bash files in the repo). qa-all.bash fails with rc=2 if missing —
    # see CLAUDE.md "Missing Dependencies" rule (fix via IaC, never tolerate the gap).
    - name: Semgrep (host-side QA pattern scanner)
      community.general.pipx:
        name: semgrep
        state: latest

    - name: Pyenv Python Version Management
      ansible.builtin.shell: |
        set -eo pipefail
        curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
      args:
        executable: /bin/bash
        creates: /home/{{ user_login }}/.pyenv

    - name: Pyenv Bashrc Config
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Pyenv"
        block: |
          export PYENV_ROOT="$HOME/.pyenv"
          command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
      loop:
        - /home/{{ user_login }}/.bashrc
        - /home/{{ user_login }}/.bash_profile

    # All non-trivial pyenv logic (refresh definitions, pick the newest N minor
    # lines, resolve the latest patch of each, keep+flag stale installs) lives in
    # a unit-tested Python helper rather than an Ansible shell block: the 2.19
    # free-form parser is not bash-aware and chokes on real scripts. The helper
    # drives the pyenv binary via PYENV_ROOT, so it also avoids the BASHRCSOURCED
    # nounset trap entirely. Logic: helpers/pyenv/resolver.py (+ tests/).
    - name: Install/upgrade Pyenv Versions
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - helpers.pyenv.install_pyenv_versions
          - --minor-count
          - "{{ pyenv_minor_count }}"
        chdir: "{{ root_dir }}" # repo root must be cwd so the helpers package imports
      register: pyenv_install
      # The helper prints PYENV-CHANGED once per version it actually builds.
      changed_when: "'PYENV-CHANGED' in pyenv_install.stdout"
      tags:
        - pyenv
        - pyenv_install_versions
