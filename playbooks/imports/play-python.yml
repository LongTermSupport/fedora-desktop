#!/usr/bin/env ansible-playbook
---
# This play installs things you need for Python and AI development
- hosts: desktop
  vars:
    root_dir: "{{ inventory_dir }}/../../"
    # Python versions to install - using latest stable patch releases
    # To update: pyenv install --list | grep -E "^\s*3\.(11|12|13)\.[0-9]+$" | tail -3
    # Last verified: 2026-06-12 via git ls-remote --tags https://github.com/python/cpython
    pyenv_versions:
      - 3.11.15 # LTS version - security support until Oct 2027
      - 3.12.13 # Stable version - security support until Oct 2028
      - 3.13.14 # Latest stable
  tasks:
    - name: Ensure pipx Installed, Pyenv dependencies, and dependencies required by various python packages
      become: true
      ansible.builtin.dnf:
        name:
          - pipx
          - ruff
          - uv
          - make
          - cmake
          - gcc-c++
          - gcc
          - patch
          - zlib-ng-compat-devel # F44+: zlib-devel was dropped; zlib-ng-compat-devel provides the same headers/lib (pyenv wiki)
          - bzip2
          - bzip2-devel
          - readline-devel
          - sqlite
          - sqlite-devel
          - openssl-devel
          - tk-devel
          - libffi-devel
          - xz-devel
          - libuuid-devel
          - gdbm-libs
          - libnsl2
          - SDL2-devel
          - SDL2_image-devel
          - SDL2_mixer-devel
          - SDL2_ttf-devel
          - libjpeg-devel
          - portmidi-devel
          - portaudio-devel
          - python3-devel

    - name: Install PDM
      community.general.pipx:
        name: pdm
        state: latest
      # PERF-06: no separate `pdm self update` task — `state: latest` already upgrades pdm
      # on every run; the extra shell task was pure duplication and always reported changed.

    - name: Hugging Face CLI
      community.general.pipx:
        name: huggingface_hub
        state: latest

    # Required by scripts/qa-patterns.bash (runs .semgrep/bash-conventions.yml rules
    # against all bash files in the repo). qa-all.bash fails with rc=2 if missing —
    # see CLAUDE.md "Missing Dependencies" rule (fix via IaC, never tolerate the gap).
    - name: Semgrep (host-side QA pattern scanner)
      community.general.pipx:
        name: semgrep
        state: latest

    - name: Pyenv Python Version Management
      ansible.builtin.shell: |
        set -eo pipefail
        curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
      args:
        executable: /bin/bash
        creates: /home/{{ user_login }}/.pyenv

    - name: Pyenv Bashrc Config
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Pyenv"
        block: |
          export PYENV_ROOT="$HOME/.pyenv"
          command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
      loop:
        - /home/{{ user_login }}/.bashrc
        - /home/{{ user_login }}/.bash_profile

    - name: Install Pyenv Versions
      ansible.builtin.shell: |
        set -euo pipefail
        source ~/.bash_profile
        pyenv install -s {{ item }}  # -s/--skip-existing skips if already installed
      args:
        executable: /bin/bash
      loop: "{{ pyenv_versions }}"
      register: pyenv_install
      # pyenv prints "Installed Python-..." (to stderr) only when it actually builds a
      # version; with -s an already-present version is a silent no-op, so report unchanged.
      changed_when: "'Installed' in pyenv_install.stderr or 'Installed' in pyenv_install.stdout"
      tags:
        - pyenv
        - pyenv_install_versions
