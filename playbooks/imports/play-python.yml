#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# This play installs things you need for Python and AI development
- hosts: desktop
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # Number of newest CPython MINOR lines (3.x) to install. Nothing is hardcoded:
    # the latest N minors and the latest patch of each are resolved at runtime from
    # pyenv (see "Install/upgrade Pyenv Versions"). Pinning exact patches made the
    # old static list go stale on every CPython point release and fail with
    # "definition not found"; deriving everything from pyenv self-heals that.
    pyenv_minor_count: 4
    # The SAME file .claude/ccy/Dockerfile, .github/workflows/qa.yml and
    # scripts/qa-toolchain.bash read, so host, container and CI run one set of
    # QA tool versions rather than three. KEY=VALUE lines, comments skipped.
    qa_versions: >-
      {{ dict(lookup('ansible.builtin.file', root_dir ~ '/.qa-versions').splitlines()
              | select('match', '^[A-Z_]+=')
              | map('split', '=', 1)) }}
  tasks:
    - name: Ensure pipx Installed, Pyenv dependencies, and dependencies required by various python packages
      become: true
      ansible.builtin.dnf:
        name:
          - pipx
          - uv
          - make
          - cmake
          - gcc-c++
          - gcc
          - patch
          - zlib-ng-compat-devel # F44+: zlib-devel was dropped; zlib-ng-compat-devel provides the same headers/lib (pyenv wiki)
          - bzip2
          - bzip2-devel
          - readline-devel
          - sqlite
          - sqlite-devel
          - openssl-devel
          - tk-devel
          - libffi-devel
          - xz-devel
          - libuuid-devel
          - gdbm-libs
          - libnsl2
          - SDL2-devel
          - SDL2_image-devel
          - SDL2_mixer-devel
          - SDL2_ttf-devel
          - libjpeg-devel
          - portmidi-devel
          - portaudio-devel
          - python3-devel

    # The QA toolchain is pinned, unlike the development tools below, because
    # scripts/qa-toolchain.bash ASSERTS these versions: a gate's verdict is a
    # property of the binary that produced it, so a host running different
    # versions is running different gates. Two shellchecks four minor releases
    # apart reported 141 and 173 issues on this same tree. Only tools a gate
    # runs are pinned: ruff (qa-python), semgrep (qa-patterns), shellcheck
    # (qa-bash).
    #
    # The Python tools come from pipx rather than dnf specifically so they CAN
    # be pinned. Fedora's ruff package tracks whatever Fedora ships, so it moves
    # whenever Fedora does. The dnf packages are removed rather than left
    # alongside, so /usr/bin cannot shadow the pinned binaries via PATH order.
    - name: Remove Fedora's unpinned QA tool packages
      become: true
      ansible.builtin.dnf:
        name:
          - ruff
          - ShellCheck
        state: absent

    # Probed rather than reinstalled unconditionally: community.general.pipx
    # treats an already-present app as satisfied regardless of its version, so a
    # pin change would otherwise never be applied — and `force: true` alone would
    # reinstall on every run and report changed for ever.
    - name: Check installed QA tool versions
      ansible.builtin.command:
        cmd: "{{ item.cmd }} --version"
      register: qa_tool_installed
      changed_when: false
      failed_when: false # FAIL-FAST-OK: probe — absence is the normal first-run state
      loop:
        - {cmd: ruff, pkg: ruff, version: "{{ qa_versions.RUFF }}"}
        - {cmd: semgrep, pkg: semgrep, version: "{{ qa_versions.SEMGREP }}"}
      loop_control:
        label: "{{ item.cmd }}"

    - name: Install QA tools at their pinned versions
      community.general.pipx:
        name: "{{ item.item.pkg }}"
        source: "{{ item.item.pkg }}=={{ item.item.version }}"
        state: install
        force: true
      when: item.rc != 0 or item.item.version not in item.stdout
      loop: "{{ qa_tool_installed.results }}"
      loop_control:
        label: "{{ item.item.cmd }}"

    # shutdown-with-update runs `pipx upgrade-all`, which upgrades every venv
    # that is not pinned and so moves these off .qa-versions. A pinned venv is
    # skipped. Runs after the install above, because a reinstall drops the pin.
    - name: Pin QA tools so pipx upgrade-all leaves them at .qa-versions
      community.general.pipx:
        name: "{{ item }}"
        state: pin
      loop: [ruff, semgrep]

    # shellcheck is not a Python package, so it cannot ride pipx, and Fedora's
    # package tracks Fedora. The upstream static binary goes to /usr/local/bin —
    # the same place and the same tarball the CCY image and CI use — so all three
    # environments run one shellcheck. Probed first for the same reason as above.
    - name: Check the installed shellcheck version
      ansible.builtin.command:
        cmd: shellcheck --version
      register: shellcheck_installed
      changed_when: false
      failed_when: false # FAIL-FAST-OK: probe — absence is the normal first-run state

    - name: Install shellcheck at the pinned version
      become: true
      ansible.builtin.unarchive:
        src: "https://github.com/koalaman/shellcheck/releases/download/v{{ qa_versions.SHELLCHECK }}/shellcheck-v{{ qa_versions.SHELLCHECK }}.linux.x86_64.tar.xz"
        remote_src: true
        dest: /usr/local/bin
        include:
          - "shellcheck-v{{ qa_versions.SHELLCHECK }}/shellcheck"
        extra_opts:
          - --strip-components=1
        owner: root
        group: root
        mode: "0755"
      when: >-
        shellcheck_installed.rc != 0
        or ('version: ' ~ qa_versions.SHELLCHECK) not in shellcheck_installed.stdout

    # The installs above are not self-verifying: pipx can succeed while the binary
    # on PATH stays the old one (another install site shadowing it), which is the
    # exact failure the dnf removal above exists to prevent. Assert the outcome
    # rather than the action.
    - name: Verify the QA toolchain now matches the pins
      ansible.builtin.command:
        cmd: "{{ root_dir }}/scripts/qa-toolchain.bash"
      register: qa_toolchain_verify
      changed_when: false

    - name: Install PDM
      community.general.pipx:
        name: pdm
        state: latest
      # PERF-06: no separate `pdm self update` task — `state: latest` already upgrades pdm
      # on every run; the extra shell task was pure duplication and always reported changed.

    - name: Hugging Face CLI
      community.general.pipx:
        name: huggingface_hub
        state: latest

    - name: Pyenv Python Version Management
      ansible.builtin.shell: |
        set -eo pipefail
        curl -L https://github.com/pyenv/pyenv-installer/raw/master/bin/pyenv-installer | bash
      args:
        executable: /bin/bash
        creates: /home/{{ user_login }}/.pyenv

    - name: Pyenv Bashrc Config
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Pyenv"
        block: |
          export PYENV_ROOT="$HOME/.pyenv"
          command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
      loop:
        - /home/{{ user_login }}/.bashrc
        - /home/{{ user_login }}/.bash_profile

    # All non-trivial pyenv logic (refresh definitions, pick the newest N minor
    # lines, resolve the latest patch of each, keep+flag stale installs) lives in
    # a unit-tested Python helper rather than an Ansible shell block: the 2.19
    # free-form parser is not bash-aware and chokes on real scripts. The helper
    # drives the pyenv binary via PYENV_ROOT, so it also avoids the BASHRCSOURCED
    # nounset trap entirely. Logic: helpers/pyenv/resolver.py (+ tests/).
    - name: Install/upgrade Pyenv Versions
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - helpers.pyenv.install_pyenv_versions
          - --minor-count
          - "{{ pyenv_minor_count }}"
        chdir: "{{ root_dir }}" # repo root must be cwd so the helpers package imports
      register: pyenv_install
      # The helper prints PYENV-CHANGED once per version it actually builds.
      changed_when: "'PYENV-CHANGED' in pyenv_install.stdout"
      tags:
        - pyenv
        - pyenv_install_versions
