#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Flatpak is already installed by default, we just need to add to it
- hosts: desktop
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    - name: Install VS Code
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        set -x
        umask 022
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
        echo -e "[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\nautorefresh=1\ntype=rpm-md\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc" > /etc/yum.repos.d/vscode.repo
        # dnf check-update exits 0 (no updates) or 100 (updates available);
        # both are success. Any other rc is a real failure — do not mask it.
        dnf check-update; rc=$?; [ "$rc" -eq 0 ] || [ "$rc" -eq 100 ] || exit "$rc"  # FAIL-FAST-OK: rc 100 is dnf "updates available", not an error
        dnf -y install code
      args:
        executable: /bin/bash
        creates: /usr/bin/code

    # dnf run by a user reads the repo file. One written under a restrictive umask is root-only,
    # and the creates: guard above never writes it again (CLAUDE/QA.md#root-umask).
    - name: Make the VS Code repo file readable by every user
      become: true
      ansible.builtin.file:
        path: /etc/yum.repos.d/vscode.repo
        state: file
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode
