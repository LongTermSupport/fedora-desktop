#!/usr/bin/env ansible-playbook
---
# Customisations for Gnome Shell - only worth doing if you actually use Gnome
- hosts: desktop
  name: Gnome Shell Extensions
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    # FUP-07: fetch from upstream at a pinned tag instead of tracking the GPL-2.0
    # script in this MIT repo. Checksum pins v1.7 — update both url and checksum
    # together if upgrading. Upstream: github.com/brunelli/gnome-shell-extension-installer
    - name: Install Gnome Shell Extension Installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/brunelli/gnome-shell-extension-installer/v1.7/gnome-shell-extension-installer"
        dest: /usr/bin/gnome-shell-extension-installer
        checksum: "sha256:f1534d65ecb6c4851f59f4c3053dbd690faa00816fa3364adb9e455d6f403643"
        mode: "0755"
        owner: root
        group: root

    - name: Install DNF packages
      ansible.builtin.dnf:
        name:
          - xprop
          # The official "Extensions" GUI. GNOME Tweaks 40+ dropped its extensions
          # panel, and Fedora no longer ships this app by default, so without it
          # there is no graphical way to enable/disable/configure extensions.
          - gnome-extensions-app
          # EXT-08: DNF resolves the per-release build automatically (105-1.fc44 on Fedora 44).
          # No version pin needed — the distro package always targets the bundled GNOME major.
          - gnome-shell-extension-dash-to-dock
          # Note: just-perfection is installed via ID below as DNF package may be outdated

    # PERF-09: --update makes the installer skip the re-download (and its restart) when the
    # installed version is already current, instead of unconditionally re-fetching all seven
    # every run. changed_when keys on the actual download marker; rc 2 == "already current".
    - name: Install Gnome Shell Extensions Not Included with DNF
      become: false
      ansible.builtin.command: gnome-shell-extension-installer --yes --update --restart-shell {{ item.id }}
      register: gse_install
      changed_when: "'Downloading extension' in gse_install.stdout"
      failed_when: gse_install.rc not in [0, 2]
      loop:
        # Verified compatibility status checked against GNOME Shell 50 (Fedora 44)
        - name: Blur my Shell
          id: 3193
          # https://extensions.gnome.org/extension/3193/blur-my-shell/
        - name: Vitals
          id: 1460
          # https://extensions.gnome.org/extension/1460/vitals/
        - name: AppIndicator and KStatusNotifierItem Support
          id: 615
          # https://extensions.gnome.org/extension/615/appindicator-support/
        - name: Clipboard Indicator
          id: 779
          # https://extensions.gnome.org/extension/779/clipboard-indicator/
        - name: Just Perfection
          id: 3843
          # https://extensions.gnome.org/extension/3843/just-perfection/
        - name: Tiling Shell
          id: 7065
          # https://extensions.gnome.org/extension/7065/tiling-shell/
        - name: Space Bar
          id: 5090
          # https://extensions.gnome.org/extension/5090/space-bar/

    # EXT-09: gnome-shell-extension-installer v1.7 does NOT run glib-compile-schemas
    # after extracting the zip. Extensions that ship only the .gschema.xml source
    # (blur-my-shell, tilingshell, just-perfection — verified on GNOME 50 / Fedora 44)
    # then fail to enable with "Failed to open file gschemas.compiled: No such file
    # or directory" and end up in State: ERROR. Extensions that bundle a pre-compiled
    # gschemas.compiled in their zip (Vitals, AppIndicator, Clipboard Indicator,
    # Space Bar) work without this step — but we sweep all schema dirs unconditionally
    # so any future extension lands compiled regardless of how the upstream zip
    # was packaged.
    - name: Discover Extension GSettings Schemas
      become: false
      ansible.builtin.find:
        paths: "/home/{{ user_login }}/.local/share/gnome-shell/extensions"
        patterns: "*.gschema.xml"
        recurse: true
        file_type: file
      register: gse_schema_files

    # Idempotent on the "does compiled file exist at all" question via creates:.
    # gnome-shell-extension-installer wipes and re-extracts on a version bump, so a
    # stale compiled file from a previous version cannot persist — the new XML always
    # arrives without a compiled sibling, and this task regenerates it.
    - name: Compile Extension GSettings Schemas
      become: false
      ansible.builtin.command:
        cmd: glib-compile-schemas "{{ item }}"
        creates: "{{ item }}/gschemas.compiled"
      loop: "{{ gse_schema_files.files | map(attribute='path') | map('dirname') | unique | sort }}"

    - name: Deploy Custom Extension - Workspace Names in Overview
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.copy:
        src: "{{ root_dir }}/extensions/workspace-names-overview@fedora-desktop/"
        dest: "/home/{{ user_login }}/.local/share/gnome-shell/extensions/workspace-names-overview@fedora-desktop/"
        mode: '0755'

    - name: Enable Workspace Names in Overview Extension
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.shell:
        cmd: |
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          gnome-extensions enable workspace-names-overview@fedora-desktop
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: GNOME session may not be active during playbook run

    # EXT-05: gnome-extensions enable only flips the gsettings list — it succeeds even when
    # GNOME rejected the extension as OUT_OF_DATE (wrong shell-version) or ERROR. This step
    # verifies the actual runtime state, but is Wayland-reload-aware: an OUT OF DATE verdict
    # whose cause is already fixed on disk (metadata.json lists the running GNOME major, but
    # the live session has not re-validated because Wayland cannot reload the shell without a
    # logout) must NOT fail the play — only a genuine version mismatch or load ERROR should.
    # That decision is non-trivial, so it lives in a unit-tested helper rather than inline
    # shell (see helpers/gnome/extension_state.py and this repo's complex-logic rule).
    - name: Verify Workspace Names in Overview Extension Is Active
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - helpers.gnome.verify_extension
          - --uuid
          - workspace-names-overview@fedora-desktop
          - --extensions-dir
          - "/home/{{ user_login }}/.local/share/gnome-shell/extensions"
        chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
      register: gse_verify
      changed_when: false
      # The helper exits non-zero ONLY on a genuine version mismatch or load ERROR (it prints
      # EXT-FAIL ...). Pending-Wayland-reload and no-session both exit 0 (EXT-OK ...). The
      # command module already fails the play on a non-zero rc; this is the fail-fast gate.

    # Default Space Bar behaviour is: first click opens Overview, second click
    # selects the workspace. We want a single click to switch directly.
    # Use dconf write (not gsettings set) because the Space Bar schema is
    # installed under the extension dir, not the system schema path — gsettings
    # would refuse with "No such schema" inside a fresh dbus-run-session.
    - name: Configure Space Bar - Single Click Switches Workspace
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: dbus-run-session -- dconf write /org/gnome/shell/extensions/space-bar/behavior/toggle-overview false
      changed_when: false
