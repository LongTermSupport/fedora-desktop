#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Customisations for Gnome Shell - only worth doing if you actually use Gnome
- hosts: desktop
  name: Gnome Shell Extensions
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    user_extensions_dir: "/home/{{ user_login }}/.local/share/gnome-shell/extensions"
    system_extensions_dir: /usr/share/gnome-shell/extensions
    # Every UUID this play deploys, across EVERY group — `.values()`, not the three
    # group names spelled out. A fourth group added to the vars file would then be
    # enabled and verified rather than silently ignored here, and if nothing
    # installs it the applier fails loudly with `declared-extension-not-deployed`,
    # which is the outcome you want from a half-added group.
    #
    # The install tasks below stay group-specific on purpose: `egos` entries carry
    # an `id` to fetch and `system` entries a `package` to install, and those are
    # not interchangeable. Only the UUID population is generic.
    declared_extension_uuids: >-
      {{ gnome_shell_extensions.values() | sum(start=[]) | map(attribute='uuid') | list }}
  vars_files:
    - "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}/vars/gnome-shell-extensions.yml"
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    # FUP-07: fetch from upstream at a pinned tag instead of tracking the GPL-2.0
    # script in this MIT repo. Checksum pins v1.7 — update both url and checksum
    # together if upgrading. Upstream: github.com/brunelli/gnome-shell-extension-installer
    - name: Install Gnome Shell Extension Installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/brunelli/gnome-shell-extension-installer/v1.7/gnome-shell-extension-installer"
        dest: /usr/bin/gnome-shell-extension-installer
        checksum: "sha256:f1534d65ecb6c4851f59f4c3053dbd690faa00816fa3364adb9e455d6f403643"
        mode: "0755"
        owner: root
        group: root

    - name: Install DNF packages
      ansible.builtin.dnf:
        name:
          - xprop
          # The official "Extensions" GUI. GNOME Tweaks 40+ dropped its extensions
          # panel, and Fedora no longer ships this app by default, so without it
          # there is no graphical way to enable/disable/configure extensions.
          - gnome-extensions-app
    # EXT-08: DNF resolves the per-release build automatically (105-1.fc44 on Fedora 44).
    # No version pin needed — the distro package always targets the bundled GNOME major.
    # Note: just-perfection comes from extensions.gnome.org below, not DNF, which lags.
    - name: Install Gnome Shell Extensions Packaged by DNF
      ansible.builtin.dnf:
        name: "{{ gnome_shell_extensions.system | map(attribute='package') | list }}"

    # PERF-09: --update makes the installer skip the re-download (and its restart) when the
    # installed version is already current, instead of unconditionally re-fetching all seven
    # every run. changed_when keys on the actual download marker; rc 2 == "already current".
    - name: Install Gnome Shell Extensions Not Included with DNF
      become: false
      ansible.builtin.command: gnome-shell-extension-installer --yes --update --restart-shell {{ item.id }}
      register: gse_install
      changed_when: "'Downloading extension' in gse_install.stdout"
      failed_when: gse_install.rc not in [0, 2]
      loop: "{{ gnome_shell_extensions.egos }}"
      loop_control:
        label: "{{ item.name }}"

    # EXT-09: gnome-shell-extension-installer v1.7 does NOT run glib-compile-schemas
    # after extracting the zip. Extensions that ship only the .gschema.xml source
    # (blur-my-shell, tilingshell, just-perfection — verified on GNOME 50 / Fedora 44)
    # then fail to enable with "Failed to open file gschemas.compiled: No such file
    # or directory" and end up in State: ERROR. Extensions that bundle a pre-compiled
    # gschemas.compiled in their zip (Vitals, AppIndicator, Clipboard Indicator,
    # Space Bar) work without this step — but we sweep all schema dirs unconditionally
    # so any future extension lands compiled regardless of how the upstream zip
    # was packaged.
    - name: Discover Extension GSettings Schemas
      become: false
      ansible.builtin.find:
        paths: "{{ user_extensions_dir }}"
        patterns: "*.gschema.xml"
        recurse: true
        file_type: file
      register: gse_schema_files

    # Idempotent on the "does compiled file exist at all" question via creates:.
    # gnome-shell-extension-installer wipes and re-extracts on a version bump, so a
    # stale compiled file from a previous version cannot persist — the new XML always
    # arrives without a compiled sibling, and this task regenerates it.
    - name: Compile Extension GSettings Schemas
      become: false
      ansible.builtin.command:
        cmd: glib-compile-schemas "{{ item }}"
        creates: "{{ item }}/gschemas.compiled"
      loop: "{{ gse_schema_files.files | map(attribute='path') | map('dirname') | unique | sort }}"

    # The UUID comes from the vars file, not from this task. Spelling it here too
    # would make the play a second copy of the declaration, which the vars header
    # promises no consumer keeps — so a rename there used to deploy the OLD
    # directory, and the applier then hard-failed with
    # `declared-extension-not-deployed`. Loud rather than silent, but a failure
    # whose cause is two files apart, for a declaration that should have one home.
    #
    # `mode` is per-file: nothing an extension ships is executable (JS, JSON, CSS
    # and a README), and only the directories need the search bit. Same form as the
    # sibling play-container-watch.yml, which copies a repo extension directory.
    # It is still a whole-directory copy, so the README and any stray file in the
    # source dir do deploy — the open half of Plan 00049's EXT-13.
    - name: Deploy Declared Custom Extensions
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.copy:
        src: "{{ root_dir }}/extensions/{{ item.uuid }}/"
        dest: "{{ user_extensions_dir }}/{{ item.uuid }}/"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
        directory_mode: '0755'
      loop: "{{ gnome_shell_extensions.custom }}"
      loop_control:
        label: "{{ item.uuid }}"

    # EXT-10: `gnome-extensions enable` asks the RUNNING shell to enable a UUID, so on a
    # fresh install — where the shell has not scanned the new directory yet — the request
    # is silently lost. Plan 00110's desktop acceptance run found all eight extensions
    # installed, compiled and loaded, and not one enabled, with every task reporting ok.
    # The gsettings list is read at session start and watched live, so declaring it works
    # whether or not a shell has loaded the extension. Additive: the user's own enabled
    # extensions are never removed. The helper re-reads what it wrote, so a dconf database
    # that refused the write fails the play instead of passing silently (Plan 00112).
    #
    # The set is what this repo DECLARES, never what the extensions directory contains —
    # the user's own extensions live in the same place, and judging or re-enabling those
    # is not this play's business. A declared UUID that is not on disk fails here, which
    # is what stops a partial install reading as success.
    #
    # Both directories are searched because dash-to-dock is a DNF-installed SYSTEM
    # extension and is enabled through the very same key. It was NOT being enabled, so
    # the dconf settings written for it further down were a no-op on every fresh install.
    - name: Declare Deployed Extensions Enabled
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        # `--uuid=<value>` rather than a `--uuid <value>` pair, so the declared list maps
        # to argv with one filter instead of an interleave nobody can read.
        argv: "{{ ['python3', '-m', 'helpers.gnome.apply_enabled_extensions',
                   '--extensions-dir', user_extensions_dir,
                   '--extensions-dir', system_extensions_dir]
                  + (declared_extension_uuids | map('regex_replace', '^', '--uuid=') | list) }}"
        chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
      register: gse_enabled
      changed_when: "'GNOME-EXT-ENABLED-CHANGED' in gse_enabled.stdout"

    # The helper is the one place that reports what it actually resolved on disk; the verify
    # loop below reads its marker line rather than re-deriving the list, so the two can never
    # disagree about which extensions were judged.
    #
    # Skipped under --check because the task above is: the command module has no check mode,
    # so it never runs and never prints the marker. Without this guard a --check preview dies
    # on an undefined attribute instead of previewing.
    - name: Collect Deployed Extension UUIDs
      when: not ansible_check_mode
      ansible.builtin.set_fact:
        gse_deployed_uuids: >-
          {{ (gse_enabled.stdout_lines | select('match', '^GNOME-EXT-DEPLOYED ') | first).split(' ', 1)[1].split(',') }}

    # `loop` is templated BEFORE `when` is evaluated, so the verify task below cannot carry
    # the check-mode guard itself and has to tolerate an unset fact. `| default([])` on its
    # own would then turn this repo's fail-fast verify gate into a silent zero-iteration
    # no-op for any future reason the fact goes unset — a `when:`, a --tags selection, an
    # edit to the applier task. This assertion is what keeps that loud.
    - name: Assert Deployed Extension UUIDs Were Collected
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - gse_deployed_uuids | default([]) | length == declared_extension_uuids | length
        fail_msg: >-
          Expected {{ declared_extension_uuids | length }} deployed extension UUIDs from
          the GNOME-EXT-DEPLOYED marker, got {{ gse_deployed_uuids | default([]) | length }}.
          The verify loop below would silently judge nothing. A short count with no other
          error usually means a duplicate `uuid:` in vars/gnome-shell-extensions.yml, which
          the helper collapses and this length comparison does not.

    # EXT-05: declaring the gsettings list above says nothing about whether GNOME accepted
    # each extension — it can still reject one as OUT_OF_DATE (wrong shell-version) or ERROR.
    # This step verifies the actual runtime state of EVERY deployed UUID, not just the custom
    # one it originally covered, but is Wayland-reload-aware: an OUT OF DATE verdict
    # whose cause is already fixed on disk (metadata.json lists the running GNOME major, but
    # the live session has not re-validated because Wayland cannot reload the shell without a
    # logout) must NOT fail the play — only a genuine version mismatch or load ERROR should.
    # That decision is non-trivial, so it lives in a unit-tested helper rather than inline
    # shell (see helpers/gnome/extension_state.py and this repo's complex-logic rule).
    - name: Verify Deployed Extensions Are Healthy
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - helpers.gnome.verify_extension
          - --uuid
          - "{{ item }}"
          - --extensions-dir
          - "{{ user_extensions_dir }}"
          - --extensions-dir
          - "{{ system_extensions_dir }}"
        chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
      register: gse_verify
      changed_when: false
      # Empty under --check, where the fact above is never set and there is nothing deployed
      # by this run to verify. The assertion above is what makes an unexpectedly empty list
      # loud rather than a silent zero-iteration pass.
      loop: "{{ gse_deployed_uuids | default([]) }}"
      # The helper exits non-zero ONLY on a genuine version mismatch or load ERROR (it prints
      # EXT-FAIL ...). Pending-Wayland-reload and no-session both exit 0 (EXT-OK ...). The
      # command module already fails the play on a non-zero rc; this is the fail-fast gate.

    # A pass above is NOT evidence the extensions are healthy, and this task exists so the
    # transcript cannot pretend otherwise. Every non-failing verdict exits 0, so on a fresh
    # install — where the shell has not rescanned the extensions directory — all iterations
    # return EXT-OK [pending_scan] and the output is byte-identical to a genuine all-clear.
    # Ansible does not print a command task's stdout without -v, so nothing distinguished
    # "nine judged healthy" from "nine not judged at all".
    #
    # It deliberately does NOT fail on pending_scan or skip_no_session: both are legitimate
    # here (the shell rescans on the reboot run.bash already requires), and failing would
    # break every fresh install. What it fails on is a verdict it cannot read — that is the
    # case where the gate genuinely did not run. The gate that PROVES the outcome is the
    # post-reboot `deployed-extensions-active` check in the desktop acceptance scenario.
    - name: Assert Every Deployed Extension Produced A Readable Verdict
      ansible.builtin.assert:
        that:
          # Both counts derive from gse_verify.results, so on their own they agree at
          # zero and this gate reports "0 of 0" and passes — the same shape it exists
          # to catch. The population is pinned against what the repo DECLARES, which no
          # `when:` on the loop above can shrink.
          - gse_total | int == declared_extension_uuids | length
          - gse_marked | int == gse_total | int
        fail_msg: >-
          Verified {{ gse_total }} of {{ declared_extension_uuids | length }} declared
          extensions, {{ gse_marked }} of which produced an EXT-OK/EXT-FAIL marker. Both
          must equal the declared count. A short verified count means the loop above did
          not run over every extension. A short marker count means a verdict could not be
          read. Either way their state is unknown and this gate has not run.
        success_msg: >-
          COVERAGE: {{ gse_live }} of {{ gse_total }} deployed extensions judged against a
          live session; {{ gse_scan }} awaiting a shell rescan (expected before the reboot);
          {{ gse_nosession }} with no session reachable. Only the {{ gse_live }} are evidence.
        # Load-bearing, not boilerplate: it sets _ansible_verbose_always, which is what
        # prints success_msg without -v. quiet: true deletes the COVERAGE line silently.
        quiet: false
      vars:
        gse_stdout: "{{ gse_verify.results | default([]) | map(attribute='stdout') | list }}"
        gse_total: "{{ gse_stdout | length }}"
        gse_marked: "{{ gse_stdout | select('match', 'EXT-(OK|FAIL) .[a-z_]+. ') | list | length }}"
        gse_live: "{{ gse_stdout | select('match', 'EXT-OK .ok. |EXT-OK .pending_reload. ') | list | length }}"
        gse_scan: "{{ gse_stdout | select('search', 'pending_scan') | list | length }}"
        gse_nosession: "{{ gse_stdout | select('search', 'skip_no_session') | list | length }}"
      when: not ansible_check_mode

    # Default Space Bar behaviour is: first click opens Overview, second click
    # selects the workspace. We want a single click to switch directly.
    # Use dconf write (not gsettings set) because the Space Bar schema is
    # installed under the extension dir, not the system schema path — gsettings
    # would refuse with "No such schema" inside a fresh dbus-run-session.
    - name: Configure Space Bar - Single Click Switches Workspace
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: dbus-run-session -- dconf write /org/gnome/shell/extensions/space-bar/behavior/toggle-overview false
      changed_when: false

    # Observed: on the default intellihide mode (FOCUS_APPLICATION_WINDOWS) the dock does
    # not hide behind an un-maximised Ptyxis window, while it does for other apps. Working
    # explanation: that mode only tests windows the Shell window tracker ties to the
    # focused application, and the D-Bus-activated Ptyxis window is not tied. ALL_WINDOWS
    # tests every window on the workspace and needs no such association (Plan 00102).
    - name: Configure Dash to Dock - Hide Behind Any Overlapping Window
      become: true
      become_user: "{{ user_login }}"
      community.general.dconf:
        key: /org/gnome/shell/extensions/dash-to-dock/intellihide-mode
        value: "'ALL_WINDOWS'"
        state: present
