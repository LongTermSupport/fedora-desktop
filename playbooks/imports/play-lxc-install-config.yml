#!/usr/bin/env ansible-playbook
---
# LXC install + config.
#
# IaC ORDERING: this play MUST run AFTER play-docker.yml. See playbook-main.yml
# for the canonical order. The "Reconcile iptables" block near the end of this
# file inserts rules into Docker's DOCKER-USER chain to keep LXC outbound
# connectivity working on Docker hosts; that chain only exists once Docker is
# installed and its daemon has run. The first two tasks below fail-fast with a
# clear error if Docker is missing.
#
# Rootless Podman (play-podman.yml) does NOT need to come before LXC — it
# uses slirp4netns/pasta for networking and does not touch host iptables.
- hosts: desktop
  name: LXC Install Config
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    # ── IaC Ordering Guard ─────────────────────────────────────────────────────
    - name: Check whether Docker is installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_binary_check

    - name: Assert Docker is installed before LXC (IaC ordering)
      ansible.builtin.assert:
        that:
          - docker_binary_check.stat.exists
        fail_msg: |
          Docker is not installed but this play expects Docker to have been
          installed first.

          ORDERING REQUIREMENT: play-docker.yml must run before
          play-lxc-install-config.yml in playbook-main.yml. The LXC play
          reconciles iptables rules in Docker's DOCKER-USER chain (see the
          "Reconcile iptables" block later in this file); that chain only
          exists once Docker is installed.

          To run standalone, install Docker first:
            ansible-playbook playbooks/imports/play-docker.yml
            ansible-playbook playbooks/imports/play-lxc-install-config.yml

          Rootless Podman does NOT need to precede LXC — it uses
          slirp4netns/pasta and does not touch host iptables.

    # Named for what it is: ganto/lxc4 is an LXC 4.x repo and the only packages
    # taken from it are `lxc` / `lxc-templates`. It was called "LXD Copr" until
    # Plan 00070, and that name was the source of docs/playbooks.md claiming
    # this play installs LXD. No LXD package has ever appeared here.
    - name: Enable LXC Copr Repository
      community.general.copr:
        name: "ganto/lxc4"

    - name: Install Packages
      ansible.builtin.package:
        name:
          - lxc
          - lxc-templates
          # Declared dependencies. A minimal Fedora Cloud Base image ships none of
          # these by default, yet tasks below hard-require them — so install them
          # here rather than assume/probe (CLAUDE.md "Missing Dependencies — Fix in
          # IaC"). Previously they were only present transitively (Server edition /
          # weak-deps), which made this play abort the whole run on Cloud Base.
          - firewalld        # ansible.posix.firewalld zone bind below needs the daemon
          - python3-firewall  # firewalld's Python bindings for the Ansible module
          - dnsmasq          # lxc-net launches it; the DHCP sanity gate hard-asserts it came up
          - iptables-nft     # the DOCKER-USER / MASQUERADE reconciliation shells out to `iptables`
          # NOTE: a since-reverted Fedora 42 update once shipped iptables-nft without wiring
          #       the /usr/bin/iptables alternatives link — if the later "Assert DOCKER-USER
          #       chain exists" task fails command-not-found, suspect that distro packaging
          #       regression rather than this play.
          - NetworkManager   # the nmcli probe + "reload NetworkManager" handler require it

    - name: Put SELinux in permissive mode, logging actions that would be blocked.
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    # ANS-09: `state: started` (not `restarted`) so a main-playbook run does not bounce
    # lxc.service — and the long-lived containers it autostarts — on every pass.
    - name: Setup LXC Service
      ansible.builtin.systemd:
        name: lxc
        state: started
        enabled: true

    # Plan 00057: lxc-net owns the DHCP server for lxcbr0, so it MUST be enabled
    # in its own right — not left as an implicit dependency pull-in. `state` is
    # omitted here on purpose: on a host currently broken by the NetworkManager
    # bridge race, lxc-net cannot start until the NM-unmanaged change below
    # lands, so the "restart lxc-net" handler (after that change) is what
    # actually (re)starts it.
    - name: Enable lxc-net Service at Boot
      ansible.builtin.systemd:
        name: lxc-net
        enabled: true

    # Plan 00057: the lxcbr0 firewall zone is bound via `ansible.posix.firewalld`
    # below (by interface name, independent of NetworkManager). We deliberately
    # do NOT set the zone with `nmcli connection modify lxcbr0 …` — doing so
    # persists NM's generated bridge connection into a saved, autoconnect profile
    # that then assigns the bridge address (the stock LXC_ADDR) at boot and races
    # lxc-net: RTNETLINK "File exists" → no dnsmasq → containers get no lease.
    # lxcbr0 is kept NM-unmanaged (see the NM-unmanaged block later in this play).

    # firewalld must be running for the `immediate: true` half of the bind below to
    # apply to the live ruleset (Cloud Base does not start it by default).
    - name: Ensure firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    # This is Cloud Base's FIRST-EVER firewalld start (it was simply absent until the
    # package task above installed it). On a remote, headless VM the only access path is
    # SSH, so before we leave the daemon enabled we must guarantee the box's default zone
    # still permits it — turning on a previously-absent firewall must never self-lockout
    # the operator. Idempotent and a no-op on stock Fedora (the public zone already allows
    # ssh); load-bearing on any non-stock cloud image or cloud-init firewalld drop-in. No
    # zone key, so it operates on whatever the resolved default zone is (the zone the admin
    # NIC actually lands in). firewalld is running by now, so immediate applies live too.
    - name: Ensure SSH stays permitted in the default zone (no remote self-lockout)
      ansible.posix.firewalld:
        service: ssh
        state: enabled
        permanent: true
        immediate: true

    # PERF-07: the firewalld module applies permanent + runtime idempotently without the
    # blanket `firewall-cmd --reload` that reprocessed every zone on every run.
    - name: Bind lxcbr0 to the trusted firewall zone
      ansible.posix.firewalld:
        zone: trusted
        interface: lxcbr0
        permanent: true
        immediate: true
        state: enabled
    - name: Create Insecure SSH Key for Connecting to Container
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.shell: ssh-keygen -t rsa -f ~/.ssh/id_lxc -q -P ""
      args:
        creates: "/home/{{ user_login }}/.ssh/id_lxc"

    - name: Set up SSH Config for LXC Containers
      ansible.builtin.blockinfile:
        marker: "# {mark} LXC Containers Insecure Key"
        path: "/home/{{ user_login }}/.ssh/config"
        create: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0600"
        block: |
          Host "10.0.*.*"
            IdentityFile ~/.ssh/id_lxc
            UserKnownHostsFile=/dev/null
            StrictHostKeyChecking=no

    - name: Ensure /etc/lxc/dhcp.conf File Exists
      ansible.builtin.file:
        path: /etc/lxc/dhcp.conf
        state: touch
        owner: root
        group: root
        mode: "0644"
        # preserve timestamps so an existing file is not reported changed on every run
        access_time: preserve
        modification_time: preserve

    - name: Enable DHPC on lxcbr0
      ansible.builtin.blockinfile:
        block: LXC_DHCP_CONFILE=/etc/lxc/dhcp.conf
        marker: "# {mark} ANSIBLE MANAGED - LXC Install"
        path: /etc/sysconfig/lxc-net

    - name: Disable IPv6 on lxc-net (not needed, causes stale address errors on restart)
      ansible.builtin.blockinfile:
        block: LXC_IPV6_ENABLE="false"
        marker: "# {mark} ANSIBLE MANAGED - LXC IPv6"
        path: /etc/sysconfig/lxc-net
      notify: restart lxc-net

    # ── Keep NetworkManager off lxcbr0 (Plan 00057) ────────────────────────────
    # Root cause of "lxc-net failed / no DHCP / containers unreachable": if NM
    # manages lxcbr0 it assigns the bridge address at boot before lxc-net runs,
    # so lxc-net's `ip addr add` fails with RTNETLINK "File exists" under `set -e`
    # and aborts before launching dnsmasq. Making lxcbr0 NM-unmanaged makes
    # lxc-net the sole owner and removes the race. These tasks also RECOVER a
    # host already in the broken state; the "restart lxc-net" handler below is
    # non-disruptive to running containers (lxc-net keeps a bridge that still has
    # attached veths — it only re-adds the address and relaunches dnsmasq).
    - name: Mark lxcbr0 unmanaged by NetworkManager (persistent)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/NetworkManager/conf.d/99-lxc-unmanaged.conf"
        dest: /etc/NetworkManager/conf.d/99-lxc-unmanaged.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload NetworkManager

    - name: Probe whether NetworkManager still manages lxcbr0
      ansible.builtin.command: nmcli -t -f DEVICE,STATE device
      register: _nm_devs
      changed_when: false

    # Setting the device unmanaged makes NM hand it off immediately while leaving
    # its current L3 config in place (no teardown) — safe while container veths
    # are enslaved. We deliberately do NOT `nmcli connection delete lxcbr0`:
    # deleting an active bridge profile can tear the bridge down and unenslave
    # live container veths. With lxcbr0 unmanaged, any saved lxcbr0 profile can
    # never activate again, so it is inert and harmless.
    - name: Set lxcbr0 unmanaged at runtime (no device teardown)
      ansible.builtin.command: nmcli device set lxcbr0 managed no
      when:
        - "'lxcbr0:' in _nm_devs.stdout"
        - "'lxcbr0:unmanaged' not in _nm_devs.stdout"
      changed_when: true
      notify: restart lxc-net

    # Apply the NM-unmanaged change and (re)start lxc-net now, so the rest of the
    # play — and the sanity gate at the end — run against a healthy DHCP setup
    # rather than waiting for the end-of-play handler flush.
    - name: Flush handlers to apply NM-unmanaged + restart lxc-net
      ansible.builtin.meta: flush_handlers

    # lxc-bash is a PUBLIC repo, so clone it over HTTPS with no auth. This replaces
    # the former vault-passphrase assert + `ssh -T git@github.com` probe + `git@`
    # SSH clone, which hard-required a vaulted GitHub SSH passphrase and a working
    # port-22 GitHub SSH handshake — an unnecessary dependency for a public repo
    # that aborted the whole run on a box with no GitHub identity or with 22 blocked.
    # lxc-bash provides shell aliases + completion only; it is not an LXC host
    # prerequisite.
    - name: Clone lxc-bash and wire its shell completion (public repo, HTTPS)
      become_user: "{{ user_login }}"
      block:
        - name: Clone lxc-bash (public, HTTPS — no GitHub auth)
          ansible.builtin.git:
            repo: https://github.com/LongTermSupport/lxc-bash.git
            dest: "/home/{{ user_login }}/Projects/lxc-bash"
            update: false   # clone once; do not fight local edits on re-run (matches old `creates:`)

        - name: Source lxc-bash completion from bashrc
          ansible.builtin.lineinfile:
            line: source /home/{{ user_login }}/Projects/lxc-bash/lxc-bash-completion.bash
            path: /home/{{ user_login }}/.bashrc

    - name: Increase System Limits
      ansible.builtin.blockinfile:
        path: /etc/sysctl.conf
        marker: "# {mark} ANSIBLE MANAGED - LXC Install"
        block: |
          fs.inotify.max_user_instances=8192
          fs.inotify.max_user_watches=524288
      notify: sysctl
      tags: sysctl

    # Docker and other networking tools in LXC containers require certain kernel modules
    # to be loaded on the host for proper operation. These are standard Linux networking
    # modules that are safe to load and commonly used by various applications.
    - name: Ensure kernel modules loaded for Docker/OpenVPN in LXC containers
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present # Ensures modules are loaded at boot via /etc/modules-load.d/
      loop:
        # Core iptables modules needed by Docker for NAT and packet filtering
        - ip_tables # Core IPv4 packet filtering framework
        - iptable_filter # Basic packet filtering (ACCEPT/DROP/REJECT)
        - iptable_nat # Network Address Translation for port mapping
        - iptable_mangle # Packet modification (TTL, TOS, etc)
        # Note: IPv6 modules are typically auto-loaded by firewalld
      tags: [kernel_modules, lxc_docker]

    # Ensure any pending handlers (e.g. restart lxc-net, sysctl) finish before
    # we read lxcbr0 state and reconcile iptables.
    - name: Flush handlers before iptables reconciliation
      ansible.builtin.meta: flush_handlers

    # ── Reconcile iptables for outbound connectivity (Docker coexistence) ──────
    # Docker sets FORWARD policy to DROP and inserts the DOCKER-USER chain at
    # the top of FORWARD. lxc-net's per-bridge ACCEPT rules live in FORWARD but
    # never execute because DOCKER-USER short-circuits first. The MASQUERADE
    # rule for the LXC subnet can also disappear during a bridge-recovery
    # sequence (stop containers → stop lxc-net → ip link delete lxcbr0 →
    # start lxc-net). Net result: containers boot, get IPs, accept SSH, but
    # have zero outbound TCP connectivity (curl exit 28).
    #
    # IaC ordering: playbook-main.yml runs this play AFTER play-docker.yml,
    # so DOCKER-USER is guaranteed to exist. We assert it (fail-fast) rather
    # than probing for a runtime fallback — Docker IS installed because the
    # IaC says so. The LXC subnet is derived from the live lxcbr0 interface
    # so a customised LXC_NETWORK still works.
    #
    # Persistence: the ACCEPT/MASQUERADE rules are runtime-only kernel state that
    # vanishes on host reboot and on a Docker daemon restart (which flushes
    # DOCKER-USER). A shared reconcile script + a systemd unit bound to
    # docker.service (PartOf=) re-apply them on every boot and every docker
    # restart — see the "Deploy DOCKER-USER iptables reconciliation" tasks below.
    - name: Assert DOCKER-USER iptables chain exists (Docker must run before LXC)
      ansible.builtin.command: iptables -n -L DOCKER-USER
      changed_when: false
      tags: [lxc_iptables]

    # The DOCKER-USER ACCEPT rules + the LXC-subnet MASQUERADE rule are applied by
    # a single shared, idempotent script (probe-then-insert via `iptables -C`), which
    # is ALSO run at boot / on docker restart by the systemd unit below. Keeping the
    # rule logic in one script (not duplicated inline here and in the unit) is what
    # stops the live-apply path and the persistence path from silently drifting apart.
    - name: Deploy DOCKER-USER iptables reconciliation script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/usr/local/bin/lxc-docker-user-iptables-reconcile.bash"
        dest: /usr/local/bin/lxc-docker-user-iptables-reconcile.bash
        owner: root
        group: root
        mode: "0755"
      tags: [lxc_iptables]

    - name: Apply DOCKER-USER iptables rules now (this session)
      ansible.builtin.command: /usr/local/bin/lxc-docker-user-iptables-reconcile.bash
      register: _lxc_iptables_reconcile
      changed_when: "'LXC-IPTABLES-RECONCILE-CHANGED' in _lxc_iptables_reconcile.stdout"
      tags: [lxc_iptables]

    # PartOf=docker.service makes systemd re-run this unit whenever docker restarts
    # (which flushes DOCKER-USER); WantedBy=multi-user.target + Requires/After pull it
    # in — and order it after — docker at boot. This is the persist-across-reboot and
    # persist-across-docker-restart path; the task above is the immediate-apply path.
    - name: Deploy DOCKER-USER iptables reconciliation systemd unit (reboot/docker-restart persistence)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/systemd/system/lxc-docker-user-iptables-reconcile.service"
        dest: /etc/systemd/system/lxc-docker-user-iptables-reconcile.service
        owner: root
        group: root
        mode: "0644"
      tags: [lxc_iptables]

    # state: started (not restarted) — ANS-09 convention (see lxc.service above): the
    # immediate-apply task already reconciled this session, so the unit only needs to be
    # enabled + started at least once, not bounced on every Ansible run.
    - name: Enable + start the DOCKER-USER iptables reconciliation unit
      ansible.builtin.systemd:
        name: lxc-docker-user-iptables-reconcile.service
        daemon_reload: true
        enabled: true
        state: started
      tags: [lxc_iptables]

    # ── Sanity Checks ──────────────────────────────────────────────────────────
    - name: Sanity — lxc service is active
      ansible.builtin.command: systemctl is-active lxc
      changed_when: false

    - name: Sanity — lxcbr0 bridge interface is up
      ansible.builtin.command: ip link show lxcbr0
      changed_when: false

    # Plan 00057 DEFENCE: "bridge is up" is a FALSE-POSITIVE for DHCP health — the
    # bridge stays up even when lxc-net failed and no dnsmasq is running. These
    # two gates catch that silent failure and fail the play fast.
    - name: Sanity — lxc-net service is active (DHCP server owner)
      ansible.builtin.command: systemctl is-active lxc-net
      changed_when: false

    - name: Sanity — lxc-net completed startup (dnsmasq launched)
      ansible.builtin.stat:
        path: /run/lxc/network_up
      register: _lxcnet_network_up

    - name: Assert lxc-net brought up its DHCP server
      ansible.builtin.assert:
        that:
          - _lxcnet_network_up.stat.exists
        fail_msg: |
          lxc-net is active but /run/lxc/network_up is missing — dnsmasq did NOT
          launch, so containers on lxcbr0 cannot obtain a DHCP lease.

          This is almost always the NetworkManager/lxcbr0 ownership race: NM
          assigned the bridge address to lxcbr0 first, so lxc-net's `ip addr add`
          failed with RTNETLINK "File exists" and aborted before dnsmasq.

          Diagnose with the plan triage:
            CLAUDE/Plan/00057-lxc-net-networkmanager-bridge-race/triage.bash

    - name: Sanity — lxc-ls command works
      ansible.builtin.command: lxc-ls
      changed_when: false

    - name: Sanity — lxc-checkconfig
      ansible.builtin.command: lxc-checkconfig
      register: lxc_checkconfig_result
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: best-effort informational — lxc-checkconfig returns non-zero when optional kernel features are disabled

    - name: Show lxc-checkconfig results (review for any disabled features)
      ansible.builtin.debug:
        msg: "{{ ['NOTE: Review output below for critical features. Some optional features may be disabled — this is normal.'] + lxc_checkconfig_result.stdout_lines }}"

  handlers:
    - name: sysctl
      ansible.builtin.command: sysctl -p

    # Ansible runs handlers in DEFINITION order, not notify order. "reload
    # NetworkManager" is defined before "restart lxc-net" on purpose: NM must
    # re-read its conf.d and release lxcbr0 first, so that lxc-net can then take
    # sole ownership of the bridge + address and start dnsmasq cleanly.
    - name: reload NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded

    - name: restart lxc-net
      ansible.builtin.systemd:
        name: lxc-net
        state: restarted
