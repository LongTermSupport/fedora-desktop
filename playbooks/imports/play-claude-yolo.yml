#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
- hosts: desktop
  # One play for both launchers. cc (host Claude Code) runs on ccy's lib, so the two cannot
  # be deployed apart: when they were separate plays, deploying only this one left an old
  # cc calling functions a new lib/tmux-session.bash expected it to have sourced.
  name: Claude Code - Host cc and Container ccy
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # 'latest' tracks the leading-edge release train (the same one npm's `latest`
    # dist-tag serves the ccy container), so host `cc` and container `ccy` stay on
    # the same Claude Code version. 'stable' is the slower staged-rollout channel
    # and lags behind — using it left the host stuck several releases back while
    # ccy moved ahead. The native updater's channel is sticky: cc's per-launch
    # `claude update` only ever reaches the head of whichever channel is set here.
    claude_code_version: "latest"
    # Desktop Claude Code's plaintext session store. Container (ccy) sessions
    # keep their state per-project instead, so ccy's launcher repairs those.
    #
    # NOT ansible_facts['env']['HOME']: this play runs become: false, but
    # ansible.cfg's `gathering = smart` + persistent `fact_caching=jsonfile`
    # mean facts gathered by an EARLIER play in playbook-main.yml are reused
    # here rather than re-gathered. play-AA-preflight-sanity.yml (play #1)
    # runs become: true at the PLAY level, which elevates its own fact-
    # gathering too, so ansible_facts['env']['HOME'] is '/root' for the whole
    # run — see CLAUDE/Plan/00088-claude-code-state-dir-stale-home-fact. The
    # rest of this file already avoids this trap (lines below use
    # /home/{{ user_login }}/... directly); do the same here.
    claude_state_dir: "/home/{{ user_login }}/.claude"
  pre_tasks:
    - name: Load container defaults
      ansible.builtin.include_vars:
        file: "{{ root_dir }}/vars/container-defaults.yml"
  tasks:
    - name: Check if Container Engine is Installed
      ansible.builtin.command: which {{ container_engine }}
      register: container_engine_check
      failed_when: false  # FAIL-FAST-OK: probe — next task fails with install instructions
      changed_when: false

    - name: Verify Container Engine is Available
      ansible.builtin.fail:
        msg: |
          {{ container_engine }} is not installed or not in PATH.
          Please install {{ container_engine }} first.
          {% if container_engine == 'docker' %}
          Run: ansible-playbook playbooks/imports/optional/common/play-docker.yml
          {% else %}
          Run: ansible-playbook playbooks/imports/play-podman.yml
          {% endif %}
      when: container_engine_check.rc != 0

    - name: Check for podman-compose (Podman only)
      ansible.builtin.command: which podman-compose
      register: podman_compose_check
      failed_when: false  # FAIL-FAST-OK: probe — next task fails with install instructions
      changed_when: false
      when: container_engine == 'podman'

    - name: Verify podman-compose is Available (Podman only)
      ansible.builtin.fail:
        msg: |
          podman-compose is not installed.
          This is required for Docker Compose compatibility with Podman.

          Install it with:
          ansible-playbook playbooks/imports/play-podman.yml
      when:
        - container_engine == 'podman'
        - podman_compose_check.rc != 0

    - name: Check Container Engine Service is Running
      ansible.builtin.command: "{{ container_engine }} ps"
      register: container_service_check
      failed_when: false  # FAIL-FAST-OK: probe — next task fails with troubleshooting info
      changed_when: false

    - name: Verify Container Engine Service
      ansible.builtin.fail:
        msg: |
          {{ container_engine }} service is not running or not accessible.
          {% if container_engine == 'docker' %}
          Please start Docker: systemctl --user start docker
          {% else %}
          Podman should work without a daemon. Check: podman info
          {% endif %}
      when: container_service_check.rc != 0

    - name: Create Claude YOLO Base Directory
      become: true
      ansible.builtin.file:
        path: /opt/claude-yolo
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Custom Dockerfiles Directory
      become: true
      ansible.builtin.file:
        path: /opt/claude-yolo/custom-dockerfiles
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Dockerfile
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile"
        dest: /opt/claude-yolo/Dockerfile
        owner: root
        group: root
        mode: "0644"
      tags:
        - scripts
        - dockerfile

    - name: Copy Entrypoint Script
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/claude-yolo/entrypoint.sh"
        dest: /opt/claude-yolo/entrypoint.sh
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - entrypoint

    - name: Copy Browser Mode Stub into Docker Build Context
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/claude-yolo/agent-browser-mode-required"
        dest: /opt/claude-yolo/agent-browser-mode-required
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts

    # The ctrl+z patch script that used to be copied here is gone (CCY 3.42.0).
    # Suppressing ctrl+z is now the PTY supervisor's job, so remove the stale
    # copy from build contexts provisioned by an earlier run — otherwise the
    # Dockerfile hash changes while a dead file lingers beside it.
    - name: Remove Retired ctrl+z Patch Script from Docker Build Context
      become: true
      ansible.builtin.file:
        path: /opt/claude-yolo/ccy-ctrl-z-patch.js
        state: absent
      tags:
        - scripts
        - dockerfile

    - name: Copy PHPantom LSP Plugin into Docker Build Context
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/claude-yolo/plugins/"
        dest: /opt/claude-yolo/plugins/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      tags:
        - scripts
        - dockerfile

    - name: Create Documentation Directory
      become: true
      ansible.builtin.file:
        path: /opt/claude-yolo/docs
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - docs

    - name: Copy CCY Startup Info File
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/opt/claude-yolo/ccy-startup-info.txt"
        dest: /opt/claude-yolo/ccy-startup-info.txt
        owner: root
        group: root
        mode: "0644"
      tags:
        - scripts

    - name: Copy Documentation into Docker Build Context
      become: true
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: "{{ root_dir }}/files/opt/claude-yolo/docs/CUSTOM-DOCKERFILES.txt"
          dest: /opt/claude-yolo/docs/CUSTOM-DOCKERFILES.txt
        - src: "{{ root_dir }}/files/opt/claude-yolo/docs/CCY-GUIDE.txt"
          dest: /opt/claude-yolo/docs/CCY-GUIDE.txt
      tags:
        - scripts
        - docs

    - name: Create Skills Directory in Docker Build Context
      become: true
      ansible.builtin.file:
        path: /opt/claude-yolo/skills/browsing
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - skills

    - name: Copy Browsing Skills into Docker Build Context
      become: true
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/claude-yolo/skills/browsing/
        owner: root
        group: root
        mode: "0644"
      loop:
        # SKILL.md is deliberately the only file here. The command reference used to be
        # duplicated into COMMANDLINE-USAGE.md and EXAMPLES.md, which drifted so far that
        # all 97 of their examples used an `agent-browser run "..."` syntax the CLI no
        # longer has. agent-browser ships its own version-matched skills
        # (`agent-browser-headless skills get core --full`), so the skill now points at those.
        - "{{ root_dir }}/files/opt/claude-yolo/skills/browsing/SKILL.md"
      tags:
        - scripts
        - skills

    - name: Create Optional Child-Claude Directories in Docker Build Context
      become: true
      ansible.builtin.file:
        path: "/opt/claude-yolo/optional/child-claude/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - bin
        - skills/child-claude
      tags:
        - scripts
        - skills

    # Staged OUTSIDE /opt/claude-yolo/skills/ deliberately. The entrypoint copies
    # that directory into every session unconditionally, so opt-in content cannot
    # live there. Reasoning: Plan 00092, by number under CLAUDE/Plan/.
    #
    # The next two tasks only ever ADD, exactly like the browsing copy above, and the
    # Dockerfile COPYs this whole directory. So deleting a file from
    # files/opt/claude-yolo/optional/ does NOT remove it from a host's build context, and
    # the stale copy keeps shipping into the image. If anything under optional/ is ever
    # removed or renamed, add it to a `state: absent` task — the pattern is at
    # "Remove Obsolete Browsing Skill Files" below, which exists because this was missed once.
    - name: Copy Optional Child-Claude Wrapper into Docker Build Context
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/opt/claude-yolo/optional/child-claude/bin/ccy-claude"
        dest: /opt/claude-yolo/optional/child-claude/bin/ccy-claude
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - skills

    - name: Copy Optional Child-Claude Skill into Docker Build Context
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/opt/claude-yolo/optional/child-claude/skills/child-claude/SKILL.md"
        dest: /opt/claude-yolo/optional/child-claude/skills/child-claude/SKILL.md
        owner: root
        group: root
        mode: "0644"
      tags:
        - scripts
        - skills

    - name: Remove Obsolete Browsing Skill Files from Docker Build Context
      become: true
      ansible.builtin.file:
        path: "/opt/claude-yolo/skills/browsing/{{ item }}"
        state: absent
      loop:
        - COMMANDLINE-USAGE.md
        - EXAMPLES.md
      # The copy task above only ever ADDS files, so deleting these from the repo would
      # otherwise leave stale copies in the build context on every host that has already
      # deployed them — and the Dockerfile COPYs the whole directory, so the removed,
      # wrong documentation would keep shipping into the image indefinitely.
      tags:
        - scripts
        - skills

    - name: Copy Custom Dockerfile Templates (Never Overwrite User Changes)
      become: true
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/opt/claude-yolo/custom-dockerfiles/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
        force: false # NEVER overwrite - users can customize these
      loop:
        - "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile.project-template"
        - "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile.example-ansible"
        - "{{ root_dir }}/files/var/local/claude-yolo/Dockerfile.example-golang"
      tags:
        - scripts
        - templates

    # Shared library for DRY helpers (used by ccy)
    - name: Create Shared Library Directory
      become: true
      ansible.builtin.file:
        path: /var/local/claude-yolo/lib
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - launchers

    - name: Install Shared Helper Libraries
      become: true
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/local/claude-yolo/lib/{{ item | basename }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/common-pure.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/common.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/ssh-handling.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/token-management.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/network-management.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/dockerfile-custom.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/docker-health.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/tmux-session.bash"
        - "{{ root_dir }}/files/var/local/claude-yolo/lib/session-registry.bash"
      # `launchers` is on the lib and on every script that sources it (ccy, cc,
      # ccy-sessions), with the directories they land in: a tag that deployed one
      # without the others would recreate the new-lib-under-old-cc break.
      tags:
        - scripts
        - launchers

    # Clean up the per-host install of the obsolete terminal-detection.bash
    # lib (Plan 00047 pre-flight, removed in the pivot away from Path C+).
    - name: Remove Obsolete terminal-detection.bash Lib From Host
      become: true
      ansible.builtin.file:
        path: /var/local/claude-yolo/lib/terminal-detection.bash
        state: absent
      tags:
        - scripts
        - cleanup

    # Drop the usage cache on every deploy. Entries written by CCY 3.32.0's
    # /api/oauth/usage reader (Plan 00100) hold a different summary format to the
    # rate-limit-header reader that replaced it in 3.34.0 (Plan 00101), and a
    # stale entry would render as a wrong or empty usage column until it aged
    # out. Unconditional rather than version-gated because it is free to redo:
    # the cache is a quota-saving optimisation with a 15-minute life, rebuilt on
    # demand the next time the user presses `u`, so there is nothing to preserve
    # across a deploy that might have changed the format again.
    # Addresses the user's home explicitly, never the HOME fact: with
    # `gathering = smart` plus jsonfile fact caching, a cached fact from an
    # elevated play makes ansible_facts['env']['HOME'] resolve to /root, so the
    # task deleted /root/.claude-tokens/ccy/usage-cache and left the user's
    # stale cache in place. Same trap Plan 00088 fixed; documented in full above
    # this play's claude_state_dir var.
    - name: Discard Stale Token Usage Cache From Host
      ansible.builtin.file:
        path: /home/{{ user_login }}/.claude-tokens/ccy/usage-cache
        state: absent
      tags:
        - scripts
        - cleanup

    # Remove old symlinks and dead files (cleanup from previous versions)
    - name: Remove Old Symlink in /usr/local/bin
      become: true
      ansible.builtin.file:
        path: /usr/local/bin/claude-yolo
        state: absent
      tags:
        - scripts
        - cleanup

    - name: Remove Dead ui-helpers.bash Library
      become: true
      ansible.builtin.file:
        path: /var/local/claude-yolo/lib/ui-helpers.bash
        state: absent
      tags:
        - scripts
        - cleanup

    - name: Copy Wrapper Script to /var/local/
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/claude-yolo/claude-yolo"
        dest: /var/local/claude-yolo/claude-yolo
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - launchers

    - name: Deploy Bashrc Include for Root
      become: true
      ansible.builtin.template:
        src: "{{ root_dir }}/files/home/bashrc-includes/claude-yolo.bash.j2"
        dest: /root/.bashrc-includes/claude-yolo.bash
        owner: root
        group: root
        mode: "0644"

    - name: Deploy Bashrc Include for User
      ansible.builtin.template:
        src: "{{ root_dir }}/files/home/bashrc-includes/claude-yolo.bash.j2"
        dest: /home/{{ user_login }}/.bashrc-includes/claude-yolo.bash
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    # =========================================================================
    # Host Claude Code CLI and the cc wrapper
    # =========================================================================
    # cc sources the lib installed above, so these tasks come after it.

    - name: Ensure jq is available
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ensure-jq.yml"

    - name: Install Claude Code Dependencies (System Level)
      become: true
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - ripgrep
          - curl
          - wget
          - git
          - openssh-clients

    - name: Check if Claude Code is Already Installed
      ansible.builtin.stat:
        path: "/home/{{ user_login }}/.local/bin/claude"
      register: claude_installed

    # Fresh host: bootstrap the native build on the chosen channel.
    - name: Install Claude Code CLI via Official Installer
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://claude.ai/install.sh | bash -s {{ claude_code_version }}
      args:
        executable: /bin/bash
      environment:
        HOME: "/home/{{ user_login }}"
      when: not claude_installed.stat.exists

    # Existing host: ensure it tracks the chosen channel. `claude install latest`
    # switches the native updater's (sticky) channel so cc's per-launch
    # `claude update` follows the leading edge instead of the slower `stable`
    # rollout. Without this, retargeting claude_code_version above would never
    # reach a host that already has claude installed (the bootstrap task is
    # gated on absence). Reports changed only when it actually moves the version.
    - name: Ensure Claude Code Tracks the '{{ claude_code_version }}' Channel
      ansible.builtin.shell: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        before="$(claude --version)"
        claude install {{ claude_code_version }}
        after="$(claude --version)"
        # Surface the result for changed_when; trailing line is machine-parsed.
        echo "CCVER before=${before} after=${after}"
      args:
        executable: /bin/bash
      environment:
        HOME: "/home/{{ user_login }}"
      when: claude_installed.stat.exists
      register: claude_channel_sync
      changed_when: >-
        ('CCVER before=' in claude_channel_sync.stdout) and
        (claude_channel_sync.stdout
          | regex_search('CCVER before=(.*) after=(.*)$', '\\1', '\\2')
          | unique | length > 1)

    # cc wrapper script — token-source parity with ccy. Shares the ccy
    # token pool at ~/.claude-tokens/ccy/tokens/ and presents the same
    # named-token chooser with an added "Desktop" pseudo-option that
    # preserves the pre-Plan-00048 cc behaviour (host ~/.claude/ OAuth).
    # See CLAUDE/Plan/00048-cc-token-source-parity/PLAN.md.
    - name: Create /var/local/claude-code Directory
      become: true
      ansible.builtin.file:
        path: /var/local/claude-code
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - launchers

    - name: Install cc Wrapper Script
      become: true
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/claude-code/cc"
        dest: /var/local/claude-code/cc
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - launchers

    # Claude Code writes its session state — full conversation transcripts,
    # verbatim pre-edit file bodies in file-history/, shell snapshots, prompt
    # history — as plaintext under ~/.claude. Anthropic documents that this
    # state is NOT encrypted at rest and that OS file permissions are its only
    # protection:
    #   https://code.claude.com/docs/en/claude-directory  ("Plaintext storage")
    #
    # The cc wrapper above now sets a restrictive umask, so state created from
    # here on is owner-only. These three tasks repair the state that was written
    # before that umask existed. Plan 00098 measured 887 of 990 files and 331 of
    # 348 directories carrying group/other bits in a single store.
    #
    # See CLAUDE/Plan/00098-encrypted-claude-transcripts-at-rest/PLAN.md
    - name: Check Whether the Claude Code State Directory Exists
      ansible.builtin.stat:
        path: "{{ claude_state_dir }}"
      register: claude_state

    # Probe-then-act: find's output is inspected explicitly by the tasks below,
    # so a genuine error still stops the play.
    - name: Find Claude Code State Entries With Group or Other Permissions
      ansible.builtin.command:
        # argv (list form) bypasses Ansible 2.19's split_args parser entirely,
        # so find's parentheses need no shell quoting.
        #
        # -perm /077 matches any entry with ANY group or other bit set, so a
        # re-run after the repair matches nothing — that is what makes this
        # idempotent without a `creates:` guard.
        #
        # -type f/-type d deliberately EXCLUDES symlinks: chmod on a symlink
        # applies to its target, which may live outside this tree.
        argv:
          - find
          - "{{ claude_state_dir }}"
          - (
          - -type
          - f
          - -o
          - -type
          - d
          - )
          - -perm
          - /077
          - -print
      register: claude_state_offenders
      changed_when: false
      when: claude_state.stat.exists

    - name: Restrict Claude Code State to the Owner
      ansible.builtin.command:
        # `chmod go=` removes group/other bits and leaves OWNER bits untouched.
        # This matters: a blanket restrictive mode would strip the execute bit
        # from every executable in the tree (129 of them in the store Plan 00098
        # measured — plugin and skill scripts, plus backups of executables).
        argv:
          - find
          - "{{ claude_state_dir }}"
          - (
          - -type
          - f
          - -o
          - -type
          - d
          - )
          - -perm
          - /077
          - -exec
          - chmod
          - go=
          - "{}"
          - +
      changed_when: true
      when:
        - claude_state.stat.exists
        - claude_state_offenders.stdout_lines | length > 0

    # Fail fast: a repair that silently left files exposed is worse than no
    # repair, because the summary would report the store as protected.
    - name: Assert No Claude Code State Entry Is Group or Other Accessible
      ansible.builtin.command:
        argv:
          - find
          - "{{ claude_state_dir }}"
          - (
          - -type
          - f
          - -o
          - -type
          - d
          - )
          - -perm
          - /077
          - -print
      register: claude_state_remaining
      changed_when: false
      failed_when: claude_state_remaining.stdout_lines | length > 0
      when: claude_state.stat.exists

    - name: Configure Claude Code Shell Integration
      ansible.builtin.blockinfile:
        path: "/home/{{ user_login }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED: Claude Code Integration"
        block: |
          # Claude Code CLI alias and PATH
          # cc is a wrapper script — see /var/local/claude-code/cc
          export PATH="$HOME/.local/bin:$PATH"
          alias cc='/var/local/claude-code/cc'
        create: false

    - name: Verify Claude Code Installation
      ansible.builtin.shell: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        # Capture each value into a variable first so a failing probe trips
        # set -e (command substitutions inline in echo do not fail the echo).
        claude_version=$(claude --version)
        claude_location=$(which claude)
        ripgrep_version=$(rg --version | head -1)
        jq_version=$(jq --version)
        echo "Claude Code Version: ${claude_version}"
        echo "Claude Code Location: ${claude_location}"
        echo "Dependencies Available:"
        echo "  - ripgrep: ${ripgrep_version}"
        echo "  - jq: ${jq_version}"
      args:
        executable: /bin/bash
      environment:
        HOME: "/home/{{ user_login }}"
      register: claude_code_verification
      changed_when: false

    - name: Display Claude Code Installation
      ansible.builtin.debug:
        msg: "{{ claude_code_verification.stdout_lines }}"

    # ccy refuses every interactive launch without tmux, so it is a dependency of THIS
    # play, not only of play-tmux-sessions.yml (which runs later in playbook-main.yml and
    # owns the configuration). Installing it here too keeps a standalone run of this play
    # on a fresh host working; the package task is idempotent.
    - name: Install tmux and fzf (ccy runs every session inside tmux; ccy-sessions picks with fzf)
      become: true
      ansible.builtin.package:
        name:
          - tmux
          - fzf
        state: present

    - name: Ensure the User Bin Directory Exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      tags:
        - scripts
        - launchers

    # The human way back to a session whose terminal died: lists every CCY tmux session,
    # attaches a detached one by number, ends one on request. Sources lib/tmux-session.bash
    # from the install above, so it ships with ccy rather than with the tmux play.
    - name: Deploy the ccy-sessions Command
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ccy-sessions"
        dest: "/home/{{ user_login }}/.local/bin/ccy-sessions"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      tags:
        - scripts
        - launchers

    # =========================================================================
    # Restore ccy sessions after a reboot — OPT-IN (Plan 00135, issue #44)
    # =========================================================================
    # Every ccy and cc session writes a record while it runs (lib/session-registry.bash);
    # `ccy-sessions restore` starts the recorded ones again at boot. The unit is always
    # deployed, so `systemctl --user start ccy-sessions-restore` works on any host, but it
    # is ENABLED only where `ccy_restore_sessions: true` is declared in host_vars — a
    # laptop rebooted daily does not want four agents resuming at login, and the default
    # must stay exactly today's behaviour.
    #
    # Linger is NOT enabled here: play-systemd-user-tweaks.yml owns it, and two owners of
    # one fact is how the second one to be edited wins silently. It is what makes
    # default.target reachable at boot without a login, so restore before login depends
    # on that play having run — it is in playbook-main's core path.
    - name: Ensure the User Systemd Unit Directory Exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy the ccy Session Restore Unit
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/ccy-sessions-restore.service"
        dest: "/home/{{ user_login }}/.config/systemd/user/ccy-sessions-restore.service"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    # Resolved, never defaulted: a guessed uid points the user-manager calls below at
    # another user's runtime directory without failing (play-container-watch.yml has the
    # history). `fail_key: false` hands the verdict to the assert, whose message names the
    # problem; getent still sets the key to None for a missing user, so `is not none` must
    # be tested before `[1]` is indexed.
    - name: Resolve The Session User UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
        fail_key: false

    - name: Assert The Session User Exists
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][user_login] is defined
          - ansible_facts['getent_passwd'][user_login] is not none
          - ansible_facts['getent_passwd'][user_login][1] | int > 0
        fail_msg: >-
          Could not resolve a uid for {{ user_login }}, so this play cannot find that
          user's systemd manager. It would otherwise guess, and a guessed uid points
          at the wrong runtime directory without failing.

    # Opted in: enable, then reload as its OWN task AFTER the enable, then read back.
    # The module's `daemon_reload:` runs BEFORE it changes the enabled state, so it re-reads
    # a directory that does not yet hold the wants-symlink the same task is about to
    # create; `is-enabled` then says enabled (it reads the filesystem) while the live
    # manager does not pull the unit in. play-host-health-login-report.yml measured that
    # and this follows it: the read-back asks the live manager, not the disk.
    - name: Enable the ccy Session Restore Unit
      ansible.builtin.systemd:
        name: ccy-sessions-restore.service
        scope: user
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      when: ccy_restore_sessions | default(false) | bool

    # Not opted in: the unit stays deployed and the wants-symlink goes. `state: absent` is
    # idempotent and cannot fail on a host that never enabled it, which `disable` would.
    - name: Leave the ccy Session Restore Unit Disabled
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user/default.target.wants/ccy-sessions-restore.service"
        state: absent
      when: not (ccy_restore_sessions | default(false) | bool)

    - name: Reload The User Manager So It Sees The Restore Unit's Enabled State
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"

    - name: Read Back Whether The Live Manager Pulls In The Restore Unit
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - list-dependencies
          - default.target
          - --no-pager
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      register: ccy_restore_readback
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-fail — the verdict is the next task

    - name: Assert The Restore Unit's Live State Matches The Opt-In
      ansible.builtin.fail:
        msg: >-
          {% if ccy_restore_readback.rc != 0 %}
          The running user manager could not be asked what default.target pulls in
          (`systemctl --user list-dependencies` exited {{ ccy_restore_readback.rc }}:
          {{ ccy_restore_readback.stderr | default('') }}), so whether
          ccy-sessions-restore.service will run at boot is unknown. This usually means no
          user manager is reachable for {{ user_login }} — play-systemd-user-tweaks.yml
          (part of playbook-main.yml) starts it.
          {% elif ccy_restore_sessions | default(false) | bool %}
          ccy-sessions-restore.service is enabled on disk but default.target does not name it
          in the running user manager, so it will not run at boot.
          {% else %}
          ccy-sessions-restore.service is still named by default.target in the running user
          manager although it is not opted in.
          {% endif %}
          Collect, on the host:
          `systemctl --user list-dependencies default.target --no-pager | cat`,
          `ls -l ~/.config/systemd/user/default.target.wants/ | cat`
          and `systemctl --user show ccy-sessions-restore.service -p LoadState -p UnitFileState -p WantedBy --no-pager | cat`.
      when: >-
        ccy_restore_readback.rc != 0
        or (('ccy-sessions-restore.service' in ccy_restore_readback.stdout)
            != (ccy_restore_sessions | default(false) | bool))

    - name: Create Claude YOLO Root Directory
      ansible.builtin.file:
        path: /home/{{ user_login }}/.claude-tokens/ccy
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"

    - name: Create Claude YOLO Tokens Directory
      ansible.builtin.file:
        path: /home/{{ user_login }}/.claude-tokens/ccy/tokens
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"

    - name: Create Claude YOLO Projects Directory
      ansible.builtin.file:
        path: /home/{{ user_login }}/.claude-tokens/ccy/projects
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"

    - name: Calculate Dockerfile Hash for Build
      ansible.builtin.shell: md5sum /opt/claude-yolo/Dockerfile | cut -d' ' -f1 | cut -c1-16
      register: dockerfile_hash
      changed_when: false

    - name: Build Claude YOLO Container Image with Hash
      ansible.builtin.command: >
        {{ container_engine }} build
        --build-arg DOCKERFILE_HASH={{ dockerfile_hash.stdout }}
        -t claude-yolo:latest
        /opt/claude-yolo
      register: container_build
      changed_when: "'Successfully built' in container_build.stdout or 'Successfully tagged' in container_build.stdout or container_build.rc == 0"

    - name: Verify Container Image
      ansible.builtin.command: "{{ container_engine }} image inspect claude-yolo:latest"
      register: image_verify
      changed_when: false

    # =========================================================================
    # Retired claude-browser artifact cleanup — remove all remnants of the retired claude-browser system
    # =========================================================================

    - name: Remove claude-browser:latest Container Image
      ansible.builtin.command: "{{ container_engine }} rmi claude-browser:latest"
      register: rmi_result
      failed_when: false  # FAIL-FAST-OK: image may not exist (already cleaned up)
      changed_when: rmi_result.rc == 0
      tags:
        - cleanup
        - browser

    - name: Remove /opt/claude-browser Build Context Directory
      become: true
      ansible.builtin.file:
        path: /opt/claude-browser
        state: absent
      tags:
        - cleanup
        - browser

    - name: Remove claude-browser Wrapper Script
      become: true
      ansible.builtin.file:
        path: /var/local/claude-yolo/claude-browser
        state: absent
      tags:
        - cleanup
        - browser

    - name: Remove claude-browser Bashrc Include (Root)
      become: true
      ansible.builtin.file:
        path: /root/.bashrc-includes/claude-browser.bash
        state: absent
      tags:
        - cleanup
        - browser

    - name: Remove claude-browser Bashrc Include (User)
      ansible.builtin.file:
        path: /home/{{ user_login }}/.bashrc-includes/claude-browser.bash
        state: absent
      tags:
        - cleanup
        - browser

    - name: Notify About Retired claude-browser Token Data
      ansible.builtin.debug:
        msg:
          - "ℹ️  Retired claude-browser token data preserved at ~/.claude-tokens/ccb/"
          - "   Remove manually if no longer needed:"
          - "   rm -rf ~/.claude-tokens/ccb/"
      tags:
        - cleanup
        - browser

    # =========================================================================
    # claude-yolo-browser (Distrobox) Artifact Cleanup — retired experiment
    # =========================================================================

    - name: Remove claude-yolo-browser Wrapper Script
      become: true
      ansible.builtin.file:
        path: /var/local/claude-yolo/claude-yolo-browser
        state: absent
      tags:
        - cleanup
        - distrobox

    - name: Remove claude-yolo-browser Bashrc Include (Root)
      become: true
      ansible.builtin.file:
        path: /root/.bashrc-includes/claude-yolo-browser.bash
        state: absent
      tags:
        - cleanup
        - distrobox

    - name: Remove claude-yolo-browser Bashrc Include (User)
      ansible.builtin.file:
        path: /home/{{ user_login }}/.bashrc-includes/claude-yolo-browser.bash
        state: absent
      tags:
        - cleanup
        - distrobox

    - name: Remove playwright-tests Distrobox Container
      ansible.builtin.command: distrobox rm playwright-tests --force
      register: distrobox_rm_result
      failed_when: false  # FAIL-FAST-OK: container may not exist (already cleaned up)
      changed_when: distrobox_rm_result.rc == 0
      tags:
        - cleanup
        - distrobox

