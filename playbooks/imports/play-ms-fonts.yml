#!/usr/bin/env ansible-playbook
---
- hosts: desktop
  name: MS Fonts
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - curl
          - cabextract
          - xorg-x11-font-utils
          - fontconfig

    - name: Install Fonts
      ansible.builtin.shell: |
        set -euo pipefail
        rpm --nodigest -i https://downloads.sourceforge.net/project/mscorefonts2/rpms/msttcore-fonts-installer-2.6-1.noarch.rpm
      args:
        creates: /usr/share/fonts/msttcore
        executable: /bin/bash
