#!/usr/bin/env ansible-playbook
---
# Reconcile iptables for LXC outbound connectivity on Docker hosts.
#
# WHY THIS IS A SEPARATE PLAY (NOT INSIDE play-lxc-install-config.yml):
# playbook-main.yml runs LXC (line 16) BEFORE Docker (line 21). On a fresh
# provisioning run, any iptables work done inside the LXC play happens
# before Docker has had a chance to create DOCKER-USER and flip FORWARD to
# DROP. This play runs AFTER play-docker.yml, so both LXC and Docker are
# guaranteed present.
#
# THE PROBLEM THIS FIXES:
# On a Docker host, Docker sets FORWARD policy to DROP and inserts the
# DOCKER-USER chain at the top of FORWARD. lxc-net's per-bridge ACCEPT
# rules live in FORWARD but never execute because DOCKER-USER short-
# circuits first. In addition, the MASQUERADE rule for the LXC subnet can
# disappear during a bridge-recovery sequence (stop containers → stop
# lxc-net → ip link delete lxcbr0 → start lxc-net). Net result:
# containers boot, get IPs, accept SSH, but have zero outbound TCP
# connectivity (curl exit 28, not 6 — DNS works, TCP itself is dropped).
#
# WHAT THIS PLAY DOES:
# Three iptables rules added idempotently via probe-then-act:
#   1. -I DOCKER-USER -i lxcbr0 -j ACCEPT       (container → internet)
#   2. -I DOCKER-USER -o lxcbr0 -j ACCEPT       (internet → container reply)
#   3. -t nat -I POSTROUTING -s <subnet> ! -o lxcbr0 -j MASQUERADE
#
# The LXC subnet is derived from the live lxcbr0 interface so a customised
# LXC_NETWORK in /etc/sysconfig/lxc-net continues to work.
#
# This repo's IaC always installs Docker (playbook-main.yml line 21,
# unconditional). DOCKER-USER MUST exist by the time we reach this play —
# we assert it, fail-fast style, rather than probing for a non-existent
# fallback case.
#
# CAVEAT: these rules are runtime-only — they vanish on host reboot or on
# a Docker daemon restart (which flushes DOCKER-USER). Re-running this
# playbook restores them.
#
# Ported from BallicomDev/ballicom-infra#463 via fedora-desktop#21, then
# restructured to run after Docker rather than during LXC install.
- hosts: desktop
  name: Reconcile LXC iptables for Docker Host
  become: true
  tasks:
    - name: Assert DOCKER-USER chain exists (Docker must have installed first)
      ansible.builtin.command: iptables -n -L DOCKER-USER
      register: docker_user_chain_check
      changed_when: false
      tags: [lxc_iptables]

    - name: Assert lxcbr0 bridge is up (lxc-net must be running)
      ansible.builtin.command: ip link show lxcbr0
      register: lxcbr0_check
      changed_when: false
      tags: [lxc_iptables]

    - name: Derive LXC subnet CIDR from live lxcbr0 interface
      ansible.builtin.shell: |
        set -o pipefail
        ip -o -4 route show dev lxcbr0 proto kernel | awk '{print $1}' | head -n1
      args:
        executable: /bin/bash
      register: lxc_subnet_cidr
      changed_when: false
      tags: [lxc_iptables]

    - name: Validate LXC subnet CIDR was derived
      ansible.builtin.assert:
        that:
          - lxc_subnet_cidr.stdout | length > 0
          - "'/' in lxc_subnet_cidr.stdout"
        fail_msg: "Could not derive lxcbr0 subnet from `ip route show dev lxcbr0 proto kernel`. Is lxc-net running and lxcbr0 up?"
      tags: [lxc_iptables]

    - name: Probe iptables ACCEPT rule (container → internet) in DOCKER-USER
      ansible.builtin.command: "iptables -C DOCKER-USER -i lxcbr0 -j ACCEPT"
      register: iptables_accept_out
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-act — rc explicitly checked below
      tags: [lxc_iptables]

    - name: Insert iptables ACCEPT rule (container → internet)
      ansible.builtin.command: "iptables -I DOCKER-USER -i lxcbr0 -j ACCEPT"
      when: iptables_accept_out.rc != 0
      tags: [lxc_iptables]

    - name: Probe iptables ACCEPT rule (internet → container) in DOCKER-USER
      ansible.builtin.command: "iptables -C DOCKER-USER -o lxcbr0 -j ACCEPT"
      register: iptables_accept_in
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-act — rc explicitly checked below
      tags: [lxc_iptables]

    - name: Insert iptables ACCEPT rule (internet → container)
      ansible.builtin.command: "iptables -I DOCKER-USER -o lxcbr0 -j ACCEPT"
      when: iptables_accept_in.rc != 0
      tags: [lxc_iptables]

    - name: Probe iptables MASQUERADE rule for LXC subnet
      ansible.builtin.command: "iptables -t nat -C POSTROUTING -s {{ lxc_subnet_cidr.stdout }} ! -o lxcbr0 -j MASQUERADE"
      register: iptables_masquerade
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-act — rc explicitly checked below
      tags: [lxc_iptables]

    - name: Insert iptables MASQUERADE rule for LXC subnet
      ansible.builtin.command: "iptables -t nat -I POSTROUTING -s {{ lxc_subnet_cidr.stdout }} ! -o lxcbr0 -j MASQUERADE"
      when: iptables_masquerade.rc != 0
      tags: [lxc_iptables]
