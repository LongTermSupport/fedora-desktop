#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# This play installs the Go toolchain: what building Go code needs, and nothing else.
# play-claude-yolo.yml imports it because its commands are Go binaries, and that play is
# on the unattended self-update path, so no developer QA tooling may live here. The Go QA
# tools (golangci-lint, and the gcc that `go test -race` links against) are installed with
# the rest of the QA toolchain by play-python.yml.
- hosts: desktop
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    - name: Install Golang
      become: true
      ansible.builtin.dnf:
        name: golang
