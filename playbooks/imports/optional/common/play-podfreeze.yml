#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# podfreeze is a Go binary built from this checkout (src-go/cmd/podfreeze), so the Go toolchain
# is installed first. play-golang.yml stays its one source of truth.
- import_playbook: ../../play-golang.yml

# podfreeze — freeze/thaw Podman containers by name, network, or CCY group.
#
# Builds and installs ~/.local/bin/podfreeze, and shells out to the `podman` CLI installed by
# playbooks/imports/play-podman.yml (a core play imported by playbook-main.yml, so it is always
# present). Nothing else is added to the host but the optional picker, fzf.
#
# One artefact. The group menu, the drill-down, the derived verb, the dry run and the act loop are
# in the binary, shared with `lxcfreeze` as one Go package (src-go/internal/freeze), so the two
# tools cannot drift into different habits for the same job (Plan 00122 Phase 4). The build and
# install is tasks/deploy-freeze.yml, which both plays import with their own tool name.
#
# WHY A WRAPPER AND NOT JUST `podman pause`:
#   - `podman pause --filter network=X` already exists, but you act on a set you
#     never saw, and you have to know the flag names to reach a group at all.
#     The wrapper's interactive form is a menu of GROUPS — all CCY containers,
#     all containers, everything on a given network — each row saying what
#     choosing it does right now ("FREEZE 8", "THAW 3"). It acts, refreshes,
#     and returns to the menu.
#   - The verb is derived rather than asked: anything running is frozen, a set
#     with nothing running is thawed, so the same choice twice toggles it.
#   - podman-tui / Cockpit / lazydocker / ctop all act on one container at a
#     time and have no concept of a CCY session group.
#
# `podman pause` is the cgroup freezer, NOT suspend-to-disk: frozen containers
# do not survive a reboot. The reboot-surviving equivalent (`podman container
# checkpoint`, CRIU) requires root and is unavailable on this rootless setup.
- hosts: desktop
  name: Podman Freeze — freeze/thaw containers by name, network, or CCY group
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    podfreeze_binary: "/home/{{ user_login }}/.local/bin/podfreeze"
  tasks:
    # =========================================================================
    # The tool itself: fzf, ~/.local/bin, the Go build and install, and the
    # removal of the bash tool's library
    # =========================================================================

    - name: Deploy the Freeze Tool
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/deploy-freeze.yml"
      vars:
        freeze_tool: podfreeze
      tags:
        - podfreeze

    # The tool shipped for part of one day as `podman-freeze` before being
    # shortened. The removal belongs HERE, not in the plan's deploy.bash: that
    # script is one way to run this play and the play is directly runnable
    # without it, and the plan folder leaves with the plan when it moves to
    # Completed/ — so a migration living there disappears while any un-migrated
    # machine keeps both binaries. Two builds of one tool on PATH means the
    # behaviour you get depends on which name you happen to type.
    - name: Remove the Pre-Rename podman-freeze Binary
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin/podman-freeze"
        state: absent
      tags:
        - podfreeze

    - name: Podman Freeze Ready
      ansible.builtin.debug:
        msg:
          - "✓ podfreeze deployed to {{ podfreeze_binary }}"
          - ""
          - "  podfreeze                         menu of groups; acts, then repeats"
          - "  podfreeze list                    running and frozen containers"
          - "  podfreeze freeze NAME             freeze one by name"
          - "  podfreeze freeze --ccy            freeze every CCY session"
          - "  podfreeze freeze --network NET -n preview a network freeze"
          - "  podfreeze freeze --github ID      every session on that GitHub account"
          - "  podfreeze thaw --all              thaw everything frozen"
          - "  podfreeze --help                  full usage"
          - ""
          - "  --github / --token / --ssh-key read labels CCY sets at launch, so"
          - "  they see only sessions started by CCY 3.40.0 or later."
          - ""
          - "  Freezing is the cgroup freezer, not suspend-to-disk — frozen"
          - "  containers do NOT survive a reboot."
          - ""
          - "  The LXC counterpart is 'lxcfreeze' (play-lxcfreeze.yml). Both are"
          - "  built from the same Go package, so both offer the same menu,"
          - "  drill-down and keys."
      tags:
        - podfreeze
