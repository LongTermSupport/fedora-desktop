#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# LastPass Setup - Supports both single and multi-account configurations
#
# Accounts come from lastpass_accounts in host_vars, a mapping of name to email; one
# account is {default: user@example.com}. See docs/configuration.md#lastpass-accounts.
#
# A run with no terminal (an unattended optional-play run) never waits: Ansible returns an
# empty answer for every pause, the repo-wide signal for "nobody can be asked". Such a run
# installs lastpass-cli and writes the shell blocks, skips login and logout, and fails fast
# when lastpass_accounts is not declared. A person at a terminal is asked whether to log in;
# the login proves the password and MFA work, and every account is logged out at the end.
- hosts: desktop
  name: LastPass Configuration
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
    vault_file: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
  tasks:
    - name: Install LastPass CLI
      become: true
      ansible.builtin.package:
        name: lastpass-cli
        state: present

    - name: Check if LastPass is configured
      ansible.builtin.set_fact:
        lastpass_configured: "{{ lastpass_accounts is defined and lastpass_accounts | length > 0 }}"

    # CONFIGURATION SETUP
    - block:
        - name: Ask for configuration type
          ansible.builtin.pause:
            prompt: |2

              ========================================================================
              LASTPASS CONFIGURATION
              ========================================================================

              How many LastPass accounts do you want to configure?

              1 - Single account (simple, uses default 'lpass' command)
              2 - Multiple accounts (creates aliases like lpass-work, lpass-personal)

              Enter choice (1 or 2)
          register: config_choice

        # An empty answer is ENTER, or a run with no terminal, where Ansible does not wait.
        - name: Stop when lastpass_accounts is not declared and no choice was given
          ansible.builtin.fail:
            msg: >-
              lastpass_accounts is not declared and no choice was given (a run with no
              terminal cannot be asked). Declare it in {{ vault_file }} as a mapping of
              account name to email, then run this play again. One account uses the
              single name default (lastpass_accounts, then default: user@example.com
              indented under it); several accounts take one name per account (work:
              user@example.com, personal: user2@example.com). See
              docs/configuration.md#lastpass-accounts.
          when: (config_choice.user_input | default('') | trim | length) == 0

        - name: Stop if the choice was not 1 or 2
          ansible.builtin.fail:
            msg: >-
              "{{ config_choice.user_input | default('') }}" is not one of the choices. Nothing was
              saved; run this play again and type 1 (one account) or 2 (several).
          when: (config_choice.user_input | default('') | trim) not in ['1', '2']

        - name: Get single account details
          ansible.builtin.pause:
            prompt: "Enter your LastPass email address"
          register: single_email
          when: config_choice.user_input == "1"

        - name: Get multiple account details
          ansible.builtin.pause:
            prompt: |2

              Enter your LastPass accounts as comma-separated name:email pairs.

              Example: work:user@example.com,personal:user2@example.com

              The names will be used for aliases (e.g., lpass-work, lpass-personal)

              Enter accounts
          register: multi_accounts
          when: config_choice.user_input == "2"

        - name: Parse multi-account input
          ansible.builtin.set_fact:
            parsed_accounts: |
              {% set accounts = {} %}
              {% for pair in multi_accounts.user_input.split(',') %}
              {%   set parts = pair.strip().split(':') %}
              {%   if parts | length == 2 %}
              {%     set _ = accounts.update({parts[0].strip(): parts[1].strip()}) %}
              {%   endif %}
              {% endfor %}
              {{ accounts }}
          when: config_choice.user_input == "2"

        - name: Stop if no account was given
          ansible.builtin.fail:
            msg: >-
              No LastPass account was given (for several accounts, the form is
              name:email,name:email). Nothing was saved; run this play again.
          when: >-
            (config_choice.user_input == "1" and (single_email.user_input | default('') | trim | length == 0))
            or (config_choice.user_input == "2" and ((parsed_accounts | string | trim) in ['{}', '']))

        # One task owns the block: the choice picks its content, not which task writes it.
        - name: Write the account configuration
          ansible.builtin.blockinfile:
            path: "{{ vault_file }}"
            marker: "# {mark} ANSIBLE MANAGED: LastPass Configuration"
            block: |
              {% if config_choice.user_input == "1" %}
              # LastPass single account
              lastpass_accounts:
                default: "{{ single_email.user_input }}"
              {% else %}
              # LastPass accounts
              lastpass_accounts:
              {% for name, email in parsed_accounts.items() %}
                {{ name }}: "{{ email }}"
              {% endfor %}
              {% endif %}
          when: config_choice.user_input in ["1", "2"]

        - name: Reload variables
          ansible.builtin.include_vars: "{{ vault_file }}"
        # A person just answered at a terminal, so the login below needs no second question.
        - name: Update lastpass_configured
          ansible.builtin.set_fact:
            lastpass_configured: true
            lastpass_accounts_just_entered: true
      when: not lastpass_configured

    - name: Assert lastpass_accounts is a mapping of account name to email
      ansible.builtin.assert:
        that:
          - lastpass_accounts is mapping
          - lastpass_accounts | length > 0
          - lastpass_accounts.values() | select('string') | select('match', '^[^@ ]+@[^@ ]+$') | list | length == lastpass_accounts | length
        fail_msg: >-
          lastpass_accounts must be a mapping of account name to email: the single name
          default for one account (default: user@example.com), or one name per account
          for several (work: user@example.com, personal: user2@example.com). Fix it in
          {{ vault_file }} and run this play again; see docs/configuration.md#lastpass-accounts.

    # ACCOUNT SETUP - works for both single and multi account
    - name: Create LastPass home directories
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.lpass-{{ item.key }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"
      loop: "{{ lastpass_accounts | dict2items }}"

    # LOGIN GATE. A run with no terminal gets an empty answer here at once, so it skips
    # the login; so does ENTER. A person who just entered the accounts above is not asked.
    - name: Ask whether to log in to LastPass now
      ansible.builtin.pause:
        prompt: |2

          ========================================================================
          LASTPASS LOGIN
          ========================================================================

          Log in to every configured LastPass account now? It asks for each master
          password (and MFA), proves they work and syncs the vault; every account is
          logged out again at the end of this play.

          Type y to log in, or press ENTER to skip
      register: lastpass_login_answer
      when: not (lastpass_accounts_just_entered | default(false))

    - name: Decide whether this run logs in to LastPass
      ansible.builtin.set_fact:
        lastpass_login_now: >-
          {{ (lastpass_accounts_just_entered | default(false))
             or ((lastpass_login_answer.user_input | default('') | trim | lower) in ['y', 'yes']) }}

    - name: Say how to log in to LastPass by hand
      ansible.builtin.debug:
        msg: >-
          LastPass login skipped: no answer was given (a run with no terminal cannot be
          asked). lastpass-cli is installed and the shell configuration is written. Log in
          by hand in a new shell with
          {% if lastpass_accounts | length == 1 and 'default' in lastpass_accounts %}lpass login {{ lastpass_accounts.default }}{% else %}lpass-login NAME (one of {{ lastpass_accounts.keys() | join(', ') }}){% endif %},
          or run this play again at a terminal and type y.
      when: not lastpass_login_now

    # The play needs the lpass agent between login and sync, so a shell that exported
    # LPASS_AGENT_DISABLE (the blocks below do) must not pass it on to these tasks.
    - name: Log in to LastPass accounts
      when: lastpass_login_now
      block:
        - name: Check authentication status
          ansible.builtin.shell: |
            set -euo pipefail
            unset LPASS_AGENT_DISABLE
            # grep -q exits non-zero when not logged in; the echo of needs_auth is the intended probe result  # FAIL-FAST-OK: probe output drives login decision
            LPASS_HOME=/home/{{ user_login }}/.lpass-{{ item.key }} lpass status 2>&1 | grep -q "Logged in as {{ item.value }}" && echo "authenticated" || echo "needs_auth"
          args:
            executable: /bin/bash
          register: auth_status
          changed_when: false
          failed_when: false  # FAIL-FAST-OK: probe — checking if accounts are authenticated
          loop: "{{ lastpass_accounts | dict2items }}"

        - name: Display authentication status
          ansible.builtin.debug:
            msg: |
              {% if lastpass_accounts | length == 1 and 'default' in lastpass_accounts %}
              LastPass account: {{ 'Already authenticated ✓' if item.stdout == 'authenticated' else 'Needs authentication' }}
              {% else %}
              Account '{{ item.item.key }}': {{ 'Already authenticated ✓' if item.stdout == 'authenticated' else 'Needs authentication' }}
              {% endif %}
          loop: "{{ auth_status.results }}"

        # A failed login or sync fails the play here, before anything is logged out.
        - name: Login to LastPass accounts
          ansible.builtin.shell: |
            set -euo pipefail
            unset LPASS_AGENT_DISABLE
            export LPASS_HOME=/home/{{ user_login }}/.lpass-{{ item.item.key }}
            lpass login {{ item.item.value }}
            lpass sync
          args:
            executable: /bin/bash
          when: item.stdout != "authenticated"
          changed_when: item.stdout != "authenticated"
          loop: "{{ auth_status.results }}"

    # SINGLE ACCOUNT - just set default LPASS_HOME
    - block:
        - name: Set default LPASS_HOME for single account
          ansible.builtin.blockinfile:
            path: "/home/{{ user_login }}/.bashrc"
            marker: "# {mark} ANSIBLE MANAGED: LastPass Default"
            block: |
              # LastPass default configuration
              export LPASS_HOME=$HOME/.lpass-default
              # No decryption-key agent: every lpass command asks for the master password
              export LPASS_AGENT_DISABLE=1

        - name: Display single account completion
          ansible.builtin.debug:
            msg: |
              ========================================================================
              LastPass Setup Complete!
              ========================================================================

              Account: {{ lastpass_accounts.default }}

              You can now use 'lpass' commands directly: lpass login {{ lastpass_accounts.default }}
              The play leaves the account logged out, and LPASS_AGENT_DISABLE=1 keeps no
              key agent, so every lpass command asks for the master password.
              Restart your shell or run: source ~/.bashrc
              ========================================================================
      when: lastpass_accounts | length == 1 and 'default' in lastpass_accounts

    # MULTI-ACCOUNT - create aliases
    - block:
        - name: Create LastPass aliases include file
          ansible.builtin.blockinfile:
            path: "/home/{{ user_login }}/.bashrc-includes/lastpass-aliases.inc.bash"
            create: true
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0644"
            marker: "# {mark} ANSIBLE MANAGED: LastPass Multi-Account Aliases"
            block: |
              # LastPass Multi-Account Aliases
              {% for name in lastpass_accounts.keys() %}
              alias lpass-{{ name }}='LPASS_HOME=$HOME/.lpass-{{ name }} lpass'
              {% endfor %}

              # Status check for all accounts
              function lpass-status() {
                  echo "LastPass Account Status:"
                  echo "========================"
                  {% for name in lastpass_accounts.keys() %}
                  printf "%-15s: " "{{ name }}"
                  LPASS_HOME=$HOME/.lpass-{{ name }} lpass status 2>&1 | grep -oP "Logged in as \K.*" || echo "Not logged in"
                  {% endfor %}
              }

              # Quick login helper
              function lpass-login() {
                  case "$1" in
                      {% for name, email in lastpass_accounts.items() %}
                      {{ name }})
                          LPASS_HOME=$HOME/.lpass-{{ name }} lpass login {{ email }}
                          ;;
                      {% endfor %}
                      *)
                          echo "Usage: lpass-login <account>"
                          echo "Available: {% for name in lastpass_accounts.keys() %}{{ name }}{% if not loop.last %}, {% endif %}{% endfor %}"
                          return 1
                          ;;
                  esac
              }

              # Set default to first account
              {% set first_account = lastpass_accounts.keys() | first %}
              export LPASS_HOME=$HOME/.lpass-{{ first_account }}

              # No decryption-key agent: every lpass command asks for the master password
              export LPASS_AGENT_DISABLE=1


        - name: Display multi-account completion
          ansible.builtin.debug:
            msg: |
              ========================================================================
              LastPass Multi-Account Setup Complete!
              ========================================================================

              Configured accounts:
              {% for name in lastpass_accounts.keys() %}
                - lpass-{{ name }}
              {% endfor %}

              Commands available after reloading shell:
                lpass-status       - Check all accounts
                lpass-login <name> - Login to specific account
                lpass-<name>       - Use specific account

              The play leaves every account logged out, and LPASS_AGENT_DISABLE=1 keeps no
              key agent, so every lpass command asks for the master password.
              Restart shell or run: source ~/.bashrc
              ========================================================================
      when: lastpass_accounts | length > 1 or 'default' not in lastpass_accounts

    # Last, after the sync above: nothing stays logged in once the login has proved the
    # password and MFA. A logout that fails fails the play.
    - name: Log out of every LastPass account
      ansible.builtin.shell: |
        set -euo pipefail
        unset LPASS_AGENT_DISABLE
        LPASS_HOME=/home/{{ user_login }}/.lpass-{{ item.key }} lpass logout --force
      args:
        executable: /bin/bash
      register: lastpass_logout
      # lpass ends a logout that removed a session with the line "Log out: complete."
      changed_when: "'complete' in lastpass_logout.stdout"
      loop: "{{ lastpass_accounts | dict2items }}"
      when: lastpass_login_now
