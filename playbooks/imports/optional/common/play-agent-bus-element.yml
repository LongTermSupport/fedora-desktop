#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Element Desktop for the agent team bus (Plan 00161, DESIGN.md section 8). Optional: only
# a desktop whose human watches a team runs it.
#
# Installs the Element Desktop Flatpak system-wide (tasks/element-desktop.yml, shared with
# play-matrix-clients.yml), then, as user_login, writes one
# locked-down profile and launcher per agent_bus_element_teams entry through
# helpers/agent_bus/element.py, which owns the config.json keys and is tested for each, and
# removes the launcher and profile it wrote for a team that is not declared or is absent.
# Last, for a declared team whose v2 approved url is https, it places the team CA where
# Element reads it and fails unless a handshake from Element's sandbox trusts it
# (tasks/element-team-ca.yml, Plan 00246 SPEC-cross-network X34).
#
# The Element profile holds the human's Matrix session token, readable by every process of
# that user, so no agent may run as user_login: the helper refuses (exit 78) a user holding
# pingbus bundles, before anything is installed (the rule and its one exception:
# check_user in helpers/agent_bus/element.py), and agent-bus-claude and
# `pingbus config check` refuse a host member beside the profile this play writes.
#
# Teams live in the untracked host_vars localhost.yml (see localhost.yml.dist).
- hosts: desktop
  name: Agent team bus Element Desktop profiles
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: developer   # all | developer — see CLAUDE/AnsibleStyle.md
    agent_bus_element_declared: "{{ agent_bus_element_teams | default([]) }}"
    # A team ccy-teams remove declared absent keeps its entry here (so it comes back with its
    # team) but gets no profile: the helper removes the launcher and profile of every team it
    # wrote one for that this list does not name, and never one this list names.
    agent_bus_element_absent: >-
      {{ agent_bus_teams | default([]) | selectattr('state', 'defined')
         | selectattr('state', 'equalto', 'absent') | map(attribute='team') | list }}
    agent_bus_element_profiles: >-
      {{ agent_bus_element_declared | rejectattr('team', 'in', agent_bus_element_absent) | list }}
    # Matches the helper's CHANGED<TAB><path> marker lines.
    agent_bus_element_changed_re: "^CHANGED\t"
    # Where an https team's CA is put for Element (tasks/element-team-ca.yml): nssdb or system,
    # chosen in host_vars by agent_bus_element_ca_store. The play's last task proves it.
    agent_bus_element_ca_default_store: nssdb
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    - name: Audience guard — end play on a consumer install
      ansible.builtin.meta: end_play
      when: install_audience != 'developer'

    - name: Check agent_bus_element_teams declares at least one team
      ansible.builtin.assert:
        that:
          - agent_bus_element_declared is sequence and agent_bus_element_declared is not string
          - agent_bus_element_declared | length > 0
        fail_msg: >-
          agent_bus_element_teams in
          {{ agent_bus_host_vars_file | default('environment/localhost/host_vars/localhost.yml') }} must list
          the teams user_login watches, each with team and base_url. See localhost.yml.dist.
        quiet: true
      tags: [agent-bus-element]

    # Read-only, so it runs in --check too, and before anything is installed.
    - name: Validate the profiles and refuse a user_login holding pingbus bundles
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv: [python3, -m, helpers.agent_bus.element, check]
        stdin: "{{ agent_bus_element_profiles | to_json }}"
        chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
      changed_when: false
      check_mode: false
      tags: [agent-bus-element]

    - name: Enable Flathub remote
      become: true
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        state: present
      tags: [agent-bus-element]

    # The install and the keyring grant (which must be in place before a profile's first start)
    # are written once, in tasks/element-desktop.yml, and play-matrix-clients.yml imports the
    # same file. This play still imports it because ccy-teams runs it on its own.
    - name: Install Element Desktop and let it reach the keyring
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/element-desktop.yml"
      tags: [agent-bus-element]

    - name: Write each team's Element profile and launcher, and remove those of teams not declared
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv: [python3, -m, helpers.agent_bus.element, apply]
        stdin: "{{ agent_bus_element_profiles | to_json }}"
        chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
      register: agent_bus_element_apply
      changed_when: agent_bus_element_apply.stdout_lines | select('match', agent_bus_element_changed_re) | list | length > 0
      tags: [agent-bus-element]

    # Last, because its last task is the proof: for each declared team whose approved url is
    # https, the team CA placed where Element reads it and a handshake from Element's sandbox
    # checked against it (SPEC-cross-network X34). A team with no v2 approval here is untouched.
    - name: Trust each https team's CA in Element Desktop, and prove it from Element's sandbox
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/element-team-ca.yml"
      vars:
        element_team_ca_teams: "{{ agent_bus_element_profiles | map(attribute='team') | list }}"
        element_team_ca_store: "{{ agent_bus_element_ca_store | default(agent_bus_element_ca_default_store) }}"
        # paths.StatusRoot/teams and paths.AdminStateRoot in src-go/internal/teamchat/paths.
        element_team_ca_approved_root: /var/lib/teamchat-status/teams
        element_team_ca_admin_root: /var/lib/teamchat-admin
      tags: [agent-bus-element]
