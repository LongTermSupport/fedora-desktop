#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Element Desktop for the agent team bus (Plan 00161, DESIGN.md section 8). Optional: only
# a desktop whose human watches a team runs it.
#
# agent_bus_element_teams is the teams this desktop's human watches, whatever the client. Each
# team opens in its own client:, else agent_bus_matrix_client, else element (Plan 00254
# DESIGN-client-choice.md); the first read-only task refuses any other value, and each
# client's steps get the whole list with client on every entry.
#
# Installs the Element Desktop Flatpak system-wide (tasks/element-desktop.yml, shared with
# play-matrix-clients.yml), then, as user_login, writes one locked-down profile and launcher per
# element team through helpers/agent_bus/element.py, which owns the config.json keys and is
# tested for each, and removes the launcher and profile it wrote for a team that is not declared
# or is absent; a team moved to Lightning loses its Element launcher and keeps its profile. For
# an element team whose v2 approved url is https, it places the team CA where Element reads it
# and fails unless a handshake from Element's sandbox trusts it (tasks/element-team-ca.yml,
# Plan 00246 SPEC-cross-network X34). Then Lightning (tag agent-bus-lightning, Plan 00254): it
# installs the Lightning Flatpak, places each https lightning team's CA where Lightning reads it
# and fails unless a handshake from Lightning's sandbox trusts it (tasks/lightning-team-ca.yml),
# then writes each lightning team's own instance, settings file and launcher through the Go
# command agent-bus-lightning (src-go/internal/lightning), and runs that command's diagnostics
# watchdog as the user service agent-bus-lightning-watch only while a lightning team has
# lightning_diagnostics true (Plan 00268). It caps every Lightning instance's memory
# (agent_bus_lightning_memory_max, 2G by default, no swap) with a drop-in on the app's Flatpak
# scopes, and a kill at the cap raises a desktop notification. Both Lightning steps are Go binaries
# built here, so the Go toolchain is installed first; play-golang.yml stays its one source of
# truth.
#
# The Element profile and the Lightning instance hold the human's Matrix session, readable by
# every process of that user, so no agent may run as user_login: each refuses (exit 78) a user holding
# pingbus bundles, before anything is installed (the rule and its one exception:
# check_user in helpers/agent_bus/element.py), and agent-bus-claude and
# `pingbus config check` refuse a host member beside the profile this play writes.
#
# Teams live in the untracked host_vars localhost.yml (see localhost.yml.dist).
- import_playbook: ../../play-golang.yml
  tags: [agent-bus-lightning]

- hosts: desktop
  name: Agent team bus Element Desktop profiles
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: developer   # all | developer — see CLAUDE/AnsibleStyle.md
    agent_bus_element_declared: "{{ agent_bus_element_teams | default([]) }}"
    # The Matrix client each team opens in (Plan 00254 DESIGN-client-choice.md): the team's own
    # client, else the home-level agent_bus_matrix_client, else element. The first read-only
    # task refuses any other value; each client's steps then get the whole list, with client on
    # every entry, so each can tell a team moved to the other client from one not declared.
    agent_bus_matrix_clients: [element, lightning]
    agent_bus_matrix_client_default: "{{ agent_bus_matrix_client | default('element') }}"
    # A team ccy-teams remove declared absent keeps its entry here (so it comes back with its
    # team) but gets no profile: the helper removes the launcher and profile of every team it
    # wrote one for that this list does not name, and never one this list names.
    agent_bus_element_absent: >-
      {{ agent_bus_teams | default([]) | selectattr('state', 'defined')
         | selectattr('state', 'equalto', 'absent') | map(attribute='team') | list }}
    agent_bus_element_present: >-
      {{ agent_bus_element_declared | rejectattr('team', 'in', agent_bus_element_absent) | list }}
    agent_bus_element_profiles: >-
      {{ ([{'client': agent_bus_matrix_client_default}] * (agent_bus_element_present | length))
         | zip(agent_bus_element_present) | map('list') | map('combine') | list }}
    agent_bus_element_element_teams: >-
      {{ agent_bus_element_profiles | selectattr('client', 'equalto', 'element') | list }}
    agent_bus_element_lightning_teams: >-
      {{ agent_bus_element_profiles | selectattr('client', 'equalto', 'lightning') | list }}
    # Whether a lightning team is traced (Plan 00268): the watchdog runs only then.
    agent_bus_lightning_diagnostics_on: >-
      {{ agent_bus_element_lightning_teams | selectattr('lightning_diagnostics', 'defined')
         | selectattr('lightning_diagnostics', 'equalto', true) | list | length > 0 }}
    # The memory cap on every Lightning instance (Plan 00268 Task 1.9): systemd's MemoryMax
    # size (2G by default), or false for no cap. Set in host_vars as agent_bus_lightning_memory_max.
    agent_bus_lightning_memory_cap: "{{ agent_bus_lightning_memory_max | default('2G') }}"
    agent_bus_lightning_memory_cap_on: "{{ agent_bus_lightning_memory_cap is not sameas false }}"
    # Lightning's Flatpak app id, read from the one Matrix client list, never spelt here.
    agent_bus_lightning_app_id: >-
      {{ (lookup('ansible.builtin.file', root_dir ~ '/helpers/pingbus/matrix_clients.json') | from_json).clients
         | selectattr('name', 'equalto', 'Lightning') | map(attribute='app_id') | first }}
    # The prefix drop-in holding the cap, in the desktop user's systemd folder (read once the
    # user's home is resolved).
    agent_bus_lightning_cap_file: >-
      {{ ansible_facts['getent_passwd'][user_login][4] }}/.config/systemd/user/app-flatpak-{{ agent_bus_lightning_app_id }}-.scope.d/agent-bus-memory-cap.conf
    # Matches the helper's CHANGED<TAB><path> marker lines.
    agent_bus_element_changed_re: "^CHANGED\t"
    # Where an https team's CA is put for Element (tasks/element-team-ca.yml): nssdb or system,
    # chosen in host_vars by agent_bus_element_ca_store. The play's last task proves it.
    agent_bus_element_ca_default_store: nssdb
    # A team whose homeserver is not this host names the CA file this machine holds (ca_file,
    # checked by the helper): its CA is read from there, at its base_url, not from the
    # homeserver's admin state (Plan 00254 Task 4.4).
    agent_bus_element_ca_given: "{{ agent_bus_element_profiles | selectattr('ca_file', 'defined') | list }}"
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    - name: Audience guard — end play on a consumer install
      ansible.builtin.meta: end_play
      when: install_audience != 'developer'

    - name: Check agent_bus_element_teams declares at least one team
      ansible.builtin.assert:
        that:
          - agent_bus_element_declared is sequence and agent_bus_element_declared is not string
          - agent_bus_element_declared | length > 0
        fail_msg: >-
          agent_bus_element_teams in
          {{ agent_bus_host_vars_file | default('environment/localhost/host_vars/localhost.yml') }} must list
          the teams user_login watches, each with team and base_url. See localhost.yml.dist.
        quiet: true
      tags: [agent-bus-element, agent-bus-lightning]

    - name: Check each team's Matrix client is element or lightning
      ansible.builtin.assert:
        that:
          - agent_bus_matrix_client_default in agent_bus_matrix_clients
          - item.client | default(agent_bus_matrix_client_default) in agent_bus_matrix_clients
        fail_msg: >-
          Team {{ item.team | default('(no team)') }} opens in
          {{ item.client | default(agent_bus_matrix_client_default) }} (its client, else
          agent_bus_matrix_client); the client must be element or lightning.
        quiet: true
      loop: "{{ agent_bus_element_present }}"
      loop_control:
        label: "{{ item.team | default('(no team)') }}"
      tags: [agent-bus-element, agent-bus-lightning]

    - name: Check the Lightning memory cap is a size or false
      ansible.builtin.assert:
        that:
          - >-
            agent_bus_lightning_memory_cap is sameas false
            or (agent_bus_lightning_memory_cap is string
                and agent_bus_lightning_memory_cap is match('^[1-9][0-9]*[KMG]$'))
        fail_msg: >-
          agent_bus_lightning_memory_max must be a size systemd's MemoryMax takes, a whole number
          and K, M or G (2G is the default), or false for no cap on Lightning's memory.
        quiet: true
      tags: [agent-bus-lightning]

    # Read-only, so it runs in --check too, and before anything is installed.
    - name: Validate the profiles and refuse a user_login holding pingbus bundles
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv: [python3, -m, helpers.agent_bus.element, check]
        stdin: "{{ agent_bus_element_profiles | to_json }}"
        chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
      changed_when: false
      check_mode: false
      tags: [agent-bus-element, agent-bus-lightning]

    - name: Enable Flathub remote
      become: true
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        state: present
      tags: [agent-bus-element, agent-bus-lightning]

    # The install and the keyring grant (which must be in place before a profile's first start)
    # are written once, in tasks/element-desktop.yml, and play-matrix-clients.yml imports the
    # same file. This play still imports it because ccy-teams runs it on its own.
    - name: Install Element Desktop and let it reach the keyring
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/element-desktop.yml"
      tags: [agent-bus-element]

    - name: Write each team's Element profile and launcher, and remove those of teams not declared
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv: [python3, -m, helpers.agent_bus.element, apply]
        stdin: "{{ agent_bus_element_profiles | to_json }}"
        chdir: "{{ root_dir }}"   # repo root on sys.path so the helpers package imports
      register: agent_bus_element_apply
      changed_when: agent_bus_element_apply.stdout_lines | select('match', agent_bus_element_changed_re) | list | length > 0
      tags: [agent-bus-element]

    # The Element profile of a team last declared for Lightning and then dropped has no launcher
    # to be pruned by, and may hold a signed-in session, so the helper names it on a KEPT line
    # (issue #299) and it is shown here for the owner to delete; the run does not fail on it.
    - name: Show each Element profile kept for a team no longer declared
      ansible.builtin.debug:
        msg: >-
          Kept, not deleted (it may hold a signed-in session; delete it by hand when it is no
          longer wanted): {{ agent_bus_element_kept | join(', ') }}
      vars:
        agent_bus_element_kept: >-
          {{ agent_bus_element_apply.stdout_lines | select('match', '^KEPT\t')
             | map('regex_replace', '^KEPT\t', '') | list }}
      when:
        - not ansible_check_mode
        - agent_bus_element_kept | length > 0
      tags: [agent-bus-element]

    # Last of Element's steps, because its last task is the proof: for each declared team whose approved url is
    # https, the team CA placed where Element reads it and a handshake from Element's sandbox
    # checked against it (SPEC-cross-network X34). A team with no v2 approval here is untouched.
    - name: Trust each https team's CA in Element Desktop, and prove it from Element's sandbox
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/element-team-ca.yml"
      vars:
        element_team_ca_teams: "{{ agent_bus_element_element_teams | map(attribute='team') | list }}"
        element_team_ca_store: "{{ agent_bus_element_ca_store | default(agent_bus_element_ca_default_store) }}"
        # paths.StatusRoot/teams and paths.AdminStateRoot in src-go/internal/teamchat/paths.
        element_team_ca_approved_root: /var/lib/teamchat-status/teams
        element_team_ca_admin_root: /var/lib/teamchat-admin
        element_team_ca_given: "{{ agent_bus_element_ca_given | selectattr('client', 'equalto', 'element') | list }}"
      tags: [agent-bus-element]

    # Lightning (Plan 00254): installed, with each https lightning team's CA where its rustls
    # reads it, proven from its sandbox. It installs Lightning as well as play-matrix-clients.yml
    # does because ccy-teams runs this play on its own.
    - name: Install Lightning, trust each https team's CA in it, and prove it from its sandbox
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/lightning-team-ca.yml"
      vars:
        lightning_team_ca_teams: "{{ agent_bus_element_lightning_teams | map(attribute='team') | list }}"
        # paths.StatusRoot/teams and paths.AdminStateRoot in src-go/internal/teamchat/paths.
        lightning_team_ca_approved_root: /var/lib/teamchat-status/teams
        lightning_team_ca_admin_root: /var/lib/teamchat-admin
        lightning_team_ca_given: "{{ agent_bus_element_ca_given | selectattr('client', 'equalto', 'lightning') | list }}"
      tags: [agent-bus-lightning]

    # After the CA proof, so a team's launcher is written only once its CA is trusted.
    - name: Resolve the desktop user's home for the per-team Lightning command
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
      tags: [agent-bus-lightning]

    - name: Name the per-team Lightning command's path
      ansible.builtin.set_fact:
        agent_bus_lightning_command: "{{ ansible_facts['getent_passwd'][user_login][4] }}/.local/libexec/agent-bus-lightning"
      tags: [agent-bus-lightning]

    - name: Ensure the directory the per-team Lightning command is installed in exists
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: "{{ agent_bus_lightning_command | dirname }}"
        state: directory
        mode: "0755"
      tags: [agent-bus-lightning]

    # Read before and after the build, so the watchdog is restarted onto a new binary.
    - name: Read the installed per-team Lightning command's checksum before the build
      ansible.builtin.stat:
        path: "{{ agent_bus_lightning_command }}"
        get_checksum: true
      register: agent_bus_lightning_command_before
      tags: [agent-bus-lightning]

    - name: Build and install the per-team Lightning command
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/build-go-command.yml"
      vars:
        go_command_name: agent-bus-lightning
        go_command_dest: "{{ agent_bus_lightning_command }}"
        go_command_mode: "0755"
      tags: [agent-bus-lightning]

    # Each lightning team's instance folders, settings file and launcher; the launcher of a team
    # moved to Element or no longer declared is removed. No instance is ever removed: one of a
    # team no longer declared is named on a KEPT line, for the owner to delete.
    - name: Write each team's Lightning instance and launcher, and remove those of teams not on Lightning
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv: ["{{ agent_bus_lightning_command }}", apply]
        stdin: "{{ agent_bus_element_profiles | to_json }}"
      register: agent_bus_lightning_apply
      changed_when: agent_bus_lightning_apply.stdout_lines | select('match', agent_bus_element_changed_re) | list | length > 0
      # In --check nothing was built, so there is nothing to run.
      when: not ansible_check_mode
      tags: [agent-bus-lightning]

    # A kept instance may hold a signed-in session, so it is shown here for the owner to delete
    # by hand; the run does not fail on it.
    - name: Show each Lightning instance kept for a team no longer declared
      ansible.builtin.debug:
        msg: >-
          Kept, not deleted (it may hold a signed-in session; delete it by hand when it is no
          longer wanted): {{ agent_bus_lightning_kept | join(', ') }}
      vars:
        agent_bus_lightning_kept: >-
          {{ agent_bus_lightning_apply.stdout_lines | select('match', '^KEPT\t')
             | map('regex_replace', '^KEPT\t', '') | list }}
      when:
        - not ansible_check_mode
        - agent_bus_lightning_kept | length > 0
      tags: [agent-bus-lightning]

    # The diagnostics watchdog (Plan 00268 Task 1.7): agent-bus-lightning watch, a user service
    # that records a stalled instance's threads once, beside its diagnostic log. It runs only
    # while a lightning team has lightning_diagnostics true, and is stopped and disabled
    # otherwise. The unit is always placed, so the disable below has a unit to act on.
    # The watchdog's backtrace tools: gdb, else eu-stack (elfutils). It never installs anything
    # itself. With kernel.yama.ptrace_scope above 0 (play-self-update.yml sets 1) they may not
    # attach to Lightning; the record then says so (watch W12), and the per-thread lines remain.
    - name: Install the Lightning watchdog's backtrace tools while a team is traced
      become: true
      ansible.builtin.dnf:
        name:
          - gdb
          - elfutils
        state: present
      when: agent_bus_lightning_diagnostics_on
      tags: [agent-bus-lightning]

    - name: Read the per-team Lightning command's checksum after the build
      ansible.builtin.stat:
        path: "{{ agent_bus_lightning_command }}"
        get_checksum: true
      register: agent_bus_lightning_command_after
      tags: [agent-bus-lightning]

    - name: Ensure the desktop user's systemd unit directory exists
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: "{{ ansible_facts['getent_passwd'][user_login][4] }}/.config/systemd/user"
        state: directory
        mode: "0755"
      tags: [agent-bus-lightning]

    - name: Place the Lightning diagnostics watchdog's user unit
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/agent-bus-lightning-watch.service"
        dest: "{{ ansible_facts['getent_passwd'][user_login][4] }}/.config/systemd/user/agent-bus-lightning-watch.service"
        mode: "0644"
      register: agent_bus_lightning_watch_unit
      tags: [agent-bus-lightning]

    # The memory cap (Plan 00268 Task 1.9): a prefix drop-in that systemd applies to every
    # app-flatpak-<app id>-<n>.scope flatpak run starts, whichever team's launcher (or none)
    # started it. No swap, so the cap is the whole of the instance's memory, not RAM with zram
    # behind it. A kill at the cap fails the scope, and its OnFailure= raises a desktop
    # notification through the template unit below. Nothing restarts Lightning.
    - name: Place the user unit that says a Lightning instance was stopped
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/agent-bus-lightning-capped@.service"
        dest: "{{ ansible_facts['getent_passwd'][user_login][4] }}/.config/systemd/user/agent-bus-lightning-capped@.service"
        mode: "0644"
      register: agent_bus_lightning_capped_unit
      tags: [agent-bus-lightning]

    - name: Ensure the drop-in directory of Lightning's Flatpak scopes exists while the cap is on
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: "{{ agent_bus_lightning_cap_file | dirname }}"
        state: directory
        mode: "0755"
      when: agent_bus_lightning_memory_cap_on
      tags: [agent-bus-lightning]

    - name: Cap every Lightning instance's memory while the cap is on
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.copy:
        content: |
          # Plan 00268 Task 1.9, placed by play-agent-bus-element.yml (agent_bus_lightning_memory_max).
          [Scope]
          MemoryMax={{ agent_bus_lightning_memory_cap }}
          MemorySwapMax=0

          [Unit]
          OnFailure=agent-bus-lightning-capped@%n.service
        dest: "{{ agent_bus_lightning_cap_file }}"
        mode: "0644"
      when: agent_bus_lightning_memory_cap_on
      register: agent_bus_lightning_cap_placed
      tags: [agent-bus-lightning]

    - name: Remove the Lightning memory cap while it is off
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.file:
        path: "{{ agent_bus_lightning_cap_file }}"
        state: absent
      when: not agent_bus_lightning_memory_cap_on
      register: agent_bus_lightning_cap_removed
      tags: [agent-bus-lightning]

    - name: Reload the desktop user's systemd manager so it reads the watchdog's unit and the cap
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      when:
        - not ansible_check_mode
        - agent_bus_lightning_watch_unit is changed
          or agent_bus_lightning_capped_unit is changed
          or agent_bus_lightning_cap_placed is changed
          or agent_bus_lightning_cap_removed is changed
      tags: [agent-bus-lightning]

    - name: Run the Lightning diagnostics watchdog while a team has diagnostics on, else stop it
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: agent-bus-lightning-watch.service
        scope: user
        enabled: "{{ agent_bus_lightning_diagnostics_on }}"
        state: >-
          {{ 'stopped' if not agent_bus_lightning_diagnostics_on
             else 'restarted' if agent_bus_lightning_watch_renewed else 'started' }}
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      vars:
        agent_bus_lightning_watch_renewed: >-
          {{ agent_bus_lightning_watch_unit is changed
             or agent_bus_lightning_command_before.stat.checksum | default('')
                != agent_bus_lightning_command_after.stat.checksum | default('') }}
      # In --check nothing was built or reloaded, so there is nothing to run.
      when: not ansible_check_mode
      tags: [agent-bus-lightning]
