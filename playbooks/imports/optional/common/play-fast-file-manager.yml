#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Fast File Manager Setup
# Optimizes file picker performance and optionally replaces Nautilus
#
# This playbook addresses slow GNOME file picker issues by:
# - Installing lightweight PCManFM as alternative file manager
# - Configuring xdg-desktop-portal to use faster GTK file chooser
# - Removing the GSK_RENDERER=ngl override from /etc/environment (see the task for why)
# - Disabling GNOME's recently-used file history (a huge ~/.local/share/recently-used.xbel
#   makes Nautilus stat hundreds of paths on startup; on network-backed mounts
#   this stalls it for seconds)
# - Optionally disabling thumbnail generation
#
# Background:
# Starting with GNOME 47, xdg-desktop-portal-gnome uses Nautilus for file
# picking, which can be slow (1-2 seconds to open). This playbook configures
# the system to use the faster GTK portal for file picker dialogs in browsers
# and other applications.

- hosts: desktop
  name: Configure Fast File Manager and Optimize File Picker Performance
  become: true

  vars:
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # Performance optimization options (can be overridden in host_vars)
    # Set these in environment/localhost/host_vars/localhost.yml:
    #   fast_file_manager_disable_thumbnails: true
    disable_thumbnails: "{{ fast_file_manager_disable_thumbnails | default(false) }}"

  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    # ============================================================================
    # Package Installation
    # ============================================================================

    - name: Install PCManFM Lightweight File Manager
      package:
        name:
          - pcmanfm              # Lightweight GTK file manager
          - xdg-desktop-portal-gtk  # GTK portal implementation
        state: present
      tags:
        - packages
        - file-manager

    # ============================================================================
    # Set PCManFM as Default File Manager
    # ============================================================================

    - name: Set PCManFM as Default File Manager for User
      become: true
      become_user: "{{ user_login }}"
      command: xdg-mime default pcmanfm.desktop inode/directory
      changed_when: false
      tags:
        - file-manager
        - xdg-mime

    # ============================================================================
    # Configure XDG Desktop Portal for Fast File Picker
    # ============================================================================

    - name: Create XDG Desktop Portal Config Directory
      file:
        path: "/home/{{ user_login }}/.config/xdg-desktop-portal"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      tags:
        - portal
        - config

    - name: Configure Portal to Use GTK File Chooser Instead of GNOME
      blockinfile:
        path: "/home/{{ user_login }}/.config/xdg-desktop-portal/portals.conf"
        marker: "# {mark} ANSIBLE MANAGED: Fast File Picker Configuration"
        block: |
          [preferred]
          default=gnome
          org.freedesktop.impl.portal.FileChooser=gtk
        create: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      notify:
        - restart-xdg-portal-services
      tags:
        - portal
        - config

    # ============================================================================
    # Remove the GSK_RENDERER=ngl Override
    # ============================================================================
    # GSK_RENDERER=ngl was a Fedora 41/42 workaround for slow GTK4 app startup.
    # On Fedora 44 "ngl" is only a deprecated alias for "gl", so forcing it
    # on every GTK4 app is obsolete. Leave the renderer to GTK's default.

    - name: Remove GSK_RENDERER=ngl Override from /etc/environment
      blockinfile:
        path: /etc/environment
        marker: "# {mark} ANSIBLE MANAGED: GSK Renderer Performance Fix"
        state: absent
      tags:
        - performance
        - gsk-renderer

    # ============================================================================
    # Disable Recently-Used File History
    # ============================================================================
    # ~/.local/share/recently-used.xbel grows unboundedly across all GTK apps
    # and Nautilus stat()s every entry on startup. When entries point at
    # FUSE-backed remote mounts (rclone, sshfs, gvfs) the cumulative stat
    # cost adds multi-second startup delays to Nautilus.
    #
    # remember-recent-files=false is the GNOME-native toggle (Settings →
    # Privacy → File History). Disabling it stops GTK apps writing to
    # recently-used.xbel and hides the Recent tab from Nautilus.
    #
    # We also delete the existing file as a one-shot — disabling the toggle
    # alone doesn't truncate the existing 100s of KB of historical entries.

    - name: Disable GNOME Recently-Used File History
      become: true
      become_user: "{{ user_login }}"
      community.general.dconf:
        key: /org/gnome/desktop/privacy/remember-recent-files
        value: 'false'
        state: present
      tags:
        - performance
        - recent-files

    - name: Remove existing recently-used.xbel (one-shot cleanup)
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/share/recently-used.xbel"
        state: absent
      tags:
        - performance
        - recent-files

    # ============================================================================
    # Optional: Disable Thumbnail Generation
    # ============================================================================
    # Generating thumbnails for images and videos can slow down folder browsing.
    # Disabling this improves performance on slower systems.

    - name: Disable Nautilus Thumbnail Generation
      become: true
      become_user: "{{ user_login }}"
      command: gsettings set org.gnome.nautilus.preferences show-image-thumbnails "never"
      when: disable_thumbnails
      changed_when: false
      tags:
        - performance
        - thumbnails

    # ============================================================================
    # Information Output
    # ============================================================================

    - name: Display Post-Installation Instructions
      debug:
        msg:
          - "=========================================="
          - "Fast File Manager Configuration Complete"
          - "=========================================="
          - ""
          - "Changes applied:"
          - "  ✓ PCManFM installed as lightweight file manager"
          - "  ✓ XDG portal configured to use GTK file chooser"
          - "  ✓ GSK_RENDERER=ngl override removed"
          - "  ✓ Recently-used file history disabled (recently-used.xbel removed)"
          - "  ✓ Thumbnails disabled (if enabled)"
          - ""
          - "IMPORTANT: To activate all changes:"
          - "  1. Log out and log back in (drops GSK_RENDERER from the session)"
          - "  2. Restart Chrome/Firefox"
          - "  3. Test file picker - should be instant!"
          - ""
          - "To use PCManFM: Click folders or run 'pcmanfm'"
          - "To revert: Edit ~/.config/xdg-desktop-portal/portals.conf"
          - ""
      tags:
        - always

  # ==============================================================================
  # Handlers
  # ==============================================================================

  handlers:
    - name: restart-xdg-portal-services
      become: true
      become_user: "{{ user_login }}"
      systemd:
        name: "{{ item }}"
        state: restarted
        scope: user
      loop:
        - xdg-desktop-portal.service
        - xdg-desktop-portal-gnome.service
      failed_when: false  # FAIL-FAST-OK: user D-Bus session may not exist during headless/SSH playbook runs
