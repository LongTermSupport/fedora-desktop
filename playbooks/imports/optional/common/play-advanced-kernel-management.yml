#!/usr/bin/env ansible-playbook
---
- hosts: desktop
  name: Advanced Kernel Management - Auto-retain Previous Minor Version
  become: true

  vars:
    root_dir: "{{ inventory_dir }}/../../"

  tasks:
    # PKG-08 (F44): python3-dnf-plugin-versionlock install removed.
    # On DNF5-complete Fedora 44, the dnf4 versionlock plugin (python3-dnf-plugin-versionlock)
    # is inert — locks live in /etc/dnf/versionlock.toml and are managed by the dnf5
    # builtin. Installing the dnf4 plugin buys nothing and old versionlock.list entries
    # it may have written are silently ignored by dnf5.
    # The `dnf versionlock` CLI calls below hit the dnf5 builtin and work without it.
    #
    # HW-01 (F44): BEFORE running `dnf system-upgrade` to F44, clear stale fc43 kernel
    # versionlocks or they can cause a half-install of the fc44 kernel (kernel-core without
    # kernel-modules — all radios dead on next boot; see play-AB-dnf-upgrade.yml incident log).
    # Run on the host before upgrading:
    #   dnf versionlock list               # inspect — look for kernel* with .fc43 release
    #   dnf versionlock delete "kernel-0:<fc43-NEVRA>.x86_64"   # remove each fc43 lock
    # Then re-run this play after first boot into F44 to re-establish locks with fc44 NEVRAs.

    - name: Configure DNF to Keep 3 Kernels
      ansible.builtin.blockinfile:
        path: /etc/dnf/dnf.conf
        marker: "# {mark} ANSIBLE MANAGED: Advanced Kernel Management"
        block: |
          # Keep 3 kernels to accommodate:
          # - Latest minor version (multiple patches)
          # - Previous minor version (locked for hardware compatibility)
          installonly_limit=3
        create: false
      tags:
        - config
        - kernel-mgmt

    - name: Deploy Kernel Version Management Script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/usr/local/bin/manage-kernel-versions.py"
        dest: /usr/local/bin/manage-kernel-versions.py
        owner: root
        group: root
        mode: "0755"
      tags:
        - scripts
        - kernel-mgmt

    - name: Deploy Systemd Service Unit
      ansible.builtin.template:
        src: "{{ root_dir }}/files/etc/systemd/system/kernel-version-manager.service"
        dest: /etc/systemd/system/kernel-version-manager.service
        owner: root
        group: root
        mode: "0644"
      notify: reload-systemd
      tags:
        - systemd
        - kernel-mgmt

    - name: Deploy Systemd Path Unit
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/systemd/system/kernel-version-manager.path"
        dest: /etc/systemd/system/kernel-version-manager.path
        owner: root
        group: root
        mode: "0644"
      notify: reload-systemd
      tags:
        - systemd
        - kernel-mgmt

    - name: Enable and Start Kernel Version Manager Path Unit
      ansible.builtin.systemd:
        name: kernel-version-manager.path
        enabled: true
        state: started
        daemon_reload: true
      tags:
        - systemd
        - kernel-mgmt

    - name: Run Initial Kernel Version Analysis
      ansible.builtin.command: /usr/bin/python3 /usr/local/bin/manage-kernel-versions.py
      register: kernel_mgmt_output
      changed_when: false
      tags:
        - kernel-mgmt

    - name: Display Kernel Management Results
      ansible.builtin.debug:
        msg: "{{ kernel_mgmt_output.stdout_lines }}"
      when: kernel_mgmt_output.stdout_lines is defined
      tags:
        - kernel-mgmt

    - name: Verify Kernel Versionlock Status
      ansible.builtin.command: dnf versionlock list
      register: versionlock_status
      changed_when: false
      tags:
        - kernel-mgmt

    - name: Display Current Versionlock Status
      ansible.builtin.debug:
        msg: "{{ versionlock_status.stdout_lines | default(['No version locks configured']) }}"
      tags:
        - kernel-mgmt

  handlers:
    - name: reload-systemd
      ansible.builtin.systemd:
        daemon_reload: true
