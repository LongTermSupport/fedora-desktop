#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
- hosts: desktop
  name: Qobuz Apps - CLI Player and Last.fm Scrobbling
  # The rescrobbled config is written well before the handler that restarts the
  # unit, and the manual-setup block in between can abort the play. Without
  # force_handlers that notification is lost for good: the next run sees an
  # unchanged config.toml, notifies nothing, and leaves the old process running
  # with the old config while reporting success.
  force_handlers: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
    # hifi-rs configuration
    # Set to "latest" for automatic version detection or specify version like "0.3.8"
    hifiRsVersion: "latest"
    hifiRsPath: "/home/{{ user_login }}/.local/bin/hifi-rs"

    # Anchored MPRIS-identity regexes for players that scrobble themselves, so
    # Rescrobbled configuration for Last.fm scrobbling
    # Check https://github.com/InputUsername/rescrobbled/releases for updates
    rescrobbledVersion: 0.10.0
    rescrobbledUrl: "https://github.com/InputUsername/rescrobbled/releases/download/v{{ rescrobbledVersion }}/rescrobbled"
    rescrobbledPath: "/home/{{ user_login }}/.local/bin/rescrobbled"
  tasks:
    # Version detection for hifi-rs
    - name: Get latest hifi-rs version
      ansible.builtin.shell: |
        set -euo pipefail
        curl -s https://api.github.com/repos/iamdb/hifi.rs/releases/latest |
        jq -r '.tag_name' | sed 's/^v//'
      args:
        executable: /bin/bash
      register: hifiRsLatestVersion
      when: hifiRsVersion == "latest"
      changed_when: false

    - name: Set hifi-rs version
      ansible.builtin.set_fact:
        hifiRsVersionFinal: "{{ hifiRsLatestVersion.stdout if hifiRsVersion == 'latest' else hifiRsVersion }}"

    - name: Set hifi-rs URL
      ansible.builtin.set_fact:
        hifiRsUrl: "https://github.com/iamdb/hifi.rs/releases/download/v{{ hifiRsVersionFinal }}/hifi-rs-x86_64-unknown-linux-gnu.tar.gz"

    # Prints one marker line on stdout as its payload (UNCHANGED / INSTALLED) so
    # changed_when reflects what the script actually did; the human-readable
    # version detail goes to stderr, as does the set -x trace.
    - name: Install hifi-rs
      ansible.builtin.shell: |
        set -exuo pipefail
        if [[ -f {{ hifiRsPath }} ]]; then
          installedVersion="$(hifi-rs --version | grep -Po '[0-9.]+')"
          desiredVersion="{{ hifiRsVersionFinal }}"
          if  [[ "$installedVersion" == "$desiredVersion" ]]; then
            echo "installed version $installedVersion is the same as the desired version $desiredVersion" >&2
            echo "HIFIRS_UNCHANGED"
            exit 0
          fi
        fi
        cd /home/{{ user_login }}/Downloads
        rm -rf hifi-rs*
        wget "{{ hifiRsUrl }}"
        tar -xf hifi-rs-x86_64-unknown-linux-gnu.tar.gz
        mv -f hifi-rs "{{ hifiRsPath }}"
        echo "HIFIRS_INSTALLED"
      args:
        executable: /bin/bash
      register: hifirs_install
      changed_when: "'HIFIRS_INSTALLED' in hifirs_install.stdout"
      # Demand exactly one marker. Treating "no INSTALLED marker" as "unchanged"
      # would read a script that printed nothing — a broken or truncated run —
      # as a clean no-op. The rc check is kept explicitly because defining
      # failed_when replaces the shell module's own rc test.
      failed_when: >-
        hifirs_install.rc != 0
        or (('HIFIRS_INSTALLED' in hifirs_install.stdout)
            == ('HIFIRS_UNCHANGED' in hifirs_install.stdout))
      tags:
        - hifi-rs

    # Last.fm scrobbling is optional: not everyone uses Last.fm. An empty API key at the
    # prompt skips the scrobbling setup for this run and the rest of the play carries on;
    # nothing is saved, so the next run asks again.
    - name: Ask for the Last.fm API key when it is missing (optional)
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret.yml"
      vars:
        secret_name: lastfm_api_key
        secret_label: Last.fm API key
        secret_explain: |2

          LAST.FM SCROBBLING (optional)

          Rescrobbled sends what you play to Last.fm. It needs a Last.fm API key
          and its shared secret:

          1. Go to https://www.last.fm/api/account/create
          2. Create an API application (any name and description)
          3. Copy the API key, and next the shared secret

          Do not use Last.fm, or not now? Leave the key empty and press ENTER:
          this run skips scrobbling, and the next run asks again.
        secret_confirm: false
        secret_optional: true
      when: lastfm_api_key is not defined

    - name: Ask for the Last.fm shared secret when it is missing
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret.yml"
      vars:
        secret_name: lastfm_api_secret
        secret_label: Last.fm shared secret
        secret_explain: >-
          The shared secret shown next to your Last.fm API key, at
          https://www.last.fm/api/accounts. Rescrobbled needs both to scrobble.
        secret_confirm: false
      when:
        - lastfm_api_key is defined
        - lastfm_api_secret is not defined

    - name: Decide whether this run sets up scrobbling
      ansible.builtin.set_fact:
        qobuz_scrobble: "{{ lastfm_api_key is defined and lastfm_api_secret is defined }}"

    - name: Last.fm scrobbling with rescrobbled
      when: qobuz_scrobble | bool
      block:
        - name: Install Rescrobbled
          ansible.builtin.shell: |
            set -euo pipefail
            cd /home/{{ user_login }}/Downloads
            rm -rf rescrobbled*
            wget "{{ rescrobbledUrl }}"
            mv rescrobbled "{{ rescrobbledPath }}"
            chmod u+x "{{ rescrobbledPath }}"
          args:
            executable: /bin/bash
            creates: "{{ rescrobbledPath }}"

        # 0700: this dir holds config.toml (Last.fm API key + secret) and the
        # session token file, so it must not be group- or world-readable.
        - name: Create Rescrobbled Config Dir
          ansible.builtin.file:
            state: directory
            path: /home/{{ user_login }}/.config/rescrobbled/
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0700"

        # Contains the Last.fm API key + secret in plaintext, so lock it to 0600 and
        # suppress logging/diff so `--diff` runs never print the credentials.
        #
        # rescrobbled scrobbles whatever publishes MPRIS. hifi-rs, the only player
        # this play installs, has no scrobbler of its own, so rescrobbled must keep
        # scrobbling it. A player that scrobbles itself has to be ignored here or
        # every one of its tracks is submitted twice — both submissions fire on
        # Last.fm's half-duration / 4-minute rule, so the duplicates land seconds
        # apart with nothing anywhere reporting a problem.
        #
        # "^QBZ$" stays even though this repo no longer installs QBZ. The entry is
        # a defensive guard, not a declaration of ownership: QBZ was withdrawn
        # upstream, but removing it from this repo does not remove it from a
        # machine that already had it, and it still publishes MPRIS and still
        # scrobbles itself. Keeping the entry costs one regex evaluation per
        # discovered player when QBZ is absent (is_ignorelisted only ever tests
        # players that exist), and prevents silent double-scrobbling when it is
        # present. Deleting it is fail-open; keeping it is fail-safe.
        #
        # Entries are matched unanchored against identity, bus name and
        # instance-stripped bus name (player.rs regex_set_contains), so anchor
        # every entry (^Name$). Do NOT widen this one: a loose pattern would start
        # swallowing hifi-rs, which must never be ignored. Confirm an identity with
        # `journalctl --user -u rescrobbled`, which prints it verbatim.
        - name: Configure Rescrobbled
          block:
            - name: Configure Rescrobbled
              ansible.builtin.copy:
                content: |
                  lastfm-key = "{{ lastfm_api_key }}"
                  lastfm-secret = "{{ lastfm_api_secret }}"
                  player-ignorelist = [ "^QBZ$" ]
                dest: /home/{{ user_login }}/.config/rescrobbled/config.toml
                owner: "{{ user_login }}"
                group: "{{ user_login }}"
                mode: "0600"
              no_log: true
              diff: false
              notify: Restart rescrobbled
          rescue:
            # Only the module msg: the content and diff hold the Last.fm key and secret.
            - name: Stop because the rescrobbled config could not be written
              ansible.builtin.fail:
                msg: >-
                  The rescrobbled config (~/.config/rescrobbled/config.toml) could not be
                  written: {{ ansible_failed_result.msg | default('no reason given') }}.
                  Scrobbling is not set up. Check that the directory exists and belongs to
                  you, then run this play again.

        - name: Create Systemd User Dir
          ansible.builtin.file:
            state: directory
            path: /home/{{ user_login }}/.config/systemd/user/
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0755"

        - name: Rescrobbled Systemd Config
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=An MPRIS scrobbler
              Documentation=https://github.com/InputUsername/rescrobbled
              Wants=network-online.target
              After=network-online.target

              [Service]
              ExecStart=%h/.local/bin/rescrobbled

              [Install]
              WantedBy=default.target
            dest: /home/{{ user_login }}/.config/systemd/user/rescrobbled.service
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: "0644"
          notify: Restart rescrobbled

        - name: Check for Session File For Rescrobbled
          ansible.builtin.stat:
            path: /home/{{ user_login }}/.config/rescrobbled/session
          register: rescrobbled_session_file

        - name: Manual Rescrobbled Setup Required
          block:
            # PAUSE-OK: waits while the owner logs rescrobbled in to Last.fm; the next task checks the session file
            - name: Display Setup Instructions
              ansible.builtin.pause:
                prompt: |2

                  ============================================
                  RESCROBBLED SETUP REQUIRED
                  ============================================

                  Please do the following in a NEW terminal:
                  1. Run: rescrobbled
                  2. Enter your Last.fm login details
                  3. Confirm it logs in properly
                  4. Press Ctrl+C to exit rescrobbled

                  Then press ENTER here to continue...

            - name: Check if Session File Now Exists
              ansible.builtin.stat:
                path: /home/{{ user_login }}/.config/rescrobbled/session
              register: rescrobbled_session_check

            - name: Verify Session File Created
              ansible.builtin.fail:
                msg: |
                  Session file still not found at ~/.config/rescrobbled/session
                  Please ensure you completed the rescrobbled login process.
                  Run this playbook again after successfully logging in.
              when: not rescrobbled_session_check.stat.exists
          when: not rescrobbled_session_file.stat.exists | default(true)

        - name: Reload systemd daemon for user
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user

    # Flushed here, after the daemon-reload above and before the start below, so
    # that a restart and a first-install start cannot both fire in one run: on a
    # fresh machine the handler starts the unit and "Start and Enable" is then a
    # no-op for state. Running it before the verify is the point — the verify
    # must see the unit that carries the new config, not the one it replaced.
    - name: Flush handlers before starting rescrobbled
      ansible.builtin.meta: flush_handlers

    - name: Start rescrobbled
      when: qobuz_scrobble | bool
      block:
        - name: Start and Enable Rescrobbled Service
          ansible.builtin.systemd:
            name: rescrobbled
            state: started
            enabled: true
            scope: user

        # Queried via the systemd module with no state:, which reports the unit
        # without touching it. Still fail-fast: a unit that is not active stops
        # the play rather than letting the success message below lie.
        - name: Verify Rescrobbled Service is Running
          ansible.builtin.systemd:
            name: rescrobbled
            scope: user
          register: rescrobbled_status
          changed_when: false
          failed_when: rescrobbled_status.status.ActiveState != "active"

        - name: Display Success Message
          ansible.builtin.debug:
            msg: |
              ✓ Rescrobbled successfully installed and running!
              ✓ hifi-rs playback will be scrobbled to Last.fm by rescrobbled

              To check status: systemctl --user status rescrobbled
              To view logs: journalctl --user -u rescrobbled -f

    - name: Create qobuz-players bashrc include file
      ansible.builtin.copy:
        content: |
          # Qobuz Players Configuration
          # hifi-rs is the CLI Qobuz player. `play` (and its `hplay` alias) run it.

          # Play a Qobuz URL with hifi-rs
          play() {
              if ! command -v hifi-rs &> /dev/null; then
                  echo "Error: hifi-rs not found in PATH"
                  return 1
              fi
              if [ -z "$1" ]; then
                  echo "Usage: play <qobuz_url>"
                  return 1
              fi
              hifi-rs play --url "$1"
          }

          # hplay is an alias for play (kept for muscle memory)
          alias hplay='play'

          # Show hifi-rs status
          qobuz_status() {
              echo "Qobuz Player Status:"
              echo "===================="
              if command -v hifi-rs &> /dev/null; then
                  version=$(hifi-rs --version 2>/dev/null | grep -Po '[0-9.]+' || echo "unknown")
                  echo "✓ hifi-rs: v$version"
              else
                  echo "✗ hifi-rs: not installed"
              fi
          }
        dest: /home/{{ user_login }}/.bashrc-includes/qobuz-players
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    - name: Check if hifi-rs is configured with Qobuz credentials
      ansible.builtin.shell: |
        set -euo pipefail
        hifi-rs api search test -o json 2>&1
      args:
        executable: /bin/bash
      register: hifirs_api_check
      failed_when: false  # FAIL-FAST-OK: probe — checking if Qobuz credentials are set
      changed_when: false

    - name: Manual hifi-rs Setup Required
      block:
        # PAUSE-OK: waits while the owner configures hifi-rs with Qobuz credentials; the next task checks the API
        - name: Display hifi-rs Setup Instructions
          ansible.builtin.pause:
            prompt: |2

              ============================================
              HIFI-RS SETUP REQUIRED
              ============================================

              Please configure hifi-rs with your Qobuz credentials.
              Run the following commands in a NEW terminal:

              1. Set your Qobuz username:
                 hifi-rs config username

              2. Set your Qobuz password:
                 hifi-rs config password

              3. Set audio quality (recommended: hifi192):
                 hifi-rs config default-quality
                 Options: mp3, cd, hifi96, hifi192

              4. Test that the API works:
                 hifi-rs api search mozart -o json

              5. Test playback with a Qobuz URL:
                 play https://play.qobuz.com/album/v7hnd6neb7w0b

              Press ENTER here once configuration is complete...

        - name: Verify hifi-rs API Access
          ansible.builtin.shell: |
            set -euo pipefail
            hifi-rs api search test -o json
          args:
            executable: /bin/bash
          register: hifirs_api_verify
          changed_when: false

        - name: Display Success Message
          ansible.builtin.debug:
            msg: |
              ✓ hifi-rs successfully configured and ready!
              ✓ You can now use: play <qobuz_url>

              Example: play https://play.qobuz.com/album/v7hnd6neb7w0b
      when: hifirs_api_check.rc != 0 or 'error' in hifirs_api_check.stdout.lower() or 'unauthorized' in hifirs_api_check.stdout.lower()

    # Final summary
    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - ============================================
          - Qobuz Apps Installation Complete!
          - ============================================
          - ""
          - ✓ hifi-rs {{ hifiRsVersionFinal }} installed (CLI player)
          - "{{ ('✓ rescrobbled ' ~ rescrobbledVersion ~ ' installed and running') if (qobuz_scrobble | bool) else '- Last.fm scrobbling skipped this run (no API details given; the next run asks again)' }}"
          - ""
          - "Usage:"
          - play <qobuz_url>     - Play a Qobuz URL with hifi-rs
          - hplay <qobuz_url>    - Alias for play
          - qobuz_status         - Show hifi-rs status

  handlers:
    # rescrobbled reads config.toml once at startup, and the "Start and Enable"
    # task is a no-op against an already-running unit. Without this restart a
    # config change stays inert until the next reboot.
    - name: Restart rescrobbled
      ansible.builtin.systemd:
        name: rescrobbled
        state: restarted
        scope: user
