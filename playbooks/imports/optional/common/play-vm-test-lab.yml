#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# VM lifecycle acceptance-testing lab (Plan 00110)
#
# Installs the rootless libvirt/QEMU stack, keeps the user's systemd --user
# manager alive across logouts, creates the lab tree under ~/.local/share/vmtest,
# and renders the tracked scenario manifest (vars/vm-test-scenarios.yml) into the
# JSON the lab helpers read plus the scenario allowlist the bridge enforces.
#
# Rootless by design (qemu:///session, CLAUDE/ContainerEngines.md): no root
# daemon, no new root-equivalent group. /dev/kvm must be openable by the user —
# Fedora's systemd udev rule ships it 0666 — and the play asserts that rather
# than assuming it.
#
# Standalone / opt-in play — deliberately NOT imported from playbook-main.yml.
# Run it directly, or via the plan's deploy.bash:
#   ./playbooks/imports/optional/common/play-vm-test-lab.yml
- hosts: desktop
  name: VM Acceptance Testing Lab
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    vm_test_lab_dir: "/home/{{ user_login }}/.local/share/vmtest"
    vm_test_spool_dir: "{{ root_dir }}/untracked/vmtest-bridge"
    # Bridge policy (DESIGN.md §6.4 step 9): MODE_<verb>=auto|deny. refresh-base
    # ships denied — an unannounced base rebuild is a surprise on a workstation;
    # override vm_test_bridge_modes per host to enable it. lab-status and abort-run
    # are in the verb set but not yet implemented by the scope, so they ship denied
    # and are rejected by policy rather than answered "not implemented".
    vm_test_bridge_default_modes:
      list-scenarios: auto
      lab-status: deny
      run-scenario: auto
      refresh-base: deny
      abort-run: deny
    # The manifest in the shape helpers/vmtest/scenarios.py parses: the four
    # tracked top-level keys and nothing else.
    vm_test_manifest:
      vm_test_ttl_upgrade_days: "{{ vm_test_ttl_upgrade_days }}"
      vm_test_ttl_rebuild_days: "{{ vm_test_ttl_rebuild_days }}"
      vm_test_bases: "{{ vm_test_bases }}"
      vm_test_scenarios: "{{ vm_test_scenarios }}"
  vars_files:
    - "{{ root_dir }}/vars/fedora-version.yml"
    - "{{ root_dir }}/vars/vm-test-scenarios.yml"
  tasks:
    # =========================================================================
    # Preflight: KVM must be usable by the user, or nothing below is worth doing
    # =========================================================================
    - name: Stat /dev/kvm as the lab user
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.stat:
        path: /dev/kvm
      register: vm_test_kvm

    - name: Assert /dev/kvm is openable read-write by the lab user
      ansible.builtin.assert:
        that:
          - vm_test_kvm.stat.exists
          - vm_test_kvm.stat.readable
          - vm_test_kvm.stat.writeable
        fail_msg: |
          /dev/kvm is missing or not openable read-write by {{ user_login }}.
          Without KVM the lab would run on TCG emulation, which it refuses.
          Check that virtualisation is enabled in firmware and that
          /usr/lib/udev/rules.d/50-udev-default.rules still ships kvm as 0666.

    # =========================================================================
    # Packages — by name only, no versions (DESIGN.md §9 T2.1)
    # =========================================================================
    - name: Install the rootless libvirt/QEMU lab stack
      ansible.builtin.package:
        name:
          - libvirt-daemon-kvm
          - libvirt-daemon-config-network
          - libvirt-client
          - virt-install
          - qemu-kvm
          - qemu-img
          - edk2-ovmf
          - guestfs-tools
          - virtiofsd
          - cloud-utils
          - xorriso
          - osinfo-db
          - lorax
          - swtpm
          - swtpm-tools
          - passt
          - distribution-gpg-keys
        state: present

    # =========================================================================
    # The user's systemd --user manager must outlive the login session, or the
    # bridge units and any in-flight run die with the terminal.
    # =========================================================================
    - name: Enable systemd --user lingering for the lab user
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ user_login }}"
        creates: "/var/lib/systemd/linger/{{ user_login }}"

    # =========================================================================
    # The lab tree (DESIGN.md §3.2). Bases are opened read-only by runs; the
    # directory modes are the user's, and nothing here is on the shared mount.
    # =========================================================================
    - name: Create the lab directory tree
      ansible.builtin.file:
        path: "{{ vm_test_lab_dir }}/{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - ""
        - images
        - bases
        - runs

    # =========================================================================
    # The helpers, the CLI and the in-guest scripts — Ansible-deployed copies
    # outside the checkout are the only code the host executes (DESIGN.md §2.3)
    # =========================================================================
    - name: Ensure ccy-helpers vmtest library directory exists
      ansible.builtin.file:
        path: /usr/local/lib/ccy-helpers/helpers/vmtest
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy vmtest helper modules
      ansible.builtin.copy:
        src: "{{ root_dir }}/helpers/vmtest/{{ item }}"
        dest: "/usr/local/lib/ccy-helpers/helpers/vmtest/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      # Every module in the package, derived rather than listed: a module added later and
      # forgotten in a hand-kept list would fail only on the code path that imports it.
      # request.py is the container-side requester and is the one deliberate exclusion.
      loop: >-
        {{ lookup('ansible.builtin.fileglob', root_dir ~ '/helpers/vmtest/*.py', wantlist=true)
           | map('basename') | reject('equalto', 'request.py') | sort }}

    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy the vmtest host CLI
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/vmtest"
        dest: "/home/{{ user_login }}/.local/bin/vmtest"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy the in-guest scripts
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/share/vmtest/{{ item }}"
        dest: "{{ vm_test_lab_dir }}/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - guest-cleanup.bash
        - guest-acceptance-server.bash
        - guest-acceptance-desktop.bash
        - vmtest-session-provision.bash

    # The VM kickstarts for the full bases: the deployed copies are what the builder
    # renders, so the checkout cannot change how a base is installed underneath a run.
    - name: Deploy the VM kickstarts
      ansible.builtin.copy:
        src: "{{ root_dir }}/fedora-install/{{ item }}"
        dest: "{{ vm_test_lab_dir }}/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      loop:
        - ks-vm-server.cfg
        - ks-vm-desktop.cfg

    # The lab's own throwaway SSH key: baked into every base so runs can reach
    # their guest. Never the user's key, never leaves this directory.
    - name: Ensure the lab SSH key directory exists
      ansible.builtin.file:
        path: "{{ vm_test_lab_dir }}/ssh"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"

    - name: Generate the lab SSH key
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - vmtest-lab
          - -f
          - "{{ vm_test_lab_dir }}/ssh/lab-key"
        creates: "{{ vm_test_lab_dir }}/ssh/lab-key"

    # lab.env is how the deployed CLI learns the branch's Fedora version and the
    # public repo URL the guests clone, without reading the checkout at run time.
    - name: Read the checkout's origin URL for the guests to clone
      become: false
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ root_dir }}"
          - remote
          - get-url
          - origin
      register: vm_test_origin
      changed_when: false

    - name: Read the checkout's branch, whose pushed tip the guests provision from
      become: false
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ root_dir }}"
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: vm_test_branch
      changed_when: false
      failed_when: vm_test_branch.stdout | trim in ['', 'HEAD']

    # The guests clone over HTTPS with no identity (DESIGN.md §3.4), so an SSH
    # origin on the host is normalised to the same repository's https URL.
    - name: Render lab.env
      ansible.builtin.copy:
        content: |
          VMTEST_FEDORA_VERSION={{ fedora_version }}
          VMTEST_REPO_URL={{ vm_test_origin.stdout | trim | regex_replace('^(ssh://)?git@github[.]com[:/]', 'https://github.com/') | regex_replace('[.]git$', '') }}
          VMTEST_REPO_BRANCH={{ vm_test_branch.stdout | trim }}
          VMTEST_CHECKOUT={{ root_dir }}
        dest: "{{ vm_test_lab_dir }}/lab.env"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    # =========================================================================
    # The manifest, validated by the same helper the lab uses, then rendered
    # =========================================================================
    - name: Validate the scenario manifest with helpers.vmtest.validate_manifest
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - helpers.vmtest.validate_manifest
          - --fedora-version
          - "{{ fedora_version }}"
        chdir: "{{ root_dir }}"
        stdin: "{{ vm_test_manifest | to_json }}"
      register: vm_test_manifest_check
      changed_when: false
      failed_when: "'VMTEST-MANIFEST-OK' not in vm_test_manifest_check.stdout"

    - name: Render the manifest as JSON for the lab helpers
      ansible.builtin.copy:
        content: "{{ vm_test_manifest | to_nice_json }}\n"
        dest: "{{ vm_test_lab_dir }}/scenarios.json"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    - name: Read how many scenarios are runnable
      ansible.builtin.set_fact:
        vm_test_runnable: "{{ vm_test_manifest_check.stdout | regex_search('runnable=([0-9]+)', '\\1') | first | int }}"

    # The allowlist is the bridge's authority (DESIGN.md §2.3, §6.4 step 7). It
    # exists exactly when at least one scenario is runnable; an empty file would
    # read as "a lab with no scenarios", so none is written in that case and any
    # stale one is removed. The validator refuses to emit an empty list anyway.
    - name: Render the scenario allowlist from the manifest
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - helpers.vmtest.validate_manifest
          - --fedora-version
          - "{{ fedora_version }}"
          - --allowlist
        chdir: "{{ root_dir }}"
        stdin: "{{ vm_test_manifest | to_json }}"
      register: vm_test_allowlist
      changed_when: false
      when: vm_test_runnable | int > 0

    - name: Deploy the scenario allowlist
      ansible.builtin.copy:
        content: "{{ vm_test_allowlist.stdout }}\n"
        dest: "{{ vm_test_lab_dir }}/scenarios.allowlist"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      when: vm_test_runnable | int > 0

    - name: Remove a stale allowlist when no scenario is runnable
      ansible.builtin.file:
        path: "{{ vm_test_lab_dir }}/scenarios.allowlist"
        state: absent
      when: vm_test_runnable | int == 0

    # =========================================================================
    # The bridge (DESIGN.md §6): the spool is the only shared surface; policy,
    # signing key, audit log and lock live off the mount under a per-checkout
    # slug that is also the units' instance name.
    # =========================================================================
    - name: Derive the bridge slug from the checkout path
      become: false
      ansible.builtin.command:
        argv:
          - systemd-escape
          - --path
          - "{{ root_dir }}"
      register: vm_test_bridge_slug
      changed_when: false

    - name: Create the bridge spool directories in the checkout
      ansible.builtin.file:
        path: "{{ vm_test_spool_dir }}/{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - ""
        - tmp
        - requests
        - processing
        - responses
        - archive
        - quarantine
        - diagnostics

    - name: Create the bridge configuration and state directories off the mount
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"
      loop:
        - "/home/{{ user_login }}/.config/vmtest-bridge/{{ vm_test_bridge_slug.stdout | trim }}"
        - "/home/{{ user_login }}/.local/state/vmtest-bridge/{{ vm_test_bridge_slug.stdout | trim }}"

    - name: Render the bridge policy
      ansible.builtin.copy:
        content: |
          {% for verb, mode in (vm_test_bridge_modes | default(vm_test_bridge_default_modes)).items() %}
          MODE_{{ verb }}={{ mode }}
          {% endfor %}
        dest: "/home/{{ user_login }}/.config/vmtest-bridge/{{ vm_test_bridge_slug.stdout | trim }}/policy"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0600"

    # The response signing key: host-only, never on the mount, generated once.
    - name: Generate the bridge response signing key
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -out
          - "/home/{{ user_login }}/.config/vmtest-bridge/{{ vm_test_bridge_slug.stdout | trim }}/response.key"
          - "64"
        creates: "/home/{{ user_login }}/.config/vmtest-bridge/{{ vm_test_bridge_slug.stdout | trim }}/response.key"

    - name: Restrict the bridge response signing key
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/vmtest-bridge/{{ vm_test_bridge_slug.stdout | trim }}/response.key"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0600"

    - name: Deploy the bridge entry-point CLI
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/vmtest-bridge-watcher"
        dest: "/home/{{ user_login }}/.local/bin/vmtest-bridge-watcher"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Ensure the user systemd unit directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy the bridge user systemd units
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ item }}"
        dest: "/home/{{ user_login }}/.config/systemd/user/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      loop:
        - vmtest-bridge@.path
        - vmtest-bridge@.service
        - vmtest-bridge-heartbeat@.timer
        - vmtest-bridge-heartbeat@.service
        - vmtest-nightly.timer
        - vmtest-nightly.service
      register: vm_test_bridge_units

    - name: Look up the lab user's uid for the user manager's runtime directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"

    # Lingering is enabled above, so the user manager is there to answer. A
    # changed unit file is reloaded and the instances restarted so the running
    # bridge is the deployed one.
    - name: Enable and start the bridge path unit and heartbeat timer
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: "{{ item }}"
        scope: user
        enabled: true
        state: "{{ 'restarted' if vm_test_bridge_units.changed else 'started' }}"
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[user_login][1] }}"
      loop:
        - "vmtest-bridge@{{ vm_test_bridge_slug.stdout | trim }}.path"
        - "vmtest-bridge-heartbeat@{{ vm_test_bridge_slug.stdout | trim }}.timer"
        - vmtest-nightly.timer

    # =========================================================================
    # Confirm the session-mode hypervisor answers as the lab user
    # =========================================================================
    - name: Verify qemu:///session answers as the lab user
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///session
          - uri
      register: vm_test_session_uri
      changed_when: false
      failed_when: vm_test_session_uri.stdout.strip() != 'qemu:///session'

    - name: Display lab summary
      ansible.builtin.debug:
        msg:
          - "VM acceptance lab deployed for {{ user_login }} at {{ vm_test_lab_dir }}"
          - "Hypervisor: rootless ({{ vm_test_session_uri.stdout.strip() }})"
          - "Manifest: {{ vm_test_manifest_check.stdout | trim }}"
          - "Allowlist: {{ 'deployed' if vm_test_runnable | int > 0 else 'none — no scenario has a declared check count yet' }}"
          - "Bridge: vmtest-bridge@{{ vm_test_bridge_slug.stdout | trim }}.path watching {{ vm_test_spool_dir }}/requests"
          - ""
          - "Next: vmtest fetch server-fast; vmtest build-base server-fast"
          - "Documentation: docs/vm-acceptance-testing.md"
