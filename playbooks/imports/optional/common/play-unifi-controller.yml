#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
- hosts: desktop
  name: Deploy UniFi Network Controller for Seamless WiFi Roaming (Podman Compose)
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # UniFi controller data persists across container rebuilds
    unifi_data_dir: /home/{{ user_login }}/.local/share/unifi
    # @see https://hub.docker.com/r/linuxserver/unifi-network-application/tags
    unifi_image: lscr.io/linuxserver/unifi-network-application:latest
    # MongoDB is required by the UniFi Network Application
    unifi_mongo_image: docker.io/library/mongo:7.0
    # The controller's web login name; its password is unifi_admin_password (vaulted)
    unifi_admin_name: unifi-admin
  tasks:
    # ── Setup Guide ────────────────────────────────────────────────────────────
    # Full setup guide including wired AP adoption, seamless roaming config,
    # troubleshooting, and backup/restore: docs/UnifiSetupGuide.md

    # ── Data Directories ────────────────────────────────────────────────────────

    - name: Create UniFi Persistent Data Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - "{{ unifi_data_dir }}"
        - "{{ unifi_data_dir }}/mongodb"
        - "{{ unifi_data_dir }}/mongodb/init"

    # The containers own these two once they have started: their entrypoints chown them
    # to the container's own users. Created as the account when missing and otherwise
    # left alone; resetting their owner under a running stack makes MongoDB abort with
    # EACCES on its next checkpoint.
    - name: Create the UniFi Container-Owned Data Directories
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv: [mkdir, "{{ item }}"]
        creates: "{{ item }}"
      loop:
        - "{{ unifi_data_dir }}/config"
        - "{{ unifi_data_dir }}/mongodb/data"

    # Rootless podman maps container users onto the account's /etc/subuid range. Files
    # written under a range the account no longer has show as nobody inside the
    # namespace, so neither the containers nor `podman unshare chown` can touch them.
    # Handing them to the account (root in the namespace) is enough: the mongo and
    # linuxserver entrypoints start as root and chown their data to their own users.
    - name: Read the Subordinate ID Ranges
      ansible.builtin.slurp:
        src: /etc/subuid
      register: unifi_subuid_file

    - name: Resolve the Account's Subordinate ID Range
      ansible.builtin.set_fact:
        unifi_subuid_entries: >-
          {{ (unifi_subuid_file.content | b64decode).splitlines()
             | select('match', '^' ~ user_login ~ ':[0-9]+:[0-9]+$') | list }}

    - name: Assert the Account Has Exactly One Subordinate ID Range
      ansible.builtin.assert:
        that: unifi_subuid_entries | length == 1
        fail_msg: >-
          /etc/subuid has {{ unifi_subuid_entries | length }} entries for {{ user_login }};
          rootless podman, and this check, need exactly one.
        quiet: true

    - name: Find UniFi Data Owned Outside the Account's Subordinate ID Range
      ansible.builtin.command:
        argv: "{{ unifi_find_orphans }}"
      vars:
        unifi_subuid_start: "{{ unifi_subuid_entries[0].split(':')[1] | int }}"
        unifi_subuid_end: "{{ unifi_subuid_start | int + unifi_subuid_entries[0].split(':')[2] | int - 1 }}"
        unifi_find_orphans:
          - find
          - "{{ unifi_data_dir }}/config"
          - "{{ unifi_data_dir }}/mongodb/data"
          - "!"
          - -user
          - "{{ user_login }}"
          - (
          - -uid
          - "-{{ unifi_subuid_start }}"
          - -o
          - -uid
          - "+{{ unifi_subuid_end }}"
          - )
          - -print
          - -quit
      register: unifi_orphaned_data
      changed_when: false

    - name: Reclaim Orphaned UniFi Data
      when: unifi_orphaned_data.stdout | length > 0
      block:
        # Changing the owner under a running MongoDB aborts it (EACCES on its next
        # checkpoint), so the stack must be down. Orphaned data means it cannot be
        # working anyway.
        - name: Probe Whether UniFi MongoDB Is Running Before the Reclaim
          become: true
          become_user: "{{ user_login }}"
          ansible.builtin.command: podman container inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' unifi-mongodb
          register: unifi_mongo_running_before_reclaim
          changed_when: false
          failed_when: false  # FAIL-FAST-OK: a missing container is the "not running" answer; checked by the assert below

        - name: Assert UniFi MongoDB Is Stopped Before the Reclaim
          ansible.builtin.assert:
            that: unifi_mongo_running_before_reclaim.stdout != 'true'
            fail_msg: >-
              UniFi data under {{ unifi_data_dir }} is owned outside your subordinate ID range
              ({{ unifi_orphaned_data.stdout }}), and MongoDB is running. Run
              `unifi-controller stop`, then re-run this play.
            quiet: true

        - name: Give Orphaned UniFi Data Back to the Account
          ansible.builtin.file:
            path: "{{ item }}"
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            recurse: true
          loop:
            - "{{ unifi_data_dir }}/config"
            - "{{ unifi_data_dir }}/mongodb/data"

        - name: Find UniFi Data Still Orphaned After the Reclaim
          ansible.builtin.command:
            argv: "{{ unifi_orphaned_data.cmd }}"
          register: unifi_still_orphaned
          changed_when: false
          failed_when: unifi_still_orphaned.rc != 0 or unifi_still_orphaned.stdout | length > 0

    # ── MongoDB Init Script ─────────────────────────────────────────────────────
    # UniFi Network Application requires a dedicated MongoDB user/database
    # @see https://github.com/linuxserver/docker-unifi-network-application

    - name: Deploy MongoDB Init Script for UniFi
      ansible.builtin.copy:
        dest: "{{ unifi_data_dir }}/mongodb/init/init-mongo.js"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          // Creates the UniFi database and user on first MongoDB start
          db.getSiblingDB("unifi").createUser({
            user: "unifi",
            pwd: "unifi",
            roles: [{ role: "dbOwner", db: "unifi" }]
          });
          db.getSiblingDB("unifi_stat").createUser({
            user: "unifi",
            pwd: "unifi",
            roles: [{ role: "dbOwner", db: "unifi_stat" }]
          });

    # ── Compose File ──────────────────────────────────────────────────────────
    # Defines both containers and their relationship in one declarative file
    # podman compose reads standard docker-compose.yml format

    - name: Deploy UniFi Compose File
      ansible.builtin.copy:
        dest: "{{ unifi_data_dir }}/docker-compose.yml"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # UniFi Network Controller — podman compose
          # Start: podman compose up -d
          # Stop:  podman compose down
          services:
            mongodb:
              image: {{ unifi_mongo_image }}
              container_name: unifi-mongodb
              volumes:
                - {{ unifi_data_dir }}/mongodb/data:/data/db:Z
                - {{ unifi_data_dir }}/mongodb/init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro,Z
              restart: unless-stopped

            unifi:
              image: {{ unifi_image }}
              container_name: unifi-network-controller
              depends_on:
                - mongodb
              environment:
                PUID: "1000"
                PGID: "1000"
                TZ: Europe/London
                MONGO_USER: unifi
                MONGO_PASS: unifi
                MONGO_HOST: mongodb
                MONGO_PORT: "27017"
                MONGO_DBNAME: unifi
                MEM_LIMIT: "1024"
              volumes:
                - {{ unifi_data_dir }}/config:/config:Z
              ports:
                - "8443:8443"       # Web UI (HTTPS)
                - "8080:8080"       # Device communication (inform)
                - "3478:3478/udp"   # STUN (AP discovery)
                - "10001:10001/udp" # AP discovery (L2)
                - "1900:1900/udp"   # UPnP/DLNA
                - "8843:8843"       # Guest portal HTTPS
                - "6789:6789"       # Speed test
              restart: unless-stopped

    # ── Pull Container Images ─────────────────────────────────────────────────
    # Pre-pull images so first `unifi-controller start` is faster
    # The controller is on-demand — the playbook does NOT start it

    - name: Pull UniFi Container Images
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command: podman compose pull
      args:
        chdir: "{{ unifi_data_dir }}"
      register: compose_pull
      changed_when: "'Pull complete' in compose_pull.stdout or 'Downloaded' in compose_pull.stdout or compose_pull.rc == 0"

    # ── Firewall Rules ──────────────────────────────────────────────────────────
    # AP discovery requires these ports to be open on the host firewall
    # @see https://help.ui.com/hc/en-us/articles/218506997

    - name: Open UniFi Ports in Firewall
      ansible.builtin.shell: |
        set -e
        # STUN (AP discovery)
        firewall-cmd --permanent --add-port=3478/udp
        # Device communication
        firewall-cmd --permanent --add-port=8080/tcp
        # Web UI (HTTPS)
        firewall-cmd --permanent --add-port=8443/tcp
        # AP discovery (L2)
        firewall-cmd --permanent --add-port=10001/udp
        # DLNA/UPnP (optional)
        firewall-cmd --permanent --add-port=1900/udp
        # Guest portal HTTPS (optional)
        firewall-cmd --permanent --add-port=8843/tcp
        # Speed test (optional)
        firewall-cmd --permanent --add-port=6789/tcp
        firewall-cmd --reload
      args:
        executable: /bin/bash
      changed_when: true

    # ── Launch Script ─────────────────────────────────────────────────────────
    # On-demand launcher: starts the stack, opens the web UI, waits for stop

    - name: Deploy UniFi Controller Launch Script
      ansible.builtin.copy:
        dest: /home/{{ user_login }}/.local/bin/unifi-controller
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -e

          COMPOSE_DIR="{{ unifi_data_dir }}"
          PROPERTIES="$COMPOSE_DIR/config/data/system.properties"
          URL="https://localhost:8443"

          # Detect current LAN IP and write to system.properties before every start
          # APs need to reach the controller over the network — the container's
          # internal IP (10.89.x.x) is unreachable, so we set the host's LAN IP
          # @see https://help.ui.com/hc/en-us/articles/204909754
          update_inform_host() {
            local lan_ip
            lan_ip=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}')
            if [ -z "$lan_ip" ]; then
              echo "WARNING: Could not detect LAN IP — APs may not be able to reach the controller" >&2
              return
            fi
            mkdir -p "$(dirname "$PROPERTIES")"
            # Container remaps UIDs — reclaim ownership so we can write
            # Inside podman's user namespace, UID 0 maps to the host user
            if ! podman unshare chown -R 0:0 "$COMPOSE_DIR/config/data/" 2>/dev/null; then
              echo "WARNING: could not reclaim ownership of config/data; writes may fail" >&2
            fi
            # Remove any existing system_ip line, then append current
            if [ -f "$PROPERTIES" ]; then
              grep -v '^system_ip=' "$PROPERTIES" > "$PROPERTIES.tmp"
              mv "$PROPERTIES.tmp" "$PROPERTIES"
            fi
            echo "system_ip=$lan_ip" >> "$PROPERTIES"
            echo "Controller inform host set to: $lan_ip"
          }

          start_stack() {
            if [ "$(podman compose -f "$COMPOSE_DIR/docker-compose.yml" ps -q 2>/dev/null | wc -l)" -ge 2 ]; then
              echo "UniFi stack already running"
            else
              update_inform_host
              echo "Starting UniFi stack..."
              podman compose -f "$COMPOSE_DIR/docker-compose.yml" up -d
              echo "Waiting for controller to initialise..."
              sleep 5
            fi
          }

          stop_stack() {
            echo ""
            echo "Stopping UniFi stack..."
            podman compose -f "$COMPOSE_DIR/docker-compose.yml" down
            echo "UniFi controller stopped."
          }

          case "${1:-start}" in
            start)
              start_stack
              echo "UniFi Controller: $URL"
              xdg-open "$URL" 2>/dev/null || echo "Open $URL in your browser"
              echo ""
              echo "Press Ctrl+C to stop the controller."
              trap stop_stack EXIT
              # Keep running until user presses Ctrl+C
              while true; do sleep 60; done
              ;;
            stop)
              stop_stack
              ;;
            status)
              podman compose -f "$COMPOSE_DIR/docker-compose.yml" ps
              ;;
            logs)
              podman compose -f "$COMPOSE_DIR/docker-compose.yml" logs -f
              ;;
            *)
              echo "Usage: unifi-controller [start|stop|status|logs]"
              exit 1
              ;;
          esac

    # ── Desktop Launcher ───────────────────────────────────────────────────────
    # GNOME application launcher — shows in Activities search as "UniFi"

    - name: Deploy UniFi Desktop Launcher
      ansible.builtin.copy:
        dest: /home/{{ user_login }}/.local/share/applications/unifi-controller.desktop
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=UniFi Controller
          Comment=Start UniFi Network Controller and open web UI
          Exec=/home/{{ user_login }}/.local/bin/unifi-controller start
          Icon=network-wireless
          Terminal=true
          Type=Application
          Categories=Network;System;
          Keywords=unifi;wifi;network;access point;router;

    # ── Post-Install Info ───────────────────────────────────────────────────────

    - name: Show UniFi Controller Access Info
      ansible.builtin.debug:
        msg:
          - ""
          - "UniFi Network Controller deployed successfully!"
          - ""
          - "  Launch:  search 'UniFi' in GNOME Activities"
          - "  Or run:  unifi-controller start"
          - ""
          - "  Web UI:  https://localhost:8443"
          - ""
          - "  Commands:"
          - "    unifi-controller start    start + open browser"
          - "    unifi-controller stop     stop the controller"
          - "    unifi-controller status   show container status"
          - "    unifi-controller logs     follow container logs"
          - ""
          - "  Data:    {{ unifi_data_dir }}"
          - "  Compose: {{ unifi_data_dir }}/docker-compose.yml"
          - ""
          - "  NOTE: First startup takes 1-2 minutes."
          - "  Accept the self-signed certificate warning in browser."
          - ""
          - "  Setup guide: docs/UnifiSetupGuide.md"
          - ""

    # ── Admin Login ─────────────────────────────────────────────────────────────
    # The controller's web login is owned here: the name is unifi_admin_name, the
    # password is unifi_admin_password, vault-encrypted in localhost.yml. A host with no
    # password gets a generated one, vaulted on first run. Read it back with
    # `./vault.bash get unifi_admin_password`. Last in the play: on a new install the
    # database has no admin until the setup wizard has run, and everything above must be
    # deployed for the wizard to be reachable.

    - name: Generate a UniFi Admin Password
      ansible.builtin.set_fact:
        unifi_admin_password_generated: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      no_log: true
      when: unifi_admin_password is not defined

    # Passed on stdin, never templated into a command line. stdin_add_newline is off so
    # the vaulted value is the password and not the password plus a newline.
    - name: Vault-Encrypt the Generated UniFi Admin Password
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --stdin-name
          - unifi_admin_password
        chdir: "{{ root_dir }}"
        stdin: "{{ unifi_admin_password_generated }}"
        stdin_add_newline: false
      become: false
      register: unifi_admin_password_encrypted
      changed_when: false
      no_log: true
      when: unifi_admin_password is not defined

    - name: Save the Vault-Encrypted UniFi Admin Password to localhost.yml
      ansible.builtin.blockinfile:
        path: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
        marker: "# {mark} ANSIBLE MANAGED: unifi_admin_password"
        block: "{{ unifi_admin_password_encrypted.stdout }}"
        create: false
      become: false
      no_log: true
      when: unifi_admin_password is not defined

    - name: Resolve the UniFi Admin Password for This Run
      ansible.builtin.set_fact:
        unifi_admin_password_effective: "{{ unifi_admin_password | default(unifi_admin_password_generated) }}"
      no_log: true

    - name: Apply the Admin Login to the UniFi Database
      become: true
      become_user: "{{ user_login }}"
      block:
        - name: Probe Whether UniFi MongoDB Is Running
          ansible.builtin.command: podman container inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' unifi-mongodb
          register: unifi_mongo_running
          changed_when: false
          failed_when: false  # FAIL-FAST-OK: a missing container is the "not running" answer; rc is checked below

        - name: Start UniFi MongoDB for the Admin Update
          ansible.builtin.command: podman compose up -d mongodb
          args:
            chdir: "{{ unifi_data_dir }}"
          changed_when: true
          when: unifi_mongo_running.rc != 0 or unifi_mongo_running.stdout != 'true'

        - name: Wait for UniFi MongoDB to Answer
          ansible.builtin.command:
            argv: [podman, exec, unifi-mongodb, mongosh, --quiet, -u, unifi, -p, unifi,
                   --authenticationDatabase, unifi, unifi, --eval, "db.runCommand({ping: 1}).ok"]
          register: unifi_mongo_ping
          until: unifi_mongo_ping.rc == 0 and unifi_mongo_ping.stdout | trim == '1'
          retries: 30
          delay: 2
          changed_when: false

        - name: Read the UniFi Admin Accounts
          ansible.builtin.command:
            argv: [podman, exec, unifi-mongodb, mongosh, --quiet, -u, unifi, -p, unifi,
                   --authenticationDatabase, unifi, unifi, --eval,
                   "print(JSON.stringify(db.admin.find({}, {name: 1, x_shadow: 1}).toArray().map(a => ({id: a._id.toString(), name: a.name, x_shadow: a.x_shadow || ''}))))"]
          register: unifi_admins_read
          changed_when: false
          no_log: true

        # The admin named unifi_admin_name, or else the only admin there is. More than
        # one admin and none of them named so is a choice for a person, not this play.
        - name: Choose the UniFi Admin This Play Owns
          ansible.builtin.set_fact:
            unifi_admin_target: >-
              {{ (unifi_admins | selectattr('name', 'equalto', unifi_admin_name) | list
                  or (unifi_admins if unifi_admins | length == 1 else []))
                 | first | default({}) }}
          vars:
            unifi_admins: "{{ unifi_admins_read.stdout | from_json }}"
          no_log: true

        - name: Assert There Is One UniFi Admin to Own
          ansible.builtin.assert:
            that: unifi_admin_target.id is defined
            fail_msg: >-
              The UniFi database has {{ (unifi_admins_read.stdout | from_json) | length }} admin
              account(s) and none is named {{ unifi_admin_name }}. Everything else is deployed.
              With no admin (a new install): run `unifi-controller start`, complete the setup
              wizard with any admin name and password, then re-run this play; it renames that
              admin to {{ unifi_admin_name }} and sets the vaulted password. With several: rename
              the one to keep to {{ unifi_admin_name }} in the UniFi UI, then re-run this play.
            quiet: true

        # Hashed with the stored salt, so an unchanged password gives the stored hash
        # and the update below is skipped.
        - name: Hash the UniFi Admin Password
          ansible.builtin.command:
            argv: "{{ ['openssl', 'passwd', '-6']
                      + (['-salt', unifi_admin_target.x_shadow.split('$')[2]]
                         if unifi_admin_target.x_shadow.startswith('$6$') else [])
                      + ['-stdin'] }}"
            stdin: "{{ unifi_admin_password_effective }}"
          register: unifi_admin_hash
          changed_when: false
          no_log: true

        - name: Set the UniFi Admin Name and Password
          ansible.builtin.command:
            argv: [podman, exec, -e, UNIFI_ADMIN_ID, -e, UNIFI_ADMIN_NAME, -e, UNIFI_ADMIN_HASH,
                   unifi-mongodb, mongosh, --quiet, -u, unifi, -p, unifi,
                   --authenticationDatabase, unifi, unifi, --eval,
                   "const r = db.admin.updateOne({_id: ObjectId(process.env.UNIFI_ADMIN_ID)}, {$set: {name: process.env.UNIFI_ADMIN_NAME, x_shadow: process.env.UNIFI_ADMIN_HASH}}); if (r.matchedCount !== 1) { quit(1) }"]
          environment:
            UNIFI_ADMIN_ID: "{{ unifi_admin_target.id }}"
            UNIFI_ADMIN_NAME: "{{ unifi_admin_name }}"
            UNIFI_ADMIN_HASH: "{{ unifi_admin_hash.stdout | trim }}"
          changed_when: true
          no_log: true
          when: >-
            unifi_admin_target.name != unifi_admin_name
            or unifi_admin_target.x_shadow != (unifi_admin_hash.stdout | trim)

      always:
        - name: Stop UniFi MongoDB if This Play Started It
          ansible.builtin.command: podman stop unifi-mongodb
          changed_when: true
          when: unifi_mongo_running.rc != 0 or unifi_mongo_running.stdout != 'true'
