#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Login-time host health report (Plan 00109, Tasks 3.1 and 3.2) — reporting-only.
#
# The report merges four checks into one message: post-boot health (DKMS against the
# running kernel, failed units), whether the ledger is there to read at all, play
# freshness against the ledger, and repo-pin versus installed. It is SILENT when clean.
#
# Why this exists: a reboot into a new kernel left both DisplayLink monitors dark because
# a DKMS module could not build, and every automated check in this repo was green
# throughout — none of them looks at the host.
#
# ONE PLAY, TWO DELIVERIES, because only the delivery was ever profile-specific. The
# checks are profile-agnostic, and a second playbook for the second delivery meant four
# byte-identical tasks and a pair that would drift the first time one of them was fixed.
#
#   desktop — `host-health.service`, a systemd --user unit at the END of a graphical
#             login, delivering by notify-send. The end of login, not boot: the whole
#             point is that somebody is present to read it.
#   server  — `graphical-session.target` never activates and there is no session bus, so
#             the same collection runs on `host-health-collect.timer` and a
#             ~/.bashrc-includes snippet prints what it left at the next interactive
#             shell. A git fetch at every SSH login would slow every login and can hang.
#
# Reporting-only, and that is a hard boundary: nothing here re-runs a play, installs
# anything beyond the report's own runtime dependency, or moves the working tree.
# Re-running a play is always a human decision.
#
# Needs `user_login`'s systemd manager reachable, because this play ENABLES rather than
# merely deploying — an unenabled unit never fires. That does NOT require a graphical
# session: `play-systemd-user-tweaks.yml` (import 8 of playbook-main, `scope: general`)
# enables linger and then explicitly starts `user@UID.service`, blocking until it signals
# READY=1. So on any host provisioned by playbook-main the manager is there. Run this on a
# fresh host before that play and the enable fails, loudly, which is the intended answer.
#
# Standalone / opt-in play — deliberately NOT imported from playbook-main.yml. Run it
# directly:
#   ./playbooks/imports/optional/common/play-host-health-login-report.yml
- hosts: desktop
  name: Login-Time Host Health Report
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    unit_name: host-health.service
    collect_service: host-health-collect.service
    collect_timer: host-health-collect.timer
    user_units_dir: "/home/{{ user_login }}/.config/systemd/user"
    bashrc_includes_dir: "/home/{{ user_login }}/.bashrc-includes"
    # The marker play-basic-configs.yml writes when it adds the sourcing loop. Asserted
    # rather than assumed: without that loop the snippet is deployed and never read, and
    # a report nothing reads looks exactly like a host with nothing to report.
    bashrc_includes_marker: "# BEGIN ANSIBLE MANAGED: Source bashrc includes"
    is_server: "{{ provisioning_profile == 'server' }}"
  tasks:
    # NOT the scope guard. AnsibleStyle.md's "a general play carries no guard" is about
    # the two-task `meta: end_play` block, which would be wrong here: this play has work
    # for BOTH profiles, and qa-ansible.bash rejects that block on a general scope.
    #
    # This validates an input instead, and it is load-bearing because a human types that
    # input: auto-detection can only ever yield desktop or server, but
    # `-e provisioning_profile=…` is the documented override and takes highest
    # precedence. A typo there would leave `is_server` false and quietly run the desktop
    # delivery on a server — deploying a notify-send unit to a box with no session bus
    # and no login report at all.
    - name: Assert The Provisioning Profile Is Recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    # PyYAML for the SYSTEM interpreter, which is what the units run
    # (`ExecStart=/usr/bin/python3`). The pin check converts `vars/version-pins.yml`
    # through it, and Ansible's own PyYAML may live in a pipx venv that
    # `/usr/bin/python3` cannot import — so assuming it was an assumption about a
    # host, on the one drift axis this plan was written for. Declared, per CLAUDE.md's
    # missing-dependency rule, rather than tolerated at runtime.
    #
    # `libnotify` is NOT here: `play-gnome-shell.yml` owns it, because it owns the
    # desktop and two other core-path consumers need it too.
    - name: Install The Report's Runtime Dependencies
      ansible.builtin.dnf:
        name: python3-pyyaml
        state: present

    - name: Ensure User Systemd Unit Directory Exists
      ansible.builtin.file:
        path: "{{ user_units_dir }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    # Resolved, not assumed. A sibling play writes `/run/user/{{ uid | default(1000) }}`,
    # and a wrong default there does not fail — it silently points the probe at
    # another user's runtime directory, or at nothing, and the enable step then
    # reports "no user manager" on a host that has one.
    - name: Resolve The Session User UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
        # `fail_key: false` hands the verdict to the assert below, whose fail_msg is
        # the report the operator actually gets; the module's own failure says only
        # "one or more supplied key could not be found".
        #
        # It does NOT make the key absent. getent sets the key to `None` and exits
        # successfully, so `is defined` is True even for a missing user. That is why
        # the assert tests `is not none` BEFORE indexing: without it, `[1]` raises
        # UndefinedError and the fail_msg written for this case is never reached.
        # Each clause below exists to make the next one safe to evaluate.
        fail_key: false

    - name: Assert The Session User Exists
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][user_login] is defined
          - ansible_facts['getent_passwd'][user_login] is not none
          - ansible_facts['getent_passwd'][user_login][1] | int > 0
        fail_msg: >-
          Could not resolve a uid for {{ user_login }}, so this play cannot find that
          user's systemd manager. It would otherwise guess, and a guessed uid points
          at the wrong runtime directory without failing.

    # ── Desktop delivery: notify-send at the end of a graphical login ────────────────
    #
    # Templated, not copied: WorkingDirectory is this checkout's path, which is a
    # property of the machine and is never written into the repo.
    - name: Deploy The Login-Time Health Report Unit
      ansible.builtin.template:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ unit_name }}.j2"
        dest: "{{ user_units_dir }}/{{ unit_name }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      register: hh_unit
      when: not is_server | bool

    # Unconditional within the desktop branch, and the enable is its own probe. Two
    # reasons it is not guarded further:
    #
    # A deployed-but-unenabled unit NEVER runs — `WantedBy=` in `[Install]` does
    # nothing until `enable` writes the `graphical-session.target.wants/` symlink.
    # So there is no second path to fall back to and describe.
    #
    # And `systemctl --user is-system-running` cannot tell "no manager" from
    # "manager with a failed unit": systemd returns
    # `streq(state, "running") ? EXIT_SUCCESS : EXIT_FAILURE`, so `degraded` exits
    # 1 too. Guarding on it skipped the enable on precisely the host this plan
    # exists to detect. An unreachable user bus fails this task, loudly, which is
    # the answer that probe was reaching for.
    # A profile is not immutable: a mis-set `-e provisioning_profile` corrected on the
    # next run would otherwise leave BOTH deliveries installed, collecting twice and
    # reporting twice. Removing the unit file alone is not a disable — `enable` writes a
    # `.wants/` symlink that outlives it — so the symlink goes too. `state: absent` is
    # idempotent and cannot fail on a host that never had them, which `systemctl
    # disable` would.
    - name: Remove The Server Delivery
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ user_units_dir }}/{{ collect_service }}"
        - "{{ user_units_dir }}/{{ collect_timer }}"
        - "{{ user_units_dir }}/timers.target.wants/{{ collect_timer }}"
        - "{{ bashrc_includes_dir }}/host-health-report.bash"
      register: hh_server_removed
      when: not is_server | bool

    - name: Enable The Login-Time Health Report
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: "{{ unit_name }}"
        scope: user
        enabled: true
        daemon_reload: "{{ hh_unit.changed or hh_server_removed.changed }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      when: not is_server | bool

    # ── Server delivery: a timer to collect, a login shell to report ─────────────────
    - name: Deploy The Host Health Collection Unit
      ansible.builtin.template:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ collect_service }}.j2"
        dest: "{{ user_units_dir }}/{{ collect_service }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      register: hh_collect_service
      when: is_server | bool

    - name: Deploy The Host Health Collection Timer
      ansible.builtin.template:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ collect_timer }}.j2"
        dest: "{{ user_units_dir }}/{{ collect_timer }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      register: hh_collect_timer
      when: is_server | bool

    # `.bashrc-includes` and the loop that sources it are play-basic-configs.yml's,
    # which is in playbook-main's core path — this play reads that contract rather than
    # re-declaring it, so there is one owner of the mechanism.
    - name: Read The User's Bashrc To Confirm Includes Are Sourced
      ansible.builtin.slurp:
        src: "/home/{{ user_login }}/.bashrc"
      register: hh_bashrc
      when: is_server | bool

    - name: Assert The Bashrc Includes Loop Is Present
      ansible.builtin.assert:
        that:
          - bashrc_includes_marker in (hh_bashrc['content'] | b64decode)
        fail_msg: >-
          /home/{{ user_login }}/.bashrc does not source ~/.bashrc-includes, so the login
          snippet this play deploys would never be read and this host would report as
          healthy while nothing checked it. Run playbook-main.yml (or
          playbooks/imports/play-basic-configs.yml) first, which owns that loop.
      when: is_server | bool

    - name: Ensure Bashrc Includes Directory Exists
      ansible.builtin.file:
        path: "{{ bashrc_includes_dir }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      when: is_server | bool

    # Templated for the same reason as the units: it names this checkout's path.
    - name: Deploy The Login-Shell Health Report Snippet
      ansible.builtin.template:
        src: "{{ root_dir }}/files/home/bashrc-includes/host-health-report.bash.j2"
        dest: "{{ bashrc_includes_dir }}/host-health-report.bash"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      when: is_server | bool

    # Enabled AND started: `enabled` alone writes the timers.target.wants symlink but
    # leaves the timer unarmed until the next boot, and a report that begins a reboot
    # later is one nobody connects to the play they just ran. The unit is a timer, so
    # starting it arms the schedule — it does not run the collection now.
    # The mirror of the desktop branch's cleanup, for the same reason: correcting a
    # mis-set profile must not leave a notify-send unit installed on a box with no
    # session bus, wanted by a target that never activates.
    - name: Remove The Desktop Delivery
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ user_units_dir }}/{{ unit_name }}"
        - "{{ user_units_dir }}/graphical-session.target.wants/{{ unit_name }}"
      register: hh_desktop_removed
      when: is_server | bool

    - name: Enable And Start The Host Health Collection Timer
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: "{{ collect_timer }}"
        scope: user
        enabled: true
        state: started
        daemon_reload: >-
          {{ hh_collect_service.changed or hh_collect_timer.changed
             or hh_desktop_removed.changed }}
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      when: is_server | bool
