#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Comprehensive Audio Enhancement Configuration
# Includes HD audio support, dynamic rate switching, and Bluetooth audio fixes
# @see https://gitlab.freedesktop.org/pipewire/pipewire/-/wikis/Performance-tuning
- hosts: desktop
  name: Audio Enhancements (HD Audio & Bluetooth)
  vars:
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    pipewire_config_dir: "/home/{{ user_login }}/.config/pipewire"
    wireplumber_config_dir: "/home/{{ user_login }}/.config/wireplumber"
  tasks:
    - name: Check for existing audio enhancement configs
      ansible.builtin.find:
        paths:
          - "{{ pipewire_config_dir }}/pipewire.conf.d"
          - "{{ pipewire_config_dir }}/pipewire-pulse.conf.d"
          - "{{ pipewire_config_dir }}/client.conf.d"
        patterns:
          - "*hd-audio*.conf"
          - "*bluetooth*.conf"
          - "*alsa-properties*.conf"
      register: existing_audio_configs
      failed_when: false  # FAIL-FAST-OK: probe — config directories may not exist yet

    - name: Prompt for audio config removal if exists
      ansible.builtin.pause:
        prompt: "Existing audio enhancement configuration found. Remove and recreate? (yes/no)"
      register: remove_config
      when: existing_audio_configs.files | default([]) | length > 0

    - name: Remove existing audio enhancement configs only
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_audio_configs.files | default([]) }}"
      when:
        - existing_audio_configs.files | default([]) | length > 0
        - remove_config.user_input | default('yes') | lower == 'yes'

    - name: Create PipeWire config directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - "{{ pipewire_config_dir }}"
        - "{{ pipewire_config_dir }}/pipewire.conf.d"
        - "{{ pipewire_config_dir }}/pipewire-pulse.conf.d"
        - "{{ pipewire_config_dir }}/client.conf.d"

    - name: Configure HD Audio - Main PipeWire config
      ansible.builtin.copy:
        dest: "{{ pipewire_config_dir }}/pipewire.conf.d/99-hd-audio.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # HD Audio Configuration for PipeWire
          # Enables dynamic sample rate switching and high-quality audio

          context.properties = {
              # Allow dynamic rate switching based on active streams
              default.clock.rate          = 48000
              default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
              default.clock.quantum       = 1024
              default.clock.min-quantum   = 32
              default.clock.max-quantum   = 8192
          }

          context.modules = [
              {   name = libpipewire-module-rt
                  args = {
                      nice.level    = -11
                      rt.prio       = 88
                      rt.time.soft  = 2000000
                      rt.time.hard  = 2000000
                  }
                  flags = [ ifexists nofail ]
              }
          ]
      notify: pw-restart

    - name: Configure HD Audio - ALSA properties
      ansible.builtin.copy:
        dest: "{{ pipewire_config_dir }}/pipewire.conf.d/99-alsa-properties.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # ALSA device properties for HD Audio

          alsa.properties = {
              # Increase buffer sizes for better stability at high sample rates
              api.alsa.period-size   = 1024
              api.alsa.period-num    = 32
              api.alsa.headroom      = 1024
              api.alsa.disable-mmap  = false
              api.alsa.disable-batch = false
          }

          # Rules for all ALSA devices
          alsa.rules = [
              {
                  matches = [
                      {
                          # Match all ALSA devices
                          device.name = "~alsa_.*"
                      }
                  ]
                  actions = {
                      update-props = {
                          # Enable rate adaptation
                          audio.rate                = 0
                          audio.allowed-rates       = [ 44100 48000 88200 96000 176400 192000 ]
                          audio.format              = "F32"

                          # High quality resampling
                          resample.quality          = 10
                          resample.disable          = false

                          # Keep devices active
                          session.suspend-timeout-seconds = 0

                          # Use ACP (Audio Control Profiles) for proper device handling
                          api.alsa.use-acp         = true
                          api.alsa.ignore-dB       = false
                      }
                  }
              }
              {
                  matches = [
                      {
                          # Specific settings for USB audio devices like Steinberg
                          device.name = "~alsa_.*usb.*"
                      }
                  ]
                  actions = {
                      update-props = {
                          # USB devices often need larger buffers
                          api.alsa.period-size     = 2048
                          api.alsa.period-num      = 3
                          api.alsa.headroom        = 2048
                      }
                  }
              }
          ]
      notify: pw-restart

    - name: Configure HD Audio - PulseAudio compatibility
      ansible.builtin.copy:
        dest: "{{ pipewire_config_dir }}/pipewire-pulse.conf.d/99-hd-audio.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # PulseAudio compatibility layer configuration for HD Audio

          pulse.properties = {
              # Match the main PipeWire sample rates
              pulse.default.rate       = 48000
              pulse.allowed-rates      = [ 44100 48000 88200 96000 176400 192000 ]

              # Minimum latency settings
              pulse.min.req            = 256/48000
              pulse.min.quantum        = 256/48000
              pulse.default.req        = 1024/48000
              pulse.default.quantum    = 1024/48000
              pulse.max.quantum        = 8192/48000
          }

          stream.properties = {
              # High quality resampling for PulseAudio clients
              resample.quality         = 10
              channelmix.normalize     = true
              channelmix.upmix         = true
              channelmix.upmix-method  = psd
              channelmix.lfe-cutoff    = 150
              channelmix.fc-cutoff     = 12000
              channelmix.rear-delay    = 12.0
          }
      notify: pw-restart

    - name: Configure HD Audio - Client defaults
      ansible.builtin.copy:
        dest: "{{ pipewire_config_dir }}/client.conf.d/99-hd-audio.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # Client configuration for HD Audio

          stream.properties = {
              # Default properties for all clients
              resample.quality         = 10
              channelmix.normalize     = true

              # Allow rate adaptation by default
              node.rate                = 0
              node.autoconnect         = true
              node.latency             = 1024/48000
          }
      notify: pw-restart

    - name: Check if speech-dispatcher config exists
      ansible.builtin.stat:
        path: /etc/speech-dispatcher/speechd.conf
      register: speechd_conf
      become: true

    - name: Disable Speech Dispatcher Autospawn
      become: true
      ansible.builtin.blockinfile:
        path: /etc/speech-dispatcher/speechd.conf
        marker: "# {mark} ANSIBLE MANAGED: HD Audio - Disable Autospawn"
        block: |
          # Disable autospawn to prevent audio conflicts
          DisableAutoSpawn
      when: speechd_conf.stat.exists

    # Bluetooth Audio Configuration
    - name: Set Bluetooth Controller Mode to bredr for compatibility
      become: true
      ansible.builtin.blockinfile:
        marker: "# {mark} ANSIBLE MANAGED: Bluetooth Audio Enhancement"
        block: |
          # Enable classic Bluetooth + LE for better headphone compatibility
          ControllerMode = bredr
        path: /etc/bluetooth/main.conf
        insertafter: \[General\]
      notify: restart-bt

    - name: Configure PipeWire Bluetooth latency settings
      ansible.builtin.copy:
        dest: "{{ pipewire_config_dir }}/pipewire.conf.d/99-bluetooth-latency.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # Bluetooth latency optimization for PipeWire

          pulse.properties = {
              # Lower latency for Bluetooth devices
              pulse.min.req     = 128/48000
              pulse.min.quantum = 128/48000
          }

          # Bluetooth-specific module settings
          context.modules = [
              {   name = libpipewire-module-rt
                  args = {
                      nice.level    = -11
                      rt.prio       = 88
                  }
                  flags = [ ifexists nofail ]
              }
          ]
      notify: pw-restart

    # WirePlumber 0.5 reads only SPA-JSON under wireplumber.conf.d/. It ignores Lua, and
    # logs "Lua configuration files are NOT supported" at every start while a *.lua.d
    # tree exists. The 0.4 Lua this play used to write is removed below.
    - name: Create WirePlumber config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - "{{ wireplumber_config_dir }}"
        - "{{ wireplumber_config_dir }}/wireplumber.conf.d"

    # Device rules match device.name (alsa_card.*), node rules match node.name
    # (alsa_input.* / alsa_output.*). The rate, period and suspend settings are node
    # properties: the 0.4 Lua matched device.name only, so they never reached a node.
    - name: Configure WirePlumber for HD Audio
      ansible.builtin.copy:
        dest: "{{ wireplumber_config_dir }}/wireplumber.conf.d/51-hd-audio.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # HD Audio configuration for WirePlumber 0.5 (managed by play-hd-audio.yml)

          monitor.alsa.rules = [
            {
              matches = [
                { node.name = "~alsa_input.*" }
                { node.name = "~alsa_output.*" }
              ]
              actions = {
                update-props = {
                  audio.rate = 0
                  audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
                  api.alsa.period-size = 1024
                  api.alsa.headroom = 1024
                  session.suspend-timeout-seconds = 0
                }
              }
            }
          ]
      notify: wm-restart

    # bluez5.headset-roles is bluez5.roles in 0.5. Codec, role and mSBC switches are
    # monitor properties; auto-connect and LDAC quality are device properties; the
    # idle and suspend settings are node properties.
    - name: Configure WirePlumber Bluetooth settings
      ansible.builtin.copy:
        dest: "{{ wireplumber_config_dir }}/wireplumber.conf.d/51-bluetooth-quality.conf"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        content: |
          # Bluetooth headphones quality settings for WirePlumber 0.5 (managed by play-hd-audio.yml)

          monitor.bluez.properties = {
            bluez5.enable-sbc-xq = true
            bluez5.enable-msbc = true
            bluez5.enable-hw-volume = true
            bluez5.roles = [ hsp_hs hsp_ag hfp_hf hfp_ag ]
            bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd aptx_ll aptx_ll_duplex ]
            bluez5.default.rate = 48000
          }

          monitor.bluez.rules = [
            {
              matches = [
                { device.name = "~bluez_card.*" }
              ]
              actions = {
                update-props = {
                  bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink ]
                  bluez5.a2dp.ldac.quality = "hq"
                }
              }
            }
            {
              matches = [
                { node.name = "~bluez_input.*" }
                { node.name = "~bluez_output.*" }
              ]
              actions = {
                update-props = {
                  node.pause-on-idle = false
                  session.suspend-timeout-seconds = 0
                }
              }
            }
          ]
      notify: wm-restart

    - name: Remove the WirePlumber 0.4 Lua Files This Play Wrote
      ansible.builtin.file:
        path: "{{ wireplumber_config_dir }}/{{ item }}"
        state: absent
      loop:
        - main.lua.d/99-hd-audio.lua
        - bluetooth.lua.d/99-bluetooth-quality.lua
      notify: wm-restart

    # A directory that does not exist is reported as skipped, not as an error, and
    # contributes no files.
    - name: List Anything Left in the Retired Lua Directories
      ansible.builtin.find:
        paths:
          - "{{ wireplumber_config_dir }}/main.lua.d"
          - "{{ wireplumber_config_dir }}/bluetooth.lua.d"
        file_type: any
        hidden: true
      register: wireplumber_lua_leftovers

    # Anything else in there was not written by this repo, and 0.5 ignores it too. It is
    # not deleted. The run stops so the owner can port it or remove it.
    - name: Assert No Other Lua Configuration Remains
      ansible.builtin.assert:
        that:
          - wireplumber_lua_leftovers.files | length == 0
        fail_msg: >-
          WirePlumber 0.5 ignores Lua configuration, and warns at every start while any is
          present. These files were not written by this play, so they are left for you to
          port to {{ wireplumber_config_dir }}/wireplumber.conf.d/*.conf (SPA-JSON) or delete:
          {{ wireplumber_lua_leftovers.files | map(attribute='path') | join(', ') }}

    - name: Remove the Retired Lua Directories
      ansible.builtin.file:
        path: "{{ wireplumber_config_dir }}/{{ item }}"
        state: absent
      loop:
        - main.lua.d
        - bluetooth.lua.d
      notify: wm-restart

  handlers:
    - name: pw-restart
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        scope: user
      loop:
        - pipewire
        - pipewire-pulse
        - wireplumber

    - name: wm-restart
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: wireplumber
        state: restarted
        scope: user

    - name: restart-bt
      become: true
      ansible.builtin.systemd:
        name: bluetooth
        state: restarted
