#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Network discovery and diagnostics tools
#
# Installs nmap, arp-scan, and custom lan-scan script for finding
# devices on the local network (QNAP NAS servers, etc.), and Ookla's Speedtest CLI
# with the speedtest-isp wrapper (host_vars `speedtest_isp` names the ISP).
- hosts: desktop
  name: Network Discovery Tools
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # Ookla's Speedtest CLI is not packaged; the tarball is pinned by version and checksum.
    # Update deliberately; vars/version-pins.yml names this var.
    # @see https://www.speedtest.net/apps/cli
    ooklaSpeedtestVersion: "1.2.0"
    ooklaSpeedtestSha256: "5690596c54ff9bed63fa3732f818a05dbc2db19ad36ed68f21ca5f64d5cfeeb7"
    ooklaSpeedtestDir: "/opt/ookla-speedtest-{{ ooklaSpeedtestVersion }}"
    ooklaSpeedtestUrl: "https://install.speedtest.net/app/cli/ookla-speedtest-{{ ooklaSpeedtestVersion }}-linux-x86_64.tgz"
  tasks:
    # ── Packages ───────────────────────────────────────────────────────────────

    - name: Install Network Discovery Packages
      ansible.builtin.dnf:
        name:
          - nmap                # Port scanning and host discovery
          - arp-scan            # Fast L2 ARP-based discovery (shows MAC vendors)
          - avahi-tools         # mDNS/Bonjour browsing (avahi-browse)
          - nss-mdns            # mDNS hostname resolution (.local domains)
          - net-tools           # ifconfig, netstat, arp (legacy but useful)
          - bind-utils          # dig, nslookup, host
          - jq                  # speedtest-isp reads Ookla's server list
        state: present

    # ── Ookla Speedtest CLI ────────────────────────────────────────────────────
    # Public test-file servers cap one client far below a multi-gigabit line; Ookla
    # measures against servers inside ISPs with many connections, as speedtest.net does.

    - name: Create the versioned Ookla Speedtest directory
      ansible.builtin.file:
        path: "{{ ooklaSpeedtestDir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Ookla Speedtest CLI (checksum-verified)
      ansible.builtin.get_url:
        url: "{{ ooklaSpeedtestUrl }}"
        dest: "{{ ooklaSpeedtestDir }}/ookla-speedtest.tgz"
        checksum: "sha256:{{ ooklaSpeedtestSha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack the Ookla Speedtest CLI
      ansible.builtin.unarchive:
        src: "{{ ooklaSpeedtestDir }}/ookla-speedtest.tgz"
        dest: "{{ ooklaSpeedtestDir }}"
        remote_src: true
        creates: "{{ ooklaSpeedtestDir }}/speedtest"
        owner: root
        group: root

    - name: Link speedtest into /usr/local/bin
      ansible.builtin.file:
        src: "{{ ooklaSpeedtestDir }}/speedtest"
        dest: /usr/local/bin/speedtest
        state: link
        force: true

    - name: Read the installed Ookla Speedtest version
      ansible.builtin.command: /usr/local/bin/speedtest --version
      register: ookla_speedtest_version
      changed_when: false

    - name: Assert the Ookla Speedtest version matches the pin
      ansible.builtin.assert:
        that:
          - ooklaSpeedtestVersion in ookla_speedtest_version.stdout
        fail_msg: "speedtest reports '{{ ookla_speedtest_version.stdout_lines | first }}', expected {{ ooklaSpeedtestVersion }}"

    - name: Create the fedora-desktop user config directory
      ansible.builtin.file:
        path: /home/{{ user_login }}/.config/fedora-desktop
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    # Empty when speedtest_isp is unset: speedtest-isp then lets Ookla pick the server.
    - name: Record the ISP whose speed-test server speedtest-isp prefers
      ansible.builtin.copy:
        content: "{{ speedtest_isp | default('') }}"
        dest: /home/{{ user_login }}/.config/fedora-desktop/speedtest-isp
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"

    # ── Custom Scripts ─────────────────────────────────────────────────────────

    - name: Deploy Network Discovery Scripts
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/{{ item }}"
        dest: /home/{{ user_login }}/.local/bin/{{ item }}
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      loop:
        - lan-scan
        - qnap-finder
        - speedtest-isp

    # ── Post-Install Info ──────────────────────────────────────────────────────

    - name: Show Network Tools Usage
      ansible.builtin.debug:
        msg:
          - ""
          - "Network discovery tools installed!"
          - ""
          - "  Find QNAP NAS devices:"
          - "    qnap-finder"
          - ""
          - "  Quick ARP scan (all devices, highlights QNAPs):"
          - "    lan-scan"
          - ""
          - "  Find NAS devices by open ports:"
          - "    lan-scan find-nas"
          - ""
          - "  Port scan a specific host:"
          - "    lan-scan ports <ip-address>"
          - ""
          - "  Live ARP monitor:"
          - "    lan-scan watch"
          - ""
          - "  Internet speed (your ISP's Ookla server when one is near):"
          - "    speedtest-isp"
          - ""
          - "  Other tools installed:"
          - "    nmap, arp-scan, avahi-browse, dig, nslookup"
          - ""
