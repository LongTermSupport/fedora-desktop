#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# NordVPN OpenVPN Manager
#
# Deploys the nord command, which manages NordVPN OpenVPN connections through NetworkManager's
# CLI. The user downloads .ovpn files from NordVPN; nord imports, connects and disconnects them.
#
# Usage: ./playbooks/imports/optional/common/play-nordvpn-openvpn.yml

# nord is a Go binary built from this checkout (src-go/cmd/nord), so the Go toolchain is
# installed first. play-golang.yml stays its one source of truth.
- import_playbook: ../../play-golang.yml

- hosts: desktop
  name: NordVPN OpenVPN Manager
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
  pre_tasks:
    - name: Load host vars
      ansible.builtin.include_vars:
        file: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
  tasks:
    # =========================================================================
    # System Dependencies
    # =========================================================================

    - name: Install OpenVPN and NetworkManager Support (CLI, headless-safe)
      become: true
      ansible.builtin.dnf:
        name:
          - openvpn
          - NetworkManager-openvpn
        state: present

    # NetworkManager-openvpn-gnome is the GNOME applet integration — useless on
    # a headless server (Plan 00061, mixed-play pattern like play-vpn.yml §6.3).
    - name: Install NetworkManager GNOME Applet Integration
      become: true
      ansible.builtin.dnf:
        name:
          - NetworkManager-openvpn-gnome
        state: present
      when: provisioning_profile != 'server'

    # =========================================================================
    # Configuration Directories
    # =========================================================================

    - name: Create NordVPN Configuration Directory
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/nordvpn"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0700'

    - name: Create OpenVPN Configs Directory
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/nordvpn/configs"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Create Log Directory
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/share/nordvpn"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    # =========================================================================
    # Credentials Collection (Encrypted with Vault)
    # =========================================================================

    # Asked for once and saved vault-encrypted in localhost.yml; later runs use them.
    - name: Ask for the NordVPN service username when it is missing
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret.yml"
      vars:
        secret_name: nordvpn_username
        secret_label: NordVPN service username
        secret_confirm: false
        secret_explain: |2

          ========================================================================
          NORDVPN OPENVPN CREDENTIALS
          ========================================================================

          This needs your NordVPN SERVICE credentials, which are not the email
          and password you log in to nordvpn.com with. To get them:
          1. Log in to nordvpn.com
          2. Go to Dashboard, then Services, then NordVPN
          3. Click "Set up NordVPN manually"
          4. Copy the "Service credentials" (a username like aBcD1eF2gH3iJ4kL,
             and a password)

          Both are saved vault-encrypted in localhost.yml, and not asked again.
      when: nordvpn_username is not defined

    - name: Ask for the NordVPN service password when it is missing
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/ask-and-save-secret.yml"
      vars:
        secret_name: nordvpn_password
        secret_label: NordVPN service password
        secret_explain: >-
          The password from the same "Service credentials" box on nordvpn.com (Dashboard,
          Services, NordVPN, "Set up NordVPN manually").
      when: nordvpn_password is not defined

    # =========================================================================
    # Deploy Credentials File
    # =========================================================================

    - name: Create Credentials File
      block:
        - name: Write the Credentials File
          ansible.builtin.copy:
            dest: "/home/{{ user_login }}/.config/nordvpn/.credentials"
            owner: "{{ user_login }}"
            group: "{{ user_login }}"
            mode: '0600'
            content: |
              {{ nordvpn_username }}
              {{ nordvpn_password }}
          no_log: true
      rescue:
        - name: Stop Because the Credentials File Could Not Be Written
          ansible.builtin.fail:
            msg: >-
              The NordVPN credentials file ~/.config/nordvpn/.credentials could not be
              written: {{ ansible_failed_result.msg | default('no reason given') }}. The nord
              command cannot connect without it; fix the cause and run this play again.

    # =========================================================================
    # Deploy the nord Command
    # =========================================================================

    # The command is a Go binary (src-go/cmd/nord, Plan 00192), built and installed at its
    # old path by the shared build-go-command.yml.
    - name: Build and Install the nord Command
      ansible.builtin.import_tasks: "{{ root_dir }}/tasks/build-go-command.yml"
      vars:
        go_command_name: nord
        go_command_dest: "/home/{{ user_login }}/.local/bin/nord"
        go_command_mode: "0755"

    # The bash nord recorded its last connection here; the Go nord asks NetworkManager instead
    # (SPEC-nord D2), so the stale record is removed.
    - name: Remove the Old Connection Record
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/nordvpn/.current-connection"
        state: absent

    # =========================================================================
    # Firewall Configuration
    # =========================================================================

    # With no firewalld running there is no firewall to open, so OpenVPN needs nothing and the
    # two tasks below are skipped. A firewalld started later gets the rule on the next run.
    - name: Check if Firewalld is Running
      become: true
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld_status
      failed_when: false  # FAIL-FAST-OK: probe — firewalld may not be running
      changed_when: false

    # Asked first, so a run that finds the rule in place does not reload firewalld: a reload
    # drops every runtime-only rule, and the VPNs and containers running here may hold some.
    - name: Check Whether Firewalld Already Allows OpenVPN
      become: true
      ansible.builtin.command: firewall-cmd --permanent --query-service openvpn
      register: firewall_openvpn_query
      changed_when: false
      failed_when: firewall_openvpn_query.rc not in [0, 1]
      when: firewalld_status.rc == 0

    - name: Add OpenVPN to Firewalld
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        firewall-cmd --add-service openvpn --permanent
        firewall-cmd --reload
      args:
        executable: /bin/bash
      when: firewalld_status.rc == 0 and firewall_openvpn_query.rc == 1

    # =========================================================================
    # Usage Instructions
    # =========================================================================

    - name: Display Setup Instructions
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "NordVPN OpenVPN Manager Installation Complete"
          - "════════════════════════════════════════════════════════════════"
          - ""
          - "📥 NEXT STEPS - Download OpenVPN Configs"
          - ""
          - "  1. Go to nordvpn.com → Dashboard → Downloads → Linux"
          - "  2. Choose 'OpenVPN' tab"
          - "  3. Download desired server configs (.ovpn files)"
          - "  4. Move them to: ~/.config/nordvpn/configs/"
          - ""
          - "  Example:"
          - "    mv ~/Downloads/*.ovpn ~/.config/nordvpn/configs/"
          - ""
          - "🚀 USAGE"
          - ""
          - "  List available configs:"
          - "    nord list"
          - ""
          - "  Connect to VPN:"
          - "    nord connect uk1234   (a name nord list shows)"
          - ""
          - "  Check status:"
          - "    nord status"
          - ""
          - "  Switch servers:"
          - "    nord switch us5678"
          - ""
          - "  Disconnect:"
          - "    nord disconnect"
          - ""
          - "  View all commands:"
          - "    nord --help"
          - ""
          - "💡 TIPS"
          - ""
          - "  • Configs auto-import on first connect"
          - "  • Connections persist across reboots"
          - "  • Use GNOME Settings → Network to see connections"
          - "  • Credentials stored securely (mode 0600), and vault-encrypted in localhost.yml"
          - ""
          - "════════════════════════════════════════════════════════════════"
