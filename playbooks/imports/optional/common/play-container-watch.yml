#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Container Watchdog
#
# Deploys the containerwatch helper, its CLI wrapper and the systemd --user timer
# that runs periodic scans. It is the backend only: the desktop surface for the
# findings report is a section of the Fedora Desktop panel, deployed by
# `play-fedora-desktop-panel.yml`, which also retires the standalone
# container-watch extension this play used to install.
#
# It NEVER signals a process — that guarantee is unchanged and gated by
# scripts/qa-nokill-containerwatch.bash. It has exactly one action it may take: a
# graceful `stop` of a container in a runaway restart loop whose restart policy is
# unbounded. A container with no restart policy cannot be restarted by the engine
# anyway, so it is out of reach by construction rather than by threshold.
#
# Standalone / opt-in play (like play-speech-to-text.yml) — deliberately NOT
# imported from playbook-main.yml. Run it directly:
#   ./playbooks/imports/optional/common/play-container-watch.yml
- hosts: desktop
  name: Container Process Watchdog
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    # =========================================================================
    # Helper library (ccy-helpers shared lib, imported as helpers.containerwatch)
    # =========================================================================
    - name: Ensure ccy-helpers containerwatch library directory exists
      ansible.builtin.file:
        path: /usr/local/lib/ccy-helpers/helpers/containerwatch
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy containerwatch helper modules
      ansible.builtin.copy:
        src: "{{ root_dir }}/helpers/containerwatch/{{ item }}"
        dest: "/usr/local/lib/ccy-helpers/helpers/containerwatch/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      # An EXPLICIT list, not a directory copy or a glob (Plan 00055 D8). The cost
      # is that a new module is silently absent on the host until it is added
      # here — and cli.py imports every one of these at module scope, so a
      # missing entry is not a degraded scan, it is an ImportError on every tick.
      # Adding a module to helpers/containerwatch/ means adding it here too.
      loop:
        - core.py
        - crashloop.py
        # cli.py imports both at module scope, so omitting either is an ImportError
        # on every tick — a watchdog that is installed, scheduled, and dead.
        - containment.py
        - restartpolicy.py
        - cli.py

    # =========================================================================
    # CLI wrapper (~/.local/bin)
    # =========================================================================
    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy container-watch CLI wrapper
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/container-watch"
        dest: "/home/{{ user_login }}/.local/bin/container-watch"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    # =========================================================================
    # systemd --user units (service + timer)
    # =========================================================================
    - name: Ensure user systemd unit directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy container-watch user systemd units
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ item }}"
        dest: "/home/{{ user_login }}/.config/systemd/user/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      loop:
        - container-watch.service
        - container-watch.timer

    # =========================================================================
    # Enable the user TIMER (not the service)
    # =========================================================================
    # Resolved, never defaulted. `user_login_uid` is assigned nowhere in this repo,
    # so `| default(1000)` was not a fallback — it was a hardcoded 1000 on every run,
    # and on a host whose user is not uid 1000 it pointed the enable at another
    # user's runtime directory without failing.
    - name: Resolve The Session User UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
        # `fail_key: false` hands the verdict to the assert below, so the operator gets
        # its fail_msg rather than the module's "key could not be found". It does NOT
        # make the key absent: getent sets it to `None` and exits successfully, so
        # `is defined` is True even for a missing user, and indexing `[1]` would raise
        # UndefinedError before the fail_msg was ever reached. Each clause below makes
        # the next one safe to evaluate.
        fail_key: false

    - name: Assert The Session User Exists
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][user_login] is defined
          - ansible_facts['getent_passwd'][user_login] is not none
          - ansible_facts['getent_passwd'][user_login][1] | int > 0
        fail_msg: >-
          Could not resolve a uid for {{ user_login }}, so this play cannot find that
          user's systemd manager. It would otherwise guess, and a guessed uid points
          at the wrong runtime directory without failing.

    # Unconditional, and the enable is its own probe. The `is-system-running` guard
    # that stood here could not tell "no user manager" from "manager with a failed
    # unit" — systemd returns success only for the literal state `running`, so
    # `degraded` exits 1 too — and it skipped the enable on exactly the host most
    # likely to want a container watchdog.
    #
    # The `debug` deferral beside it was a prohibited skip-and-warn (CLAUDE.md, Fail
    # Fast) carrying a false claim: the timer is `WantedBy=timers.target`, which is
    # inert until `enable` writes the `.wants` symlink, so nothing was going to pick
    # it up on the next session.
    #
    # This needs `user_login`'s systemd manager reachable, which does NOT mean a
    # graphical session: `play-systemd-user-tweaks.yml` (`scope: general`) enables
    # linger and then explicitly starts `user@UID.service`, blocking until it signals
    # READY=1, so on any host provisioned by playbook-main the manager is there. An
    # unreachable user bus fails this task, loudly, which is the intended answer.
    - name: Enable and start the container-watch user timer
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: container-watch.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
