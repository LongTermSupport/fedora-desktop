#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Container Process Watchdog (reporting-only)
#
# Deploys the containerwatch helper, its CLI wrapper, the systemd --user timer
# that runs periodic scans, and the GNOME Shell panel extension that surfaces the
# findings report. This is a REPORTING-ONLY watchdog: it never kills or throttles
# any process, it only writes a report.json + emits a DBus signal.
#
# Standalone / opt-in play (like play-speech-to-text.yml) — deliberately NOT
# imported from playbook-main.yml. Run it directly:
#   ./playbooks/imports/optional/common/play-container-watch.yml
- hosts: desktop
  name: Container Process Watchdog
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    extension_name: container-watch@fedora-desktop
    extension_src: "{{ root_dir }}/extensions/{{ extension_name }}"
    extension_dest: "/home/{{ user_login }}/.local/share/gnome-shell/extensions/{{ extension_name }}"
  tasks:
    # =========================================================================
    # Helper library (ccy-helpers shared lib, imported as helpers.containerwatch)
    # =========================================================================
    - name: Ensure ccy-helpers containerwatch library directory exists
      ansible.builtin.file:
        path: /usr/local/lib/ccy-helpers/helpers/containerwatch
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy containerwatch helper modules
      ansible.builtin.copy:
        src: "{{ root_dir }}/helpers/containerwatch/{{ item }}"
        dest: "/usr/local/lib/ccy-helpers/helpers/containerwatch/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - core.py
        - cli.py

    # =========================================================================
    # CLI wrapper (~/.local/bin)
    # =========================================================================
    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy container-watch CLI wrapper
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/container-watch"
        dest: "/home/{{ user_login }}/.local/bin/container-watch"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    # =========================================================================
    # systemd --user units (service + timer)
    # =========================================================================
    - name: Ensure user systemd unit directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Deploy container-watch user systemd units
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/{{ item }}"
        dest: "/home/{{ user_login }}/.config/systemd/user/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
      loop:
        - container-watch.service
        - container-watch.timer

    # =========================================================================
    # GNOME Extension (recursive directory copy — auto-includes every file)
    # =========================================================================
    # The general watchdog daemon (helper lib, CLI, systemd --user timer) above
    # runs on any profile; the GNOME Shell panel extension below is desktop-only,
    # so every extension task is gated off on a server (Plan 00061 §6.4).
    - name: Ensure extension destination directory exists
      ansible.builtin.file:
        path: "{{ extension_dest }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"
      when: provisioning_profile != 'server'

    - name: Deploy container-watch GNOME extension
      ansible.builtin.copy:
        src: "{{ extension_src }}/"
        dest: "{{ extension_dest }}/"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        directory_mode: "0755"
      when: provisioning_profile != 'server'

    # =========================================================================
    # Enable the user TIMER (not the service)
    # =========================================================================
    # Resolved, never defaulted. `user_login_uid` is assigned nowhere in this repo,
    # so `| default(1000)` was not a fallback — it was a hardcoded 1000 on every run,
    # and on a host whose user is not uid 1000 it pointed the enable at another
    # user's runtime directory without failing.
    - name: Resolve The Session User UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
        fail_key: false

    - name: Assert The Session User Exists
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][user_login] is defined
          - ansible_facts['getent_passwd'][user_login][1] | int > 0
        fail_msg: >-
          Could not resolve a uid for {{ user_login }}, so this play cannot find that
          user's systemd manager. It would otherwise guess, and a guessed uid points
          at the wrong runtime directory without failing.

    # Unconditional, and the enable is its own probe. The `is-system-running` guard
    # that stood here could not tell "no user manager" from "manager with a failed
    # unit" — systemd returns success only for the literal state `running`, so
    # `degraded` exits 1 too — and it skipped the enable on exactly the host most
    # likely to want a container watchdog.
    #
    # The `debug` deferral beside it was a prohibited skip-and-warn (CLAUDE.md, Fail
    # Fast) carrying a false claim: the timer is `WantedBy=timers.target`, which is
    # inert until `enable` writes the `.wants` symlink, so nothing was going to pick
    # it up on the next session. Run this from inside a graphical session; an
    # unreachable user bus now fails the play and says so.
    - name: Enable and start the container-watch user timer
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: container-watch.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"

    # =========================================================================
    # Enable the GNOME extension (same probe/disable/enable pattern as STT play)
    # =========================================================================
    - name: Check if container-watch extension is currently enabled
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.shell:
        cmd: gnome-extensions list --enabled | grep -q "{{ extension_name }}"
      register: extension_enabled
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — extension may not be enabled yet
      when: provisioning_profile != 'server'

    - name: Disable container-watch extension to force reload
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: gnome-extensions disable {{ extension_name }}
      when:
        - provisioning_profile != 'server'
        - extension_enabled.rc == 0
      register: disable_result
      changed_when: disable_result.rc == 0
      failed_when: false  # FAIL-FAST-OK: disable may fail if GNOME session is unavailable

    - name: Wait for container-watch extension to unload
      ansible.builtin.pause:
        seconds: 2
      when:
        - provisioning_profile != 'server'
        - extension_enabled.rc == 0

    - name: Enable container-watch extension
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: gnome-extensions enable {{ extension_name }}
      register: enable_result
      changed_when: "'is now enabled' in enable_result.stderr or enable_result.rc == 0"
      failed_when: false  # FAIL-FAST-OK: enable may fail if GNOME session is unavailable
      when: provisioning_profile != 'server'

    - name: Container-watch extension reload complete
      ansible.builtin.debug:
        msg: "Container-watch extension reloaded successfully"
      when:
        - provisioning_profile != 'server'
        - enable_result.rc == 0

    - name: Container-watch extension enable deferred
      ansible.builtin.debug:
        msg: "Container-watch extension will be enabled on next GNOME session start (no active session detected)"
      when:
        - provisioning_profile != 'server'
        - enable_result.rc != 0
