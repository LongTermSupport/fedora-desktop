#!/usr/bin/env ansible-playbook
---
- hosts: desktop
  name: Install Camera FTP Server (Sony A7V)
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # Upload directory — override in environment/localhost/host_vars/localhost.yml
    # Uses /srv/ to avoid path traversal issues (home dirs are mode 700)
    ftp_camera_upload_dir: "/srv/ftp-camera"
    ftp_camera_user: camera
    # Legacy upload dir from before the ftp-camera/ftp-camera naming alignment.
    # Used by the migration task below to move existing data into the new path.
    ftp_camera_upload_dir_legacy: "/srv/camera-ftp"
    # Name of the NetworkManager connection profile used for hotspot mode.
    # This play CREATES the profile when it is absent (see the hotspot block
    # below) and tunes it when it is present. "Hotspot" also happens to be the
    # name GNOME's WiFi-Hotspot quick-settings toggle uses, so a profile the
    # user already made by hand is adopted rather than duplicated. Override in
    # host_vars/localhost.yml if you've renamed it.
    ftp_camera_hotspot_connection: "Hotspot"
    # SSID the camera connects to in hotspot mode. Broadcast publicly, so keep
    # it functional rather than personally identifying.
    ftp_camera_hotspot_ssid: "ftp-camera"

    # NOTE: ftp_camera_hotspot_password is intentionally NOT defined here, for
    # the same precedence reason as ftp_camera_rclone_remote below — a play var
    # would silently outrank the user's host_vars/vault value. It is the WPA2
    # pre-shared key for the hotspot AP and must be vaulted:
    #   ./vault.bash set ftp_camera_hotspot_password
    # Minimum 8 characters (WPA2 requirement, asserted below).

    # NOTE: ftp_camera_rclone_remote is intentionally NOT defined here.
    # Play `vars:` have HIGHER precedence than inventory host_vars, so setting
    # a default here would silently override the user's host_vars setting.
    # The variable is consumed via `| default('')` at the use sites below.
    # Set it in environment/localhost/host_vars/localhost.yml, e.g.:
    #   ftp_camera_rclone_remote: "LTS-G-Drive:/PHOTO/LIBRARY"
    # MUST point at the library ROOT (the parent of photos/ and videos/),
    # not at a media subfolder — ftp-camera --push/--copy ships the whole
    # local tree (photos/ and videos/ siblings) in one call.

  tasks:

    # Optional playbook: skip cleanly (no-op) when the FTP password hasn't
    # been configured, instead of failing the whole optional run. Users who
    # don't use the camera FTP feature shouldn't have to vault a dummy
    # value just to let the --optional-only flow proceed.
    - name: Skip if ftp_camera_password is not configured
      when: (ftp_camera_password | default('') | length) == 0
      block:
        - name: Inform user the Camera FTP play was skipped
          ansible.builtin.debug:
            msg: |
              Camera FTP Server skipped — ftp_camera_password is not set in vault.

              To enable this feature, set the password and re-run:
                ./vault.bash set ftp_camera_password
                ./run.bash --optional-only

        - name: End play (ftp_camera_password not configured)
          ansible.builtin.meta: end_play

    # Migration: align upload dir name with the rest of the toolchain
    # (ftp-camera command, /etc/ftp-camera/, play-ftp-camera.yml).
    # Runs only when the legacy default path (/srv/camera-ftp) exists and the
    # new path (/srv/ftp-camera) does not. Skipped silently if the user
    # overrode ftp_camera_upload_dir to a custom location.
    - name: Migrate legacy upload directory (camera-ftp → ftp-camera)
      when:
        - ftp_camera_upload_dir == "/srv/ftp-camera"
        - ftp_camera_upload_dir_legacy != ftp_camera_upload_dir
      block:
        - name: Stat legacy upload directory
          ansible.builtin.stat:
            path: "{{ ftp_camera_upload_dir_legacy }}"
          register: legacy_upload_dir

        - name: Stat new upload directory
          ansible.builtin.stat:
            path: "{{ ftp_camera_upload_dir }}"
          register: new_upload_dir

        - name: Rename legacy upload directory to new path
          ansible.builtin.command:
            cmd: mv "{{ ftp_camera_upload_dir_legacy }}" "{{ ftp_camera_upload_dir }}"
          when:
            - legacy_upload_dir.stat.exists
            - not new_upload_dir.stat.exists

        - name: Remove old SELinux file context for legacy path
          community.general.sefcontext:
            target: "{{ ftp_camera_upload_dir_legacy }}(/.*)?"
            setype: public_content_rw_t
            state: absent
          failed_when: false  # FAIL-FAST-OK: legacy context may already be removed

    - name: Install vsftpd, inotify-tools, gum (TUI launcher), and tcpdump
      ansible.builtin.package:
        name:
          - vsftpd         # FTP server
          - inotify-tools  # File system event monitoring (used by ftp-camera wrapper)
          - gum            # Two-step launcher TUI for argument-free `ftp-camera` invocation
          - tcpdump        # FTP control-channel capture for triage (see CLAUDE/PlanTriage.md)
        state: present
      tags: packages

    - name: Create camera FTP user
      ansible.builtin.user:
        name: "{{ ftp_camera_user }}"
        password: "{{ ftp_camera_password | password_hash('sha512') }}"
        home: "{{ ftp_camera_upload_dir }}"
        shell: /sbin/nologin
        create_home: false
        comment: "Camera FTP upload user — managed by Ansible"
      no_log: true

    - name: Ensure /sbin/nologin is listed in /etc/shells (required for FTP auth via PAM)
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /sbin/nologin
        state: present

    - name: Create camera FTP upload directory
      ansible.builtin.file:
        path: "{{ ftp_camera_upload_dir }}"
        state: directory
        owner: "{{ ftp_camera_user }}"
        group: "{{ ftp_camera_user }}"
        mode: "0775"

    - name: Add {{ user_login }} to camera group for upload directory access
      ansible.builtin.user:
        name: "{{ user_login }}"
        groups: "{{ ftp_camera_user }}"
        append: true

    - name: Grant {{ user_login }} full access to upload directory (ACL, recursive)
      ansible.posix.acl:
        path: "{{ ftp_camera_upload_dir }}"
        entity: "{{ user_login }}"
        etype: user
        permissions: rwX
        recursive: true
        state: present

    - name: Set default ACL so new files inherit {{ user_login }} access
      # Ensures uploaded files and RAW editor sidecars are all accessible
      ansible.posix.acl:
        path: "{{ ftp_camera_upload_dir }}"
        entity: "{{ user_login }}"
        etype: user
        permissions: rwX
        default: true
        state: present

    - name: Deploy vsftpd configuration
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/vsftpd/vsftpd.conf"
        dest: /etc/vsftpd/vsftpd.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart vsftpd if running

    - name: Deploy vsftpd camera user allowlist
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/vsftpd/camera-users.txt"
        dest: /etc/vsftpd/camera-users.txt
        owner: root
        group: root
        mode: "0644"

    - name: Deploy tmpfiles.d entry for vsftpd secure chroot dir (survives reboots)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/tmpfiles.d/vsftpd-camera.conf"
        dest: /etc/tmpfiles.d/vsftpd-camera.conf
        owner: root
        group: root
        mode: "0644"

    - name: Create vsftpd secure chroot dir now (tmpfiles.d only fires at boot)
      ansible.builtin.command:
        cmd: systemd-tmpfiles --create /etc/tmpfiles.d/vsftpd-camera.conf
      changed_when: true

    - name: Set SELinux file context on upload directory (allows vsftpd write access)
      # public_content_rw_t is the designated type for FTP-writable directories.
      # This is targeted: only the upload dir gets FTP access, not the whole system.
      community.general.sefcontext:
        target: "{{ ftp_camera_upload_dir }}(/.*)?"
        setype: public_content_rw_t
        state: present

    - name: Apply SELinux file context to upload directory
      ansible.builtin.command:
        cmd: "restorecon -R {{ ftp_camera_upload_dir }}"
      changed_when: true

    - name: Enable SELinux boolean for vsftpd passive mode
      # Without this, SELinux blocks vsftpd from binding to passive data ports
      # (30000-30100), causing camera connections to fail after authentication
      ansible.posix.seboolean:
        name: ftpd_use_passive_mode
        state: true
        persistent: true

    - name: Disable vsftpd auto-start (managed manually via ftp-camera script)
      ansible.builtin.systemd:
        name: vsftpd
        enabled: false
        state: stopped
      failed_when: false  # FAIL-FAST-OK: vsftpd may not be running on first install

    # CROSS-PLAY DEPENDENCY (Plan 00072): ftp-camera's --copy / --async-copy
    # modes source files/home/.local/bin/rclone-rc-auth.bash, which is deployed
    # by play-rclone.yml, NOT by this play. The library is deliberately owned
    # there because every other consumer of it is an rclone helper; duplicating
    # the copy task here would give two plays a claim on one file.
    #
    # This play does not assert its presence: the FTP-server, --sort and --pass
    # modes never touch the rclone RC and must keep working on a machine with no
    # rclone at all. ftp-camera therefore carries a stub that fails, naming
    # play-rclone.yml, only when a copy mode actually needs the library.
    - name: Install ftp-camera wrapper script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/ftp-camera"
        dest: "/home/{{ user_login }}/.local/bin/ftp-camera"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    - name: Create /etc/ftp-camera config directory
      ansible.builtin.file:
        path: /etc/ftp-camera
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy ftp-camera config (records repo path, rclone destination, hotspot profile)
      # REPO_PATH lets `ftp-camera --pass` find vault.bash and decrypt
      # ftp_camera_password from the user's clone of this repo without
      # hardcoding the path in the script.
      # RCLONE_REMOTE is consumed by `ftp-camera --push` to know where to
      # upload sorted files. Empty value disables --push with a clear error.
      # HOTSPOT_CONNECTION names the NetworkManager profile that --hotspot
      # brings up/down. Default "Hotspot" matches GNOME quick-settings.
      ansible.builtin.copy:
        dest: /etc/ftp-camera/config
        content: |
          # Auto-generated by play-ftp-camera.yml — do not edit manually.
          # Used by `ftp-camera --pass` to locate the vault helper, by
          # `ftp-camera --push` to know which rclone remote to upload to,
          # and by `ftp-camera --hotspot` to know which NM profile to
          # activate/deactivate.
          REPO_PATH={{ root_dir | realpath }}
          RCLONE_REMOTE={{ ftp_camera_rclone_remote | default('') }}
          HOTSPOT_CONNECTION={{ ftp_camera_hotspot_connection }}
        owner: root
        group: root
        mode: "0644"

    # Hotspot profile: CREATE it if absent, then tune it for throughput.
    #
    # This play used to only tune a profile the user was told to create by hand
    # in GNOME Settings. That is a manual system change, which this repo
    # prohibits (CLAUDE/InfrastructureAsCode.md) — and in practice it meant
    # `ftp-camera --hotspot` failed with "connection 'Hotspot' not found" on
    # any machine where nobody had clicked the GNOME toggle. The profile is now
    # declared here like any other piece of system state.
    #
    # Tuning targets 2.4GHz channel 6 at 40MHz width — the only legal 40MHz
    # configuration in the GB regdomain for 2.4GHz APs, doubling theoretical
    # PHY rate over the GNOME default of channel 1 / 20MHz. 5GHz AP is blocked
    # on Intel CNVi cards by the IR-CONCURRENT regdomain flag (no concurrent
    # client+AP), so 40MHz on ch6 is the best this hardware class can do.
    - name: Provision the NetworkManager hotspot AP profile
      block:
        - name: List NetworkManager connection profiles
          ansible.builtin.command:
            cmd: "nmcli -t -f NAME connection show"
          register: ftp_camera_nm_conns
          changed_when: false
          check_mode: false

        - name: List NetworkManager devices
          ansible.builtin.command:
            cmd: "nmcli -t -f DEVICE,TYPE device"
          register: ftp_camera_nm_devices
          changed_when: false
          check_mode: false

        # Creating the AP profile needs a concrete wifi interface to bind to,
        # and a PSK. Each precondition is handled separately so the failure
        # message names the one thing that is actually missing.
        - name: Determine hotspot creation preconditions
          ansible.builtin.set_fact:
            ftp_camera_hotspot_exists: >-
              {{ ftp_camera_hotspot_connection in ftp_camera_nm_conns.stdout_lines }}
            ftp_camera_wifi_devs: >-
              {{ ftp_camera_nm_devices.stdout_lines
                 | select('match', '^[^:]+:wifi$') | list }}
            ftp_camera_hotspot_psk_set: >-
              {{ (ftp_camera_hotspot_password | default('') | length) > 0 }}

        - name: Assert the hotspot PSK meets the WPA2 minimum length
          # WPA2-PSK is defined for 8-63 character passphrases. A shorter value
          # is accepted by nmcli at write time but the AP silently fails to
          # start, which is far harder to diagnose than failing here.
          ansible.builtin.assert:
            that:
              - (ftp_camera_hotspot_password | default('') | length) >= 8
              - (ftp_camera_hotspot_password | default('') | length) <= 63
            fail_msg: |
              ftp_camera_hotspot_password must be 8-63 characters (WPA2-PSK).
              Set it with: ./vault.bash set ftp_camera_hotspot_password
          when: ftp_camera_hotspot_psk_set

        - name: Create the hotspot AP profile
          # pmf=1 disables Protected Management Frames. Sony camera FTP clients
          # are WPA2-only and do not negotiate PMF; leaving it at the NM default
          # makes the camera fail to associate on newer wpa_supplicant builds.
          # proto/pairwise/group are pinned to plain WPA2-CCMP for the same
          # compatibility reason — no WPA3 transition mode.
          ansible.builtin.command:
            argv:
              - nmcli
              - connection
              - add
              - type
              - wifi
              - ifname
              - "{{ ftp_camera_wifi_devs | first | split(':') | first }}"
              - con-name
              - "{{ ftp_camera_hotspot_connection }}"
              - autoconnect
              - "no"
              - ssid
              - "{{ ftp_camera_hotspot_ssid }}"
              - "802-11-wireless.mode"
              - ap
              - "802-11-wireless-security.key-mgmt"
              - wpa-psk
              - "802-11-wireless-security.proto"
              - rsn
              - "802-11-wireless-security.pairwise"
              - ccmp
              - "802-11-wireless-security.group"
              - ccmp
              - "802-11-wireless-security.pmf"
              - "1"
              - "802-11-wireless-security.psk"
              - "{{ ftp_camera_hotspot_password }}"
              - ipv4.method
              - shared
              - ipv6.method
              - ignore
          when:
            - not ftp_camera_hotspot_exists
            - ftp_camera_hotspot_psk_set
            - ftp_camera_wifi_devs | length > 0
          changed_when: true
          no_log: true

        - name: Apply band=bg, channel=6, channel-width=40MHz to the hotspot profile
          # Runs for a profile this play just created AND for one the user made
          # in GNOME, so a hand-made hotspot still gets the throughput tuning.
          ansible.builtin.command:
            argv:
              - nmcli
              - connection
              - modify
              - "{{ ftp_camera_hotspot_connection }}"
              - "802-11-wireless.band"
              - bg
              - "802-11-wireless.channel"
              - "6"
              - "802-11-wireless.channel-width"
              - "40"
          when: ftp_camera_hotspot_exists or
                (ftp_camera_hotspot_psk_set and ftp_camera_wifi_devs | length > 0)
          # nmcli modify writes to disk unconditionally; no idempotency check
          # short of reading every field back, which isn't worth it.
          changed_when: true

        - name: Explain how to enable hotspot mode when no PSK is vaulted
          # Not an error: the hotspot is an optional modifier of an optional
          # play. Everything else here still installs and works. This mirrors
          # how the play treats an unset ftp_camera_password at the top.
          ansible.builtin.debug:
            msg: |
              Hotspot mode is NOT configured — ftp_camera_hotspot_password is unset,
              so no WPA2 AP profile could be created and `ftp-camera --hotspot`
              will refuse to start.

              To enable it:
                ./vault.bash set ftp_camera_hotspot_password    # 8-63 characters
                ansible-playbook playbooks/imports/optional/common/play-ftp-camera.yml

              Everything else in this play is installed and working regardless.
          when: not ftp_camera_hotspot_psk_set

        - name: Warn when no WiFi device is present to host an AP
          ansible.builtin.debug:
            msg: |
              No WiFi device found via `nmcli device`, so no hotspot AP profile
              was created. This is expected on a desktop with wired networking
              only; `ftp-camera --hotspot` is not usable on this machine.
          when:
            - ftp_camera_wifi_devs | length == 0
            - not ftp_camera_hotspot_exists

        - name: Note that the tune takes effect on next hotspot activation
          ansible.builtin.debug:
            msg: |
              Hotspot profile '{{ ftp_camera_hotspot_connection }}' ready
              (SSID {{ ftp_camera_hotspot_ssid }}, band=bg channel=6 width=40MHz).

              Start it as part of a camera session:
                ftp-camera --async-copy --hotspot

              If it is currently up, bounce it to apply the tuning:
                nmcli connection down "{{ ftp_camera_hotspot_connection }}"
                nmcli connection up   "{{ ftp_camera_hotspot_connection }}"

              NOTE: Intel CNVi radios cannot be WiFi client and AP at the same
              time, so the laptop loses its own internet while the hotspot is
              up. --async-copy still works: files land in the local rclone VFS
              cache and drain to the remote once you reconnect.
          when: ftp_camera_hotspot_exists or
                (ftp_camera_hotspot_psk_set and ftp_camera_wifi_devs | length > 0)

    - name: Display installation summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          Camera FTP Server Installed
          ============================================================

          Upload directory:  {{ ftp_camera_upload_dir }}
          FTP user:          camera  (password set in vault)

          Commands:
            ftp-camera                open the two-step launcher TUI (gum) to
                                      pick a primary mode + viewer option
            ftp-camera --no-tui       start default FTP-server mode, skip the TUI
            ftp-camera --pass         print FTP password (for camera setup)
            ftp-camera --sort         sort already-uploaded files by EXIF date
            ftp-camera --push         direct push to rclone remote (synchronous)
            ftp-camera --copy         copy via mount + verify (caches locally)
                                      (--push and --copy require ftp_camera_rclone_remote)
            ftp-camera --prune        remove RAW files whose JPG has been deleted
            ftp-camera --async        sort each upload by EXIF the moment it arrives
            ftp-camera --async-copy   sort + copy each upload into the local rclone
                                      mount (VFS uploads to remote in background;
                                      requires ftp_camera_rclone_remote)

          Modifiers (compose with default / --async / --async-copy):
            --view       Live single-window geeqie preview of each ARW arrival
            --view-jpg   Same, but preview JPG arrivals instead of ARW
            --hotspot    Bring up/down the NM '{{ ftp_camera_hotspot_connection }}'
                         profile around the session (camera tethers directly
                         to the laptop; bypasses public WiFi).
            --debug-ftp  Log every FTP verb the camera sends to
                         /var/log/vsftpd.log. Use when uploads appear to
                         succeed but the camera keeps re-sending the same
                         frame. Verbose; diagnosis only.
          Example: ftp-camera --async-copy --view --hotspot

          Optional rclone push: set ftp_camera_rclone_remote in host_vars
          to enable --push, --copy, and --async-copy. Must point at the library ROOT
          (the parent of photos/ and videos/), e.g. "LTS-G-Drive:/PHOTO/LIBRARY".
          Currently configured: {{ ftp_camera_rclone_remote | default('(unset)') }}

          Sort layout (mirrors library):
            photos/YYYY/MM/DD/{JPG,RAW}/<file>
            videos/YYYY/MM/DD/{MP4,MOV}/<file>

          The script will print your PC's IP address and the exact
          camera menu path when it starts.

          Sony A7V camera setup (one-time, manual):
            Menu → Network → FTP Transfer Func. → Server Settings
              Server:           <shown by ftp-camera on start>
              Port:             21
              User:             camera
              Passive Mode:     On
              Destination:      /

          Note: camera and PC must be on the same Wi-Fi network.
          Note: log out and back in for group membership to take effect.

          Hotspot mode (security + speed on untrusted networks):
            Run: ftp-camera --async-copy --hotspot
            The camera connects directly to the laptop's AP, bypassing any
            public WiFi. ftp-camera brings the profile up at start, binds
            the right IP automatically, opens FTP in the otherwise-restrictive
            nm-shared firewall zone, and takes the hotspot back down on exit.

            This playbook OWNS the '{{ ftp_camera_hotspot_connection }}' profile —
            it creates it (SSID {{ ftp_camera_hotspot_ssid }}, WPA2) and tunes it
            for 40MHz on channel 6 (~2x throughput vs the GNOME 20MHz default).
            Do not create it by hand. It requires a vaulted passphrase:
              ./vault.bash set ftp_camera_hotspot_password    # 8-63 characters

            NOTE: Intel CNVi radios cannot be WiFi client and AP simultaneously,
            so the laptop loses its own internet while the hotspot is up.
            --async-copy still works — files land in the local rclone VFS cache
            and drain to the remote once you reconnect to a normal network.
          ============================================================

  handlers:
    - name: Restart vsftpd if running
      ansible.builtin.systemd:
        name: vsftpd
        state: restarted
      failed_when: false  # FAIL-FAST-OK: vsftpd is intentionally stopped; only restart if it was already up
