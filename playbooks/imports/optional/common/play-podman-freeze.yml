#!/usr/bin/env ansible-playbook
---
# podman-freeze — freeze/thaw Podman containers by name, network, or CCY group.
#
# Deploys ~/.local/bin/podman-freeze. The tool shells out to the `podman` CLI
# installed by playbooks/imports/play-podman.yml (a core play imported by
# playbook-main.yml, so it is always present) and adds nothing to the host but
# itself and an optional picker.
#
# WHY A WRAPPER AND NOT JUST `podman pause`:
#   - `podman pause --filter network=X` already exists, but you act on a set you
#     never saw. On this machine a CCY (Claude) session shares a user-defined
#     network with an application stack, and several more sit on the default
#     `podman` network — so "freeze that app's network" and "freeze a live
#     Claude session" can be the same command, and the network's NAME does not
#     tell you which. The wrapper resolves the set, shows it with CCY rows
#     marked, and confirms before acting.
#   - podman-tui / Cockpit / lazydocker / ctop all act on one container at a
#     time and have no concept of a CCY session group.
#
# `podman pause` is the cgroup freezer, NOT suspend-to-disk: frozen containers
# do not survive a reboot. The reboot-surviving equivalent (`podman container
# checkpoint`, CRIU) requires root and is unavailable on this rootless setup.
- hosts: desktop
  name: Podman Freeze — freeze/thaw containers by name, network, or CCY group
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    podman_freeze_binary: "/home/{{ user_login }}/.local/bin/podman-freeze"
  tasks:
    # =========================================================================
    # Dependencies
    #
    # fzf is the good multi-select picker. It is OPTIONAL to the tool — without
    # it a plain numbered menu is used instead — but it is installed here so the
    # play is self-contained rather than depending on play-open-command.yml
    # having been run.
    # =========================================================================

    - name: Install the Interactive Picker Used by podman-freeze
      ansible.builtin.dnf:
        name:
          - fzf
        state: present
      tags:
        - packages
        - podman-freeze

    # =========================================================================
    # The tool itself
    # =========================================================================

    - name: Ensure User Local Bin Directory Exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.local/bin"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      tags:
        - podman-freeze

    - name: Deploy the podman-freeze Command
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/podman-freeze"
        dest: "{{ podman_freeze_binary }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      tags:
        - podman-freeze

    - name: Podman Freeze Ready
      ansible.builtin.debug:
        msg:
          - "✓ podman-freeze deployed to {{ podman_freeze_binary }}"
          - ""
          - "  podman-freeze                    pick containers, then pick a verb"
          - "  podman-freeze list               what is running, what is frozen"
          - "  podman-freeze freeze NAME        freeze one by name"
          - "  podman-freeze freeze --ccy       freeze every CCY (Claude) session"
          - "  podman-freeze freeze --network NET -n    preview a network freeze"
          - "  podman-freeze thaw --all         thaw everything frozen"
          - "  podman-freeze --help             full usage"
          - ""
          - "  Freezing is the cgroup freezer, not suspend-to-disk — frozen"
          - "  containers do NOT survive a reboot."
      tags:
        - podman-freeze
