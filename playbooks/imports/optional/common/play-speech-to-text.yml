#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Speech-to-Text GNOME Extension with GPU-accelerated Whisper (faster-whisper)
#
# Prerequisites: NVIDIA drivers installed via play-nvidia.yml
#
# Usage: Press Insert key to toggle recording. Text auto-pastes when stopped.
# Model: chosen in the extension Settings (Whisper Model). Its default, auto, is resolved
#        per recording by wsi-resolve-model. stt_model in host_vars/localhost.yml
#        (default: small) is only the default of faster-whisper-transcribe run by hand.
- hosts: desktop
  name: Speech-to-Text Extension
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    extension_name: speech-to-text@fedora-desktop
    extension_src: "{{ root_dir }}/extensions/{{ extension_name }}"
    extension_dest: "/home/{{ user_login }}/.local/share/gnome-shell/extensions/{{ extension_name }}"
    # Default model of faster-whisper-transcribe when WHISPER_MODEL is unset (wsi always sets it)
    # Both batch and streaming modes share the same model cache (~/.cache/huggingface/hub/)
    faster_whisper_model: "{{ stt_model | default('small') }}"
    # Language code for transcription (e.g., "en" for English)
    # Set to empty string "" for auto-detect (not recommended)
    stt_language_code: "{{ stt_language | default('en') }}"
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    # =========================================================================
    # System Dependencies
    # =========================================================================

    - name: Install System Dependencies
      ansible.builtin.dnf:
        name:
          - sox
          - ydotool
          - wl-clipboard
          - python3-pip
          - zenity
          - wev  # Wayland event viewer for debugging keybindings
          - foot  # Wayland-native terminal; used by extension for model manager (supports --window-size-chars)
          - xdg-terminal-exec  # XDG default terminal launcher; fallback if foot unavailable
          # gcc-gfortran removed: scipy>=1.16.1 ships cp314 wheels; source build no longer needed on F44
        state: present

    - name: Stop User ydotool Service if Running
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: ydotool
        scope: user
        state: stopped
        enabled: false
      failed_when: false  # FAIL-FAST-OK: service may not be installed yet

    - name: Create ydotool System Service Override Directory
      ansible.builtin.file:
        path: /etc/systemd/system/ydotool.service.d
        state: directory
        mode: '0755'

    - name: Configure ydotool System Service with User-accessible Socket
      ansible.builtin.copy:
        dest: /etc/systemd/system/ydotool.service.d/override.conf
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/ydotoold --socket-path=/run/ydotool.socket --socket-perm=0666
      register: ydotool_override

    - name: Reload Systemd for ydotool Override
      ansible.builtin.systemd:
        daemon_reload: true
      when: ydotool_override.changed

    - name: Enable and Start System ydotool Daemon
      ansible.builtin.systemd:
        name: ydotool
        enabled: true
        state: restarted

    - name: Wait for ydotool Socket
      ansible.builtin.wait_for:
        path: /run/ydotool.socket
        state: present
        timeout: 10

    # =========================================================================
    # faster-whisper with GPU acceleration
    # =========================================================================

    # Pinned to what RealtimeSTT 1.0.0 (below) declares it needs. The continuous-dictation
    # segmenter loads the Silero VAD that faster-whisper ships, so an unpinned upgrade could
    # change it under the server; move both pins together, after re-running Plan 00148's
    # triage.
    - name: Install faster-whisper with CUDA Support
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.pip:
        name:
          - faster-whisper==1.2.1
          - nvidia-cublas-cu12
          - nvidia-cudnn-cu12==9.*
          - textual
        extra_args: --user
        state: present

    - name: Find CUDA Library Paths
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.shell: |
        python3 -c "
        import os
        try:
            import nvidia.cublas
            import nvidia.cudnn
            cublas = os.path.join(nvidia.cublas.__path__[0], 'lib')
            cudnn = os.path.join(nvidia.cudnn.__path__[0], 'lib')
            print(f'{cublas}:{cudnn}')
        except (ImportError, IndexError):
            print('')
        "
      register: cuda_lib_paths
      changed_when: false

    - name: Create faster-whisper Shell Wrapper
      ansible.builtin.copy:
        dest: "/home/{{ user_login }}/.local/bin/faster-whisper-transcribe"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
        content: |
          #!/bin/bash
          # Set CUDA library paths before running Python
          export LD_LIBRARY_PATH="{{ cuda_lib_paths.stdout }}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec python3 ~/.local/bin/faster-whisper-transcribe.py "$@"

    - name: Create faster-whisper Python Script
      ansible.builtin.copy:
        dest: "/home/{{ user_login }}/.local/bin/faster-whisper-transcribe.py"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
        content: |
          #!/usr/bin/env python3
          """GPU-accelerated speech-to-text using faster-whisper with streaming output"""
          import sys
          import os
          from faster_whisper import WhisperModel

          def main():
              stream_mode = '--stream' in sys.argv
              args = [a for a in sys.argv[1:] if a != '--stream']

              if len(args) < 1:
                  print("Usage: faster-whisper-transcribe [--stream] <audio-file>", file=sys.stderr)
                  sys.exit(1)

              audio_file = args[0]
              if not os.path.exists(audio_file):
                  print(f"Error: File not found: {audio_file}", file=sys.stderr)
                  sys.exit(1)

              model_size = os.environ.get('WHISPER_MODEL', '{{ faster_whisper_model }}')
              language = os.environ.get('WHISPER_LANGUAGE', '{{ stt_language_code }}') or None

              # Try GPU first, fall back to CPU
              try:
                  model = WhisperModel(model_size, device="cuda", compute_type="float16")
              except Exception as e:
                  print(f"GPU not available ({e}), using CPU", file=sys.stderr)
                  model = WhisperModel(model_size, device="cpu", compute_type="int8")

              # Force language if configured (avoids auto-detect errors)
              segments, info = model.transcribe(audio_file, beam_size=5, language=language)

              if stream_mode:
                  # Stream segments as they arrive
                  all_text = []
                  for segment in segments:
                      text = segment.text.strip()
                      if text:
                          all_text.append(text)
                          print(text, flush=True)
                  # Print final combined result on last line
                  final = " ".join(all_text)
                  if final:
                      final = final[0].upper() + final[1:] if len(final) > 1 else final.upper()
                      print(f"\n---FINAL---\n{final}", flush=True)
              else:
                  # Batch mode - collect all then output
                  text = " ".join([segment.text.strip() for segment in segments])
                  if text:
                      text = text[0].upper() + text[1:] if len(text) > 1 else text.upper()
                  print(text)

          if __name__ == "__main__":
              main()

    # =========================================================================
    # RealtimeSTT Streaming Mode
    # =========================================================================
    # Provides real-time transcription - transcribes while you speak.
    # Enable via extension menu: "Streaming mode (instant)"
    #
    # WARNING: First install can take MANY MINUTES (5-15+) due to large downloads
    # (PyTorch ~2GB, plus many dependencies). Subsequent runs are instant.

    - name: Install System Dependencies for RealtimeSTT
      ansible.builtin.dnf:
        name:
          - portaudio-devel
          - python3-devel
          # openblas-devel no longer needed: scipy>=1.16.1 ships cp314 wheels (no source build)
        state: present

    # PY-02 (F44): scipy source-build scaffolding removed.
    # scipy 1.15.2 required a from-source meson build on Python 3.14 (no cp314 wheel).
    # scipy 1.16.1+ ships cp314 wheels; RealtimeSTT's dependency resolver pulls a
    # pre-built wheel automatically — no scipy pin, no scipy-openblas32, no pkg-config
    # wrapper, no gcc-gfortran needed.  Verified: https://status.fedoralovespython.org/wheels_py314/

    - name: Install RealtimeSTT for Streaming Mode (WARNING - CAN TAKE MANY MINUTES ON FIRST RUN)
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.pip:
        name:
          - RealtimeSTT==1.0.0
        extra_args: --user --resume-retries 5
        state: present

    # PERF-11: the warm streaming server (which loads the speech model — "CAN TAKE MANY
    # MINUTES") is no longer killed unconditionally on every play run. The deploy tasks for
    # the streaming scripts below notify the `restart wsi-stream-server` handler, so the
    # server is only stopped (and thus cold-started on the next dictation) when a deployed
    # script actually changed.

    - name: Deploy Streaming Script (wsi-stream)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-stream"
        dest: "/home/{{ user_login }}/.local/bin/wsi-stream"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      notify: restart wsi-stream-server

    - name: Deploy Streaming Server Script (wsi-stream-server)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-stream-server"
        dest: "/home/{{ user_login }}/.local/bin/wsi-stream-server"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      notify: restart wsi-stream-server

    - name: Deploy Whisper Model Manager (wsi-model-manager)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-model-manager"
        dest: "/home/{{ user_login }}/.local/bin/wsi-model-manager"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Deploy Server Manager (wsi-server-manager)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-server-manager"
        dest: "/home/{{ user_login }}/.local/bin/wsi-server-manager"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Deploy Article Mode Script (wsi-article)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-article"
        dest: "/home/{{ user_login }}/.local/bin/wsi-article"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Deploy Article Mode Window (wsi-article-window)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-article-window"
        dest: "/home/{{ user_login }}/.local/bin/wsi-article-window"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    # =========================================================================
    # GNOME Extension
    # =========================================================================

    - name: Ensure Directories Exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      loop:
        - "/home/{{ user_login }}/.local/bin"
        - "/home/{{ user_login }}/.local/share/speech-to-text"
        - "{{ extension_dest }}"
        - "{{ extension_dest }}/schemas"

    - name: Copy Extension Files
      ansible.builtin.copy:
        src: "{{ extension_src }}/{{ item }}"
        dest: "{{ extension_dest }}/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      loop:
        - extension.js
        - focusOutline.js
        - prefs.js
        - metadata.json

    - name: Copy GSettings Schema
      ansible.builtin.copy:
        src: "{{ extension_src }}/schemas/org.gnome.shell.extensions.speech-to-text.gschema.xml"
        dest: "{{ extension_dest }}/schemas/"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
      register: schema_copy

    # Every run, not only when the XML copy changed: a run that copied the XML and
    # died before compiling would otherwise leave a stale compiled schema for good,
    # and the recorders refuse to start without the stop-grace-seconds key.
    - name: Compile GSettings Schema
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: glib-compile-schemas "{{ extension_dest }}/schemas"
      register: schema_compile
      changed_when: schema_copy.changed
      failed_when: schema_compile.rc != 0

    - name: Copy WSI Script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi"
        dest: "/home/{{ user_login }}/.local/bin/wsi"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    # The one reader of the extension's GSettings keys for the recorder scripts
    # (wsi-stop-grace uses it, so it is deployed first).
    - name: Deploy Settings Reader (wsi-setting)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-setting"
        dest: "/home/{{ user_login }}/.local/bin/wsi-setting"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    # What the Whisper Model setting's `auto` means on this machine; wsi and wsi-stream
    # refuse to record without it. A change can alter the warm server's model.
    - name: Deploy Model Resolver (wsi-resolve-model)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-resolve-model"
        dest: "/home/{{ user_login }}/.local/bin/wsi-resolve-model"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'
      notify: restart wsi-stream-server

    # Reads the stop-grace-seconds key from the schema compiled above; wsi and
    # wsi-stream refuse to record if it cannot be read.
    - name: Deploy Stop Grace Reader (wsi-stop-grace)
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-stop-grace"
        dest: "/home/{{ user_login }}/.local/bin/wsi-stop-grace"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    # Proves the deployed reader and the compiled key work together, as the user the
    # recorders run as; otherwise the first sign would be a dictation that will not start.
    - name: Verify Stop Grace Is Readable
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: "/home/{{ user_login }}/.local/bin/wsi-stop-grace"
      environment:
        HOME: "/home/{{ user_login }}"
      register: stop_grace_probe
      changed_when: false
      failed_when: >-
        stop_grace_probe.rc != 0
        or not (stop_grace_probe.stdout | regex_search('^[0-9]+$'))

    # wsi-stream passes this to the server it starts, and refuses to start one without it
    - name: Verify Server Idle Timeout Is Readable
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - "/home/{{ user_login }}/.local/bin/wsi-setting"
          - server-idle-timeout-minutes
      environment:
        HOME: "/home/{{ user_login }}"
      register: idle_timeout_probe
      changed_when: false
      failed_when: >-
        idle_timeout_probe.rc != 0
        or not (idle_timeout_probe.stdout | regex_search('^[0-9]+$'))

    # The NVIDIA driver (play-nvidia.yml) creates one /dev/nvidiaN node per GPU
    - name: Find NVIDIA GPU Device Nodes
      ansible.builtin.find:
        paths: /dev
        patterns: 'nvidia[0-9]*'
        file_type: any
      register: nvidia_gpu_nodes

    # CTranslate2 answers 0, not an error, when it cannot reach a GPU that is there, and
    # auto would then load the CPU model. The resolver already refuses that state; this
    # also proves, as the recording user, that the count is real on a GPU host.
    - name: Verify CTranslate2 Sees The GPU
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - "/home/{{ user_login }}/.local/bin/wsi-resolve-model"
          - --gpu-count
      environment:
        HOME: "/home/{{ user_login }}"
      register: gpu_count_probe
      changed_when: false
      failed_when: >-
        gpu_count_probe.rc != 0
        or not (gpu_count_probe.stdout | regex_search('^[0-9]+$'))
        or (nvidia_gpu_nodes.matched > 0 and (gpu_count_probe.stdout | int) == 0)

    # Proves the resolver can ask CTranslate2 (installed with faster-whisper above) for
    # CUDA devices as the recording user; it prints the model auto means here, for
    # each recorder (they differ without a GPU).
    - name: Verify The Auto Model Resolves
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - "/home/{{ user_login }}/.local/bin/wsi-resolve-model"
          - --mode
          - "{{ item }}"
          - --language
          - "{{ stt_language_code }}"
          - auto
      environment:
        HOME: "/home/{{ user_login }}"
      loop:
        - batch
        - streaming
      register: auto_model_probe
      changed_when: false
      failed_when: auto_model_probe.rc != 0 or (auto_model_probe.stdout | trim | length == 0)

    # auto is the default, so its model must be on disk before the first recording: left
    # to the warm server, a download of over 1 GB runs inside wsi-stream's 45 s start
    # wait, and an interrupted one leaves a snapshot with no model.bin. faster-whisper's
    # own download_model fetches the files WhisperModel loads, resumes a partial
    # download, and maps a bare name to its repo.
    #
    # The time limit is per model. The download can stall with a 0-byte model.bin and no
    # output, which would hold the whole deploy. 30 minutes is generous for about 1.5 GB
    # on a slow link; past it the task fails rather than waiting for ever, and a re-run
    # resumes what did arrive.
    - name: Download The Auto Model
      become: true
      become_user: "{{ user_login }}"
      timeout: 1800
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os, sys
            from faster_whisper.utils import download_model
            from huggingface_hub.errors import LocalEntryNotFoundError
            try:
                present = os.path.isfile(os.path.join(download_model(sys.argv[1], local_files_only=True), "model.bin"))
            except LocalEntryNotFoundError:
                present = False
            if not present:
                download_model(sys.argv[1])
                print("downloaded")
          - "{{ item }}"
      environment:
        HOME: "/home/{{ user_login }}"
      loop: "{{ auto_model_probe.results | map(attribute='stdout') | map('trim') | unique }}"
      register: auto_model_download
      changed_when: "'downloaded' in auto_model_download.stdout"

    # =========================================================================
    # Warm Server at Login (Settings: "Start the server at login")
    # =========================================================================
    # The unit is enabled on every host; at each login it reads the Settings and starts
    # the server only in streaming server mode with the switch on, so turning the switch
    # on or off needs no playbook run. See the unit file for the restart choice.

    - name: Ensure The systemd User Unit Directory Exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/systemd/user"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Deploy The Warm Server At Login Unit
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/systemd/user/wsi-stream-server-at-login.service"
        dest: "/home/{{ user_login }}/.config/systemd/user/wsi-stream-server-at-login.service"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'

    # Resolved, never defaulted: a guessed uid points at another user's runtime directory
    # without failing (play-container-watch.yml has the history).
    - name: Resolve The Session User UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"
        fail_key: false

    - name: Assert The Session User Exists
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][user_login] is defined
          - ansible_facts['getent_passwd'][user_login] is not none
          - ansible_facts['getent_passwd'][user_login][1] | int > 0
        fail_msg: >-
          Could not resolve a uid for {{ user_login }}, so this play cannot find that
          user's systemd manager to enable wsi-stream-server-at-login.service.

    # Enabling writes the graphical-session.target wants-link; idempotent. Not started
    # here: it acts at login, and an Insert starts the server on demand meanwhile.
    - name: Enable The Warm Server At Login Unit
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        name: wsi-stream-server-at-login.service
        scope: user
        enabled: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"

    # Its own task, after the enable: the module reloads before it enables, so a reload
    # inside the enable task would not see the new wants-link or a changed unit file.
    - name: Reload The User Manager For The Warm Server Unit
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"

    # Read back from the live manager, not the disk: `is-enabled` has been seen to say
    # enabled while graphical-session.target did not pull the unit in
    # (play-host-health-login-report.yml). Probe-then-fail: the verdict is the next task.
    - name: Read Back Whether The Live Manager Pulls In The Warm Server Unit
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - list-dependencies
          - graphical-session.target
          - --no-pager
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][user_login][1] }}"
      register: warm_server_readback
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-fail — the verdict is the next task

    - name: Assert The Warm Server Unit Is In The Live Graph, Not Only On Disk
      ansible.builtin.fail:
        msg: >-
          {% if warm_server_readback.rc != 0 %}
          The running user manager could not be asked what graphical-session.target pulls
          in (`systemctl --user list-dependencies` exited {{ warm_server_readback.rc }}:
          {{ warm_server_readback.stderr | default('') }}), so whether
          wsi-stream-server-at-login.service will run at login is unknown.
          {% else %}
          wsi-stream-server-at-login.service is enabled on disk but graphical-session.target
          does not name it in the running user manager, so it will not run at login. Collect,
          on the host:
          `systemctl --user list-dependencies graphical-session.target --no-pager | cat`,
          `ls -l ~/.config/systemd/user/graphical-session.target.wants/ | cat` and
          `systemctl --user show wsi-stream-server-at-login.service -p LoadState -p UnitFileState -p WantedBy --no-pager | cat`.
          {% endif %}
      when: >-
        warm_server_readback.rc != 0
        or 'wsi-stream-server-at-login.service' not in warm_server_readback.stdout

    # =========================================================================
    # Claude Code Post-Processing Integration
    # =========================================================================

    - name: Create Speech-to-Text Config Directory
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/speech-to-text"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Deploy Claude Processing Script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.local/bin/wsi-claude-process"
        dest: "/home/{{ user_login }}/.local/bin/wsi-claude-process"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Check Existing Claude Prompt Templates
      ansible.builtin.stat:
        path: "/home/{{ user_login }}/.config/speech-to-text/{{ item }}"
      register: existing_prompts
      loop:
        - claude-prompt-corporate.txt
        - claude-prompt-natural.txt
        - claude-prompt-article.txt
        - claude-prompt-humanize.txt

    - name: Backup Existing Claude Prompt Templates (if different from source)
      ansible.builtin.copy:
        src: "/home/{{ user_login }}/.config/speech-to-text/{{ item.item }}"
        dest: "/home/{{ user_login }}/.config/speech-to-text/{{ item.item }}.bak"
        remote_src: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
        force: true
      loop: "{{ existing_prompts.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists
        - lookup('file', root_dir + '/files/home/.config/speech-to-text/' + item.item, errors='ignore') != lookup('file', '/home/' + user_login + '/.config/speech-to-text/' + item.item, errors='ignore')

    - name: Deploy Claude Prompt Templates
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/home/.config/speech-to-text/{{ item }}"
        dest: "/home/{{ user_login }}/.config/speech-to-text/{{ item }}"
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0644'
        force: true
      loop:
        - claude-prompt-corporate.txt
        - claude-prompt-natural.txt
        - claude-prompt-article.txt
        - claude-prompt-humanize.txt

    # =========================================================================
    # Extension Reload
    # =========================================================================

    - name: Check if Extension is Currently Enabled
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.shell:
        cmd: gnome-extensions list --enabled | grep -q "{{ extension_name }}"
      register: extension_enabled
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — extension may not be enabled yet

    - name: Disable Extension (to force reload)
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: gnome-extensions disable {{ extension_name }}
      when: extension_enabled.rc == 0
      register: disable_result
      changed_when: disable_result.rc == 0
      failed_when: false  # FAIL-FAST-OK: disable may fail if GNOME session is unavailable

    - name: Wait for Extension to Unload
      ansible.builtin.pause:
        seconds: 2
      when: extension_enabled.rc == 0

    - name: Enable Extension
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: gnome-extensions enable {{ extension_name }}
      register: enable_result
      changed_when: "'is now enabled' in enable_result.stderr or enable_result.rc == 0"
      failed_when: false  # FAIL-FAST-OK: enable may fail if GNOME session is unavailable

    - name: Extension Reload Complete
      ansible.builtin.debug:
        msg: "✓ Speech-to-Text extension reloaded successfully"
      when: enable_result.rc == 0

    - name: Extension Enable Deferred
      ansible.builtin.debug:
        msg: "⚠ Extension will be enabled on next GNOME session start (no active session detected)"
      when: enable_result.rc != 0

  handlers:
    # Stop the warm streaming server so the next dictation cold-starts it with the updated
    # script. Only fires when a wsi-stream / wsi-stream-server deploy task reported changed.
    - name: restart wsi-stream-server
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.shell:
        cmd: pkill -f wsi-stream-server
      register: pkill_result
      changed_when: pkill_result.rc == 0
      failed_when: pkill_result.rc not in [0, 1]  # 1 = no process found, that's fine
