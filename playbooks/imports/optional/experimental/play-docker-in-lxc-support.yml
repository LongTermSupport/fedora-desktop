#!/usr/bin/env ansible-playbook
---
# Docker-in-LXC Support Playbook
# This playbook configures the host system to support Docker running inside LXC containers
# It extends the base LXC configuration with Docker-specific requirements

- hosts: desktop
  name: Configure Docker-in-LXC Support
  become: true

  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md

  tasks:
    - name: Load Kernel Modules Required for Docker-in-LXC
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - overlay # Docker overlay storage driver
        - br_netfilter # Bridge netfilter for Docker networking

    - name: Create Persistent Module Load Configuration
      ansible.builtin.lineinfile:
        path: "/etc/modules-load.d/{{ item }}.conf"
        line: "{{ item }}"
        create: true
        mode: "0644"
      loop:
        - overlay
        - br_netfilter

    # `kernel.unprivileged_userns_clone` is a Debian/Ubuntu downstream patch that
    # mainline — and therefore Fedora — has never carried. This play used to set
    # it, which failed on every Fedora host with
    # `cannot stat /proc/sys/kernel/unprivileged_userns_clone`.
    #
    # The module writes the line to the file BEFORE reloading, so the failed run
    # leaves a permanently-poisoned /etc/sysctl.conf: every later `sysctl -p`
    # fails, including the `sysctl` handler in play-lxc-install-config.yml. So
    # the line has to be actively removed, not merely no longer written — and it
    # must be removed BEFORE the sysctl task below, which reloads.
    - name: Check for a Sysctl Config File to Clean Up
      ansible.builtin.stat:
        path: /etc/sysctl.conf
      register: sysctl_conf

    - name: Remove the Debian-Only User-Namespace Sysctl Left by Earlier Runs
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^\s*kernel\.unprivileged_userns_clone\s*='
        state: absent
      when: sysctl_conf.stat.exists

    - name: Configure Sysctl Parameters for Docker-in-LXC
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.conf
        reload: true
      loop:
        # Enable IP forwarding for Docker container networking
        - key: net.ipv4.ip_forward
          value: "1"

        # Enable bridge netfilter for iptables to work with bridges
        # Required for Docker to manage container networking via iptables
        - key: net.bridge.bridge-nf-call-iptables
          value: "1"

        # Enable bridge netfilter for IPv6
        - key: net.bridge.bridge-nf-call-ip6tables
          value: "1"

    # Rootless Docker inside the container needs unprivileged user namespaces.
    # Fedora enables them by default via the mainline `user.max_user_namespaces`
    # knob, so there is nothing to set — but "nothing to set" must not silently
    # become "nothing verified": assert it rather than assume it. A hardened
    # kernel with the limit at 0 now fails here with a reason, instead of failing
    # later as an unexplained container error.
    - name: Read the Kernel User-Namespace Limit
      ansible.builtin.slurp:
        src: /proc/sys/user/max_user_namespaces
      register: max_user_namespaces

    - name: Assert Unprivileged User Namespaces Are Available
      ansible.builtin.assert:
        that:
          - (max_user_namespaces.content | b64decode | trim | int) > 0
        fail_msg: |
          user.max_user_namespaces is 0 — this kernel forbids unprivileged user
          namespaces, which rootless Docker inside an LXC container requires.
          Raise it (for example via /etc/sysctl.d/) and re-run this play.
        success_msg: "Unprivileged user namespaces are available"

    - name: Install Docker-in-LXC Script
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/var/local/docker-in-lxc"
        dest: /var/local/docker-in-lxc
        owner: root
        group: root
        mode: "0755"

    - name: Create Symlink for Easy Access
      ansible.builtin.file:
        src: /var/local/docker-in-lxc
        dest: /usr/local/bin/docker-in-lxc
        state: link
        force: true

    - name: Display Configuration Summary
      ansible.builtin.debug:
        msg:
          - "Docker-in-LXC support has been configured on the host system."
          - ""
          - "Kernel modules loaded: overlay, br_netfilter"
          - "Sysctl parameters set: IP forwarding, bridge netfilter"
          - "Verified: unprivileged user namespaces are available"
          - ""
          - "Command installed: docker-in-lxc"
          - ""
          - "Usage:"
          - "  1. Navigate to a Docker project (with docker-compose.yml or Dockerfile)"
          - "  2. cd ~/Projects/my-docker-app"
          - "  3. docker-in-lxc --create    # Create LXC container for this project"
          - "  4. docker-in-lxc --enter     # Enter the container"
          - "  5. Inside: ccy                # Start Claude Code in YOLO mode"
          - "  6. Inside: docker-compose up  # Start your application"
          - ""
          - "For help: docker-in-lxc --help"
