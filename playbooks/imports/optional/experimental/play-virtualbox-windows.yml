#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# VirtualBox engine install (Plan 00061: split out of the former two-play file;
# the Windows-VM setup now lives in play-virtualbox-windows-vm-setup.yml).
# Scoped general — VirtualBox is headless-capable (VBoxHeadless / VBoxManage),
# same foundational-plumbing reasoning as play-rpm-fusion.yml.
- hosts: desktop
  name: Install Virtualbox
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: developer   # all | developer — see CLAUDE/AnsibleStyle.md

  tasks:
    - name: Audience guard — end play on a consumer install
      ansible.builtin.meta: end_play
      when: install_audience != 'developer'

    - name: Find the kernel the next boot runs, which the akmod handler builds for
      ansible.builtin.include_tasks: "{{ root_dir }}/tasks/boot-kernel-version.yml"

    - name: Install Virtualbox Dependencies
      become: true
      ansible.builtin.dnf:
        name:
          - "@development-tools"
          - kernel-headers
          - kernel-devel
          - dkms
          - akmod-VirtualBox

    - name: Install Repo
      become: true
      ansible.builtin.get_url:
        url: https://download.virtualbox.org/virtualbox/rpm/fedora/virtualbox.repo
        dest: /etc/yum.repos.d/virtualbox.repo
        mode: "0644"

    - name: Install Virtualbox
      become: true
      ansible.builtin.dnf:
        name: VirtualBox
        state: present
      notify: akmod

    - name: Add user to vboxusers group
      become: true
      ansible.builtin.user:
        name: "{{ user_login }}"
        groups: vboxusers
        append: true

  handlers:
    - name: akmod
      become: true
      # Built for the kernel the next boot runs, the one kernel-devel is installed for; the
      # driver is reloaded now only when that is the running kernel, else at the reboot.
      ansible.builtin.shell: |
        set -euo pipefail
        akmods --kernels "$KVER"
        if [ "$KVER" = "$(uname -r)" ]; then
          systemctl restart vboxdrv.service
        fi
      args:
        executable: /bin/bash
      environment:
        KVER: "{{ boot_kernel_version }}"
      changed_when: true
