#!/usr/bin/env ansible-playbook
---
# DisplayLink is used by USB Docks for Extra Monitors
# Handles Secure Boot by enrolling MOK key for kernel module signing
- hosts: desktop
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    # Version configuration
    displaylink_version: "v6.3.0-1"
    evdi_version: "1.15.0"
    # RPM release suffix of the evdi package — drifts independently of the
    # evdi version itself (e.g. v6.3.0 shipped evdi 1.14.16-2, v6.3.0-1 ships 1.15.0-1).
    evdi_rpm_release: "1"
    # Set to true to bypass version check (use with caution)
    force_install: false
  vars_files:
    - "{{ root_dir }}/vars/fedora-version.yml"
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    - name: Check if Secure Boot is enabled
      ansible.builtin.shell: mokutil --sb-state
      register: secure_boot_state
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — secure boot may not be available

    - name: Validate MOK password is in vault
      ansible.builtin.assert:
        that:
          - mok_password is defined
        fail_msg: |
          ERROR: MOK password not found in vault!

          Please add 'mok_password' to your vault configuration:
          ansible-vault edit environment/localhost/host_vars/localhost.yml

          Add: mok_password: "your-password"

          This password will be used once during boot to enroll the MOK key.
      when: "'SecureBoot enabled' in secure_boot_state.stdout"

    - name: Install prerequisites for DisplayLink
      ansible.builtin.dnf:
        name:
          - mokutil
          - dkms
          - kernel-devel
          - kernel-headers
          - expect
        state: present

    - name: Fetch latest DisplayLink release from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/displaylink-rpm/displaylink-rpm/releases/latest
        return_content: true
      register: github_release
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — GitHub API may be unreachable; user warned via pause

    - name: Parse latest version information
      ansible.builtin.set_fact:
        latest_version: "{{ github_release.json.tag_name | default('unknown') }}"
        version_check_failed: "{{ github_release.status != 200 }}"
      when: github_release is defined

    - name: Display version information
      ansible.builtin.debug:
        msg:
          - "Playbook version: {{ displaylink_version }}"
          - "Latest GitHub version: {{ latest_version | default('Unable to fetch') }}"
          - "Status: {{ 'UP TO DATE' if (latest_version | default('') == displaylink_version) else ('VERSION CHECK FAILED' if version_check_failed else 'NOT UP TO
            DATE') }}"
          - "{{ 'Installation: FORCED (bypassing version check)' if (force_install and latest_version | default('') != displaylink_version and not version_check_failed)
            else '' }}"

    - name: Validate DisplayLink package version is current
      ansible.builtin.assert:
        that:
          - force_install or version_check_failed or (latest_version == displaylink_version)
        fail_msg: |
          ERROR: DisplayLink package version is outdated!

          Playbook version: {{ displaylink_version }}
          Latest version:   {{ latest_version }}

          This playbook is using an outdated DisplayLink package which may not be
          compatible with your current kernel version.

          To fix this issue:

          1. Update the playbook with the latest version:
             - Edit: playbooks/imports/optional/hardware-specific/play-displaylink.yml
             - Update 'displaylink_version' variable to: {{ latest_version }}
             - Update the download URL in 'Install DisplayLink RPM' task

          2. Check the latest release at:
             https://github.com/displaylink-rpm/displaylink-rpm/releases/latest

          3. To force installation anyway (NOT RECOMMENDED), run with:
             ansible-playbook playbooks/imports/optional/hardware-specific/play-displaylink.yml \
               -e force_install=true

          Note: Installing an outdated version may fail to build against newer kernels.
        success_msg: "DisplayLink package version is current: {{ displaylink_version }}"
      when: not version_check_failed

    - name: Warning about version check failure
      ansible.builtin.pause:
        prompt: |2

          ========================================================================
          WARNING: VERSION CHECK FAILED
          ========================================================================

          Unable to verify DisplayLink package version against GitHub.
          Proceeding will install version: {{ displaylink_version }}

          DisplayLink is a kernel driver — installing an outdated or incompatible
          version can cause system instability, boot failures, or display issues.

          If you want to verify manually before proceeding, check:
          https://github.com/displaylink-rpm/displaylink-rpm/releases

          Press ENTER to accept the risk and continue, or Ctrl+C to abort...
          ========================================================================
      when: version_check_failed

    - name: Install DisplayLink RPM
      ansible.builtin.dnf:
        name: "https://github.com/displaylink-rpm/displaylink-rpm/releases/download/{{ displaylink_version }}/fedora-{{ fedora_version }}-displaylink-{{ evdi_version }}-{{ evdi_rpm_release }}.github_evdi.x86_64.rpm"
        disable_gpg_check: true
      register: displaylink_install

    - name: Check if DKMS MOK key exists
      ansible.builtin.stat:
        path: /var/lib/dkms/mok.pub
      register: mok_key

    - name: Check if MOK is already enrolled
      ansible.builtin.shell: mokutil --test-key /var/lib/dkms/mok.pub
      register: mok_enrolled
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — MOK key may not be enrolled yet
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - mok_key.stat.exists

    - name: Import MOK key for enrollment
      ansible.builtin.shell: |
        expect -c "
        spawn mokutil --import /var/lib/dkms/mok.pub
        expect \"input password:\"
        send \"{{ mok_password }}\r\"
        expect \"input password again:\"
        send \"{{ mok_password }}\r\"
        expect eof
        "
      no_log: true
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - mok_key.stat.exists
        - "'is not enrolled' in mok_enrolled.stdout | default('')"
      register: mok_import

    - name: Display MOK enrollment password
      ansible.builtin.pause:
        prompt: |2

          ========================================================================
          IMPORTANT: SECURE BOOT MOK ENROLLMENT REQUIRED
          ========================================================================

          Your MOK enrollment password is: {{ mok_password }}

          MEMORIZE THIS PASSWORD NOW!

          After reboot:
          1. You will see a blue MOK Manager screen
          2. Select "Enroll MOK"
          3. Select "Continue"
          4. Select "Yes"
          5. Enter the password shown above: {{ mok_password }}
          6. Select "Reboot"

          The password will ONLY be needed this one time during enrollment.

          Press ENTER only after you have memorized the password...
          ========================================================================
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - mok_import is changed

    - name: Run DKMS autoinstall
      ansible.builtin.command: dkms autoinstall
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - "'is already enrolled' in mok_enrolled.stdout | default('')"

    # DisplayLink dock hotplug/suspend-resume recovery (Plan 00056 / issue #28).
    # EVDI recreates virtual DRM devices with new IDs on reconnect, which can
    # both wedge a video head (connected but never gets an EDID) and corrupt
    # ~/.config/monitors.xml references. The old bash watchdog only restarted
    # displaylink-driver.service — issue #28 established that alone does not
    # reload the evdi kernel module and does nothing for a wedged head. The
    # staged recovery logic (service restart -> USB reauth -> module reload,
    # each only as needed) is unit-tested in helpers/displaylink_recovery/ —
    # see that package's docstring for the full decision rationale, including
    # why mutter monitor-manager corruption can only be notified about, not
    # silently fixed, on Wayland.
    - name: Deploy DisplayLink recovery decision logic
      ansible.builtin.copy:
        src: "{{ root_dir }}/helpers/displaylink_recovery/recovery.py"
        dest: /usr/local/lib/displaylink-recovery/helpers/displaylink_recovery/recovery.py
        owner: root
        group: root
        mode: "0644"

    - name: Deploy DisplayLink recovery executor
      ansible.builtin.copy:
        src: "{{ root_dir }}/helpers/displaylink_recovery/run_recovery.py"
        dest: /usr/local/lib/displaylink-recovery/helpers/displaylink_recovery/run_recovery.py
        owner: root
        group: root
        mode: "0644"

    - name: Deploy DisplayLink dock hotplug recovery udev rule
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/udev/rules.d/99-displaylink-dock-recovery.rules"
        dest: /etc/udev/rules.d/99-displaylink-dock-recovery.rules
        owner: root
        group: root
        mode: "0644"
      notify: reload-udev-rules

    - name: Deploy DisplayLink dock hotplug recovery systemd service
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/systemd/system/displaylink-dock-recovery.service"
        dest: /etc/systemd/system/displaylink-dock-recovery.service
        owner: root
        group: root
        mode: "0644"
      notify: reload-systemd

    - name: Create DisplayLink suspend/resume recovery service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=DisplayLink Suspend/Resume Recovery
          After=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target displaylink-driver.service

          [Service]
          Type=oneshot
          WorkingDirectory=/usr/local/lib/displaylink-recovery
          ExecStartPre=/bin/sleep 5
          ExecStart=/usr/bin/python3 -m helpers.displaylink_recovery.run_recovery
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=displaylink-suspend-recovery

          [Install]
          WantedBy=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target
        dest: /etc/systemd/system/displaylink-suspend.service
        mode: "0644"
      register: suspend_service

    - name: Enable DisplayLink suspend service
      ansible.builtin.systemd:
        name: displaylink-suspend.service
        enabled: true
        daemon_reload: "{{ suspend_service.changed }}"

    - name: Remove obsolete DisplayLink resume-check bash script
      ansible.builtin.file:
        path: /usr/local/bin/displaylink-resume-check.sh
        state: absent

    - name: Ensure DisplayLink service is started
      ansible.builtin.systemd:
        name: displaylink-driver
        state: started
        enabled: true
      when: "'is already enrolled' in mok_enrolled.stdout | default('') or 'SecureBoot disabled' in secure_boot_state.stdout"

    - name: Verify DisplayLink installation
      ansible.builtin.command: "{{ root_dir }}/scripts/check-displaylink-status.sh --check"
      register: displaylink_check
      failed_when: displaylink_check.rc != 0
      changed_when: false
      when: "'SecureBoot disabled' in secure_boot_state.stdout or 'is already enrolled' in mok_enrolled.stdout | default('')"

    - name: Final instructions
      ansible.builtin.pause:
        prompt: |2

          ========================================================================
          DisplayLink Installation Status
          ========================================================================

          {% if 'SecureBoot enabled' in secure_boot_state.stdout and mok_import is changed %}
          ACTION REQUIRED: MOK ENROLLMENT

          1. Reboot your system now
          2. Enroll the MOK key using the password you memorized
          3. After successful enrollment, DisplayLink will work automatically

          To reboot now, run: sudo reboot
          {% elif 'SecureBoot enabled' in secure_boot_state.stdout and 'is already enrolled' in mok_enrolled.stdout | default('') %}
          ✅ MOK key is already enrolled. DisplayLink is configured and verified.
          {% else %}
          ✅ Secure Boot is disabled. DisplayLink is configured and verified.
          {% endif %}

          Press ENTER to continue...
          ========================================================================

  handlers:
    - name: reload-systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: reload-udev-rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: true
      notify: trigger-udev

    - name: trigger-udev
      ansible.builtin.command: udevadm trigger --subsystem-match=usb
      changed_when: true
