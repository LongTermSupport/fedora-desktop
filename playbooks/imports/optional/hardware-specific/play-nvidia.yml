#!/usr/bin/env ansible-playbook
---
# Install NVIDIA drivers using RPM Fusion (recommended method for Fedora 44+)
# For RTX 500 Ada Generation and other modern NVIDIA GPUs
#
# Vulkan support is installed by default (required for modern gaming, AI apps, GPU compute)
# To disable, add to host_vars/localhost.yml: nvidia_install_vulkan: false
- hosts: desktop
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    # cuDNN 9 — installed from NVIDIA's official wheel; there is no NVIDIA
    # cuDNN dnf repo for Fedora. Bump version + URL + sha256 together (the
    # pythonhosted URL path is content-addressed and changes per release).
    cudnn_version: "9.22.0.52"
    cudnn_wheel_url: "https://files.pythonhosted.org/packages/57/96/ce2cb84b5e8bb94dd55f554e3454b91e9ecd6708aa27d4a7b12f287613bc/nvidia_cudnn_cu13-9.22.0.52-py3-none-manylinux_2_27_x86_64.whl"
    cudnn_sha256: "7b24277af8cd2e4e5be731f5cf910255105d4b92481999771b99dbffee75d03e"
  pre_tasks:
    - name: Load Fedora version config
      ansible.builtin.include_vars:
        file: "{{ root_dir }}/vars/fedora-version.yml"
  tasks:
    - name: Enable RPM Fusion repositories
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_version }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Update system packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install NVIDIA driver packages
      ansible.builtin.dnf:
        name:
          - akmod-nvidia
          - xorg-x11-drv-nvidia-cuda # For CUDA/NVDEC/NVENC support
          - xorg-x11-drv-nvidia-cuda-libs
          - xorg-x11-drv-nvidia-power
          - libva-nvidia-driver # For hardware video acceleration (renamed from nvidia-vaapi-driver in F43)
          - libva-utils # For vainfo testing tool
          - mesa-demos # For glxinfo testing tool
        state: present

    - name: Install Vulkan Support for NVIDIA
      ansible.builtin.dnf:
        name:
          # Core Vulkan runtime
          - vulkan-loader
          - vulkan-tools # For vulkaninfo, vulkan-smoketest
          # NVIDIA-specific Vulkan driver (ICD - Installable Client Driver)
          - xorg-x11-drv-nvidia-libs
          - nvidia-gpu-firmware
        state: present
      when: nvidia_install_vulkan | default(true) | bool

    # =========================================================================
    # CUDA Toolkit + cuDNN — NVIDIA compute/AI capability (system-wide)
    # =========================================================================
    # CUDA is a general system capability (AI/ML tooling, GPU compute,
    # darktable's AI features) — not specific to any one application. It is
    # installed from NVIDIA's official Fedora repo.
    #
    # HOLISTIC SAFETY: only `cuda-toolkit` (NVIDIA's driverless toolkit
    # meta-package) is installed, and the repo is configured to EXCLUDE every
    # driver/kmod package — so it can never replace the RPM Fusion
    # akmod-nvidia driver installed above. cuDNN 9 has no NVIDIA dnf repo for
    # Fedora, so it is deployed from NVIDIA's official cuDNN wheel (a zip of
    # NVIDIA-built .so files) into /opt/cudnn and put on the linker path.
    #
    # Disable with: nvidia_install_cuda: false  (in host_vars/localhost.yml)
    # @see CLAUDE/Plan/00042-darktable-ai-features/ Phase 3

    - name: Configure NVIDIA CUDA repository (driver/kmod packages excluded)
      ansible.builtin.yum_repository:
        name: "cuda-fedora{{ fedora_version }}-x86_64"
        description: "NVIDIA CUDA Fedora {{ fedora_version }} x86_64"
        baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ fedora_version }}/x86_64"
        gpgcheck: true
        # Key filename changed between fedora43 (1940C73E.pub, 404 on f44) and fedora44 (73CD9B30.pub).
        # Verified 2026-06-12: 73CD9B30.pub → HTTP 200; 1940C73E.pub → HTTP 404 under fedora44/x86_64/.
        gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ fedora_version }}/x86_64/73CD9B30.pub"
        # This repo must NEVER replace the RPM Fusion akmod-nvidia driver.
        # Exclude list verified against the fedora44 repo index (2026-06-12, CUDA 13.3 / driver 610.43.02).
        # New 610-era additions vs prior list: nvidia-fabricmanager*, nvidia-fabric-manager-devel*,
        # nvidia-imex*, nvidia-libXNVCtrl*, libnvidia-fbc*, libnvidia-nscq*, libnvsdm*, nvidia-fs*
        # (the fedora44 CUDA repo ships BOTH nvidia-fs-dkms AND a plain nvidia-fs kmod package —
        # the `nvidia-fs*` glob fences both, so neither competes with the RPM Fusion akmod stack;
        # no cuda-toolkit package starts with `nvidia-fs`, so the toolkit install is unaffected).
        exclude: >-
          nvidia-driver* cuda-drivers* kmod-nvidia* nvidia-kmod* xorg-x11-nvidia* nvidia-open*
          nvidia-modprobe nvidia-persistenced nvidia-settings nvidia-xconfig
          nvidia-fabricmanager* nvidia-fabric-manager-devel* nvidia-imex* nvidia-libXNVCtrl*
          libnvidia-fbc* libnvidia-nscq* libnvsdm* nvidia-fs*
      when: nvidia_install_cuda | default(true) | bool

    - name: Install CUDA Toolkit (driverless meta-package)
      ansible.builtin.dnf:
        name: cuda-toolkit
        state: present
      when: nvidia_install_cuda | default(true) | bool

    - name: Assert the RPM Fusion NVIDIA driver survived the CUDA install
      ansible.builtin.command: rpm -q akmod-nvidia
      register: nvidia_cuda_driver_check
      changed_when: false
      when: nvidia_install_cuda | default(true) | bool

    - name: Download NVIDIA cuDNN wheel ({{ cudnn_version }})
      ansible.builtin.get_url:
        url: "{{ cudnn_wheel_url }}"
        dest: "/var/tmp/nvidia-cudnn-cu13-{{ cudnn_version }}.zip"
        checksum: "sha256:{{ cudnn_sha256 }}"
        owner: root
        group: root
        mode: "0644"
      when: nvidia_install_cuda | default(true) | bool

    - name: Create the cuDNN install directory
      ansible.builtin.file:
        path: /opt/cudnn
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: nvidia_install_cuda | default(true) | bool

    - name: Extract the cuDNN wheel into /opt/cudnn
      ansible.builtin.unarchive:
        src: "/var/tmp/nvidia-cudnn-cu13-{{ cudnn_version }}.zip"
        dest: /opt/cudnn
        remote_src: true
        creates: "/opt/cudnn/nvidia/cudnn/lib"
      when: nvidia_install_cuda | default(true) | bool

    - name: Remove the downloaded cuDNN wheel archive
      ansible.builtin.file:
        path: "/var/tmp/nvidia-cudnn-cu13-{{ cudnn_version }}.zip"
        state: absent
      when: nvidia_install_cuda | default(true) | bool

    - name: Register CUDA + cuDNN libraries with the dynamic linker
      ansible.builtin.copy:
        dest: /etc/ld.so.conf.d/nvidia-cuda.conf
        content: |
          # NVIDIA CUDA Toolkit + cuDNN — managed by play-nvidia.yml
          /usr/local/cuda/lib64
          /opt/cudnn/nvidia/cudnn/lib
        owner: root
        group: root
        mode: "0644"
      register: nvidia_ldsoconf
      when: nvidia_install_cuda | default(true) | bool

    - name: Refresh the dynamic linker cache
      ansible.builtin.command: ldconfig
      changed_when: true
      when:
        - nvidia_install_cuda | default(true) | bool
        - nvidia_ldsoconf is changed

    # =========================================================================
    # Secure Boot MOK Signing Support
    # =========================================================================

    - name: Check if Secure Boot is enabled
      ansible.builtin.shell: mokutil --sb-state
      register: secure_boot_state
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — secure boot may not be available

    - name: Install MOK prerequisites
      ansible.builtin.dnf:
        name:
          - mokutil
          - expect
          - kernel-devel
          - kernel-headers
        state: present

    - name: Validate MOK password is in vault
      ansible.builtin.assert:
        that:
          - mok_password is defined
        fail_msg: |
          ERROR: MOK password not found in vault!

          Please add 'mok_password' to your vault configuration:
          ansible-vault edit environment/localhost/host_vars/localhost.yml

          Add: mok_password: "your-password"

          This password will be used once during boot to enroll the MOK key.
      when: "'SecureBoot enabled' in secure_boot_state.stdout"

    - name: Generate akmods MOK signing key
      ansible.builtin.command: kmodgenca -a
      args:
        creates: /etc/pki/akmods/certs/public_key.der
      when: "'SecureBoot enabled' in secure_boot_state.stdout"

    - name: Check if akmods MOK key exists
      ansible.builtin.stat:
        path: /etc/pki/akmods/certs/public_key.der
      register: akmods_mok_key

    - name: Check if MOK is already enrolled
      ansible.builtin.shell: mokutil --test-key /etc/pki/akmods/certs/public_key.der
      register: mok_enrolled
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — MOK key may not be enrolled yet
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - akmods_mok_key.stat.exists

    - name: Import MOK key for enrollment
      ansible.builtin.shell: |
        expect -c "
        spawn mokutil --import /etc/pki/akmods/certs/public_key.der
        expect \"input password:\"
        send \"{{ mok_password }}\r\"
        expect \"input password again:\"
        send \"{{ mok_password }}\r\"
        expect eof
        "
      no_log: true
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - akmods_mok_key.stat.exists
        - "'is not enrolled' in mok_enrolled.stdout | default('')"
      register: mok_import

    - name: Display MOK enrollment password
      ansible.builtin.pause:
        prompt: |2

          ========================================================================
          IMPORTANT: SECURE BOOT MOK ENROLLMENT REQUIRED
          ========================================================================

          Your MOK enrollment password is: {{ mok_password }}

          MEMORIZE THIS PASSWORD NOW!

          After reboot:
          1. You will see a blue MOK Manager screen
          2. Select "Enroll MOK"
          3. Select "Continue"
          4. Select "Yes"
          5. Enter the password shown above: {{ mok_password }}
          6. Select "Reboot"

          The password will ONLY be needed this one time during enrollment.

          Press ENTER only after you have memorized the password...
          ========================================================================
      when:
        - "'SecureBoot enabled' in secure_boot_state.stdout"
        - mok_import is changed

    # =========================================================================
    # Kernel Module Build & Verification
    # =========================================================================
    # akmods builds the nvidia kernel module asynchronously via RPM scriptlet
    # on install/upgrade. We poll for the built .ko on disk (up to 5 minutes),
    # fall back to `akmods --force` on timeout, then report three version
    # states so the operator can tell at a glance whether a reboot is required:
    #   package  — what RPM is installed (target version)
    #   built    — what's on disk in /lib/modules/$(uname -r)/extra/nvidia/
    #   loaded   — what the running kernel currently has
    # If built != loaded, a reboot is required; otherwise the driver is live.

    - name: Get installed akmod-nvidia package version
      ansible.builtin.shell: rpm -q --qf '%{VERSION}\n' akmod-nvidia
      register: nvidia_pkg
      changed_when: false

    - name: Wait for akmods to build nvidia kernel module on disk (up to 5 min)
      ansible.builtin.shell: |
        set -e
        KMOD="/lib/modules/$(uname -r)/extra/nvidia/nvidia.ko.xz"
        [ -f "$KMOD" ] || KMOD="/lib/modules/$(uname -r)/extra/nvidia/nvidia.ko"
        for i in $(seq 1 60); do
          if [ -f "$KMOD" ]; then
            modinfo -F version "$KMOD"
            exit 0
          fi
          sleep 5
        done
        exit 1
      register: nvidia_kmod_poll
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe — retried below with akmods --force; that retry has no failed_when override and will halt the playbook if the build still fails

    - name: Force akmods rebuild if initial poll timed out
      # No failed_when override: if force-rebuild also fails, playbook halts.
      # Operator diagnostics:
      #   systemctl status akmods --no-pager -l
      #   journalctl -u akmods --no-pager --since "20 minutes ago"
      #   ls -la /lib/modules/$(uname -r)/extra/nvidia/
      ansible.builtin.shell: |
        set -e
        akmods --force
        dracut --force
        KMOD="/lib/modules/$(uname -r)/extra/nvidia/nvidia.ko.xz"
        [ -f "$KMOD" ] || KMOD="/lib/modules/$(uname -r)/extra/nvidia/nvidia.ko"
        modinfo -F version "$KMOD"
      register: nvidia_kmod_force
      when: nvidia_kmod_poll.rc != 0
      changed_when: true

    - name: Read built NVIDIA module version (on disk)
      ansible.builtin.shell: |
        set -euo pipefail
        KMOD="/lib/modules/$(uname -r)/extra/nvidia/nvidia.ko.xz"
        [ -f "$KMOD" ] || KMOD="/lib/modules/$(uname -r)/extra/nvidia/nvidia.ko"
        modinfo -F version "$KMOD" 2>/dev/null || echo NONE  # FAIL-FAST-OK: probe — NONE sentinel used by Display task to report missing module
      args:
        executable: /bin/bash
      register: nvidia_built
      changed_when: false

    - name: Read loaded NVIDIA module version (running kernel)
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -e /proc/driver/nvidia/version ]; then
          grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /proc/driver/nvidia/version | head -1
        else
          echo NOT_LOADED
        fi
      args:
        executable: /bin/bash
      register: nvidia_loaded
      changed_when: false

    - name: Display NVIDIA driver status
      ansible.builtin.debug:
        msg: |
          ========================================
          NVIDIA driver status
          ========================================
          Package (akmod-nvidia): {{ nvidia_pkg.stdout }}
          Built on disk:          {{ nvidia_built.stdout }}
          Loaded in kernel:       {{ nvidia_loaded.stdout }}
          {% if nvidia_loaded.stdout == nvidia_built.stdout %}

          Status: OK — built version is already loaded. No reboot required.
          {% elif nvidia_loaded.stdout == 'NOT_LOADED' %}

          Status: FRESH INSTALL — REBOOT REQUIRED to load driver {{ nvidia_built.stdout }}.
          {% else %}

          Status: UPGRADE — REBOOT REQUIRED to switch from {{ nvidia_loaded.stdout }} to {{ nvidia_built.stdout }}.
          {% endif %}
          ========================================

    - name: Reboot reminder (only when built != loaded)
      ansible.builtin.pause:
        prompt: |2

          ========================================================================
          REBOOT REQUIRED — NVIDIA driver {{ nvidia_built.stdout }} is built but not loaded
          ========================================================================
          {% if 'SecureBoot enabled' in secure_boot_state.stdout and mok_import is changed %}

          ALSO: complete MOK enrollment at boot (password shown earlier in this run).
          {% endif %}

          After reboot, verify with:
            nvidia-smi                                  # driver/GPU status
            cat /proc/driver/nvidia/version             # loaded driver version
            lsmod | grep nvidia                         # kernel module presence
          {% if nvidia_install_vulkan | default(true) | bool %}
            vulkaninfo | grep -i 'device name'         # Vulkan GPU
            vulkaninfo --summary                        # Vulkan devices list
          {% endif %}
            ./scripts/nvidia-status.bash                # full diagnostics

          Press ENTER to acknowledge.
          ========================================================================
      when: nvidia_loaded.stdout != nvidia_built.stdout
