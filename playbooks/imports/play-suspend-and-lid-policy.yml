#!/usr/bin/env ansible-playbook
---
# Suspend and lid policy.
#
# Core principle (Plan 00104): a suspend request must be HONOURED. Unplugging a cable is not
# a reason to cancel one. Three layers:
#   1. Don't let trivial events generate wakeups at all  (udev, power-delivery devices)
#   2. If a suspend aborts anyway, re-issue it            (system-sleep hook)
#   3. Bound any remaining failure on battery             (GNOME idle-suspend)
#
# Was imports/optional/hardware-specific/play-laptop-lid-power-management.yml, which
# playbook-main.yml never imported — so the lid config it deploys was live on the host but
# would not survive a rebuild. Moved here because playbook-main.yml requires that anything it
# imports does not live under imports/optional/.
- hosts: desktop
  name: Suspend and Lid Policy
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    - name: Configure logind for laptop lid behavior
      ansible.builtin.blockinfile:
        path: /etc/systemd/logind.conf.d/laptop-lid.conf
        marker: "# {mark} ANSIBLE MANAGED: Laptop Lid Behavior"
        block: |
          [Login]
          # Suspend when lid closed on battery
          HandleLidSwitch=suspend

          # Don't suspend when lid closed on AC power
          HandleLidSwitchExternalPower=ignore
        create: true
        owner: root
        group: root
        mode: '0644'
      # A handler, not an unconditional debug task: logind's config is the ONLY part of this
      # play needing a reboot, so announcing it on every routine playbook-main.yml run would
      # train the operator to ignore it.
      notify: warn-reboot-required

    - name: Configure UPower to ignore lid (let logind handle it)
      ansible.builtin.lineinfile:
        path: /etc/UPower/UPower.conf
        regexp: '^IgnoreLid='
        line: 'IgnoreLid=true'
        owner: root
        group: root
        mode: '0644'
      notify: restart-upower
      # /etc/UPower/UPower.conf ships with the upower package, and NO playbook in this repo
      # installs upower. lineinfile without `create` fails outright when the path is absent,
      # and ansible.cfg sets any_errors_fatal, so on a headless server this would abort the
      # ENTIRE provisioning run — not merely this play. Same guard, and same reason, as the
      # gsettings task below (Plan 00061 §6.2); it became reachable for servers when this
      # play moved out of imports/optional/ and into playbook-main.yml.
      when: provisioning_profile != 'server'

    # Layer 1 — stop trivial wakeups at source. The AC adapter and both USB-C power-delivery
    # ports ship armed as wakeup sources, so pulling the mains fires a wake event; landing
    # during the s2idle transition, it aborts the suspend.
    - name: Disarm power-delivery devices as wakeup sources
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/etc/udev/rules.d/99-suspend-wakeup-policy.rules"
        dest: /etc/udev/rules.d/99-suspend-wakeup-policy.rules
        owner: root
        group: root
        mode: '0644'
      notify: reload-udev-rules

    # Layer 2 — make the request durable whatever the wake source was.
    - name: Deploy the aborted-suspend recovery hook
      ansible.builtin.copy:
        src: "{{ root_dir }}/files/usr/lib/systemd/system-sleep/resuspend-aborted-suspend"
        dest: /usr/lib/systemd/system-sleep/resuspend-aborted-suspend
        owner: root
        group: root
        mode: '0755'

    - name: Get user UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_login }}"

    # Layer 3 — defence in depth. GNOME's own default for this key is 'suspend'; it was
    # 'nothing' on the host and set by nothing in this repo, so a laptop that failed to
    # suspend stayed awake indefinitely on battery. The AC sibling
    # (sleep-inactive-ac-type=nothing) is deliberate and lives in play-prevent-ssh-suspend.yml
    # so inbound SSH survives — do NOT "make them consistent".
    - name: Enable idle suspend on battery
      become: true
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        argv:
          - gsettings
          - set
          - org.gnome.settings-daemon.plugins.power
          - sleep-inactive-battery-type
          - suspend
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[user_login][1] }}/bus"
      changed_when: false
      # GNOME Settings Daemon schema over D-Bus — hard-fails ("No such schema") on a
      # headless server without gnome-settings-daemon, which under this repo's
      # any_errors_fatal aborts the whole run (Plan 00061 §6.2).
      when: provisioning_profile != 'server'


  handlers:
    - name: restart-upower
      ansible.builtin.systemd:
        name: upower
        state: restarted

    # Two steps, and the second is not optional: `udevadm control --reload-rules` only makes
    # the rule available to FUTURE device events. AC and the UCSI ports are never removed and
    # re-added on a running system, so without the trigger the policy would not take effect
    # until a reboot. Same reload -> trigger chain as play-displaylink.yml.
    - name: reload-udev-rules
      ansible.builtin.command:
        argv:
          - udevadm
          - control
          - --reload-rules
      changed_when: true
      notify: trigger-udev

    - name: trigger-udev
      ansible.builtin.command:
        argv:
          - udevadm
          - trigger
          - --subsystem-match=power_supply
      changed_when: true

    - name: warn-reboot-required
      ansible.builtin.debug:
        msg: |
          ===================================================================
          Lid configuration changed.

          REBOOT REQUIRED: systemd-logind does not reload its config without
          restarting, and restarting logind kills your session.

          (The udev wakeup policy does NOT need a reboot — the handler above
          runs `udevadm trigger`, so it applies immediately.)
          ===================================================================
