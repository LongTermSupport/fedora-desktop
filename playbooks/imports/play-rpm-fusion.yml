#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
- hosts: desktop
  name: RPM Fusion
  become: true
  vars:
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    audience: all   # all | developer — see CLAUDE/AnsibleStyle.md
  tasks:
    # The dnf module accepts remote-URL rpms and is a no-op once installed, so the two
    # release packages no longer re-fetch rpmfusion.org headers on every main run.
    # disable_gpg_check is required: the release rpm itself ships the rpmfusion keys, so
    # it cannot be verified against a key that is not installed yet (chicken-and-egg).
    - name: Install RPM Fusion free + nonfree release packages
      ansible.builtin.dnf:
        name:
          - "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true

    # Multimedia codecs: the openh264 repository enabled, then the multimedia group. Each is
    # checked on every run rather than skipped behind a marker of the first run, so a repository
    # disabled or a group removed since is put back (install-guard-trusts-record, CLAUDE/QA.md).
    # The @core/@multimedia `dnf update` lines are intentionally dropped — play-AB-dnf-
    # upgrade.yml already brings every package to latest earlier in the same run.
    - name: Read the Enabled Repositories
      ansible.builtin.command:
        argv: [dnf, -q, repolist, --enabled]
      register: rpmfusion_enabled_repos
      changed_when: false
      check_mode: false

    - name: Enable the openh264 Repository
      ansible.builtin.command:
        argv: [dnf, -y, config-manager, setopt, fedora-cisco-openh264.enabled=1]
      when: "'fedora-cisco-openh264' not in (rpmfusion_enabled_repos.stdout_lines | map('trim') | select | map('split') | map('first') | list)"
      changed_when: "'fedora-cisco-openh264' not in (rpmfusion_enabled_repos.stdout_lines | map('trim') | select | map('split') | map('first') | list)"

    - name: Install the Multimedia Group
      ansible.builtin.dnf:
        name: "@multimedia"
        state: present
        allowerasing: true
        install_weak_deps: false
        exclude:
          - PackageKit-gstreamer-plugin

    - name: Remove the Marker the Codec Setup Used to Run Once Behind
      ansible.builtin.file:
        path: /var/local/.rpmfusion-multimedia-configured
        state: absent

    # Intel GPU hardware video decode. RPM Fusion nonfree builds it for x86_64 (and i686)
    # only, as the hardware is x86 only, so it is skipped by name on any other architecture.
    - name: Install intel-media-driver (Intel GPUs; RPM Fusion has no aarch64 build, skipped there)
      ansible.builtin.dnf:
        name: intel-media-driver
        state: present
      when: ansible_facts['architecture'] == 'x86_64'

    - name: Say intel-media-driver is skipped on this architecture (RPM Fusion builds it for x86 only)
      ansible.builtin.debug:
        msg: "intel-media-driver: RPM Fusion has no {{ ansible_facts['architecture'] }} build (Intel GPUs are x86 only); skipped"
      when: ansible_facts['architecture'] != 'x86_64'
