#!/usr/bin/env ansible-playbook
---
# Podman Rootless Store Repair
#
# Repairs a rootless podman store wedged by an interrupted pull/build (typically
# during a full disk), which leaves behind files owned by the user's SUBORDINATE
# UIDs (/etc/subuid, e.g. 100000+). The unprivileged user — and even `podman
# unshare` (namespaced root, confined to the sub-UID map) — cannot remove them,
# so podman fails to load its store on EVERY command (incl. CCY startup),
# rc=125. Two forms seen, both handled here:
#
#   1. Stale temp dirs:
#      error removing stale temp dir: unlinkat overlay/tempdirs/temp-dir-*/...: permission denied
#   2. An INCOMPLETE overlay layer podman keeps trying (and failing) to delete:
#      Found incomplete layer "<64-hex>", deleting it
#      Error: loading primary layer store data: deleting layer "<64-hex>": failed to add to
#      stage directory: rename overlay/<64-hex> overlay/tempdirs/temp-dir-*/0-<64-hex>: permission denied
#      (this is the real source — it regenerates a temp dir on every podman call)
#
# Fix: as REAL host root (become: true, no become_user — root has CAP_DAC_OVERRIDE
# over every UID, unlike `podman unshare`), remove (a) the incomplete overlay
# layer dirs podman named in its own output, and (b) overlay/tempdirs scratch.
# Idempotent: nothing to remove = no-op. Safe with LIVE containers — an
# incomplete layer is never the mounted layer of a running container, and
# tempdirs is orphaned scratch; NO prune/reset is performed.
#
# Run on the HOST:
#   ansible-playbook playbooks/imports/play-podman-store-repair.yml
#
# Optional: also remove a specific image podman flagged corrupted (it will be
# re-pulled/rebuilt on next use) — e.g. the CCY image:
#   ansible-playbook playbooks/imports/play-podman-store-repair.yml \
#     -e podman_repair_remove_image=claude-yolo:latest
- hosts: desktop
  name: Podman Rootless Store Repair - clear incomplete layers + stale temp dirs
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    podman_storage: "/home/{{ user_login }}/.local/share/containers/storage"
    podman_tempdirs: "/home/{{ user_login }}/.local/share/containers/storage/overlay/tempdirs"
    podman_user_runtime: "/run/user/{{ user_login_uid | default(1000) }}"
    podman_repair_remove_image: ""   # set via -e to also drop a corrupted image
  tasks:
    - name: Probe rootless store health BEFORE repair (as the user)
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_before
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: a wedged store returns non-zero; we branch/report on rc below
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Report store health before repair
      ansible.builtin.debug:
        msg: >-
          podman store BEFORE repair: rc={{ podman_df_before.rc }}
          ({{ 'healthy — nothing to repair' if podman_df_before.rc == 0 else 'WEDGED — will repair' }})

    # The deeper wedge: an INCOMPLETE overlay layer (interrupted pull) that
    # podman tries to delete on every load but can't, because the layer dir is
    # owned by mapped sub-UIDs (rename → tempdirs fails EACCES). podman names
    # each one in its own output ('Found incomplete layer "<64-hex-id>"'); we
    # parse those IDs and remove the layer dirs as REAL root. This is what
    # podman itself is trying (and failing) to do — safe: an incomplete layer is
    # never the mounted layer of a running container.
    - name: Detect incomplete overlay layers from podman's own output
      ansible.builtin.set_fact:
        podman_incomplete_layers: >-
          {{ (podman_df_before.stderr | default(''))
             | regex_findall('Found incomplete layer "([0-9a-f]{64})"')
             | unique }}

    - name: Report detected incomplete layers
      ansible.builtin.debug:
        msg: "Incomplete overlay layers detected: {{ podman_incomplete_layers | default([]) }}"

    - name: Remove incomplete overlay layers as root (bypasses sub-UID ownership)
      ansible.builtin.file:
        path: "{{ podman_storage }}/overlay/{{ item }}"
        state: absent
      loop: "{{ podman_incomplete_layers | default([]) }}"
      register: podman_incomplete_removed

    - name: Stat the stale tempdirs directory
      ansible.builtin.stat:
        path: "{{ podman_tempdirs }}"
      register: podman_tempdirs_stat

    - name: Remove stale podman temp dirs (as root — bypasses sub-UID ownership)
      ansible.builtin.file:
        path: "{{ podman_tempdirs }}"
        state: absent
      when: podman_tempdirs_stat.stat.exists
      register: podman_tempdirs_removed

    - name: Report tempdirs outcome
      ansible.builtin.debug:
        msg: >-
          {{ 'Removed stale tempdirs at ' ~ podman_tempdirs
             if podman_tempdirs_stat.stat.exists
             else 'No tempdirs present — store was not wedged by stale temp dirs' }}

    - name: Probe rootless store health AFTER repair (as the user)
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman system df
      register: podman_df_after
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: asserted explicitly in the next task
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Show the exact podman output after repair (diagnostic)
      ansible.builtin.debug:
        msg:
          - "podman system df — rc={{ podman_df_after.rc }}"
          - "STDOUT:"
          - "{{ podman_df_after.stdout | default('') }}"
          - "STDERR:"
          - "{{ podman_df_after.stderr | default('') }}"

    - name: Assert the store now loads cleanly
      ansible.builtin.assert:
        that:
          - podman_df_after.rc == 0
        success_msg: "Rootless podman store loads cleanly ✅ (CCY should start now)."
        fail_msg: |
          The rootless podman store still does not load (rc={{ podman_df_after.rc }})
          after removing the incomplete layers it named and the stale tempdirs.

          Incomplete layers removed this run: {{ podman_incomplete_layers | default([]) }}

          podman's remaining error was:
          {{ podman_df_after.stderr | default('(no stderr captured)') }}

          Re-run triage.bash and share the report — a NEW layer id here means
          another incomplete layer to clear (re-running this play picks it up).
          Do NOT run `podman system reset` (it would wipe all rootless
          images/containers and disrupt the live CCY sessions).

    - name: Remove a specific corrupted image if requested
      become_user: "{{ user_login }}"
      ansible.builtin.command:
        cmd: podman rmi -f {{ podman_repair_remove_image }}
      when: podman_repair_remove_image | length > 0
      register: podman_rmi
      changed_when: podman_rmi.rc == 0
      failed_when: false  # FAIL-FAST-OK: image may already be gone; informational only
      environment:
        XDG_RUNTIME_DIR: "{{ podman_user_runtime }}"

    - name: Repair summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Podman rootless store repair complete"
          - "============================================"
          - "Before: podman system df rc={{ podman_df_before.rc }}"
          - "After:  podman system df rc={{ podman_df_after.rc }}"
          - "Incomplete layers removed: {{ podman_incomplete_layers | default([]) }}"
          - "{{ 'Corrupted image removed: ' ~ podman_repair_remove_image if podman_repair_remove_image | length > 0 else 'No image removed' }}"
          - ""
          - "If CCY was flagged corrupted and still misbehaves, re-run with:"
          - "  -e podman_repair_remove_image=claude-yolo:latest"
          - "then relaunch ccy (it rebuilds from .claude/ccy/Dockerfile)."
