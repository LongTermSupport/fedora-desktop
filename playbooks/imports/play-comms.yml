#!/usr/bin/env ansible-playbook
---
# Communication tools - Slack, etc.
# Flatpak is already installed by default, we just need to add to it
- hosts: desktop
  name: Communication Tools
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: gnome   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  tasks:
    - name: Scope guard — assert provisioning_profile is recognised
      ansible.builtin.assert:
        that:
          - provisioning_profile in ['desktop', 'server']
        fail_msg: |
          provisioning_profile={{ provisioning_profile }} is not recognised.
          Valid values: desktop, server.
          Auto-detected from `systemctl get-default`
          (see environment/localhost/group_vars/desktop.yml) or overridden
          via -e provisioning_profile=desktop|server.

    - name: Scope guard — end play if provisioning_profile does not match declared scope
      ansible.builtin.meta: end_play
      when: (scope == 'gnome' and provisioning_profile == 'server') or (scope == 'server' and provisioning_profile != 'server')

    # Native modules are idempotent (no per-run Flathub round-trip / spurious changed).
    - name: Enable Flathub remote
      become: true
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        state: present
    - name: Install Slack
      become: true
      community.general.flatpak:
        name: com.slack.Slack
        remote: flathub
        state: present

    # The Flathub manifest grants the sandbox only xdg-download. A file dragged from
    # Nautilus arrives as a host path; outside Downloads the sandbox cannot open it and
    # Slack reports the empty result as "a type of file not supported" (Plan 00103).
    # Read-only access to the home directory lets any dropped file be read without
    # letting Slack write outside its own sandbox home. community.general has no
    # flatpak-override module, so drive the CLI, guarded to stay idempotent.
    - name: Read current Slack Flatpak overrides
      become: true
      ansible.builtin.command:
        argv: [flatpak, override, --show, com.slack.Slack]
      register: slack_flatpak_override
      changed_when: false

    - name: Grant Slack read-only access to the home directory so dropped files can be read
      become: true
      ansible.builtin.command:
        argv: [flatpak, override, --filesystem=home:ro, com.slack.Slack]
      when: "'home:ro' not in slack_flatpak_override.stdout"
