#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Agent team bus homeserver host (Plan 00161, DESIGN.md sections 3.1 and 3.4).
#
# A thin caller of files/usr/local/sbin/agent-bus-install, which is the single source of
# truth for what a homeserver host looks like; other projects run the same installer from
# their own IaC, so nothing here may re-implement a step of it. The play:
#
#   0. `backup-now --team` for every running team, only when this checkout's Tuwunel pin or
#      homeserver units differ from the installed ones, or it renders a team's tuwunel.toml
#      differently (each a homeserver restart), so a swap that goes wrong has a restore
#      point minutes old. A failed backup fails the run before anything changes.
#   1. `software --source <this checkout>` on every run, with `--bus-address` when the
#      host sets agent_bus_address: packages, the agent-bus user, the pinned Tuwunel, the
#      zipapps, the units, and the installer itself under /usr/local/sbin. Every desktop
#      carries the software; an instance exists only where a team is declared.
#   2. `remove --team` (plus `--purge` when asked) for each agent_bus_teams entry with
#      state absent, before any team is installed, so a port a removed team held is free.
#   3. `team --team-file` for each entry with state present (the default), from a team
#      file rendered into a root-only temporary directory that is deleted afterwards. Each
#      file's allow_from is the declared list plus the LXC bridge's subnet, read from the
#      live bridge (lxcbr0, helpers/agent_bus/bridge.py): LXC containers need no declaration.
#
# Before step 2 it installs /etc/sudoers.d/agent-bus-read-only (Plan 00177): the desktop
# user may run exactly `agent-bus list <team>` and `agent-bus human devices <team> <name>`
# without a password, so ccy-teams shows a team's members without asking.
#
# agent_bus_lxc_members joins existing LXC containers to those teams by README.lxc's steps
# (helpers/agent_bus_lxc/members.py): its absent entries before step 2, so a team still
# runs while its member is parked; its present entries after step 3, so the team exists.
# The member steps live here, not in a play of their own, because each needs this play's
# teams applied in the same run, and the LXC play runs earlier in playbook-main.yml.
#
# Each step reports changed only when the installer or the helper prints a CHANGED line,
# so a run with nothing new is all ok. Neither has a dry run, so --check skips them.
#
# ccy-teams applies one change at a time (DESIGN.md D65): it runs this play with
# agent_bus_only_teams set to the teams it means to change, so steps 2 and 3 touch those
# alone and a bulk update can never take another team down. Unset, every entry applies.
#
# Teams live in the untracked host_vars localhost.yml (see localhost.yml.dist): each entry
# is the team file of DESIGN.md section 3.4, validated by the installer, and an absent
# entry needs only `team`, `state: absent` and optionally `purge: true`. The LXC members
# are declared there too.
- hosts: desktop
  name: Agent team bus homeserver (agent-bus-install)
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
    agent_bus_installer: "{{ root_dir }}/files/usr/local/sbin/agent-bus-install"
    agent_bus_team_list: "{{ agent_bus_teams | default([]) }}"
    agent_bus_present: "{{ agent_bus_team_list | rejectattr('state', 'defined') | list
      + agent_bus_team_list | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
    agent_bus_absent: "{{ agent_bus_team_list | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
    # The entries steps 2 and 3 apply: all, or only those agent_bus_only_teams names.
    agent_bus_apply_present: "{{ agent_bus_present if agent_bus_only_teams is not defined
      else agent_bus_present | selectattr('team', 'in', agent_bus_only_teams) | list }}"
    agent_bus_apply_absent: "{{ agent_bus_absent if agent_bus_only_teams is not defined
      else agent_bus_absent | selectattr('team', 'in', agent_bus_only_teams) | list }}"
    # The files `software` installs whose change restarts every homeserver, relative to /.
    agent_bus_swap_paths:
      - usr/local/share/agent-bus/tuwunel.pin
      - etc/systemd/system/agent-bus-hs@.service
      - etc/systemd/system/agent-bus-backup@.service
    # Matches the installer's and the helper's CHANGED<TAB><what> marker lines.
    agent_bus_changed_re: "^CHANGED\t"
    # Scoped like the teams: with agent_bus_only_teams, only those teams' LXC members.
    agent_bus_lxc_member_list: "{{ agent_bus_lxc_members | default([]) if agent_bus_only_teams is not defined
      else agent_bus_lxc_members | default([]) | selectattr('team', 'in', agent_bus_only_teams) | list }}"
    # The helper's arguments but --phase; it validates every entry on each call.
    agent_bus_lxc_args:
      - --members
      - "{{ agent_bus_lxc_member_list | to_json }}"
      - --teams-present
      - "{{ agent_bus_present | map(attribute='team') | list | to_json }}"
  tasks:
    # Only the shape this play itself relies on; the installer validates each team file.
    - name: Check agent_bus_teams declares each team once, with a known state
      ansible.builtin.assert:
        that:
          - agent_bus_team_list is sequence and agent_bus_team_list is not string
          - agent_bus_team_list | reject('mapping') | list | length == 0
          - agent_bus_team_list | rejectattr('team', 'defined') | list | length == 0
          - agent_bus_team_list | map(attribute='team') | unique | list | length == agent_bus_team_list | length
          - (agent_bus_present | length + agent_bus_absent | length) == agent_bus_team_list | length
          - agent_bus_present | selectattr('purge', 'defined') | list | length == 0
          - agent_bus_absent | rejectattr('purge', 'undefined') | rejectattr('purge', 'boolean') | list | length == 0
          - agent_bus_only_teams is not defined or (agent_bus_only_teams is sequence and agent_bus_only_teams is not string
            and agent_bus_only_teams | difference(agent_bus_team_list | map(attribute='team')) | length == 0)
        fail_msg: >-
          agent_bus_teams in environment/localhost/host_vars/localhost.yml must be a list
          of mappings, each with a unique team, a state of present (the default) or absent,
          and purge (true or false) only on an absent team; agent_bus_only_teams, when given,
          a list of declared team names. See localhost.yml.dist.
        quiet: true
      tags: [agent-bus]

    - name: Refuse agent_bus_lxc_bridge, which nothing reads
      ansible.builtin.assert:
        that:
          - agent_bus_lxc_bridge is not defined
        fail_msg: >-
          agent_bus_lxc_bridge is set, but nothing reads it: the LXC bridge is always lxcbr0,
          read live by helpers/agent_bus/bridge.py. Remove it from
          environment/localhost/host_vars/localhost.yml; admit another bridge's subnet
          through a team's allow_from.
        quiet: true
      tags: [agent-bus]

    # A restore point before the Tuwunel binary, the homeserver units or a team's config
    # change: `software` replaces the first two and the next `team` run restarts the
    # homeservers. Taken only when the checkout's pin, a unit or a rendered config differs
    # from the installed one, since each backup pushes the
    # oldest of Tuwunel's seven out; a homeserver that is not running has nothing new to save.
    # A failed backup fails the run before anything is swapped.
    - name: Read the installed Tuwunel pin and homeserver units
      ansible.builtin.stat:
        path: "/{{ item }}"
        get_checksum: true
      loop: "{{ agent_bus_swap_paths }}"
      register: agent_bus_installed_files
      tags: [agent-bus]

    - name: Read this checkout's Tuwunel pin and homeserver units
      ansible.builtin.stat:
        path: "{{ root_dir }}/files/{{ item }}"
        get_checksum: true
      loop: "{{ agent_bus_swap_paths }}"
      register: agent_bus_source_files
      tags: [agent-bus]

    # A release that changes only how tuwunel.toml is rendered swaps no file above, yet
    # `team` restarts every homeserver whose rendered config differs. The helper renders each
    # installed team's team.json with this checkout's code; read-only, so it runs in --check.
    - name: Find the installed teams whose tuwunel.toml this checkout renders differently
      ansible.builtin.command:
        argv: "{{ ['python3', '-m', 'helpers.agent_bus.config_restart', '--state-root', '/var/lib/agent-bus']
                  + (agent_bus_present | map(attribute='team') | list) }}"
        chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
      register: agent_bus_config_restart
      changed_when: false
      check_mode: false
      tags: [agent-bus]

    # True when an installed file differs from this checkout's copy, or a team's config does;
    # a host with none of them installed yet runs no homeserver, so it has nothing to back up.
    - name: Decide whether this run swaps the binary, the units or a team's config
      ansible.builtin.set_fact:
        agent_bus_swap: >-
          {{ agent_bus_installed_files.results | selectattr('stat.exists') | map(attribute='stat.checksum') | list
             != agent_bus_source_files.results
                | selectattr('item', 'in', agent_bus_installed_files.results | selectattr('stat.exists') | map(attribute='item') | list)
                | map(attribute='stat.checksum') | list
             or agent_bus_config_restart.stdout_lines | select('match', '^CONFIG-CHANGED ') | list | length > 0 }}
      tags: [agent-bus]

    - name: Read which homeservers are running
      ansible.builtin.service_facts:
      when: agent_bus_swap | bool
      tags: [agent-bus]

    - name: Back up every running team before the binary, units or a config change
      ansible.builtin.command:
        argv: ["{{ agent_bus_installer }}", backup-now, --team, "{{ item.team }}"]
      loop: "{{ agent_bus_present }}"
      loop_control:
        label: "{{ item.team }}"
      when:
        - agent_bus_swap | bool
        - not ansible_check_mode
        - (ansible_facts.services['agent-bus-hs@' ~ item.team ~ '.service'] | default({})).state | default('') == 'running'
      register: agent_bus_backup
      changed_when: true
      tags: [agent-bus]

    - name: Install the agent-bus homeserver software
      ansible.builtin.command:
        argv: >-
          {{ [agent_bus_installer, 'software', '--source', root_dir]
             + (['--bus-address', agent_bus_address] if (agent_bus_address | default('') | length > 0) else []) }}
      register: agent_bus_software
      changed_when: agent_bus_software.stdout_lines | select('match', agent_bus_changed_re) | list | length > 0
      tags: [agent-bus]

    # ccy-teams lists a team's members and its people's Element sessions through these two
    # read-only commands; with this rule it needs no password to show them. Nothing else is
    # granted: the rule pins each command's arguments (see the file for why that is safe).
    - name: Let the desktop user read team members without a password (a scoped sudoers rule)
      ansible.builtin.template:
        src: "{{ root_dir }}/files/etc/sudoers.d/agent-bus-read-only.j2"
        dest: /etc/sudoers.d/agent-bus-read-only
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [agent-bus]

    - name: Take the LXC members declared absent off their teams
      ansible.builtin.command:
        argv: "{{ ['python3', '-m', 'helpers.agent_bus_lxc.members', '--phase', 'absent'] + agent_bus_lxc_args }}"
        chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
      register: agent_bus_lxc_absent
      changed_when: agent_bus_lxc_absent.stdout_lines | select('match', agent_bus_changed_re) | list | length > 0
      when: agent_bus_lxc_member_list | length > 0 and not ansible_check_mode
      tags: [agent-bus]

    - name: Remove the agent-bus teams declared absent
      ansible.builtin.command:
        argv: >-
          {{ [agent_bus_installer, 'remove', '--team', item.team]
             + (['--purge'] if (item.purge | default(false)) else []) }}
      loop: "{{ agent_bus_apply_absent }}"
      loop_control:
        label: "{{ item.team }}"
      register: agent_bus_remove
      changed_when: agent_bus_remove.stdout_lines | select('match', agent_bus_changed_re) | list | length > 0
      tags: [agent-bus]

    - name: Install the agent-bus teams declared present
      # The installer has no dry run, so --check renders nothing either.
      when: agent_bus_apply_present | length > 0 and not ansible_check_mode
      tags: [agent-bus]
      block:
        # A scratch directory, not a managed file: the installer keeps the validated copy
        # as /var/lib/agent-bus/<team>/team.json, and the play reports only its changes.
        # The one place a team's effective allow_from is computed (helpers/agent_bus/bridge.py):
        # the declared list plus the LXC bridge's subnet. The team files rendered below carry
        # it, so the installer's firewall rule, unit drop-in and validation all see the same list.
        # The helper asks the live host (`ip`), not the fact cache, so a bridge that
        # play-lxc-install-config.yml created earlier in this run is seen; `ccy-teams` status
        # uses the same probe to digest the same list.
        - name: Add the LXC bridge's subnet to every team's allow_from
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - helpers.agent_bus.bridge
              - --teams
              - "{{ agent_bus_apply_present | to_json }}"
            chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
          register: agent_bus_bridge
          changed_when: false

        - name: Say what the LXC bridge adds
          ansible.builtin.debug:
            msg: "{{ (agent_bus_bridge.stdout | from_json).note }}"

        - name: Make a root-only directory for the rendered team files
          ansible.builtin.tempfile:
            state: directory
            suffix: .agent-bus-teams
          register: agent_bus_team_dir
          changed_when: false

        - name: Render each team file
          ansible.builtin.copy:
            content: "{{ item | combine({'state': 'present'}) | to_nice_json }}\n"
            dest: "{{ agent_bus_team_dir.path }}/{{ item.team }}.json"
            owner: root
            group: root
            mode: "0600"
          loop: "{{ (agent_bus_bridge.stdout | from_json).teams }}"
          loop_control:
            label: "{{ item.team }}"
          changed_when: false

        # The applied stamps are root:<the desktop user's primary group> 0640 in a 0750
        # directory: ccy-teams, run by that user, reads them without sudo, and no other user
        # learns a team's name from them. The group is looked up, not assumed to share the
        # login's name; a user or group that cannot be found fails here, before any team.
        # It is recorded in /etc/agent-bus/stamp-group, which every `agent-bus-install team`
        # reads (with no record it fails), so a run outside this play keeps the same group.
        - name: Look up the desktop user's primary group ID
          ansible.builtin.getent:
            database: passwd
            key: "{{ user_login }}"

        - name: Look up the desktop user's primary group name
          ansible.builtin.getent:
            database: group
            key: "{{ ansible_facts.getent_passwd[user_login][2] }}"

        - name: Create the agent-bus configuration directory
          ansible.builtin.file:
            path: /etc/agent-bus
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Record the applied stamps' group
          ansible.builtin.copy:
            content: "{{ ansible_facts.getent_group | list | first }}\n"
            dest: /etc/agent-bus/stamp-group
            owner: root
            group: root
            mode: "0644"

        - name: Install or update each team
          ansible.builtin.command:
            argv:
              - "{{ agent_bus_installer }}"
              - team
              - --team-file
              - "{{ agent_bus_team_dir.path }}/{{ item.team }}.json"
          loop: "{{ agent_bus_apply_present }}"
          loop_control:
            label: "{{ item.team }}"
          register: agent_bus_team
          changed_when: agent_bus_team.stdout_lines | select('match', agent_bus_changed_re) | list | length > 0
      always:
        - name: Delete the rendered team files
          ansible.builtin.file:
            path: "{{ agent_bus_team_dir.path }}"
            state: absent
          when: agent_bus_team_dir.path is defined
          changed_when: false

    # README.lxc's steps for each present entry; a member already joined is left alone.
    - name: Join the LXC members declared present to their teams
      ansible.builtin.command:
        argv: "{{ ['python3', '-m', 'helpers.agent_bus_lxc.members', '--phase', 'present'] + agent_bus_lxc_args }}"
        chdir: "{{ root_dir }}" # repo root on sys.path so the helpers package imports
      register: agent_bus_lxc_present
      changed_when: agent_bus_lxc_present.stdout_lines | select('match', agent_bus_changed_re) | list | length > 0
      when: agent_bus_lxc_member_list | length > 0 and not ansible_check_mode
      tags: [agent-bus]
