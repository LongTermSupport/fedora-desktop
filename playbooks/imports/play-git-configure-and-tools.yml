#!/usr/bin/env -S bash -c 'p=$(realpath "$0") && exec "${p%/playbooks/*}/run.bash" "$p" "$@"'
---
# Git is already installed as it was used to clone this repo,
# so we just need to configure it
- hosts: desktop
  name: Git Configure and Tools
  become: false
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
    scope: general   # general | gnome | server — see CLAUDE/AnsibleStyle.md
  vars_files:
    - "{{ root_dir }}/vars/git-signing.yml"   # git_signing_key_path
  tasks:
    - name: Setup Git Config - user
      ansible.builtin.shell: |
        set -euo pipefail
        git config --global user.email "{{ user_email }}"
        git config --global user.name "{{ user_name }}"
        git config --global color.ui auto
        git config --global push.default simple;
        git config --global help.autocorrect 30;
        git config --global core.editor "vim"
        git config --global init.defaultBranch main
        git config --global fetch.prune true
        git config --global pull.rebase false
        git config --global branch.autoSetupMerge simple
        git config --global core.autocrlf input
      args:
        executable: /bin/bash

    - name: Ensure ~/.config/git directory exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.config/git"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0755"

    # =========================================================================
    # Commit signing, on by default (Plan 00139)
    # =========================================================================
    # Every commit and tag made on this machine is signed with this machine's SSH
    # signing key: by a person, by a cc agent on the host, and inside ccy, which copies
    # ~/.gitconfig and mounts the key read-only. What a signature proves is that the
    # commit came from the owner or the owner's machine; the owner's own agents are
    # meant to be able to sign. That is why the key has no passphrase (asserted
    # below): nothing that commits unattended has a terminal to type one into.
    # A self-updating server trusts this key through self_update_signing_public_key.
    # play-github-cli-multi.yml registers it on GitHub, and gives each account its own
    # key for that account's repositories: docs/configuration.md "Commit Signing".
    - name: Ensure ~/.ssh Exists
      ansible.builtin.file:
        path: "/home/{{ user_login }}/.ssh"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0700"

    - name: Generate This Machine's Git Signing Key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "{{ user_email }} git signing"
          - -f
          - "{{ git_signing_key_path }}"
        creates: "{{ git_signing_key_path }}"

    - name: Check the Signing Key and Its Public Half
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ git_signing_key_path }}"
        - "{{ git_signing_key_path }}.pub"
      register: git_signing_key_stat

    - name: Assert the Signing Key Is a Private File With Its Public Half Beside It
      ansible.builtin.assert:
        that:
          - git_signing_key_stat.results[0].stat.isreg | default(false)
          - git_signing_key_stat.results[0].stat.mode == '0600'
          - git_signing_key_stat.results[1].stat.isreg | default(false)
        fail_msg: >-
          {{ git_signing_key_path }} must be a regular file at mode 0600, with
          {{ git_signing_key_path }}.pub beside it. Remove both and re-run this play to
          generate a fresh pair.

    # Loading the key with an empty passphrase succeeds only for an unencrypted key. A
    # key with a passphrase fails with "incorrect passphrase"; an empty, truncated or
    # foreign file fails with anything else. `creates:` above accepts any file at the
    # path, so the two failures get their own remedies.
    - name: Probe Whether the Signing Key Loads Without a Passphrase
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -y
          - -P
          - ""
          - -f
          - "{{ git_signing_key_path }}"
      register: git_signing_key_unlocked
      changed_when: false
      failed_when: false  # FAIL-FAST-OK: probe-then-fail — the verdict is the next task
      no_log: true

    - name: Assert the Signing Key Is a Private Key ssh-keygen Can Read
      ansible.builtin.assert:
        that:
          - >-
            git_signing_key_unlocked.rc == 0
            or 'incorrect passphrase' in git_signing_key_unlocked.stderr
        fail_msg: >-
          {{ git_signing_key_path }} is not a private key ssh-keygen can load (it said:
          {{ git_signing_key_unlocked.stderr | trim }}). If it is the default key, remove
          it and {{ git_signing_key_path }}.pub and re-run this play to generate a fresh
          pair. If git_signing_key in host_vars names it, point that at a real key.

    - name: Assert the Signing Key Needs No Passphrase
      ansible.builtin.assert:
        that:
          - git_signing_key_unlocked.rc == 0
        fail_msg: >-
          {{ git_signing_key_path }} has a passphrase. Signing is on for every commit,
          and cc agents and ccy containers commit with no terminal to type it into, so
          every one of their commits would fail. Remove git_signing_key from host_vars
          so this play generates a key at the default path, then register the new key
          with GitHub and give its public half to any self-updating server
          (docs/configuration.md "Commit Signing").

    # Written to host_vars so run.bash's "Save local config to repo" keeps this machine's
    # public key in the config repo with the rest of its configuration. It has its own
    # name: self_update_signing_public_key is the key a SERVER trusts, and writing a
    # machine's own key there would make a server trust its own commits.
    - name: Read This Machine's Public Signing Key
      ansible.builtin.slurp:
        src: "{{ git_signing_key_path }}.pub"
      register: git_signing_public_key_file

    - name: Record the Public Signing Key in host_vars
      ansible.builtin.blockinfile:
        path: "{{ root_dir }}/environment/localhost/host_vars/localhost.yml"
        marker: "# {mark} ANSIBLE MANAGED: Git Signing Public Key"
        block: |
          git_signing_public_key: "{{ git_signing_public_key_file.content | b64decode | trim }}"
        create: false

    - name: Sign Every Commit and Tag With This Machine's Key
      community.general.git_config:
        scope: global
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - name: gpg.format
          value: ssh
        - name: user.signingkey
          value: "{{ git_signing_key_path }}"
        - name: commit.gpgsign
          value: "true"
        - name: tag.gpgsign
          value: "true"

    # A host that ran the earlier opt-in signing wrote these to the XDG config, which git
    # reads after ~/.gitconfig, so a stale user.signingkey there would win.
    - name: Remove the Opt-In Signing Settings From the XDG Git Config
      community.general.git_config:
        scope: file
        file: "/home/{{ user_login }}/.config/git/config"
        name: "{{ item }}"
        state: absent
      loop:
        - gpg.format
        - user.signingkey
        - alias.sign-deploy

    - name: Set up Global Git Ignores
      ansible.builtin.blockinfile:
        create: true
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: "0644"
        block: |
          /.idea
          *.secret
          /untracked
          /vendor
          .phpunit.result.cache
        path: "/home/{{ user_login }}/.config/git/ignore"

    - name: Enable Git Bash Prompt
      ansible.builtin.shell: "git clone https://github.com/magicmonty/bash-git-prompt.git ~/.bash-git-prompt --depth=1"
      args:
        creates: /home/{{ user_login }}/.bash-git-prompt/.git/config

    - name: Prompt to Start SSH Agent on SSH Sessions
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.bashrc
        marker: "# {mark} ANSIBLE MANAGED: SSH Agent Prompt"
        insertbefore: "# BEGIN ANSIBLE MANAGED: Git Bash Prompt"
        block: |
          # On SSH sessions without a working agent, offer to start one
          # (must run before bash-git-prompt to avoid passphrase prompt on stdin).
          # Only with a terminal on stdin: without one the read hits EOF, the
          # default answer is yes, and keys are loaded that nobody asked for.
          # Everything it prints goes to stderr, so a captured stdout stays clean.
          if [[ -n "${SSH_CONNECTION:-}" && $- == *i* && -t 0 ]]; then
              if ! ssh-add -l &>/dev/null; then
                  echo "SSH session detected without a working SSH agent." >&2
                  read -rp "Start ssh-agent and load keys? [Y/n] " _ssh_reply
                  if [[ "${_ssh_reply:-Y}" =~ ^[Yy]?$ ]]; then
                      eval "$(ssh-agent -s)" > /dev/null
                      if command -v ssh-agent-start &>/dev/null; then
                          ssh-agent-start --all >&2
                      else
                          ssh-add
                      fi
                  fi
                  unset _ssh_reply
              fi
          fi

    - name: Update ~/.bashrc File for the Bash Git Prompt
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.bashrc
        marker: "# {mark} ANSIBLE MANAGED: Git Bash Prompt"
        block: |
          GIT_PROMPT_ONLY_IN_REPO=1
          GIT_PROMPT_THEME=Solarized
          GIT_PROMPT_START=$PS1
          source ~/.bash-git-prompt/gitprompt.sh

    # https://github.com/cli/cli/blob/trunk/docs/install_linux.md#fedora-centos-red-hat-enterprise-linux-dnf
    # --overwrite re-fetches the repofile every run: upstream rotates the signing
    # key and edits the gpgkey= line, and a repofile written once keeps pointing at
    # the retired key, so `dnf update` fails signature verification on new gh RPMs.
    - name: Configure GitHub CLI Repository
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        dnf -y install 'dnf-command(config-manager)'
        dnf -y config-manager addrepo --overwrite --from-repofile=https://cli.github.com/packages/rpm/gh-cli.repo
      args:
        executable: /bin/bash
      changed_when: true

    - name: Install Github Client
      become: true
      ansible.builtin.dnf:
        name:
          - gh

    # https://github.com/newren/git-filter-repo
    - name: Install DNF Git Filter Repo
      become: true
      ansible.builtin.dnf:
        name:
          - git-filter-repo

    - name: Git Aliases
      ansible.builtin.blockinfile:
        path: /home/{{ user_login }}/.bashrc
        marker: "# {mark} ANSIBLE MANAGED: Git Aliases"
        block: |
          alias gu="git push"
          alias gd="git pull"
          alias gs="git status"
          alias c="git commit"
      tags: alias
