#!/usr/bin/env ansible-playbook
---
# Repo-development playbook — NOT part of the standard configuration run.
#
# Gathers a comprehensive host diagnostic snapshot into
# untracked/diagnostics/<ISO timestamp>/ so an agent (human or LLM) can
# audit a freshly installed / freshly converged Fedora desktop for bugs,
# regressions and opportunities to improve the playbooks in this repo.
#
# Outputs are structured per-tool text files (and a few SVGs) plus a
# README.md index and a _manifest.tsv listing every probe and its exit
# code. The untracked/ directory is gitignored so snapshots stay local.
#
# Run from the repo root on the HOST (never inside a CCY container):
#
#     ansible-playbook playbooks/dev/play-collect-diagnostics.yml
#
- hosts: desktop
  name: Collect host diagnostic snapshot for repo-side analysis
  become: true
  vars:
    root_dir: "{{ lookup('ansible.builtin.config', 'CONFIG_FILE') | dirname }}"
  tasks:
    # Freeze the timestamp once so every downstream task sees the same
    # value. Putting `lookup('pipe', 'date …')` in `vars:` directly
    # re-evaluates the lookup on every variable access — which created
    # two adjacent timestamped directories one second apart (parent-dir
    # task vs. collection-script task). `ansible_date_time.*` would
    # avoid the second-flicker but is served from the on-disk fact
    # cache (untracked/facts/), so its value is the timestamp of the
    # last full fact gather, not "now". set_fact binds the resolved
    # value as a fact for the rest of the play.
    - name: Freeze capture timestamp and output dir
      ansible.builtin.set_fact:
        out_dir: "{{ root_dir }}/untracked/diagnostics/{{ lookup('ansible.builtin.pipe', 'date +%Y%m%dT%H%M%S') }}"

    - name: Ensure untracked/diagnostics base directory exists
      ansible.builtin.file:
        path: "{{ root_dir }}/untracked/diagnostics"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Create this run's output directory
      ansible.builtin.file:
        path: "{{ out_dir }}"
        state: directory
        owner: "{{ user_login }}"
        group: "{{ user_login }}"
        mode: '0755'

    - name: Run diagnostic collection script
      ansible.builtin.command:
        argv:
          - "{{ root_dir }}/scripts/collect-diagnostics.bash"
          - "{{ out_dir }}"
          - "{{ user_login }}"
      register: collect_result
      changed_when: true

    - name: Print collection progress (stderr from the script)
      ansible.builtin.debug:
        var: collect_result.stderr_lines

    - name: Print summary
      ansible.builtin.debug:
        msg:
          - "Diagnostic snapshot written to:"
          - "  {{ out_dir }}"
          - ""
          - "Start by reading:"
          - "  {{ out_dir }}/README.md"
          - ""
          - "Manifest of all captures (TSV: subdir, name, exit_code):"
          - "  {{ out_dir }}/_manifest.tsv"
